[build]
builder = "RAILPACK"

[deploy]
startCommand = "python -m src.kp_unemployment_live_probe_safe"
preDeployCommand = ["python -m pytest -q tests/test_sports_kp_execution.py tests/test_sports_kp_live_coordinator.py tests/test_sports_kp_venue_hardening.py tests/test_kp_unemployment_live_probe.py && python -m py_compile src/kp_unemployment_certification.py src/kp_unemployment_live_probe.py src/kp_unemployment_live_probe_safe.py"]
restartPolicyType = "NEVER"
