name: AWS Gemini incentive live watch

on:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/gemini-incentive-live-watch.trigger
      - .github/workflows/aws-gemini-incentive-live-watch.yml

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation
      - name: Read trigger
        id: trigger
        shell: bash
        run: |
          set -Eeuo pipefail
          FILE=deploy/aws/gemini-incentive-live-watch.trigger
          PINNED_COMMIT=$(awk -F= '$1=="PINNED_COMMIT"{print $2}' "$FILE" | tr -d '[:space:]')
          RUN_ID=$(awk -F= '$1=="RUN_ID"{print $2}' "$FILE" | tr -d '[:space:]')
          DURATION=$(awk -F= '$1=="DURATION_SECONDS"{print $2}' "$FILE" | tr -d '[:space:]')
          INTERVAL=$(awk -F= '$1=="INTERVAL_SECONDS"{print $2}' "$FILE" | tr -d '[:space:]')
          test "$(awk -F= '$1=="CLASSIFICATION"{print $2}' "$FILE" | tr -d '[:space:]')" = "READ_ONLY_GEMINI_INCENTIVE_WATCH_NOT_REALIZED"
          test "$(awk -F= '$1=="ORDER_ENTRY"{print $2}' "$FILE" | tr -d '[:space:]')" = "false"
          [[ "$PINNED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DURATION" =~ ^[0-9]+$ ]]
          [[ "$INTERVAL" =~ ^[0-9]+$ ]]
          echo "pinned_commit=$PINNED_COMMIT" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "interval=$INTERVAL" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Launch bounded read-only watch
        env:
          PINNED_COMMIT: ${{ steps.trigger.outputs.pinned_commit }}
          RUN_ID: ${{ steps.trigger.outputs.run_id }}
          DURATION: ${{ steps.trigger.outputs.duration }}
          INTERVAL: ${{ steps.trigger.outputs.interval }}
        shell: bash
        run: |
          set -Eeuo pipefail
          SHORT_SHA="${PINNED_COMMIT:0:12}"
          REMOTE_CMD="sudo -u ssm-user bash -lc 'set -Eeuo pipefail; REPO=/home/ssm-user/kalshi-arb-bot; WORK=/opt/arb/gemini-incentive-live-watch; STATE=/home/ssm-user/gemini-incentive-live-watch-state/${RUN_ID}; NAME=arb-gemini-incentive-live-watch; git -C \"\$REPO\" config --global --add safe.directory \"\$REPO\" || true; git -C \"\$REPO\" fetch origin feature/incentive-arb-engine-v1; git -C \"\$REPO\" cat-file -e \"${PINNED_COMMIT}^{commit}\"; git -C \"\$REPO\" worktree remove --force \"\$WORK\" >/dev/null 2>&1 || true; rm -rf \"\$WORK\"; git -C \"\$REPO\" worktree prune; git -C \"\$REPO\" worktree add --detach \"\$WORK\" \"${PINNED_COMMIT}\"; IMAGE=arb-gemini-incentive-live-watch:${SHORT_SHA}; docker build -t \"\$IMAGE\" \"\$WORK\" >/dev/null; docker rm -f \"\$NAME\" >/dev/null 2>&1 || true; mkdir -p \"\$STATE\"; printf \"classification=READ_ONLY_GEMINI_INCENTIVE_WATCH_NOT_REALIZED\\norder_entry=false\\ncredentials_loaded=false\\nrun_id=${RUN_ID}\\n\" > \"\$STATE/run-metadata.txt\"; docker run -d --name \"\$NAME\" --network host -v \"\$STATE:/state\" \"\$IMAGE\" sh -lc \"end=\\\$((\\\$(date +%s)+${DURATION})); while [ \\\$(date +%s) -lt \\\$end ]; do python -m src.gemini_incentive_live_scan_summary >> /state/scans.jsonl 2>>/state/errors.log || true; sleep ${INTERVAL}; done; echo WATCH_COMPLETE >> /state/completed.txt\"; echo GEMINI_INCENTIVE_WATCH_STARTED run_id=${RUN_ID} commit=${SHORT_SHA} duration_s=${DURATION} interval_s=${INTERVAL} classification=READ_ONLY_GEMINI_INCENTIVE_WATCH_NOT_REALIZED order_entry=false credentials_loaded=false'"
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB Gemini incentive live watch ${RUN_ID}" --parameters "$PARAMETERS" --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" || true
          RESULT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          grep -q 'GEMINI_INCENTIVE_WATCH_STARTED' <<<"$(jq -r '.Stdout // ""' <<<"$RESULT")"
