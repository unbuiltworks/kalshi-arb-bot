name: AWS Gemini q10 V5.1 admission shadow

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - deploy/aws/gemini-q10-v5-1-shadow.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  FEATURE_BRANCH: feature/gemini-q10-production-executor

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation
      - name: Read trigger
        id: t
        shell: bash
        run: |
          set -Eeuo pipefail
          F=deploy/aws/gemini-q10-v5-1-shadow.trigger
          PIN=$(awk -F= '$1=="PINNED_COMMIT"{print $2}' "$F" | tr -d '[:space:]')
          RUN_ID=$(awk -F= '$1=="RUN_ID"{print $2}' "$F" | tr -d '[:space:]')
          CLASS=$(awk -F= '$1=="CLASSIFICATION"{print $2}' "$F" | tr -d '[:space:]')
          test "$CLASS" = READ_ONLY_GEMINI_Q10_V5_1_ADMISSION_SHADOW
          [[ "$PIN" =~ ^[0-9a-f]{40}$ ]]
          echo "pin=$PIN" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Run exact V5.1 read-only shadow on EC2
        shell: bash
        env:
          PIN: ${{ steps.t.outputs.pin }}
          RUN_ID: ${{ steps.t.outputs.run_id }}
        run: |
          set -Eeuo pipefail
          SHORT=${PIN:0:12}
          REMOTE=$(cat <<EOF
          set -Eeuo pipefail
          REPO=/home/ssm-user/kalshi-arb-bot
          WORK=/opt/arb/gemini-q10-v5-1-shadow
          OUT=/home/ssm-user/gemini-q10-v5-1-shadow/${RUN_ID}
          STATE=/home/ssm-user/gemini-q10-v5-1-shadow-state
          IMAGE=arb-gemini-q10-v5-1-shadow:${SHORT}
          cd "\$REPO"
          git config --global --add safe.directory "\$REPO" || true
          git fetch origin ${FEATURE_BRANCH} >/dev/null
          git cat-file -e "${PIN}^{commit}"
          git merge-base --is-ancestor "${PIN}" origin/${FEATURE_BRANCH}
          git worktree remove --force "\$WORK" >/dev/null 2>&1 || true
          rm -rf "\$WORK" "\$STATE" "\$OUT"
          git worktree prune
          git worktree add --detach "\$WORK" "${PIN}" >/dev/null
          docker build -q -t "\$IMAGE" "\$WORK" >/dev/null
          docker run --rm "\$IMAGE" python -m pytest -q \
            tests/test_btc_spot_toxicity_guard.py \
            tests/test_gemini_prediction_book_cache.py \
            tests/test_gemini_q10_rescue_policy.py \
            tests/test_gemini_q10_production_executor.py \
            tests/test_gemini_q10_production_executor_v2.py \
            tests/test_gemini_q10_production_executor_v5.py \
            tests/test_gemini_q10_production_executor_v5_1.py \
            tests/test_gemini_q10_v5_recovery_deadman.py
          if [ -f /opt/arb/secrets/gemini-short-crypto.env ]; then ENV_FILE=/opt/arb/secrets/gemini-short-crypto.env; else ENV_FILE=/home/ssm-user/kalshi-arb-bot/.env; fi
          if [ -d /home/ssm-user/gemini-short-crypto-state ]; then BASE_STATE=/home/ssm-user/gemini-short-crypto-state; else BASE_STATE=/opt/arb/gemini-short-crypto-state; fi
          test -f "\$ENV_FILE"
          mkdir -p "\$STATE" "\$OUT"
          docker run --rm --network host --env-file "\$ENV_FILE" \
            -e GEMINI_SHORT_CRYPTO_STATE_DIR=/base_state \
            -e GEMINI_Q10_PRODUCTION_STATE_DIR=/prod_state \
            -e GEMINI_Q10_PRODUCTION_LIVE=NO \
            -e GEMINI_Q10_PRODUCTION_ARM_ID= \
            -e GEMINI_Q10_PRODUCTION_ARM= \
            -e GEMINI_Q10_PRODUCTION_CONTINUOUS=NO \
            -e GEMINI_Q10_V5_RECOVERY_ARM= \
            -e GEMINI_Q10_V5_WATCHDOG_ARM= \
            -e GEMINI_Q10_V5_SHADOW_CANDIDATE_WAIT_SECONDS=180 \
            -v "\$BASE_STATE:/base_state:ro" \
            -v "\$STATE:/prod_state" \
            "\$IMAGE" python -m src.gemini_q10_production_shadow_v5_1 | tee "\$OUT/shadow.log"
          grep -q 'GEMINI_Q10_V5_SHADOW=' "\$OUT/shadow.log"
          grep -q 'READ_ONLY_V5_SHADOW_NOT_REALIZED' "\$OUT/shadow.log"
          echo V5_1_SHADOW_COMPLETE
          EOF
          )
          ENC=$(printf '%s' "$REMOTE" | base64 -w0)
          PARAMS=$(jq -nc --arg cmd "echo '$ENC' | base64 -d | sudo -u ssm-user bash" '{commands:[$cmd]}')
          CID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB Gemini q10 V5.1 shadow $RUN_ID" --parameters "$PARAMS" --timeout-seconds 800 --query 'Command.CommandId' --output text)
          for _ in $(seq 1 420); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 2
          done
          RESULT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          OUT=$(jq -r '.Stdout // ""' <<<"$RESULT")
          grep -q 'GEMINI_Q10_V5_SHADOW=' <<<"$OUT"
          grep -q 'V5_1_SHADOW_COMPLETE' <<<"$OUT"
