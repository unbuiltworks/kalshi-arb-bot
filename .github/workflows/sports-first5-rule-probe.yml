name: Sports First5 Rule Probe

on:
  pull_request:
    paths:
      - 'src/polymarket_us_first5_probe.py'
      - '.github/workflows/sports-first5-rule-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Query public Polymarket US MLB first-five inventory
        run: python -m src.polymarket_us_first5_probe
