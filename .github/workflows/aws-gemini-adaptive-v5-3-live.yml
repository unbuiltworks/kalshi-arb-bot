name: AWS Gemini adaptive maker V5.3 one-canary live

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - deploy/aws/gemini-adaptive-v5-3-live.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  RELEASE_BRANCH: release/gemini-adaptive-maker-v5-3-final
  REQUIRED_RELEASE_COMMIT: 1f876470e9e4de43235914379636c4b16d02c8ab

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation

      - name: Validate fresh V5.3 live authorization
        id: gate
        shell: bash
        run: |
          set -Eeuo pipefail
          F=deploy/aws/gemini-adaptive-v5-3-live.trigger
          test -f "$F"
          PIN=$(awk -F= '$1=="PINNED_COMMIT"{print $2}' "$F" | tr -d '[:space:]')
          APPROVAL=$(awk -F= '$1=="APPROVAL_ID"{print $2}' "$F" | tr -d '[:space:]')
          CLASS=$(awk -F= '$1=="CLASSIFICATION"{print $2}' "$F" | tr -d '\r')
          AUTH=$(awk -F= '$1=="LIVE_AUTHORIZATION"{print $2}' "$F" | tr -d '\r')
          test "$PIN" = "$REQUIRED_RELEASE_COMMIT"
          [[ "$APPROVAL" =~ ^[A-Za-z0-9_-]+$ ]]
          test "$CLASS" = FRESH_USER_APPROVED_ONE_ADAPTIVE_BTC5_V5_3_CAMPAIGN
          test "$AUTH" = EXPLICIT_USER_APPROVAL_ADAPTIVE_BTC5_V5_3
          echo "pin=$PIN" >> "$GITHUB_OUTPUT"
          echo "approval=$APPROVAL" >> "$GITHUB_OUTPUT"
          echo 'Fresh authorization accepted for exactly one adaptive BTC5 V5.3 campaign; continuous mode disabled.'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run exactly one bounded adaptive V5.3 campaign
        shell: bash
        env:
          PIN: ${{ steps.gate.outputs.pin }}
          APPROVAL: ${{ steps.gate.outputs.approval }}
        run: |
          set -Eeuo pipefail
          SHORT=${PIN:0:12}
          REMOTE=$(cat <<EOF
          set -Eeuo pipefail
          REPO=/home/ssm-user/kalshi-arb-bot
          WORK=/opt/arb/gemini-adaptive-v5-3-live
          STATE=/home/ssm-user/gemini-adaptive-v5-3-live-state/${APPROVAL}
          OUT=/home/ssm-user/gemini-adaptive-v5-3-live-output/${APPROVAL}
          IMAGE=arb-gemini-adaptive-v5-3-live:${SHORT}
          SIDECAR=v53-watch-${APPROVAL}
          EXECUTOR=v53-exec-${APPROVAL}
          cd "\$REPO"
          git config --global --add safe.directory "\$REPO" || true
          git fetch origin ${RELEASE_BRANCH} >/dev/null
          ACTUAL=\$(git rev-parse origin/${RELEASE_BRANCH})
          test "\$ACTUAL" = "${PIN}"

          if [ -e "\$STATE" ]; then
            echo 'STOP: approval state path already exists'
            exit 41
          fi
          mkdir -p "\$STATE" "\$OUT"
          chmod 700 "\$STATE" "\$OUT"
          git worktree remove --force "\$WORK" >/dev/null 2>&1 || true
          rm -rf "\$WORK"
          docker rm -f "\$SIDECAR" "\$EXECUTOR" >/dev/null 2>&1 || true
          git worktree prune
          git worktree add --detach "\$WORK" "${PIN}" >/dev/null
          docker build -q -t "\$IMAGE" "\$WORK" >/dev/null

          echo '=== V5.3 EXACT RELEASE SAFETY TESTS ==='
          docker run --rm --network none "\$IMAGE" python -m pytest -q \
            tests/test_btc_spot_toxicity_guard.py \
            tests/test_gemini_prediction_book_cache.py \
            tests/test_gemini_q10_rescue_policy.py \
            tests/test_gemini_liquidity_reward_dynamic_completion_q10.py \
            tests/test_gemini_q10_production_executor.py \
            tests/test_gemini_q10_production_executor_v2.py \
            tests/test_gemini_q10_production_executor_v5.py \
            tests/test_gemini_q10_production_executor_v5_1.py \
            tests/test_gemini_q10_v5_recovery_deadman.py \
            tests/test_gemini_q10_v5_deadman_sidecar.py \
            tests/test_gemini_q10_v5_2.py \
            tests/test_gemini_adaptive_maker_v5_3.py \
            tests/test_gemini_adaptive_maker_executor_v5_3.py \
            tests/test_gemini_adaptive_maker_contract_grid_v5_3.py

          if [ -f /opt/arb/secrets/gemini-short-crypto.env ]; then ENV_FILE=/opt/arb/secrets/gemini-short-crypto.env; else ENV_FILE=/home/ssm-user/kalshi-arb-bot/.env; fi
          if [ -d /home/ssm-user/gemini-short-crypto-state ]; then BASE_STATE=/home/ssm-user/gemini-short-crypto-state; else BASE_STATE=/opt/arb/gemini-short-crypto-state; fi
          test -f "\$ENV_FILE"

          echo '=== FRESH READ-ONLY ACCOUNT / RECOVERY PREFLIGHT ==='
          docker run --rm -i --network host --env-file "\$ENV_FILE" \
            -e GEMINI_SHORT_CRYPTO_STATE_DIR=/base_state \
            -e GEMINI_Q10_PRODUCTION_STATE_DIR=/prod_state \
            -e GEMINI_Q10_PRODUCTION_LIVE=NO \
            -e GEMINI_Q10_PRODUCTION_ARM_ID= \
            -e GEMINI_Q10_PRODUCTION_ARM= \
            -e GEMINI_Q10_V5_RECOVERY_ARM= \
            -e GEMINI_Q10_V5_WATCHDOG_ARM= \
            -v "\$BASE_STATE:/base_state:ro" \
            -v "\$STATE:/prod_state" \
            "\$IMAGE" python - <<'PY'
          import asyncio, json
          from decimal import Decimal as D
          from src import gemini_adaptive_maker_contract_grid_v5_3 as grid
          from src import gemini_adaptive_maker_executor_v5_3 as v53
          from src import gemini_adaptive_maker_v5_3_recovery as recovery53
          async def main():
              grid.install(); recovery53.install()
              report, _, _, _ = await recovery53.audit()
              available, flat = await v53.v5.v1._preflight_flat()
              out = {'audit':report.as_dict(),'available_usd':str(available),'flat':flat,'order_entry':False}
              print('V5_3_LIVE_PREFLIGHT='+json.dumps(out,separators=(',',':'),default=str))
              assert report.status == 'CLEAN_NO_OPEN_STATE'
              assert report.account_orders == 0 and report.account_positions == 0
              assert flat['orders'] == 0 and flat['positions'] == 0
              assert D(str(available)) >= D('22.10')
          asyncio.run(main())
          PY

          echo '=== START INDEPENDENT V5.3 DEAD-MAN SIDECAR ==='
          docker run -d --name "\$SIDECAR" --network host --env-file "\$ENV_FILE" \
            -e GEMINI_SHORT_CRYPTO_STATE_DIR=/base_state \
            -e GEMINI_Q10_PRODUCTION_STATE_DIR=/prod_state \
            -e GEMINI_Q10_PRODUCTION_LIVE=YES \
            -e GEMINI_Q10_PRODUCTION_ARM_ID=${APPROVAL} \
            -e GEMINI_Q10_PRODUCTION_ARM=${APPROVAL} \
            -e GEMINI_Q10_V5_RECOVERY_ARM=${APPROVAL} \
            -e GEMINI_Q10_V5_WATCHDOG_ARM=${APPROVAL} \
            -e GEMINI_Q10_V5_MAX_RESCUE_LOSS_USD=0.30 \
            -e GEMINI_Q10_V5_MAX_CAMPAIGN_LOSS_USD=1.00 \
            -e GEMINI_Q10_V5_MAX_DAILY_LOSS_USD=3.00 \
            -v "\$BASE_STATE:/base_state:ro" \
            -v "\$STATE:/prod_state" \
            "\$IMAGE" python -m src.gemini_adaptive_maker_v5_3_deadman_sidecar >/dev/null
          sleep 0.5
          test "\$(docker inspect -f '{{.State.Running}}' "\$SIDECAR")" = true

          echo '=== ONE USER-APPROVED ADAPTIVE V5.3 CAMPAIGN ==='
          set +e
          timeout --signal=TERM --kill-after=5s 900s docker run --name "\$EXECUTOR" --network host --env-file "\$ENV_FILE" \
            -e GEMINI_SHORT_CRYPTO_STATE_DIR=/base_state \
            -e GEMINI_Q10_PRODUCTION_STATE_DIR=/prod_state \
            -e GEMINI_Q10_PRODUCTION_LIVE=YES \
            -e GEMINI_Q10_PRODUCTION_ARM_ID=${APPROVAL} \
            -e GEMINI_Q10_PRODUCTION_ARM=${APPROVAL} \
            -e GEMINI_Q10_PRODUCTION_CONTINUOUS=NO \
            -e GEMINI_Q10_PRODUCTION_MAX_CAMPAIGNS=1 \
            -e GEMINI_Q10_V5_RECOVERY_ARM=${APPROVAL} \
            -e GEMINI_Q10_V5_WATCHDOG_ARM=${APPROVAL} \
            -e GEMINI_Q10_V5_MAX_RESCUE_LOSS_USD=0.30 \
            -e GEMINI_Q10_V5_MAX_CAMPAIGN_LOSS_USD=1.00 \
            -e GEMINI_Q10_V5_MAX_DAILY_LOSS_USD=3.00 \
            -v "\$BASE_STATE:/base_state:ro" \
            -v "\$STATE:/prod_state" \
            "\$IMAGE" python -m src.gemini_adaptive_maker_v5_3_runtime > "\$OUT/executor.log" 2>&1
          EXEC_RC=\$?
          set -e
          docker rm -f "\$EXECUTOR" >/dev/null 2>&1 || true

          # If the executor exited outside its normal path, the 15s V5.3 dead-man
          # threshold must have enough time to reconcile before final read-only audit.
          sleep 17
          docker logs "\$SIDECAR" > "\$OUT/sidecar.log" 2>&1 || true
          docker rm -f "\$SIDECAR" >/dev/null 2>&1 || true

          echo '=== POST-CAMPAIGN READ-ONLY RECONCILIATION ==='
          set +e
          docker run --rm -i --network host --env-file "\$ENV_FILE" \
            -e GEMINI_SHORT_CRYPTO_STATE_DIR=/base_state \
            -e GEMINI_Q10_PRODUCTION_STATE_DIR=/prod_state \
            -e GEMINI_Q10_PRODUCTION_LIVE=NO \
            -e GEMINI_Q10_PRODUCTION_ARM_ID= \
            -e GEMINI_Q10_PRODUCTION_ARM= \
            -e GEMINI_Q10_V5_RECOVERY_ARM= \
            -e GEMINI_Q10_V5_WATCHDOG_ARM= \
            -v "\$BASE_STATE:/base_state:ro" \
            -v "\$STATE:/prod_state" \
            "\$IMAGE" python - <<'PY' > "\$OUT/post.log" 2>&1
          import asyncio, json
          from src import gemini_adaptive_maker_contract_grid_v5_3 as grid
          from src import gemini_adaptive_maker_executor_v5_3 as v53
          from src import gemini_adaptive_maker_v5_3_recovery as recovery53
          async def main():
              grid.install(); recovery53.install()
              report, state, _, _ = await recovery53.audit()
              print('V5_3_LIVE_POST='+json.dumps({'audit':report.as_dict(),'state':state},separators=(',',':'),default=str))
              if report.residual_quantity != v53.ZERO:
                  raise SystemExit(42)
              if report.account_positions:
                  cleared = await v53.v5.v1._wait_flat_after_settlement(timeout=600.0)
                  print('V5_3_SETTLEMENT_CLEAR='+json.dumps({'cleared':cleared},separators=(',',':')))
                  if not cleared:
                      raise SystemExit(43)
              final, _, _, _ = await recovery53.audit()
              print('V5_3_LIVE_FINAL='+json.dumps(final.as_dict(),separators=(',',':'),default=str))
              if final.account_orders != 0 or final.account_positions != 0 or final.residual_quantity != v53.ZERO:
                  raise SystemExit(44)
          asyncio.run(main())
          PY
          POST_RC=\$?
          set -e

          cat "\$OUT/post.log"
          if [ "\$EXEC_RC" != 0 ]; then
            echo '=== EXECUTOR FAILURE TAIL ==='
            tail -n 20 "\$OUT/executor.log" || true
            echo '=== SIDECAR TAIL ==='
            tail -n 20 "\$OUT/sidecar.log" || true
          fi
          echo "V5_3_EXECUTOR_RC=\$EXEC_RC V5_3_POST_RC=\$POST_RC"
          test "\$POST_RC" = 0
          test "\$EXEC_RC" = 0
          echo V5_3_ONE_CANARY_COMPLETE approval=${APPROVAL} pin=${PIN}
          EOF
          )
          ENC=$(printf '%s' "$REMOTE" | base64 -w0)
          PARAMS=$(jq -nc --arg cmd "echo '$ENC' | base64 -d | sudo -u ssm-user bash" '{commands:[$cmd]}')
          CID=$(aws ssm send-command \
            --instance-ids "$AWS_HOT_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "ARB one fresh-user-approved Gemini adaptive BTC5 V5.3 canary" \
            --parameters "$PARAMS" \
            --timeout-seconds 1950 \
            --query 'Command.CommandId' --output text)
          for _ in $(seq 1 1000); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 2
          done
          RESULT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          OUT=$(jq -r '.Stdout // ""' <<<"$RESULT")
          grep -q 'V5_3_ONE_CANARY_COMPLETE' <<<"$OUT"
          grep -q 'V5_3_EXECUTOR_RC=0 V5_3_POST_RC=0' <<<"$OUT"
