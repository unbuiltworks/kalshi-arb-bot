name: AWS Gemini adaptive maker V5.4 readiness read-only

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - .github/workflows/aws-gemini-v5-4-readiness.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  RELEASE_BRANCH: release/gemini-adaptive-maker-v5-4
  REQUIRED_RELEASE_COMMIT: 1a02c6ca5c707193475bb00f1b476e809a4af127

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build exact V5.4 release, run 99 tests, and audit flat account without mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE=$(cat <<EOF
          set -Eeuo pipefail
          REPO=/home/ssm-user/kalshi-arb-bot
          WORK=/opt/arb/gemini-adaptive-v5-4-readiness
          STATE=/home/ssm-user/gemini-adaptive-v5-4-readiness-state
          RISK=/home/ssm-user/gemini-adaptive-v5-4-readiness-risk
          IMAGE=arb-gemini-adaptive-v5-4-readiness:${REQUIRED_RELEASE_COMMIT:0:12}
          cd "\$REPO"
          git config --global --add safe.directory "\$REPO" || true
          git fetch origin ${RELEASE_BRANCH} >/dev/null
          ACTUAL=\$(git rev-parse origin/${RELEASE_BRANCH})
          test "\$ACTUAL" = "${REQUIRED_RELEASE_COMMIT}"
          git worktree remove --force "\$WORK" >/dev/null 2>&1 || true
          rm -rf "\$WORK" "\$STATE" "\$RISK"
          git worktree prune
          git worktree add --detach "\$WORK" "\$ACTUAL" >/dev/null
          docker build -q -t "\$IMAGE" "\$WORK" >/dev/null

          docker run --rm --network none \
            -e GEMINI_Q10_V5_MAX_RESCUE_LOSS_USD=0.30 \
            -e GEMINI_Q10_V5_MAX_CAMPAIGN_LOSS_USD=1.00 \
            "\$IMAGE" python -m pytest -q \
            tests/test_btc_spot_toxicity_guard.py \
            tests/test_gemini_prediction_book_cache.py \
            tests/test_gemini_q10_rescue_policy.py \
            tests/test_gemini_liquidity_reward_dynamic_completion_q10.py \
            tests/test_gemini_q10_production_executor.py \
            tests/test_gemini_q10_production_executor_v2.py \
            tests/test_gemini_q10_production_executor_v5.py \
            tests/test_gemini_q10_production_executor_v5_1.py \
            tests/test_gemini_q10_v5_recovery_deadman.py \
            tests/test_gemini_q10_v5_deadman_sidecar.py \
            tests/test_gemini_q10_v5_2.py \
            tests/test_gemini_adaptive_maker_v5_3.py \
            tests/test_gemini_adaptive_maker_executor_v5_3.py \
            tests/test_gemini_adaptive_maker_contract_grid_v5_3.py \
            tests/test_gemini_adaptive_maker_v5_4.py

          if [ -f /opt/arb/secrets/gemini-short-crypto.env ]; then ENV_FILE=/opt/arb/secrets/gemini-short-crypto.env; else ENV_FILE=/home/ssm-user/kalshi-arb-bot/.env; fi
          if [ -d /home/ssm-user/gemini-short-crypto-state ]; then BASE_STATE=/home/ssm-user/gemini-short-crypto-state; else BASE_STATE=/opt/arb/gemini-short-crypto-state; fi
          test -f "\$ENV_FILE"
          mkdir -p "\$STATE" "\$RISK"
          chmod 700 "\$STATE" "\$RISK"

          docker run --rm -i --network host --env-file "\$ENV_FILE" \
            -e GEMINI_SHORT_CRYPTO_STATE_DIR=/base_state \
            -e GEMINI_Q10_PRODUCTION_STATE_DIR=/prod_state \
            -e GEMINI_ADAPTIVE_V5_4_RISK_STATE_DIR=/risk_state \
            -e GEMINI_Q10_PRODUCTION_LIVE=NO \
            -e GEMINI_Q10_PRODUCTION_ARM_ID= \
            -e GEMINI_Q10_PRODUCTION_ARM= \
            -e GEMINI_Q10_V5_RECOVERY_ARM= \
            -e GEMINI_Q10_V5_WATCHDOG_ARM= \
            -e GEMINI_Q10_V5_MAX_RESCUE_LOSS_USD=0.30 \
            -e GEMINI_Q10_V5_MAX_CAMPAIGN_LOSS_USD=1.00 \
            -v "\$BASE_STATE:/base_state:ro" \
            -v "\$STATE:/prod_state" \
            -v "\$RISK:/risk_state" \
            "\$IMAGE" python - <<'PY'
          import asyncio, json
          from decimal import Decimal as D
          from src import gemini_adaptive_maker_contract_grid_v5_3 as grid
          from src import gemini_adaptive_maker_daily_risk_v5_4 as daily
          from src import gemini_adaptive_maker_executor_v5_3 as v53
          from src import gemini_adaptive_maker_executor_v5_4 as v54
          from src import gemini_adaptive_maker_v5_3_runtime as runtime
          from src import gemini_adaptive_maker_v5_3_recovery as r
          from src import gemini_adaptive_maker_v5_3_deadman as d
          from src import gemini_adaptive_maker_v5_3_deadman_sidecar as s

          async def main():
              runtime.install_new_campaign_runtime()
              report, _, _, _ = await r.audit()
              available, flat = await v53.v5.v1._preflight_flat()

              runtime.install_new_campaign_runtime()
              hook_ok = getattr(v53.v5, '_run_campaign', None) is v54.run_campaign_v54
              grid_ok = v53._event_contract_ok is grid.event_contract_ok
              planner_ok = v53.policy.select_plan is grid.select_plan_grid_aware

              # Exercise the persistent risk module only in this disposable readiness dir.
              daily.seed(
                  date_utc='2026-08-30',
                  baseline_available_usd=available,
                  current_available_usd=available,
                  source='READINESS_DISPOSABLE_LEDGER',
              )
              risk = daily.check(
                  current_available_usd=available,
                  loss_limit_usd=v53.v5.max_daily_loss(),
                  account_flat=True,
                  allow_rollover=False,
              )

              dead = await d.check_once()
              side = await s.tick()
              out = {
                  'release_commit':'${REQUIRED_RELEASE_COMMIT}',
                  'audit':report.as_dict(),
                  'available_usd':str(available),
                  'flat':flat,
                  'deadman':dead,
                  'sidecar_tick':side,
                  'daily_risk':risk.as_dict(),
                  'live_armed':v53.v5.live_armed(),
                  'recovery_armed':r.recovery52.recovery.recovery_armed(),
                  'watchdog_armed':d.watchdog_armed(),
                  'adaptive_campaign_hook':hook_ok,
                  'contract_grid_installed':grid_ok,
                  'hard_campaign_planner_installed':planner_ok,
                  'rescue_loss_limit':str(v53.v5.max_rescue_loss()),
                  'campaign_loss_limit':str(v53.v5.max_campaign_loss()),
                  'daily_loss_limit':str(v53.v5.max_daily_loss()),
                  'order_entry':False,
                  'realized_pnl':0,
              }
              print('V5_4_ADAPTIVE_READINESS='+json.dumps(out,separators=(',',':'),default=str))
              assert report.status == 'CLEAN_NO_OPEN_STATE'
              assert report.account_orders == 0 and report.account_positions == 0
              assert flat['orders'] == 0 and flat['positions'] == 0
              assert hook_ok and grid_ok and planner_ok
              assert out['rescue_loss_limit'] == '0.30'
              assert out['campaign_loss_limit'] == '1.00'
              assert out['daily_loss_limit'] == '3.00'
              assert risk.status == 'DAILY_RISK_OK' and not risk.blocked
              assert dead['status'] == 'IDLE_NO_OPEN_CAMPAIGN'
              assert side['status'] == 'WAITING_FOR_OPEN_CAMPAIGN'
              assert not out['live_armed'] and not out['recovery_armed'] and not out['watchdog_armed']
          asyncio.run(main())
          PY
          EOF
          )
          ENC=$(printf '%s' "$REMOTE" | base64 -w0)
          PARAMS=$(jq -nc --arg cmd "echo '$ENC' | base64 -d | sudo -u ssm-user bash" '{commands:[$cmd]}')
          CID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB V5.4 adaptive maker read-only readiness" --parameters "$PARAMS" --timeout-seconds 800 --query 'Command.CommandId' --output text)
          for _ in $(seq 1 390); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 2
          done
          RESULT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          OUT=$(jq -r '.Stdout // ""' <<<"$RESULT")
          grep -q '99 passed' <<<"$OUT"
          grep -q 'V5_4_ADAPTIVE_READINESS=' <<<"$OUT"
          grep -q '"order_entry":false' <<<"$OUT"
          grep -q '"live_armed":false' <<<"$OUT"
          grep -q '"adaptive_campaign_hook":true' <<<"$OUT"
          grep -q '"hard_campaign_planner_installed":true' <<<"$OUT"
          grep -q '"daily_loss_limit":"3.00"' <<<"$OUT"
