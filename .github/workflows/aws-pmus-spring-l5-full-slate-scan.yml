name: AWS PMUS SPRING-L5 full-slate read-only scan

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - deploy/aws/pmus-spring-l5-scan.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  SPRING_REF: 55d42b60a5062489b6d7f1150ac8b65b0cd23e08

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Full universe discovery plus targeted authenticated read-only observation
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE=$(cat <<'EOF'
          set -Eeuo pipefail
          APP=/home/ssm-user/l5-pmus-spring-stage
          ENGINE=/home/ssm-user/l5-pmus-engine
          VENV=/home/ssm-user/l5-pmus-engine-venv/bin/python
          CREDS=/home/ssm-user/l5-pmus-q1-credentials.env
          PROD_STATE=/home/ssm-user/l5-pmus-q1-state
          PERM_REC=/home/ssm-user/l5-pmus-ws-state/recorder.log
          TMPROOT=/home/ssm-user/l5-pmus-spring-scan-$(date +%s)
          install -d -o ssm-user -g ssm-user "$TMPROOT"
          test -f "$APP/src/pmus_spring_l5_session.py"
          test -f "$CREDS" && test "$(stat -c %a "$CREDS")" = 600
          test "$(systemctl is-active l5-pmus-recorder.service)" = active
          test "$(systemctl is-active l5-pmus-supervisor.service)" = active
          grep -q '^Environment=PMUS_SUPERVISOR_LIVE=NO$' /etc/systemd/system/l5-pmus-supervisor.service

          sudo -u ssm-user bash -lc '
            set -Eeuo pipefail
            set -a; . /home/ssm-user/l5-pmus-q1-credentials.env; set +a
            export PMUS_Q1_STATE_DIR=/home/ssm-user/l5-pmus-q1-state
            export PMUS_Q1_LIVE=NO PMUS_MICRO_LIVE=NO PMUS_SPRING_LIVE=NO
            export PMUS_WS_LEAGUES=all PMUS_WS_PREFIXES=
            export TMPROOT="'$TMPROOT'"

            PYTHONPATH=/home/ssm-user/l5-pmus-engine /home/ssm-user/l5-pmus-engine-venv/bin/python - <<"PY"
          import json, os
          from pathlib import Path
          from src import pmus_ws_evidence_recorder as rec
          universe=rec.discover_universe()
          Path(os.environ["TMPROOT"],"universe.json").write_text(json.dumps(universe))
          print("SPRING_UNIVERSE "+json.dumps({
              "discovered_total":len(universe),
              "props":sum(1 for x in universe if x.get("prop")),
              "leagues":sorted({str(x.get("league")) for x in universe if x.get("league")})
          },separators=(",",":")))
          PY

            PYTHONPATH=/home/ssm-user/l5-pmus-spring-stage /home/ssm-user/l5-pmus-engine-venv/bin/python - <<"PY"
          import json, os, time
          from decimal import Decimal as D
          from pathlib import Path
          from urllib.error import HTTPError
          from src import pmus_micro_executor as m
          from src import pmus_spring_l5_session as s
          q=m.q1
          class ScanTransport(m.Transport):
              def __init__(self):
                  self.last_public=0.0
              def request(self, method, path, body=None, base=q.API):
                  if method != "GET":
                      raise RuntimeError("READ_ONLY_SCAN_BLOCKED_NON_GET")
                  if base == q.GATEWAY:
                      wait=max(0.0,0.07-(time.monotonic()-self.last_public))
                      if wait: time.sleep(wait)
                      last=None
                      for delay in (0.0,0.25,0.5,1.0):
                          if delay: time.sleep(delay)
                          try:
                              out=super().request(method,path,body,base)
                              self.last_public=time.monotonic()
                              return out
                          except HTTPError as exc:
                              last=exc
                              if exc.code != 429 and not (500 <= exc.code <= 599): raise
                      raise last
                  return super().request(method,path,body,base)
          t=ScanTransport()
          universe=json.loads(Path(os.environ["TMPROOT"],"universe.json").read_text())
          rows=[]; errors=0
          for x in universe:
              slug=str(x.get("slug") or "")
              if not slug: continue
              try:
                  b=q.outcome_bbo(t,slug,"OUTCOME_SIDE_YES")
                  bid=D(str(b["bid"])); ask=D(str(b["ask"]))
                  if not (s.SPRING_BAND_LO <= bid <= s.SPRING_BAND_HI):
                      continue
                  spec=m.market_micro_spec(t,slug,bid)
                  rows.append({"slug":slug,"bid":str(bid),"ask":str(ask),
                      "qty":str(spec["qty"]),"intended_notional":str(spec["entry_notional"]),
                      "worst_complement_notional":str(spec["worst_complement_notional"]),
                      "min_trade_qty":str(spec["minimum_trade_qty"]),"tick":str(spec["tick"]),
                      "prop":bool(x.get("prop")),"league":x.get("league"),
                      "distance_from_half":str(abs(bid-D("0.50")))})
              except Exception:
                  errors += 1
          rows.sort(key=lambda r:(D(r["distance_from_half"]),r["slug"]))
          shortlist=rows[:40]
          Path(os.environ["TMPROOT"],"public_shortlist.json").write_text(json.dumps(shortlist))
          Path(os.environ["TMPROOT"],"slugs.txt").write_text(",".join(r["slug"] for r in shortlist))
          print("SPRING_PUBLIC_SHORTLIST "+json.dumps({"midband_micro_total":len(rows),
              "targeted_count":len(shortlist),"scan_errors":errors,"top":shortlist[:12]},separators=(",",":")))
          PY

            SLUGS=$(cat "'$TMPROOT'/slugs.txt")
            if [ -n "$SLUGS" ]; then
              export PMUS_WS_MARKETS="$SLUGS"
              export PMUS_WS_ROOT="'$TMPROOT'/ws"
              export PMUS_WS_MAX_MARKETS=40
              export PMUS_WS_STATUS_EVERY_SECONDS=30
              export PMUS_WS_DISCOVERY_SECONDS=300
              PYTHONPATH=/home/ssm-user/l5-pmus-engine /home/ssm-user/l5-pmus-engine-venv/bin/python -m src.pmus_ws_evidence_recorder --minutes 1.5 > "'$TMPROOT'/targeted.log" 2>&1
            fi

            PYTHONPATH=/home/ssm-user/l5-pmus-engine /home/ssm-user/l5-pmus-engine-venv/bin/python - <<"PY"
          import json, os, time
          from pathlib import Path
          from src import pmus_ws_evidence_recorder as rec
          root=Path(os.environ["TMPROOT"],"ws")
          state={}
          if root.exists():
              rec.hydrate_state(state,rec.iter_recent_tape_rows(root,max_bytes=0),now=time.time())
          rows=[rec._market_row(slug,st,time.time()) for slug,st in state.items()]
          Path(os.environ["TMPROOT"],"observed.json").write_text(json.dumps(rows))
          print("SPRING_TARGETED_EVIDENCE "+json.dumps({"observed_markets":len(rows),
              "two_sided_books":sum(1 for r in rows if r.get("both_sides_served")),
              "two_sided_flow":sum(1 for r in rows if r.get("two_sided_trades")),
              "q1_gate_clear":sum(1 for r in rows if r.get("gate_status")=="Q1_GATE_CLEARED")},separators=(",",":")))
          PY

            PYTHONPATH=/home/ssm-user/l5-pmus-spring-stage /home/ssm-user/l5-pmus-engine-venv/bin/python - <<"PY"
          import json, os
          from decimal import Decimal as D
          from pathlib import Path
          from src import pmus_spring_l5_session as s
          from src import pmus_micro_executor as m
          q=m.q1
          t=m.Transport()
          obs=json.loads(Path(os.environ["TMPROOT"],"observed.json").read_text()) if Path(os.environ["TMPROOT"],"observed.json").exists() else []
          status={"eligible_markets":obs,"top_markets":[]}
          ranked=s.rank_spring_candidates(t,status)
          qual=[r for r in ranked if r.get("spring_skip") is None]
          block=None; account_error=None
          try: block=m.account_block_reason(t)
          except Exception as exc: account_error=type(exc).__name__
          power=None
          try:
              bal=q.base._get_with_retry(t,"/v1/account/balances")
              rs=bal.get("balances") if isinstance(bal,dict) else None
              for r in (rs or []):
                  if isinstance(r,dict) and str(r.get("currency","")).upper()=="USD":
                      power=q._d(r.get("buyingPower")); break
          except Exception as exc:
              account_error=account_error or type(exc).__name__
          realized=q.realized_today()
          account_ready=(account_error is None and block is None and power is not None
                         and power >= q.MIN_BUYING_POWER and realized > q.DAILY_LOSS_STOP)
          out={"mode":"SPRING_FULL_SLATE_GET_AND_WS_READ_ONLY",
               "spring_ref":"55d42b60a5062489b6d7f1150ac8b65b0cd23e08",
               "spring_armed":s.armed(),"micro_armed":m.micro_armed(),
               "qualifying_count":len(qual),"qualifying":qual[:12],
               "account":{"ready":account_ready,"block_reason":block,"error":account_error,
                          "buying_power":str(power) if power is not None else None,
                          "realized_today_authoritative":str(realized)},
               "ready_for_one_shot":bool(account_ready and qual),
               "mutation_methods":[]}
          print("SPRING_FULL_SLATE_RESULT "+json.dumps(out,separators=(",",":"),default=str))
          PY
          '
          test "$(systemctl is-active l5-pmus-recorder.service)" = active
          test "$(systemctl is-active l5-pmus-supervisor.service)" = active
          grep -q '^Environment=PMUS_SUPERVISOR_LIVE=NO$' /etc/systemd/system/l5-pmus-supervisor.service
          echo SPRING_FULL_SLATE_SCAN_OK read_only=true permanent_supervisor_disarmed=true
          EOF
          )
          ENC=$(printf '%s' "$REMOTE" | base64 -w0)
          PARAMS=$(jq -nc --arg cmd "echo '$ENC' | base64 -d | bash" '{commands:[$cmd]}')
          CID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment 'L5 SPRING full-slate targeted read-only scan' --parameters "$PARAMS" --timeout-seconds 420 --query 'Command.CommandId' --output text)
          for _ in $(seq 1 230); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 2
          done
          RESULT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          OUT=$(jq -r '.Stdout' <<<"$RESULT")
          grep -q 'SPRING_FULL_SLATE_SCAN_OK' <<<"$OUT"
          grep -q '"mutation_methods":\[\]' <<<"$OUT"
