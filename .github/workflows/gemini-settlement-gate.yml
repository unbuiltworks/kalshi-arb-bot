# Read-only Gemini SETTLEMENT gate evidence.
#
# WHY THIS EXISTS. The Gemini lane can evidence every stage a bounded canary
# PROPOSAL needs and cannot score one: an expired BTC5m contract closes with
# an empty book and the venue publishes NO terminal value anywhere public
# (measured 2026-09-17 across four expired windows; one last-printed 0.97 and
# another 0.17, and a last print is not a settlement). Only the authenticated
# account surface can close it.
#
# WHERE THE CREDENTIALS ARE. This repo already holds Gemini credentials as
# Actions secrets -- the same established mechanism gemini-subsidy-verify.yml
# uses. No AWS host, no SSH, no fallback. If this fails, it fails.
#
# WHAT IT ANSWERS. Whether an authoritative settlement/outcome read exists for
# our account at all, and how far the required proof chain gets:
#
#   contract -> expiry -> authoritative outcome -> position
#            -> settlement cashflow -> fees -> ledger reconciliation
#
# A 404 on a settlement candidate is a RESULT, not a failure: it establishes
# the credit does not live there, which nobody had established.
#
# NO ORDER IS SUBMITTED. The probe has no order transport and cannot reach one;
# the structural guard below proves it over the AST before any secret is in
# scope.
name: Gemini Settlement Gate (read-only)

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated GEMI symbols; blank = recent BTC5m expiries"
        required: false
        default: ""
      armed_continuous:
        description: "Set to true to ARM the ONE authorized continuous window. Default false."
        required: false
        default: "false"

# One at a time. A second run could commit evidence over the first.
concurrency:
  group: gemini-settlement-gate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/l5-execution-instrumentation-io6nzi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      # The guards run BEFORE any credential is in scope: if the read-only
      # contract is broken, the job dies without ever holding a secret.
      - name: Structural guard -- no order transport, no credential read
        run: |
          python -m pytest tests/test_gemini_settlement_probe.py \
                           tests/test_gemini_settlement.py -q

      - name: Choose symbols
        id: syms
        env:
          INPUT_SYMBOLS: ${{ github.event.inputs.symbols }}
        run: |
          if [ -n "$INPUT_SYMBOLS" ]; then
            echo "symbols=$INPUT_SYMBOLS" >> "$GITHUB_OUTPUT"
          else
            # the last six EXPIRED BTC5m windows: settlement is only a
            # question once a contract has actually expired
            echo "symbols=$(python3 scripts/gemini_recent_expiries.py -n 6)" \
              >> "$GITHUB_OUTPUT"
          fi

      - name: Settlement gate probe (read-only; no order transport)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_SECRET: ${{ secrets.GEMINI_API_SECRET }}
        run: |
          set -o pipefail
          # stdout carries the gate report only; the module never prints secrets.
          python -m src.gemini_settlement_probe \
            --symbols "${{ steps.syms.outputs.symbols }}" | tee /tmp/gate.json
          # fail closed: NO_CREDENTIALS is a real answer, not a silent zero,
          # and we do NOT fall back to another credential source.
          if grep -q '"verdict": *"NO_CREDENTIALS"' /tmp/gate.json; then
            echo "::error::Gemini secrets absent or invalid -- failing closed."
            exit 1
          fi

      - name: Canary preflight (read-only; places NOTHING)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_SECRET: ${{ secrets.GEMINI_API_SECRET }}
        run: |
          # Prints what WOULD be submitted and stops. The module has no order
          # transport and imports none; the guard above proved that before any
          # secret entered scope. Balance is reported as a SUFFICIENCY BOOLEAN
          # and the amount never leaves the process.
          #
          # A preflight that finds no eligible window is a RESULT (a BTC5m
          # window is only eligible for part of each cycle), so this step does
          # not fail the job.
          python -m src.gemini_canary_preflight || true

      - name: Execution readiness (read-only; VENUE_WRITE_PATH gate)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_SECRET: ${{ secrets.GEMINI_API_SECRET }}
        run: |
          # DISARMED: no GEMINI_CANARY_LIVE and no GEMINI_CANARY_AUTH are set
          # here, so the execution package is structurally unable to mutate.
          # This reports the gates only.
          #
          # The report is kept as an ARTIFACT rather than left in a job log:
          # it carries the authoritative contract metadata, the terms gate and
          # the request-transport verdict, and a log expires. A run that finds
          # no eligible window still writes what it could read.
          # SAME DEAD ZONE AS THE DRY RUN. Run 35336015691 reported
          # preflight_ok/contract_tradeable/quantity_valid/price_valid all
          # FALSE at 10:43:25Z and the dry run 21 seconds later succeeded --
          # the gates were false for TIMING, not for substance, which is the
          # most misleading way for a gate report to be wrong. It retries on
          # the same bounded schedule so the gates describe a real window.
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          OUT="analysis/gemini/execution_readiness_${TS}.json"
          for attempt in 1 2 3 4 5; do
            python -m src.gemini_execution.readiness > "$OUT" || true
            if python3 -c "import json,sys; d=json.load(open('$OUT')); sys.exit(0 if (d.get('gates') or {}).get('preflight_ok') else 1)" 2>/dev/null; then
              echo "gates evaluated against a live window on attempt $attempt"
              break
            fi
            echo "attempt $attempt: no eligible BTC5m window; waiting 45s"
            [ "$attempt" = "5" ] || sleep 45
          done
          if [ ! -s "$OUT" ]; then rm -f "$OUT"; fi

      - name: L5 WS canary DRY RUN (renders the frame; opens no socket)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_SECRET: ${{ secrets.GEMINI_API_SECRET }}
        run: |
          # DISARMED, and structurally unable to send: dry_run never
          # constructs a session, and the session refuses mutation methods
          # without an arm. It prints what the L5 adapter WOULD put on the
          # wire, over the transport this account has actually used.
          # A BTC5m window is only ELIGIBLE for part of each 5-minute cycle:
          # the band is TTE 60..300s, so the last 60 seconds before an expiry
          # has no eligible window at all and the next one is not open yet.
          # Run 35335282701 landed in exactly that gap at 10:34:25Z and
          # reported NO_ELIGIBLE_WINDOW -- a scheduling miss, not a defect,
          # and one that would recur on roughly one dispatch in five.
          #
          # So it retries into the next window instead of reporting a dead
          # zone as a result. Bounded at 5 attempts, and it still writes the
          # last attempt when none succeeds, because "no window" IS the
          # honest answer when it is really true.
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          OUT="analysis/gemini/ws_dry_run_${TS}.json"
          for attempt in 1 2 3 4 5; do
            python -m src.gemini_execution.ws_canary > "$OUT" || true
            if python3 -c "import json,sys; sys.exit(0 if json.load(open('$OUT')).get('ok') else 1)" 2>/dev/null; then
              echo "eligible window found on attempt $attempt"
              break
            fi
            echo "attempt $attempt: no eligible BTC5m window; waiting 45s"
            [ "$attempt" = "5" ] || sleep 45
          done
          if [ ! -s "$OUT" ]; then rm -f "$OUT"; fi

      # ==================================================================
      # UNARMED PRODUCTION-PATH PROOF. Real credentials, real readers, real
      # awaited async terms read, real account and open-order reads, real
      # symbol selection, real TTE, real recovery, real controller, real
      # working-order diff -- and NO ARM. GEMINI_CANARY_LIVE is deliberately
      # absent here, which is what makes the mutation impossible.
      #
      # It asks to mutate at the end and must be REFUSED by the authorization
      # gate. Proving the block by ASKING and being refused is evidence;
      # reading the code and asserting it would refuse is what was done twice
      # before, and it was wrong twice.
      #
      # Exit 1 when the path does NOT reach the boundary, so a regression that
      # makes the driver permanently incapable again fails this job.
      # ==================================================================
      - name: Unarmed production-path proof (sends nothing; must be refused)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_SECRET: ${{ secrets.GEMINI_API_SECRET }}
        run: |
          mkdir -p analysis/gemini
          for attempt in 1 2 3 4 5; do
            if python -m src.gemini_execution.premutation_probe \
                 --out analysis/gemini/premutation_proof_$(date -u +%Y%m%dT%H%M%SZ).json \
                 2>&1 | tee /tmp/premutation.txt; then
              exit 0
            fi
            # the eligible entry band is TTE 90..300s, so part of every 5-minute
            # cycle has no eligible window. That is timing, not a defect.
            if ! grep -q "no BTC5m contract is inside the entry band" /tmp/premutation.txt; then
              echo "::error::the production path did not reach the boundary"
              exit 1
            fi
            echo "no eligible window (attempt $attempt); waiting"
            sleep 45
          done
          echo "::error::no eligible window after 5 attempts"
          exit 1

      # Reconcile the ONE historical ledger slot that blocks every window.
      # READ-ONLY: no arm, no order path. CONTINUOUS-3 reached the mutation
      # boundary with every gate open and then refused because slot 2 of
      # CONTINUOUS-2 -- a CANCEL the venue rejected 400/-1013 -- was still
      # recorded UNKNOWN. This gathers the venue evidence; it does NOT
      # write the ledger. Applying is a separate, reviewed step.
      - name: Reconcile historical ledger slot (read-only; writes nothing)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_SECRET: ${{ secrets.GEMINI_API_SECRET }}
        run: |
          mkdir -p analysis/gemini
          python -m src.gemini_execution.reconcile_slot \
            --ledger analysis/gemini/continuous_ledger.jsonl \
            --slot 2 --order-id 145828836242288478 \
            --out analysis/gemini/reconcile_slot_$(date -u +%Y%m%dT%H%M%SZ).json \
            2>&1 | tee /tmp/reconcile.txt

      # THE UNARMED PRODUCTION-PATH VERIFICATION. This is run_continuous
      # ITSELF -- the same entry point the armed step calls -- with real
      # credentials, the real metadata readers, the real authoritative
      # account reads and the real recovery, and with NO arm and NO
      # authorization installed. It must walk the whole read-only path and
      # then be refused by the authorization gate alone, having consumed no
      # latch and sent no frame. A mocked preflight would prove nothing.
      - name: Unarmed production path (real readers; refused, sends nothing)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_SECRET: ${{ secrets.GEMINI_API_SECRET }}
        run: |
          mkdir -p analysis/gemini
          python -m src.gemini_execution.run_continuous \
            --auth-id "NO-AUTHORIZATION-IN-FORCE" \
            --cohort "COHORT-2026-09-18-C5" \
            --ledger analysis/gemini/continuous_ledger.jsonl \
            --out    analysis/gemini/continuous_unarmed_$(date -u +%Y%m%dT%H%M%SZ).json \
            --wire   /tmp/unarmed_wire.json \
            2>&1 | tee /tmp/unarmed.txt
          # the latch directory must be untouched by a refused run
          git diff --quiet -- analysis/gemini/canary_latch/ \
            || { echo 'FAIL: a refused run touched the latch store'; exit 1; }

      # ==================================================================
      # THE ONE AUTHORIZED CONTINUOUS WINDOW. Runs only when
      # armed_continuous=true is passed on dispatch.
      #
      # DISARMED AGAIN. CONTINUOUS-5 RAN AND IS SPENT: its latch is on disk
      # in state INTENT_PERSISTED, its cohort ledger carries 3 of 6 slots,
      # and the window terminated SUBMISSION_UNKNOWN_RECONCILE_REQUIRED on a
      # cancel the venue rejected -1013. The auth id below is the sentinel
      # and the driver constants are None, so this step cannot arm.
      #
      # The authorization that ran, for the record:
      # OWNER-2026-09-18-GEMINI-CONTINUOUS-5, naming
      #   executable_sha 3194e691...abf1   (UNCHANGED since review)
      #   envelope_sha   b3bff654...aa17   (UNCHANGED: no bound moved)
      #   bundle_sha     61c7abf3...8c61   (the decision capture)
      #
      # ONE window. The latch makes that durable across runners, the cohort
      # bounds it to 6 mutations, and neither is reusable.
      #
      # --cohort IS LOAD-BEARING AND WAS MISSING. Without it the window binds
      # the HISTORICAL ledger, which is 12/12 permanently spent by
      # CONTINUOUS-2, -3 and -4, and an authorized run would die on budget
      # rather than trade. COHORT-2026-09-18-C5 carries its own bounded
      # budget of 6 and its own ledger, records the historical ledger's
      # sha256 as its predecessor, and is verified INTACT before the latch.
      # A cohort may only TIGHTEN the envelope, never extend it.
      #
      # EVERY bound -- 12 mutation slots (tightened to the cohort's 6), $0.15
      # exposure, 0.04 residual and imbalance, 0.10 per leg, the end-of-window
      # floors, the terminal one-window binding -- is enforced inside
      # ws_continuous.Driver and is covered by that executable_sha. The
      # invoker only picks the contract, supplies the authoritative re-read
      # and hands the driver venue state.
      #
      # NO PAIR-COST CEILING EXISTS HERE, BY OWNER DECISION 2026-09-18. A
      # COMPLETE above $1.00 is permitted when the controller chooses it and
      # the absolute bounds pass; `<= 0.96` is a RISK OVERLAY, not L5
      # fidelity. See L5_OPERATING_MODEL.md section 2d.
      #
      # The driver refuses unless AUTHORIZED_SHA equals its own running
      # executable_sha, so any change to the driver after this authorization
      # disarms it automatically. The dual key is still required and its live
      # half is NOT in the repository.
      # ==================================================================
      - name: ONE authorized Gemini continuous window
        if: ${{ github.event.inputs.armed_continuous == 'true' }}
        timeout-minutes: 12
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_SECRET: ${{ secrets.GEMINI_API_SECRET }}
          GEMINI_CANARY_LIVE: "YES"
          GEMINI_CANARY_AUTH: "NO-AUTHORIZATION-IN-FORCE"
          GEMINI_CANARY_AUTH_EXPIRES: "2026-09-19T00:00:00Z"
        run: |
          mkdir -p analysis/gemini
          python -m src.gemini_execution.run_continuous \
            --auth-id "NO-AUTHORIZATION-IN-FORCE" \
            --cohort  "COHORT-2026-09-18-C5" \
            --ledger  analysis/gemini/continuous_ledger.jsonl \
            --out     analysis/gemini/continuous_run_$(date -u +%Y%m%dT%H%M%SZ).json \
            --wire    analysis/gemini/continuous_wire_$(date -u +%Y%m%dT%H%M%SZ).json \
            2>&1 | tee /tmp/continuous.txt

      - name: Report the gate, without deciding anything
        run: python3 scripts/gemini_settlement_gate_report.py /tmp/gate.json

      - name: Commit ONLY the evidence artifact
        run: |
          git config user.name  "gemini-settlement-gate[bot]"
          git config user.email "gemini-settlement-gate@users.noreply.github.com"
          # analysis/gemini/ ONLY. No source, config or live-service change
          # may originate from this runtime job.
          # A pathspec that matches nothing is NORMAL, not an error: a
          # window that attempted no mutation writes no ledger, and a run that
          # refused before the driver writes no run artifact. `git add` on a
          # missing pathspec exits 128, which killed the job and threw away
          # the evidence it HAD gathered -- losing the record of a refusal,
          # which is exactly the record worth keeping.
          for f in analysis/gemini/settlement_gate_*.json \
                   analysis/gemini/canary_preflight_*.json \
                   analysis/gemini/execution_readiness_*.json \
                   analysis/gemini/ws_dry_run_*.json \
                   analysis/gemini/continuous_run_*.json \
                   analysis/gemini/continuous_wire_*.json \
                   analysis/gemini/reconcile_slot_*.json \
                   analysis/gemini/continuous_unarmed_*.json \
                   analysis/gemini/premutation_proof_*.json \
                   analysis/gemini/continuous_ledger.jsonl \
                   analysis/gemini/cohorts/*/ledger.jsonl \
                   analysis/gemini/cohorts/*/cohort.json \
                   analysis/gemini/canary_latch/*.json; do
            if [ -e "$f" ]; then git add -- "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "no new evidence artifact"; exit 0
          fi
          # The ALLOW-LIST and the add-list above must name the SAME files.
          # They drifted: premutation_proof_/continuous_run_ were added to one
          # and not the other, so a job that gathered its evidence correctly
          # then refused to commit it as "outside analysis/gemini/" -- which it
          # was not. A test now asserts the two lists agree.
          #
          # THE COHORT LEDGER DRIFTED THE SAME WAY, and it matters more. A
          # cohort supplies its OWN ledger, and that file is where the slots a
          # window spends are durably recorded. Neither list knew about it, so
          # an armed window would have spent its budget on a runner and then
          # thrown the record away -- and the NEXT window would have read a
          # cohort with 0 consumed. That is a budget reset by accident, which
          # is the one thing the cohort mechanism exists to make impossible.
          if ! git diff --cached --name-only | grep -qvE '^analysis/gemini/((settlement_gate|canary_preflight|execution_readiness|ws_dry_run|continuous_run|continuous_wire|continuous_unarmed|reconcile_slot|premutation_proof)_[0-9TZ]+\.json|canary_latch/latch_[A-Za-z0-9_-]+\.json|cohorts/[A-Za-z0-9_-]+/(ledger\.jsonl|cohort\.json)|continuous_ledger\.jsonl)$'; then
            # [skip ci] so the evidence commit cannot re-trigger anything
            git commit -m "evidence(gemini): read-only settlement gate [skip ci]"
            # An evidence job must not lose its evidence to a race. Any other
            # push to this branch while the job runs makes the push a
            # non-fast-forward; rebase onto the remote and retry rather than
            # discard a reading that cannot be reproduced (the venue has
            # moved on by the next run).
            for attempt in 1 2 3; do
              if git push origin HEAD:claude/l5-execution-instrumentation-io6nzi; then
                exit 0
              fi
              echo "push rejected (attempt $attempt); rebasing onto remote"
              git fetch origin claude/l5-execution-instrumentation-io6nzi
              git rebase FETCH_HEAD || { git rebase --abort; exit 1; }
              sleep $((attempt * 3))
            done
            echo "::error::could not push evidence after 3 attempts"
            exit 1
          else
            echo "::error::refusing to commit files outside analysis/gemini/"
            git diff --cached --name-only; exit 1
          fi
