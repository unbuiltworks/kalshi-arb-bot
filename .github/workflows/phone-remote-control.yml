name: Phone Remote Control

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  command:
    if: ${{ github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[bot-command] ') }}
    runs-on: [self-hosted, kalshi-bot]
    timeout-minutes: 70

    steps:
      - name: Run allowlisted command
        id: command
        continue-on-error: true
        shell: bash
        env:
          CMD_TITLE: ${{ github.event.issue.title }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_SECRET: ${{ secrets.GEMINI_API_SECRET }}
        run: |
          set +e
          OUT="$RUNNER_TEMP/kalshi-command-output.txt"
          REPO="/home/ssm-user/kalshi-arb-bot"
          CMD="${CMD_TITLE#\[bot-command\] }"
          : > "$OUT"

          if [ ! -d "$REPO/.git" ]; then
            echo "ERROR: repo not found at $REPO" > "$OUT"
            exit 66
          fi

          cd "$REPO"
          echo "command=$CMD" >> "$OUT"
          echo "host=$(hostname)" >> "$OUT"
          echo "utc=$(date -u +%FT%TZ)" >> "$OUT"
          echo >> "$OUT"

          case "$CMD" in
            status)
              {
                git status --short --branch
                echo
                echo "collector processes:"
                pgrep -af 'gemini_kalshi_.*shadow' || true
                echo
                echo "latest crypto logs:"
                ls -lt logs/gemini_kalshi_*bookticker*.jsonl 2>/dev/null | head -16 || true
                echo
                df -h .
              } >> "$OUT" 2>&1
              rc=$?
              ;;
            pull-feature)
              git pull --ff-only origin feature/gemini-kalshi-fast-overlap >> "$OUT" 2>&1
              rc=$?
              ;;
            tests)
              .venv/bin/python -m pytest \
                tests/test_gemini_kalshi_live_shadow.py \
                tests/test_gemini_kalshi_btc_ws_shadow.py \
                tests/test_gemini_kalshi_btc_ws_analyze.py \
                tests/test_gemini_kalshi_btc_ws_capital.py \
                tests/test_gemini_kalshi_btc_ws_bankroll.py \
                tests/test_gemini_kalshi_btc_ws_settlement.py \
                tests/test_gemini_kalshi_settlement_latency.py \
                tests/test_gemini_kalshi_multi_ws_analyze.py \
                tests/test_gemini_prediction_auth.py \
                tests/test_gemini_kalshi_live_probe_guard.py \
                tests/test_gemini_kalshi_probe_transport.py -q >> "$OUT" 2>&1
              rc=$?
              ;;
            execution-readiness)
              .venv/bin/python -m src.gemini_kalshi_execution_readiness >> "$OUT" 2>&1
              rc=$?
              ;;
            analyze-btc)
              latest=$(ls -1t logs/gemini_kalshi_btc_bookticker*.jsonl 2>/dev/null | head -1)
              if [ -z "$latest" ]; then
                echo "No BTC bookTicker log found." >> "$OUT"
                rc=2
              else
                echo "analyzing=$latest" >> "$OUT"
                .venv/bin/python -m src.gemini_kalshi_btc_ws_analyze "$latest" >> "$OUT" 2>&1
                rc=$?
              fi
              ;;
            settlement-latency-48h)
              summary="logs/gemini_kalshi_settlement_latency_48h.json"
              echo "output=$summary" >> "$OUT"
              .venv/bin/python -m src.gemini_kalshi_settlement_latency --hours 48 > "$summary" 2>> "$OUT"
              rc=$?
              if [ "$rc" -eq 0 ]; then
                cat "$summary" >> "$OUT"
              fi
              ;;
            bankroll-btc)
              latest=$(ls -1t logs/gemini_kalshi_btc_bookticker*.jsonl 2>/dev/null | head -1)
              summary="logs/gemini_kalshi_settlement_latency_48h.json"
              if [ -z "$latest" ]; then
                echo "No BTC bookTicker log found." >> "$OUT"
                rc=2
              else
                echo "analyzing=$latest" >> "$OUT"
                echo "Refreshing 48h settlement latency..." >> "$OUT"
                .venv/bin/python -m src.gemini_kalshi_settlement_latency --hours 48 > "$summary" 2>> "$OUT"
                rc=$?
                if [ "$rc" -eq 0 ]; then
                  .venv/bin/python -m src.gemini_kalshi_btc_ws_bankroll "$latest" \
                    --threshold-ms 10 \
                    --kalshi-bankroll 4000 \
                    --trade-caps 100 250 500 \
                    --kalshi-fee-multiplier 1 \
                    --settlement-latency-summary "$summary" >> "$OUT" 2>&1
                  rc=$?
                fi
              fi
              ;;
            shadow-btc-15m)
              file="logs/gemini_kalshi_btc_bookticker_remote_$(date -u +%Y%m%dT%H%M%SZ).jsonl"
              echo "output=$file" >> "$OUT"
              .venv/bin/python -m src.gemini_kalshi_btc_ws_shadow \
                --seconds 900 --max-quote-skew-ms 100 --output "$file" >> "$OUT" 2>&1
              rc=$?
              if [ "$rc" -eq 0 ]; then
                echo >> "$OUT"
                echo "ANALYSIS:" >> "$OUT"
                .venv/bin/python -m src.gemini_kalshi_btc_ws_analyze "$file" >> "$OUT" 2>&1
                rc=$?
              fi
              ;;
            shadow-btc-60m)
              file="logs/gemini_kalshi_btc_bookticker_remote_$(date -u +%Y%m%dT%H%M%SZ).jsonl"
              echo "output=$file" >> "$OUT"
              .venv/bin/python -m src.gemini_kalshi_btc_ws_shadow \
                --seconds 3600 --max-quote-skew-ms 100 --output "$file" >> "$OUT" 2>&1
              rc=$?
              if [ "$rc" -eq 0 ]; then
                echo >> "$OUT"
                echo "ANALYSIS:" >> "$OUT"
                .venv/bin/python -m src.gemini_kalshi_btc_ws_analyze "$file" >> "$OUT" 2>&1
                rc=$?
              fi
              ;;
            shadow-crypto-5m|shadow-crypto-15m)
              if [ "$CMD" = "shadow-crypto-5m" ]; then seconds=300; else seconds=900; fi
              tag="remote_$(date -u +%Y%m%dT%H%M%SZ)"
              echo "tag=$tag seconds=$seconds assets=BTC,ETH,SOL,XRP" >> "$OUT"
              .venv/bin/python -m src.gemini_kalshi_multi_ws_shadow \
                --assets BTC ETH SOL XRP \
                --seconds "$seconds" \
                --max-quote-skew-ms 100 \
                --output-dir logs \
                --tag "$tag" >> "$OUT" 2>&1
              rc=$?
              if [ "$rc" -eq 0 ]; then
                for asset in BTC ETH SOL XRP; do
                  lower=$(printf '%s' "$asset" | tr '[:upper:]' '[:lower:]')
                  file="logs/gemini_kalshi_${lower}_bookticker_${tag}.jsonl"
                  echo >> "$OUT"
                  echo "ANALYSIS_$asset file=$file" >> "$OUT"
                  .venv/bin/python -m src.gemini_kalshi_multi_ws_analyze --asset "$asset" "$file" >> "$OUT" 2>&1
                  if [ "$?" -ne 0 ]; then rc=1; fi
                done
              fi
              ;;
            *)
              echo "REJECTED: command is not allowlisted." >> "$OUT"
              echo "Allowed: status, pull-feature, tests, execution-readiness, analyze-btc, settlement-latency-48h, bankroll-btc, shadow-btc-15m, shadow-btc-60m, shadow-crypto-5m, shadow-crypto-15m" >> "$OUT"
              rc=64
              ;;
          esac

          echo >> "$OUT"
          echo "exit_code=$rc" >> "$OUT"
          exit "$rc"

      - name: Comment result
        if: always()
        uses: actions/github-script@v8
        env:
          COMMAND_OUTCOME: ${{ steps.command.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.RUNNER_TEMP}/kalshi-command-output.txt`;
            let text = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'No command output was produced.';
            if (text.length > 50000) text = text.slice(-50000);
            const body = `Remote command outcome: **${process.env.COMMAND_OUTCOME}**\n\n\`\`\`text\n${text}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
