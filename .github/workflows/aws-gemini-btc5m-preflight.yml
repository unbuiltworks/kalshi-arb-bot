name: AWS Gemini BTC5m disarmed preflight

on:
  workflow_dispatch:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/run_gemini_short_crypto_btc5m_preflight.sh
      - .github/workflows/aws-gemini-btc5m-preflight.yml

permissions:
  id-token: write
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ARB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_ARB_REGION }}

      - name: Run isolated disarmed Gemini BTC5m preflight through SSM
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_CMD="sudo -u ssm-user bash -lc 'cd /home/ssm-user/kalshi-arb-bot && git fetch origin aws-migration-foundation && git show origin/aws-migration-foundation:deploy/aws/run_gemini_short_crypto_btc5m_preflight.sh > /tmp/run_gemini_short_crypto_btc5m_preflight.sh && chmod +x /tmp/run_gemini_short_crypto_btc5m_preflight.sh && /tmp/run_gemini_short_crypto_btc5m_preflight.sh'"
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.AWS_ARB_HOT_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "ARB Gemini BTC5m disarmed preflight" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.AWS_ARB_HOT_INSTANCE_ID }}"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.AWS_ARB_HOT_INSTANCE_ID }}" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}'
