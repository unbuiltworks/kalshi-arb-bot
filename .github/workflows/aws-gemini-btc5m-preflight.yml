name: AWS Gemini BTC5m disarmed preflight

on:
  workflow_dispatch:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/run_gemini_short_crypto_btc5m_preflight.sh
      - .github/workflows/aws-gemini-btc5m-preflight.yml

permissions:
  id-token: write
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ARB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_ARB_REGION }}

      - name: Run isolated disarmed Gemini BTC5m preflight through SSM
        id: ssm
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_CMD="sudo -u ssm-user bash -lc 'cd /home/ssm-user/kalshi-arb-bot && git fetch origin aws-migration-foundation && git show origin/aws-migration-foundation:deploy/aws/run_gemini_short_crypto_btc5m_preflight.sh > /tmp/run_gemini_short_crypto_btc5m_preflight.sh && chmod +x /tmp/run_gemini_short_crypto_btc5m_preflight.sh && /tmp/run_gemini_short_crypto_btc5m_preflight.sh'"
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.AWS_ARB_HOT_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "ARB Gemini BTC5m disarmed preflight" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.AWS_ARB_HOT_INSTANCE_ID }}" || true
          mkdir -p runtime
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.AWS_ARB_HOT_INSTANCE_ID }}" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            > runtime/aws-gemini-btc5m-preflight-last.json
          cat runtime/aws-gemini-btc5m-preflight-last.json

      - name: Persist non-secret preflight result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/aws-gemini-btc5m-preflight-last.json
          if ! git diff --cached --quiet; then
            git commit -m "Record AWS Gemini BTC5m preflight result"
            git push origin HEAD:aws-migration-foundation
          fi

      - name: Fail if SSM preflight failed
        shell: bash
        run: |
          set -euo pipefail
          status=$(jq -r '.Status // "Unknown"' runtime/aws-gemini-btc5m-preflight-last.json)
          test "$status" = "Success"
