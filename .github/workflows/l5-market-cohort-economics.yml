name: l5 market cohort economics

on:
  push:
    branches:
      - feature/incentive-arb-engine-v1
    paths:
      - deploy/l5-market-cohort-economics.trigger

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Focused cohort tests
        run: pytest -q tests/test_polymarket_l5_market_cohort_economics.py
      - name: Reconcile settled market cohorts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          DAY=$(awk -F= '$1=="DATE_UTC"{print $2}' deploy/l5-market-cohort-economics.trigger | tr -d '[:space:]')
          [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          python -m src.polymarket_l5_market_cohort_economics --date "$DAY" --output artifacts/l5-market-cohort-economics.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/l5-market-cohort-economics.json').read_text())
          print(json.dumps({
            'classification': r['classification'],
            'cohort_day_utc': r['cohort_day_utc'],
            'market_count': r['market_count'],
            'settled_market_count': r['settled_market_count'],
            'unresolved_market_count': r['unresolved_market_count'],
            'positive_market_count': r['positive_market_count'],
            'negative_market_count': r['negative_market_count'],
            'settled_buy_usdc': r['settled_buy_usdc'],
            'settled_redeem_usdc': r['settled_redeem_usdc'],
            'observed_settled_lifecycle_cashflow': r['observed_settled_lifecycle_cashflow'],
            'by_family': r['by_family'],
            'reward_payments_not_attributed': r['reward_payments_not_attributed'],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: l5-market-cohort-economics
          path: artifacts/l5-market-cohort-economics.json
          retention-days: 3
