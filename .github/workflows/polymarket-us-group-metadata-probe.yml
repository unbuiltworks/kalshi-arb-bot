name: Polymarket US Group Metadata Probe

on:
  pull_request:
    paths:
      - 'src/polymarket_us_group_metadata_probe.py'
      - '.github/workflows/polymarket-us-group-metadata-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Inspect public Polymarket US group metadata
        run: python -m src.polymarket_us_group_metadata_probe
