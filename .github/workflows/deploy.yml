name: Deploy to Railway

on:
  push:
    branches: [main]
    paths-ignore:
      # Read-only L5 ops/tape workflow maintenance must never trigger the
      # generic trading-service deploy. These workflows have their own
      # isolated execution and no order transport.
      - '.github/workflows/l5-ops-24x7.yml'
      - '.github/workflows/kalshi-l5-tape-5m.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        if: ${{ env.RAILWAY_TOKEN != '' && env.RAILWAY_SERVICE_ID != '' }}
        run: npm install -g @railway/cli
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}

      - name: Deploy to Railway
        if: ${{ env.RAILWAY_TOKEN != '' && env.RAILWAY_SERVICE_ID != '' }}
        run: railway up --service "$RAILWAY_SERVICE_ID" --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}

      - name: Skip unconfigured generic deploy
        if: ${{ env.RAILWAY_TOKEN == '' || env.RAILWAY_SERVICE_ID == '' }}
        run: echo "Generic Railway deploy not configured; skipping. Service-specific Railway deployments remain independent."
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
