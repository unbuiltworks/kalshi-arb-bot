name: Gemini crypto5 L5 policy matrix smoke

on:
  push:
    branches:
      - feature/gemini-l5-volume-gate-v1
    paths:
      - '.github/workflows/gemini-crypto5-l5-policy-matrix-smoke.yml'
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Capture BTC ETH SOL XRP 5m policy matrix
        run: |
          python -m src.gemini_crypto5_l5_policy_matrix_shadow \
            --seconds 1200 \
            --sample-s 5 \
            --discover-s 5 \
            --max-seconds-to-expiry 650 \
            --output /tmp/gemini_crypto5_l5_policy_matrix.jsonl \
            --summary-output /tmp/gemini_crypto5_l5_policy_matrix_summary.json
      - name: Upload read-only matrix artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-crypto5-l5-policy-matrix-smoke
          path: |
            /tmp/gemini_crypto5_l5_policy_matrix.jsonl
            /tmp/gemini_crypto5_l5_policy_matrix_summary.json
          retention-days: 7
