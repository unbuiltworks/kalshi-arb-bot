name: Test Gemini q10 production candidate

on:
  push:
    branches:
      - feature/gemini-q10-production-candidate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Run q10 production safety tests
        run: >-
          python -m pytest -q
          tests/test_gemini_q10_production_risk.py
          tests/test_gemini_q10_production_candidate.py
          tests/test_gemini_liquidity_reward_dynamic_completion_q10.py
          tests/test_gemini_liquidity_reward_live_probe_q10.py
          tests/test_gemini_short_crypto_dynamic_complement_q1_v2.py
