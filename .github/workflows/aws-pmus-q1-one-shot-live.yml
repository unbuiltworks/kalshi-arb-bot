name: AWS PMUS q1 ONE-SHOT live campaign

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - deploy/aws/pmus-q1-one-shot-live.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  ENGINE_REF: deecb0493de29e06aed6aff4dbb21ddb2560a117

jobs:
  one-shot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation
          fetch-depth: 1
      - name: Verify explicit one-shot trigger
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -qx 'GO=ONE_Q1_CAMPAIGN' deploy/aws/pmus-q1-one-shot-live.trigger
          grep -qx "ENGINE_REF=$ENGINE_REF" deploy/aws/pmus-q1-one-shot-live.trigger
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Execute exactly one bounded q1 campaign on AWS
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE=$(cat <<'EOF'
          set -Eeuo pipefail
          APP=/home/ssm-user/l5-pmus-engine
          VENV=/home/ssm-user/l5-pmus-engine-venv
          CREDS=/home/ssm-user/l5-pmus-q1-credentials.env
          WSLOG=/home/ssm-user/l5-pmus-ws-state/recorder.log
          SUP=/home/ssm-user/l5-pmus-supervisor-state
          QSTATE=/home/ssm-user/l5-pmus-q1-state
          test -f "$CREDS" && test "$(stat -c %a "$CREDS")" = 600
          test "$(systemctl is-active l5-pmus-recorder.service)" = active
          test "$(systemctl is-active l5-pmus-supervisor.service)" = active
          grep -q '^Environment=PMUS_SUPERVISOR_LIVE=NO$' /etc/systemd/system/l5-pmus-supervisor.service
          grep -q 'def subscription_plan' "$APP/src/pmus_ws_evidence_recorder.py"
          grep -q 'eligible_total' "$APP/src/pmus_ws_evidence_recorder.py"
          python3 - <<'PY'
          import json
          h=json.load(open('/home/ssm-user/l5-pmus-supervisor-state/heartbeat.json'))
          assert h.get('mode') == 'DISARMED_WATCH', h
          assert h.get('action') in ('WOULD_TRADE','WAIT','BLOCK'), h
          print('PMUS_ONE_SHOT_PREFLIGHT mode='+str(h.get('mode'))+' action='+str(h.get('action'))+' candidate='+str(h.get('candidate')))
          PY
          sudo -u ssm-user bash -lc '
            set -Eeuo pipefail
            set -a; . /home/ssm-user/l5-pmus-q1-credentials.env; set +a
            export PYTHONPATH=/home/ssm-user/l5-pmus-engine
            export PMUS_Q1_STATE_DIR=/home/ssm-user/l5-pmus-q1-state
            export PMUS_Q1_FIRST_WAIT_SECONDS=180
            export PMUS_Q1_DEADLINE_SECONDS=300
            export PMUS_Q1_RESIDUAL_ACTION=hold
            export PMUS_SUPERVISOR_ROOT=/home/ssm-user/l5-pmus-supervisor-state
            export PMUS_SUPERVISOR_RECORDER_LOG=/home/ssm-user/l5-pmus-ws-state/recorder.log
            export PMUS_SUPERVISOR_MAX_STATUS_AGE_SECONDS=90
            SID="oneshot-$(date +%s)-$RANDOM"
            export PMUS_SUPERVISOR_LIVE=YES
            export PMUS_SUPERVISOR_SESSION_ID="$SID"
            export PMUS_SUPERVISOR_ARM="$SID"
            /home/ssm-user/l5-pmus-engine-venv/bin/python - <<"PY"
          import json
          from src.pmus_aws_supervisor import run_once
          r = run_once()
          print("PMUS_ONE_SHOT_RESULT " + json.dumps(r, default=str, separators=(",",":")))
          PY
          '
          # Permanent service was never armed and remains DISARMED.
          grep -q '^Environment=PMUS_SUPERVISOR_LIVE=NO$' /etc/systemd/system/l5-pmus-supervisor.service
          echo PMUS_PERMANENT_SUPERVISOR_REMAINS_DISARMED=true
          EOF
          )
          ENC=$(printf '%s' "$REMOTE" | base64 -w0)
          PARAMS=$(jq -nc --arg cmd "echo '$ENC' | base64 -d | bash" '{commands:[$cmd]}')
          CID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment 'L5 PMUS exactly one q1 live campaign' --parameters "$PARAMS" --timeout-seconds 420 --query 'Command.CommandId' --output text)
          for _ in $(seq 1 210); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 2
          done
          RESULT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          OUT=$(jq -r '.Stdout' <<<"$RESULT")
          grep -q 'PMUS_ONE_SHOT_RESULT ' <<<"$OUT"
          grep -q 'PMUS_PERMANENT_SUPERVISOR_REMAINS_DISARMED=true' <<<"$OUT"
