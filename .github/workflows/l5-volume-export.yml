# READ-ONLY inventory and export of the L5 recorder's raw WS volume.
#
# WHY THIS EXISTS. The recorder's volume is reachable only through Railway's
# container-file API, which this repo can otherwise reach only via the Railway
# AI agent -- and that agent's usage limit has repeatedly run out mid-task,
# blocking research on data we already own. This gives a durable path that
# needs no agent quota.
#
# HARD CONSTRAINTS, enforced below:
#   * manual trigger only: no schedule, no push trigger;
#   * the Railway CLI version is PINNED and asserted after install;
#   * authentication comes ONLY from the RAILWAY_TOKEN Actions secret, which is
#     never echoed, never written to disk and never passed on a command line;
#   * the ONLY Railway operations are `files list` and `files download`. There
#     is no deploy, redeploy, restart, variable change, domain change or agent
#     call anywhere in this file, so the healthy pmus-ws-evidence-recorder
#     cannot be disturbed by running it;
#   * if the CLI cannot read service files non-interactively the job FAILS.
#     There is deliberately no fallback;
#   * no PMUS/venue credential is used or needed.
#
# `mode: inventory` lists the directory and uploads the listing. `mode: export`
# lists, then downloads exactly the file names given -- chosen from a previous
# inventory run, so an export is reproducible rather than guessed.
name: l5-volume-export

on:
  workflow_dispatch:
    inputs:
      mode:
        description: inventory (list only) or export (list, then download)
        required: true
        default: inventory
        type: choice
        options: [inventory, export]
      remote_dir:
        description: Directory on the recorder's volume to inventory
        required: true
        default: /state/pmus-ws/raw
      remote_files:
        description: >-
          export mode only: comma-separated file NAMES inside remote_dir
        required: false
        default: ''
      railway_cli_version:
        description: Pinned @railway/cli version (asserted after install)
        required: true
        default: 5.63.1

permissions:
  contents: read

jobs:
  volume:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      PROJECT_ID: 50fb7357-e2bc-4d04-a49e-71eb5d73b0d1
      ENVIRONMENT_ID: f3642d27-26dc-4e21-9170-bc76290c076f
      # pmus-ws-evidence-recorder. READ ONLY; never redeployed here.
      SERVICE_ID: 71b6ea99-ea6a-4b20-9602-fa873721ed35
      REMOTE_DIR: ${{ inputs.remote_dir }}
    steps:
      - name: Fail closed if the token secret is absent
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set. This workflow" \
                 "authenticates only from that secret and will not prompt."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the PINNED Railway CLI and assert the version
        run: |
          set -euo pipefail
          npm install -g "@railway/cli@${{ inputs.railway_cli_version }}"
          got="$(railway --version | tr -d '\r')"
          echo "installed: $got"
          case "$got" in
            *"${{ inputs.railway_cli_version }}"*) ;;
            *) echo "::error::CLI version mismatch: wanted" \
                    "${{ inputs.railway_cli_version }}, got '$got'"; exit 1 ;;
          esac

      - name: Confirm non-interactive authentication (a read)
        run: |
          set -euo pipefail
          railway whoami

      - name: Inventory the raw directory (read-only)
        id: inv
        run: |
          set -euo pipefail
          mkdir -p export
          railway --help > export/cli_help.txt 2>&1 || true
          railway service --help >> export/cli_help.txt 2>&1 || true
          if ! railway service files list "$REMOTE_DIR" \
                 --service "$SERVICE_ID" \
                 --environment "$ENVIRONMENT_ID" \
                 --project "$PROJECT_ID" \
                 < /dev/null > export/INVENTORY.txt 2>export/inventory_err.txt; then
            echo "::error::The pinned Railway CLI could not list service files" \
                 "non-interactively. Failing closed: this workflow has no" \
                 "fallback to deploy, variables, an HTTP endpoint or the" \
                 "Railway agent, by design. See the cli_help.txt artifact."
            cat export/inventory_err.txt || true
            exit 1
          fi
          echo "----- inventory of $REMOTE_DIR -----"
          cat export/INVENTORY.txt
          wc -l < export/INVENTORY.txt

      - name: Export the named files (read-only download)
        if: ${{ inputs.mode == 'export' && inputs.remote_files != '' }}
        run: |
          set -euo pipefail
          mkdir -p export/raw
          IFS=',' read -ra NAMES <<< "${{ inputs.remote_files }}"
          for raw in "${NAMES[@]}"; do
            name="$(echo "$raw" | xargs)"
            [ -n "$name" ] || continue
            case "$name" in
              */*|..*) echo "::error::refusing suspicious name '$name'"; exit 1 ;;
            esac
            echo "downloading $name"
            railway service files download "$REMOTE_DIR/$name" \
              --service "$SERVICE_ID" \
              --environment "$ENVIRONMENT_ID" \
              --project "$PROJECT_ID" \
              --output "export/raw/$name" < /dev/null
            bytes="$(stat -c%s "export/raw/$name")"
            if [ "$bytes" -le 0 ]; then
              echo "::error::downloaded 0 bytes for $name"; exit 1
            fi
            echo "$name $bytes"
          done
          cd export/raw && sha256sum ./* > ../SHA256SUMS.raw && cd -
          gzip -9 export/raw/* || true
          cd export/raw && sha256sum ./* > ../SHA256SUMS.gz && cd -
          cat export/SHA256SUMS.gz

      - name: Metadata
        run: |
          set -euo pipefail
          cat > export/METADATA.json <<META
          {
            "mode": "${{ inputs.mode }}",
            "remote_dir": "$REMOTE_DIR",
            "service_id": "$SERVICE_ID",
            "environment_id": "$ENVIRONMENT_ID",
            "project_id": "$PROJECT_ID",
            "railway_cli_version": "${{ inputs.railway_cli_version }}",
            "exported_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "run_id": "${{ github.run_id }}",
            "operations_performed": ["files list", "files download"],
            "operations_explicitly_not_performed": [
              "deploy", "redeploy", "restart", "variable change",
              "domain/TCP proxy change", "Railway agent"
            ]
          }
          META
          cat export/METADATA.json

      - uses: actions/upload-artifact@v4
        with:
          name: l5-volume-${{ inputs.mode }}-${{ github.run_id }}
          path: export/
          retention-days: 7
          if-no-files-found: error
