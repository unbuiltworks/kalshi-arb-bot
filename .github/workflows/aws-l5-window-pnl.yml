name: L5 per-window realized PnL census

on:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/l5-window-pnl.trigger

permissions:
  contents: read

jobs:
  l5-window-pnl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation
      - name: Read-only Polymarket closed-window PnL
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          from collections import defaultdict

          USER='0xb945945d5bcaf7b56834d4da8cdf8f8f94b2db68'
          BASE='https://data-api.polymarket.com/closed-positions'

          rows=[]
          for title in ('Bitcoin Up or Down', 'Ethereum Up or Down'):
              offset=0
              while offset <= 1000:
                  params={
                      'user':USER,
                      'title':title,
                      'limit':50,
                      'offset':offset,
                      'sortBy':'TIMESTAMP',
                      'sortDirection':'DESC',
                  }
                  url=BASE+'?'+urllib.parse.urlencode(params)
                  req=urllib.request.Request(url, headers={'User-Agent':'ARB-read-only-l5-window-pnl/1.0'})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      page=json.load(r)
                  if not isinstance(page,list):
                      raise RuntimeError(f'unexpected response for {title}: {type(page)}')
                  rows.extend(page)
                  if len(page) < 50:
                      break
                  offset += 50

          # Only 15-minute BTC/ETH windows. Deduplicate by (conditionId, asset/outcome).
          dedup={}
          for r in rows:
              slug=str(r.get('eventSlug') or r.get('slug') or '').lower()
              title=str(r.get('title') or '')
              if '15m' not in slug and '15 min' not in title.lower() and '15-minute' not in title.lower():
                  # Current slugs are expected to contain 15m; skip anything else.
                  continue
              key=(r.get('conditionId'), r.get('asset') or r.get('outcome'))
              dedup[key]=r

          by_market=defaultdict(list)
          for r in dedup.values():
              by_market[r.get('conditionId')].append(r)

          markets=[]
          for cid, rs in by_market.items():
              if not cid:
                  continue
              realized=sum(float(r.get('realizedPnl') or 0) for r in rs)
              bought=sum(float(r.get('totalBought') or 0) for r in rs)
              outcomes=[{
                  'outcome':r.get('outcome'),
                  'avgPrice':float(r.get('avgPrice') or 0),
                  'totalBought':float(r.get('totalBought') or 0),
                  'realizedPnl':float(r.get('realizedPnl') or 0),
                  'curPrice':float(r.get('curPrice') or 0),
              } for r in sorted(rs,key=lambda x:str(x.get('outcome')))]
              markets.append({
                  'conditionId':cid,
                  'title':rs[0].get('title'),
                  'eventSlug':rs[0].get('eventSlug'),
                  'endDate':rs[0].get('endDate'),
                  'timestamp':max(int(r.get('timestamp') or 0) for r in rs),
                  'realizedPnl':round(realized,6),
                  'totalBought':round(bought,6),
                  'outcomes':outcomes,
              })

          markets.sort(key=lambda x:x['timestamp'])
          pnls=[m['realizedPnl'] for m in markets]
          wins=sum(1 for x in pnls if x>1e-9)
          losses=sum(1 for x in pnls if x<-1e-9)
          flats=len(pnls)-wins-losses
          summary={
              'classification':'PUBLIC_POLYMARKET_CLOSED_POSITION_PNL_CENSUS_READ_ONLY',
              'user':USER,
              'market_count':len(markets),
              'sum_realized_pnl':round(sum(pnls),6),
              'avg_realized_pnl_per_window':round(sum(pnls)/len(pnls),6) if pnls else None,
              'positive_windows':wins,
              'negative_windows':losses,
              'flat_windows':flats,
              'positive_rate':round(wins/len(pnls),6) if pnls else None,
              'last_40_windows':markets[-40:],
              'note':'realizedPnl is Polymarket Data API closed-position PnL. Rebates/incentive payments are not added here unless Polymarket embeds them in this field; treat rebate contribution separately until verified.'
          }
          print('L5_WINDOW_PNL_CENSUS='+json.dumps(summary,separators=(',',':')))
          PY
