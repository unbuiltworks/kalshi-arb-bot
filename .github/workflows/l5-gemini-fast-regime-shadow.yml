name: l5 Gemini fast regime shadow

on:
  push:
    branches:
      - feature/l5-gemini-aws-live-probe-v1
    paths:
      - deploy/l5-gemini-fast-regime.trigger

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only dependencies
        run: python -m pip install 'httpx>=0.27'
      - name: Compile fast probe
        run: python -m py_compile src/gemini_l5_fast_regime_shadow.py
      - name: Capture fast public books
        run: |
          mkdir -p artifacts
          python -m src.gemini_l5_fast_regime_shadow \
            --seconds 600 \
            --poll-s 0.25 \
            --discover-s 15 \
            --output artifacts/gemini-l5-fast-regime.jsonl \
            | tee artifacts/gemini-l5-fast-regime.log
      - name: Strict trade-through replay
        run: |
          python -m src.gemini_l5_inventory_replay \
            artifacts/gemini-l5-fast-regime.jsonl \
            --output artifacts/gemini-l5-fast-regime-replay.json \
            | tee artifacts/gemini-l5-fast-regime-replay.log
      - name: Upload fast regime evidence
        uses: actions/upload-artifact@v4
        with:
          name: l5-gemini-fast-regime-shadow
          path: artifacts/
          retention-days: 3
