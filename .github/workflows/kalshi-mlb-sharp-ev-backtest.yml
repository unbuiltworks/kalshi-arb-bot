name: Kalshi MLB Sharp EV Backtest

on:
  push:
    branches:
      - research/kalshi-mlb-sharp-ev
    paths:
      - 'src/kalshi_mlb_sharp_ev_backtest.py'
      - 'src/kalshi_mlb_sharp_ev_backtest_runner.py'
      - '.github/workflows/kalshi-mlb-sharp-ev-backtest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/kalshi-mlb-sharp-ev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run one-day read-only diagnostic and write safe status
        shell: bash
        run: |
          mkdir -p research/results
          rm -f research/results/kalshi_mlb_sharp_ev_backtest.json
          if [ -z "$THE_ODDS_API_KEY" ]; then
            credential=false
            code=2
          else
            credential=true
            set +e
            python -m src.kalshi_mlb_sharp_ev_backtest_runner --max-days 1 --output research/results/kalshi_mlb_sharp_ev_backtest.json
            code=$?
            set -e
          fi
          printf '{"workflow_started":true,"credential_present":%s,"diagnostic_exit_code":%s,"source_sha":"%s"}\n' "$credential" "$code" "$GITHUB_SHA" > research/results/kalshi_mlb_sharp_ev_status.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kalshi-mlb-sharp-ev-backtest
          path: research/results/
          if-no-files-found: error
      - name: Persist safe diagnostic status/result on research branch
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/results/kalshi_mlb_sharp_ev_status.json
          if [ -f research/results/kalshi_mlb_sharp_ev_backtest.json ]; then
            git add research/results/kalshi_mlb_sharp_ev_backtest.json
          fi
          if git diff --cached --quiet; then
            echo 'No diagnostic status change to commit.'
            exit 0
          fi
          git commit -m 'Research result: Kalshi MLB sharp EV diagnostic status [skip ci]'
          git push origin HEAD:research/kalshi-mlb-sharp-ev
