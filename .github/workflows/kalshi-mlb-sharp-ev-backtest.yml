name: Kalshi MLB Sharp EV Backtest

on:
  push:
    branches:
      - research/kalshi-mlb-sharp-ev
    paths:
      - 'src/kalshi_mlb_sharp_ev_backtest.py'
      - 'src/kalshi_mlb_sharp_ev_backtest_runner.py'
      - '.github/workflows/kalshi-mlb-sharp-ev-backtest.yml'
  workflow_dispatch:
    inputs:
      max_days:
        description: 'Diagnostic day limit; 0 means full run'
        required: false
        default: '1'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/kalshi-mlb-sharp-ev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Verify historical-odds credential is present without exposing it
        shell: bash
        run: |
          if [ -z "$THE_ODDS_API_KEY" ]; then
            echo 'THE_ODDS_API_SECRET_AVAILABLE=false'
            exit 2
          fi
          echo 'THE_ODDS_API_SECRET_AVAILABLE=true'
      - name: Run read-only diagnostic
        shell: bash
        run: |
          mkdir -p research/results
          DAYS="${{ github.event.inputs.max_days || '1' }}"
          if [ "$DAYS" = "0" ]; then
            python -m src.kalshi_mlb_sharp_ev_backtest_runner --output research/results/kalshi_mlb_sharp_ev_backtest.json
          else
            python -m src.kalshi_mlb_sharp_ev_backtest_runner --max-days "$DAYS" --output research/results/kalshi_mlb_sharp_ev_backtest.json
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kalshi-mlb-sharp-ev-backtest
          path: research/results/kalshi_mlb_sharp_ev_backtest.json
          if-no-files-found: error
      - name: Persist result on research branch
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/results/kalshi_mlb_sharp_ev_backtest.json
          if git diff --cached --quiet; then
            echo 'No result change to commit.'
            exit 0
          fi
          git commit -m 'Research result: one-day Kalshi MLB sharp EV diagnostic [skip ci]'
          git push origin HEAD:research/kalshi-mlb-sharp-ev
