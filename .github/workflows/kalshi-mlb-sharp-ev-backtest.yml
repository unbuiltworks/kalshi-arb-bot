name: Kalshi MLB Sharp EV Backtest

on:
  push:
    branches:
      - research/kalshi-mlb-sharp-ev
    paths:
      - 'src/kalshi_mlb_sharp_ev_backtest.py'
      - 'src/kalshi_mlb_sharp_ev_backtest_runner.py'
      - 'src/espn_mlb_odds_probe.py'
      - 'src/espn_mlb_closing_ev_backtest.py'
      - 'src/espn_mlb_closing_ev_backtest_runner.py'
      - 'src/espn_mlb_match_probe.py'
      - '.github/workflows/kalshi-mlb-sharp-ev-backtest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  espn-closing-backtest-full:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/kalshi-mlb-sharp-ev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run full 2026 ESPN DraftKings closing-line backtest
        shell: bash
        run: |
          mkdir -p research/results
          rm -f research/results/espn_mlb_closing_ev_backtest.json
          set +e
          python -m src.espn_mlb_closing_ev_backtest_runner --output research/results/espn_mlb_closing_ev_backtest.json
          code=$?
          set -e
          printf '{"workflow_started":true,"provider":"espn_draftkings_close","scope":"full_2026_to_yesterday","diagnostic_exit_code":%s,"source_sha":"%s"}\n' "$code" "$GITHUB_SHA" > research/results/kalshi_mlb_sharp_ev_status.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kalshi-mlb-sharp-ev-closing-full
          path: research/results/
          if-no-files-found: error
      - name: Persist full backtest result on research branch
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/results/kalshi_mlb_sharp_ev_status.json
          if [ -f research/results/espn_mlb_closing_ev_backtest.json ]; then
            git add research/results/espn_mlb_closing_ev_backtest.json
          fi
          if git diff --cached --quiet; then
            echo 'No backtest change to commit.'
            exit 0
          fi
          git commit -m 'Research result: full ESPN MLB closing-line backtest [skip ci]'
          git push origin HEAD:research/kalshi-mlb-sharp-ev
