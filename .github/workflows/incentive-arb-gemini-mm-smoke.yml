name: incentive arb Gemini MM smoke

on:
  push:
    branches:
      - feature/incentive-arb-engine-v1
    paths:
      - src/gemini_incentive_mm_replay_v1.py
      - src/gemini_incentive_mm_replay_v2.py
      - src/gemini_incentive_mm_shadow_v2.py
      - tests/test_gemini_incentive_mm_replay_v1.py
      - tests/test_gemini_incentive_mm_replay_v2.py
      - tests/test_gemini_incentive_mm_shadow_v2.py
      - .github/workflows/incentive-arb-gemini-mm-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal dependencies
        run: python -m pip install 'httpx>=0.27' 'websockets>=12' 'pytest>=8'
      - name: Test reward-eligible policy, strict ledger, and online accounting
        run: pytest -q tests/test_gemini_incentive_mm_replay_v1.py tests/test_gemini_incentive_mm_replay_v2.py tests/test_gemini_incentive_mm_shadow_v2.py tests/test_incentive_arb_engine.py
      - name: Capture two minutes with online q10 policy
        run: |
          mkdir -p artifacts
          python -m src.gemini_incentive_mm_shadow_v2 \
            --seconds 120 \
            --discover-s 15 \
            --checkpoint-s 5 \
            --output artifacts/incentive-mm-online-v2.jsonl \
            --summary-output artifacts/incentive-mm-online-v2-summary.json \
            > artifacts/incentive-mm-online-v2.log
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/incentive-mm-online-v2-summary.json').read_text())
          print(json.dumps({
            'classification': r['classification'],
            'status': r['status'],
            'markets': r['markets'],
            'trades': r['trades'],
            'ws_connections': r['ws_connections'],
            'ws_reconnects': r['ws_reconnects'],
            'tape_touch': r['tape_touch'],
            'strict_trade_through': r['strict_trade_through'],
          },indent=2))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: incentive-arb-gemini-mm-smoke
          path: artifacts/
          retention-days: 3
