name: incentive arb Gemini MM smoke

on:
  push:
    branches:
      - feature/incentive-arb-engine-v1
    paths:
      - src/gemini_incentive_mm_replay_v1.py
      - tests/test_gemini_incentive_mm_replay_v1.py
      - .github/workflows/incentive-arb-gemini-mm-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal dependencies
        run: python -m pip install 'httpx>=0.27' 'websockets>=12' 'pytest>=8'
      - name: Test reward-eligible policy
        run: pytest -q tests/test_gemini_incentive_mm_replay_v1.py tests/test_incentive_arb_engine.py
      - name: Capture two minutes of public Gemini tape
        run: |
          mkdir -p artifacts
          python -m src.gemini_l5_tape_dynamic_shadow_v3 \
            --seconds 120 \
            --discover-s 15 \
            --checkpoint-s 5 \
            --output artifacts/public-capture.jsonl \
            --summary-output artifacts/public-capture-summary.json
      - name: Replay q10 incentive-aware two-sided MM
        run: |
          python -m src.gemini_incentive_mm_replay_v1 \
            artifacts/public-capture.jsonl \
            --output artifacts/incentive-mm-replay.json \
            > artifacts/incentive-mm-replay.log
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/incentive-mm-replay.json').read_text())
          keys=['classification','markets','markets_with_fills','markets_with_pairs','matched_quantity','residual_quantity','locked_trade_edge_after_fees','projected_maker_rebates_not_realized','projected_combined_if_rebates_paid']
          print(json.dumps({k:r[k] for k in keys},indent=2))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: incentive-arb-gemini-mm-smoke
          path: artifacts/
          retention-days: 3
