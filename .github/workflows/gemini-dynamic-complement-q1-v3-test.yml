name: Gemini dynamic-complement q1 V3 focused tests

on:
  push:
    branches:
      - feature/gemini-incentive-mm-dynamic-complement-q1
    paths:
      - 'src/gemini_incentive_mm_dynamic_complement.py'
      - 'src/gemini_short_crypto_dynamic_complement_q1.py'
      - 'src/gemini_short_crypto_dynamic_complement_q1_v2.py'
      - 'src/gemini_short_crypto_dynamic_complement_q1_v3.py'
      - 'src/gemini_incentive_mm_dynamic_live_probe_q1.py'
      - 'deploy/aws/run_gemini_dynamic_complement_q1.sh'
      - 'tests/test_gemini_incentive_mm_dynamic_complement.py'
      - 'tests/test_gemini_short_crypto_dynamic_complement_q1.py'
      - 'tests/test_gemini_short_crypto_dynamic_complement_q1_v2.py'
      - 'tests/test_gemini_short_crypto_dynamic_complement_q1_v2_reject.py'
      - 'tests/test_gemini_short_crypto_dynamic_complement_q1_v3.py'
      - 'tests/test_gemini_incentive_mm_dynamic_live_probe_q1.py'
      - 'tests/test_gemini_dynamic_complement_launcher_guard.py'
      - '.github/workflows/gemini-dynamic-complement-q1-v3-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused_v3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Syntax-check live launcher
        run: bash -n deploy/aws/run_gemini_dynamic_complement_q1.sh
      - name: Run V3 execution safety suite
        run: |
          pytest -q \
            tests/test_gemini_incentive_mm_dynamic_complement.py \
            tests/test_gemini_short_crypto_dynamic_complement_q1.py \
            tests/test_gemini_short_crypto_dynamic_complement_q1_v2.py \
            tests/test_gemini_short_crypto_dynamic_complement_q1_v2_reject.py \
            tests/test_gemini_short_crypto_dynamic_complement_q1_v3.py \
            tests/test_gemini_incentive_mm_dynamic_live_probe_q1.py \
            tests/test_gemini_dynamic_complement_launcher_guard.py
