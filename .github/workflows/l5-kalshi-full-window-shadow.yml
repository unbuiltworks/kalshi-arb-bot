name: l5 Kalshi full-window shadow

on:
  push:
    branches:
      - feature/l5-gemini-aws-live-probe-v1
    paths:
      - deploy/l5-kalshi-full-window.trigger

permissions:
  contents: read

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only dependencies
        run: python -m pip install 'httpx>=0.27' 'websockets>=12' 'cryptography>=42' 'python-dotenv>=1.0' 'pytest>=8'
      - name: Verify stateful replay tests
        run: |
          pytest -q \
            tests/test_kalshi_l5_threshold_model.py \
            tests/test_kalshi_l5_inventory_replay.py \
            tests/test_short_crypto_incentive_snapshot.py
      - name: Capture and score a full 15m rollover plus buffer
        run: |
          mkdir -p artifacts
          python -m src.short_crypto_incentive_snapshot --pretty \
            > artifacts/short-crypto-incentives-start.json
          python -m src.kalshi_l5_threshold_shadow \
            --seconds 1020 \
            --poll-s 2 \
            --output artifacts/kalshi-l5-full-window.jsonl \
            | tee artifacts/kalshi-l5-full-window.log
          python -m src.kalshi_l5_inventory_replay \
            artifacts/kalshi-l5-full-window.jsonl \
            --output artifacts/kalshi-l5-inventory-replay.json \
            | tee artifacts/kalshi-l5-inventory-replay.log
          python -m src.short_crypto_incentive_snapshot --pretty \
            > artifacts/short-crypto-incentives-end.json
      - name: Upload full-window evidence
        uses: actions/upload-artifact@v4
        with:
          name: l5-kalshi-full-window-shadow
          path: artifacts/
          retention-days: 3
