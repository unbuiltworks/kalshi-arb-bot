name: AWS Gemini incentive MM q10 replay

on:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/gemini-incentive-mm-q10-replay.trigger
      - .github/workflows/aws-gemini-incentive-mm-q10-replay.yml

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation

      - name: Read replay trigger
        id: trigger
        shell: bash
        run: |
          set -euo pipefail
          FILE=deploy/aws/gemini-incentive-mm-q10-replay.trigger
          PINNED_COMMIT=$(awk -F= '$1=="PINNED_COMMIT"{print $2}' "$FILE" | tr -d '[:space:]')
          SOURCE_RUN_ID=$(awk -F= '$1=="SOURCE_RUN_ID"{print $2}' "$FILE" | tr -d '[:space:]')
          CLASSIFICATION=$(awk -F= '$1=="CLASSIFICATION"{print $2}' "$FILE" | tr -d '[:space:]')
          ORDER_ENTRY=$(awk -F= '$1=="ORDER_ENTRY"{print $2}' "$FILE" | tr -d '[:space:]')
          [[ "$PINNED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[A-Za-z0-9._-]+$ ]]
          test "$CLASSIFICATION" = "READ_ONLY_SHADOW_REPLAY_NOT_REALIZED"
          test "$ORDER_ENTRY" = "false"
          echo "pinned_commit=$PINNED_COMMIT" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Replay retained public tape through rebate-first q10 policy
        env:
          PINNED_COMMIT: ${{ steps.trigger.outputs.pinned_commit }}
          SOURCE_RUN_ID: ${{ steps.trigger.outputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${PINNED_COMMIT:0:12}"
          REMOTE_CMD="sudo -u ssm-user bash -lc 'set -euo pipefail; REPO=/home/ssm-user/kalshi-arb-bot; SOURCE=/home/ssm-user/gemini-l5-dynamic-shadow-v2-state/${SOURCE_RUN_ID}/capture.jsonl; WORK=/opt/arb/gemini-incentive-mm-q10-replay; OUT=/home/ssm-user/gemini-incentive-mm-q10-replay-state/${SOURCE_RUN_ID}-${SHORT_SHA}; test -f \"\$SOURCE\"; git -C \"\$REPO\" config --global --add safe.directory \"\$REPO\" || true; git -C \"\$REPO\" fetch origin feature/incentive-arb-engine-v1; git -C \"\$REPO\" cat-file -e \"${PINNED_COMMIT}^{commit}\"; git -C \"\$REPO\" worktree remove --force \"\$WORK\" >/dev/null 2>&1 || true; rm -rf \"\$WORK\"; git -C \"\$REPO\" worktree prune; git -C \"\$REPO\" worktree add --detach \"\$WORK\" \"${PINNED_COMMIT}\"; test \"\$(git -C \"\$WORK\" rev-parse HEAD)\" = \"${PINNED_COMMIT}\"; mkdir -p \"\$OUT\"; IMAGE=arb-gemini-incentive-mm-q10-replay:${SHORT_SHA}; docker build -t \"\$IMAGE\" \"\$WORK\" >/dev/null; docker run --rm --network none \"\$IMAGE\" python -m pytest -q tests/test_gemini_incentive_mm_replay_v1.py tests/test_incentive_arb_engine.py; docker run --rm --network none -v \"\$SOURCE:/input/capture.jsonl:ro\" -v \"\$OUT:/output\" \"\$IMAGE\" python -m src.gemini_incentive_mm_replay_v1 /input/capture.jsonl --output /output/summary.json >/dev/null; jq -c '{classification,markets,markets_with_fills,markets_with_pairs,matched_quantity,residual_quantity,locked_trade_edge_after_fees,projected_maker_rebates_not_realized,projected_combined_if_rebates_paid,order_entry,realized_pnl}' \"\$OUT/summary.json\"; echo INCENTIVE_Q10_OUTPUT=\$OUT/summary.json'"
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB Gemini incentive MM q10 replay ${SHORT_SHA}" --parameters "$PARAMETERS" --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' > /tmp/incentive-q10.json
          cat /tmp/incentive-q10.json
          test "$(jq -r '.Status' /tmp/incentive-q10.json)" = "Success"
          stdout=$(jq -r '.Stdout // ""' /tmp/incentive-q10.json)
          grep -q 'READ_ONLY_SHADOW_REPLAY_NOT_REALIZED' <<< "$stdout"
          grep -q 'INCENTIVE_Q10_OUTPUT=' <<< "$stdout"
