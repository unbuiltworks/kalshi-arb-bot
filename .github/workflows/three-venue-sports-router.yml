name: three-venue-sports-router

on:
  push:
    branches:
      - feature/three-venue-sports-router
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Run universal identity and three-venue sports tests
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_universal_sports_identity.py \
            tests/test_gemini_sports_adapter.py \
            tests/test_universal_three_venue_sports.py
