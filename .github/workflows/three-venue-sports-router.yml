name: three-venue-sports-router

on:
  push:
    branches: [feature/three-venue-sports-router]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Run targeted tests
        id: pytest
        shell: bash
        run: |
          set +e
          PYTHONPATH=. pytest -q tests/test_universal_sports_identity.py tests/test_gemini_sports_adapter.py tests/test_universal_three_venue_sports.py 2>&1 | tee three-venue-pytest.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Surface pytest diagnostics
        if: steps.pytest.outputs.exit_code != '0'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text='\n'.join(Path('three-venue-pytest.txt').read_text(errors='replace').splitlines()[-120:])
          safe=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(f'::error title=three-venue pytest failures::{safe}')
          PY
      - name: Probe live public MLB overlap
        if: steps.pytest.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python -m src.universal_three_venue_sports > three-venue-live.json 2> three-venue-live.err
          python - <<'PY'
          from pathlib import Path
          import json
          out=Path('three-venue-live.json').read_text(errors='replace').strip()
          err=Path('three-venue-live.err').read_text(errors='replace').strip()
          try:
              body=json.loads(out.splitlines()[-1])
              keys=('status','raw_events','normalized_sides','counterpart_clusters','three_venue_clusters','clusters_by_family','clusters_by_venue_set','execution_eligible_clusters','rule_gate')
              text=json.dumps({k:body.get(k) for k in keys},separators=(',',':'))
          except Exception:
              text=(out or ('NO_STDOUT '+err))[-6000:]
          safe=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(f'::notice title=live three-venue MLB probe::{safe}')
          PY
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-venue-router-diagnostics
          path: |
            three-venue-pytest.txt
            three-venue-live.json
            three-venue-live.err
          if-no-files-found: warn
      - name: Enforce test result
        if: steps.pytest.outputs.exit_code != '0'
        run: exit 1
