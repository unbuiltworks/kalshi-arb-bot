name: three-venue-sports-router

on:
  push:
    branches:
      - feature/three-venue-sports-router
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Run universal identity and three-venue sports tests
        id: pytest
        shell: bash
        run: |
          set +e
          PYTHONPATH=. pytest -q \
            tests/test_universal_sports_identity.py \
            tests/test_gemini_sports_adapter.py \
            tests/test_universal_three_venue_sports.py 2>&1 | tee three-venue-pytest.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-venue-pytest
          path: three-venue-pytest.txt
          if-no-files-found: error
      - name: Enforce test result
        if: steps.pytest.outputs.exit_code != '0'
        run: exit 1
