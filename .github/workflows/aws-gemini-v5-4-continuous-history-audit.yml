name: AWS Gemini V5.4 continuous history audit

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - deploy/aws/gemini-v5-4-continuous-history-audit.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  REQUIRED_RELEASE_COMMIT: 1a02c6ca5c707193475bb00f1b476e809a4af127
  SYMBOL: GEMI-BTC05M2608302335-UP
  EVENT_TICKER: BTC05M2608302335

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Read Gemini filled/cancelled history and settled position
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE=$(cat <<EOF
          set -Eeuo pipefail
          REPO=/home/ssm-user/kalshi-arb-bot
          WORK=/opt/arb/gemini-v5-4-continuous-history-audit
          IMAGE=arb-gemini-v5-4-history-audit:${REQUIRED_RELEASE_COMMIT:0:12}
          cd "\$REPO"
          git config --global --add safe.directory "\$REPO" || true
          git fetch origin ${REQUIRED_RELEASE_COMMIT} >/dev/null
          git worktree remove --force "\$WORK" >/dev/null 2>&1 || true
          rm -rf "\$WORK"
          git worktree prune
          git worktree add --detach "\$WORK" ${REQUIRED_RELEASE_COMMIT} >/dev/null
          test "\$(git -C "\$WORK" rev-parse HEAD)" = "${REQUIRED_RELEASE_COMMIT}"
          docker build -q -t "\$IMAGE" "\$WORK" >/dev/null
          if [ -f /opt/arb/secrets/gemini-short-crypto.env ]; then ENV_FILE=/opt/arb/secrets/gemini-short-crypto.env; else ENV_FILE=/home/ssm-user/kalshi-arb-bot/.env; fi
          test -f "\$ENV_FILE"

          docker run --rm -i --network host --env-file "\$ENV_FILE" \
            -e GEMINI_Q10_PRODUCTION_LIVE=NO \
            -e GEMINI_Q10_PRODUCTION_ARM_ID= \
            -e GEMINI_Q10_PRODUCTION_ARM= \
            -e GEMINI_Q10_V5_RECOVERY_ARM= \
            -e GEMINI_Q10_V5_WATCHDOG_ARM= \
            "\$IMAGE" python - <<'PY'
          import asyncio, json, time
          import httpx
          from collections.abc import Mapping
          from src.gemini_prediction_auth import private_rest_request
          from src.gemini_kalshi_live_service import _gemini_available_usd

          SYMBOL='${SYMBOL}'
          TICKER='${EVENT_TICKER}'
          TARGET_IDS={
            'gadv53-v54cont-20260830--yes',
            'gadv53-v54cont-20260830--no',
            'gadv53-v54cont-20260830--grace',
            'gadv53-v54cont-20260830--v5fok-1',
          }
          SAFE_ORDER_KEYS=(
            'orderId','clientOrderId','status','orderStatus','side','eventOutcome',
            'price','avgExecutionPrice','averageExecutionPrice','quantity',
            'filledQuantity','executedQty','createdAt','updatedAt','closedAt',
            'type','timeInForce','rejectReason','reason','message','code'
          )
          SAFE_SETTLED_KEYS=(
            'eventTicker','instrumentSymbol','symbol','outcome','side','quantity',
            'averagePrice','avgPrice','costBasis','payout','profitLoss','pnl',
            'resolutionSide','settledAt','resolvedAt','createdAt'
          )

          def safe(row, keys):
              if not isinstance(row, Mapping): return None
              return {k: row.get(k) for k in keys if k in row}

          async def request_json(path, params):
              r=await private_rest_request('POST', path, params=params, timeout=8.0)
              try: body=r.json()
              except Exception: body=None
              return {'http':r.status_code,'body':body}

          async def main():
              now_ms=int(time.time()*1000)
              start=now_ms-2*60*60*1000
              filled=await request_json('/v1/prediction-markets/orders/history',{
                  'status':'filled','symbol':SYMBOL,'limit':1000,'from':start,'to':now_ms+1000})
              cancelled=await request_json('/v1/prediction-markets/orders/history',{
                  'status':'cancelled','symbol':SYMBOL,'limit':1000,'from':start,'to':now_ms+1000})
              settled=await request_json('/v1/prediction-markets/positions/settled',{
                  'eventTicker':TICKER,'limit':1000,'offset':0,'sort':'-date'})
              current=await request_json('/v1/prediction-markets/positions',{
                  'eventTicker':TICKER,'limit':1000,'offset':0})
              available=await _gemini_available_usd()

              def order_rows(obj):
                  body=obj.get('body')
                  rows=(body.get('orders') or []) if isinstance(body,Mapping) else []
                  return [safe(r,SAFE_ORDER_KEYS) for r in rows if isinstance(r,Mapping) and str(r.get('clientOrderId') or '') in TARGET_IDS]

              def settled_rows(obj):
                  body=obj.get('body')
                  if not isinstance(body,Mapping): return []
                  rows=body.get('positions') or body.get('data') or []
                  return [safe(r,SAFE_SETTLED_KEYS) for r in rows if isinstance(r,Mapping)]

              async with httpx.AsyncClient(timeout=8.0, follow_redirects=True) as http:
                  pub=await http.get('https://api.gemini.com/v1/prediction-markets/events/recently-settled',params={'category':'Crypto','limit':100,'offset':0})
                  pub_body=pub.json() if pub.status_code==200 else {}
              public_match=[]
              for ev in (pub_body.get('data') or []) if isinstance(pub_body,Mapping) else []:
                  if isinstance(ev,Mapping) and str(ev.get('ticker') or '')==TICKER:
                      contracts=[]
                      for c in ev.get('contracts') or []:
                          if isinstance(c,Mapping) and str(c.get('instrumentSymbol') or '')==SYMBOL:
                              contracts.append({k:c.get(k) for k in ('instrumentSymbol','status','resolutionSide','resolvedAt','expiryDate','marketState') if k in c})
                      public_match.append({k:ev.get(k) for k in ('ticker','status','resolvedAt','expiryDate') if k in ev} | {'contracts':contracts})

              out={
                  'classification':'READ_ONLY_AUTHENTICATED_V5_4_HISTORY_AUDIT',
                  'symbol':SYMBOL,'event_ticker':TICKER,
                  'available_usd':str(available),
                  'filled_history_http':filled['http'],'filled_target_rows':order_rows(filled),
                  'cancelled_history_http':cancelled['http'],'cancelled_target_rows':order_rows(cancelled),
                  'settled_positions_http':settled['http'],'settled_positions':settled_rows(settled),
                  'current_positions_http':current['http'],'current_positions':settled_rows(current),
                  'recently_settled_http':pub.status_code,'public_settlement':public_match,
                  'order_entry':False,'venue_mutation':False,
              }
              print('V5_4_CONTINUOUS_HISTORY_AUDIT='+json.dumps(out,separators=(',',':'),default=str))
          asyncio.run(main())
          PY
          EOF
          )
          ENC=$(printf '%s' "$REMOTE" | base64 -w0)
          PARAMS=$(jq -nc --arg cmd "echo '$ENC' | base64 -d | sudo -u ssm-user bash" '{commands:[$cmd]}')
          CID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB read-only Gemini V5.4 settlement history audit" --parameters "$PARAMS" --timeout-seconds 480 --query 'Command.CommandId' --output text)
          echo "SSM_COMMAND_ID=$CID"
          for _ in $(seq 1 240); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 2
          done
          RESULT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          OUT=$(jq -r '.Stdout // ""' <<<"$RESULT")
          grep -q 'V5_4_CONTINUOUS_HISTORY_AUDIT=' <<<"$OUT"
          grep -q '"order_entry":false' <<<"$OUT"
          grep -q '"venue_mutation":false' <<<"$OUT"
