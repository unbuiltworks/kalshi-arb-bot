name: AWS L5 full-history status

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - deploy/aws/l5-full-history-status.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Read L5 run files
        shell: bash
        run: |
          set -Eeuo pipefail
          RUN_ID=$(awk -F= '$1=="RUN_ID"{print $2}' deploy/aws/l5-full-history-status.trigger)
          REMOTE="set -Eeuo pipefail; ROOT=/home/ssm-user/l5-full-history/$RUN_ID; echo L5_STATUS_RUN_ID=$RUN_ID; echo FILES=; find \"\$ROOT\" -maxdepth 3 -type f -printf '%p %s bytes\\n' 2>/dev/null | sort || true; echo CONSOLE_BEGIN; tail -n 240 \"\$ROOT/console.log\" 2>/dev/null || true; echo CONSOLE_END"
          PARAMS=$(jq -nc --arg cmd "sudo -u ssm-user bash -lc $(printf %q "$REMOTE")" '{commands:[$cmd]}')
          CID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --parameters "$PARAMS" --timeout-seconds 180 --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" || true
          R=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$R"
          test "$(jq -r '.Status' <<<"$R")" = Success
