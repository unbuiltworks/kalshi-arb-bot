name: AWS Gemini q10 V4 live status

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - deploy/aws/gemini-q10-v4-live-status.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Read-only V4 process and durable state
        shell: bash
        run: |
          set -Eeuo pipefail
          RUN_ID=$(awk -F= '$1=="RUN_ID"{print $2}' deploy/aws/gemini-q10-v4-live-status.trigger 2>/dev/null || true)
          test -n "$RUN_ID"
          REMOTE_SCRIPT=$(cat <<EOF
          set -Eeuo pipefail
          STATE=/home/ssm-user/gemini-q10-production-state/${RUN_ID}/q10-production-${RUN_ID}.json
          echo Q10_V4_STATUS_RUN_ID=${RUN_ID}
          if [ -f "\$STATE" ]; then echo Q10_V4_STATE=; cat "\$STATE"; else echo Q10_V4_STATE_MISSING; fi
          echo Q10_V4_PROCESSES=
          pgrep -af 'gemini_q10_production_candidate_v3|arb-gemini-q10-production-live' || true
          echo Q10_V4_DOCKER=
          docker ps --format '{{.ID}} {{.Image}} {{.Status}} {{.Names}}' | grep 'arb-gemini-q10-production-live' || true
          EOF
          )
          ENCODED=$(printf '%s' "$REMOTE_SCRIPT" | base64 -w0)
          PARAMETERS=$(jq -nc --arg cmd "echo '$ENCODED' | base64 -d | bash" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB q10 V4 live read-only status" --parameters "$PARAMETERS" --timeout-seconds 180 --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" || true
          RESULT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          grep -q 'Q10_V4_STATUS_RUN_ID=' <<<"$(jq -r '.Stdout // ""' <<<"$RESULT")"
