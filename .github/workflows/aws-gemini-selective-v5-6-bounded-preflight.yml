name: AWS Gemini selective maker V5.6 bounded preflight

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - deploy/aws/gemini-selective-v5-6-bounded-preflight.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  RELEASE_BRANCH: release/gemini-selective-maker-v5-6-final
  REQUIRED_RELEASE_COMMIT: 1231adf4f4e22628b4fecd4b1b57e6f1e16434e6
  DAILY_LOSS_LIMIT_USD: '3.00'
  SESSION_LOSS_LIMIT_USD: '1.00'
  CAMPAIGN_LOSS_LIMIT_USD: '1.00'
  RESCUE_LOSS_LIMIT_USD: '0.30'
  MAX_WINDOWS: '1'
  MAX_SESSION_SECONDS: '1200'

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation
      - name: Validate read-only trigger
        id: trigger
        shell: bash
        run: |
          set -Eeuo pipefail
          F=deploy/aws/gemini-selective-v5-6-bounded-preflight.trigger
          PIN=$(awk -F= '$1=="PINNED_COMMIT"{print $2}' "$F" | tr -d '[:space:]')
          CLASS=$(awk -F= '$1=="CLASSIFICATION"{print $2}' "$F" | tr -d '\r')
          test "$PIN" = "$REQUIRED_RELEASE_COMMIT"
          test "$CLASS" = READ_ONLY_V5_6_ONE_WINDOW_CANARY_PREFLIGHT
          echo "pin=$PIN" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Exact-release safety and authenticated disarmed preflight on EC2
        shell: bash
        env:
          PIN: ${{ steps.trigger.outputs.pin }}
        run: |
          set -Eeuo pipefail
          REMOTE=$(cat <<EOF
          set -Eeuo pipefail
          REPO=/home/ssm-user/kalshi-arb-bot
          WORK=/opt/arb/gemini-selective-v5-6-bounded-preflight
          IMAGE=arb-gemini-selective-v5-6-preflight:${PIN:0:12}
          cd "\$REPO"
          git config --global --add safe.directory "\$REPO" || true
          git fetch origin ${RELEASE_BRANCH} >/dev/null
          test "\$(git rev-parse origin/${RELEASE_BRANCH})" = "${PIN}"
          git worktree remove --force "\$WORK" >/dev/null 2>&1 || true
          rm -rf "\$WORK"
          git worktree prune
          git worktree add --detach "\$WORK" "${PIN}" >/dev/null
          test "\$(git -C "\$WORK" rev-parse HEAD)" = "${PIN}"
          docker build -q -t "\$IMAGE" "\$WORK" >/dev/null
          echo '=== V5.6 FOCUSED SAFETY TESTS ==='
          docker run --rm --network none "\$IMAGE" python -m pytest -q \
            tests/test_btc_spot_toxicity_guard.py \
            tests/test_gemini_prediction_book_cache.py \
            tests/test_gemini_q10_rescue_policy.py \
            tests/test_gemini_q10_production_executor_v5.py \
            tests/test_gemini_q10_v5_recovery_deadman.py \
            tests/test_gemini_q10_v5_deadman_sidecar.py \
            tests/test_gemini_adaptive_maker_v5_3.py \
            tests/test_gemini_adaptive_maker_executor_v5_3.py \
            tests/test_gemini_adaptive_maker_v5_4.py \
            tests/test_gemini_adaptive_maker_v5_5.py \
            tests/test_gemini_selective_maker_v5_6.py
          if [ -f /opt/arb/secrets/gemini-short-crypto.env ]; then ENV_FILE=/opt/arb/secrets/gemini-short-crypto.env; else ENV_FILE=/home/ssm-user/kalshi-arb-bot/.env; fi
          if [ -d /home/ssm-user/gemini-short-crypto-state ]; then BASE_STATE=/home/ssm-user/gemini-short-crypto-state; else BASE_STATE=/opt/arb/gemini-short-crypto-state; fi
          test -f "\$ENV_FILE"
          TMP_STATE=\$(mktemp -d)
          trap 'rm -rf "\$TMP_STATE"' EXIT
          echo '=== AUTHENTICATED DISARMED PREFLIGHT ==='
          docker run --rm -i --network host --env-file "\$ENV_FILE" \
            -e GEMINI_SHORT_CRYPTO_STATE_DIR=/base_state \
            -e GEMINI_Q10_PRODUCTION_STATE_DIR=/prod_state \
            -e GEMINI_Q10_PRODUCTION_LIVE=NO \
            -e GEMINI_Q10_PRODUCTION_ARM_ID= \
            -e GEMINI_Q10_PRODUCTION_ARM= \
            -e GEMINI_Q10_V5_RECOVERY_ARM= \
            -e GEMINI_Q10_V5_WATCHDOG_ARM= \
            -e GEMINI_Q10_V5_MAX_RESCUE_LOSS_USD=${RESCUE_LOSS_LIMIT_USD} \
            -e GEMINI_Q10_V5_MAX_CAMPAIGN_LOSS_USD=${CAMPAIGN_LOSS_LIMIT_USD} \
            -e GEMINI_Q10_V5_MAX_DAILY_LOSS_USD=${DAILY_LOSS_LIMIT_USD} \
            -e GEMINI_Q10_V5_CALM_MAKER_GRACE_SECONDS=0 \
            -e GEMINI_SELECTIVE_V5_6_MAX_SESSION_LOSS_USD=${SESSION_LOSS_LIMIT_USD} \
            -e GEMINI_SELECTIVE_V5_6_MAX_WINDOWS=${MAX_WINDOWS} \
            -e GEMINI_SELECTIVE_V5_6_MAX_SESSION_SECONDS=${MAX_SESSION_SECONDS} \
            -v "\$BASE_STATE:/base_state:ro" -v "\$TMP_STATE:/prod_state" \
            "\$IMAGE" python - <<'PY'
          import asyncio,json
          from decimal import Decimal as D
          from src import gemini_adaptive_maker_executor_v5_3 as v53
          from src import gemini_selective_maker_v5_6 as v56
          async def main():
              available,flat=await v53.v5.v1._preflight_flat()
              result=await v56.run()
              out={'release_commit':'${PIN}','available_usd':str(available),'flat':flat,
                   'runtime':result,'limits':{'daily':'${DAILY_LOSS_LIMIT_USD}','session':'${SESSION_LOSS_LIMIT_USD}',
                   'campaign':'${CAMPAIGN_LOSS_LIMIT_USD}','rescue':'${RESCUE_LOSS_LIMIT_USD}',
                   'windows':'${MAX_WINDOWS}','seconds':'${MAX_SESSION_SECONDS}'},
                   'order_entry':False,'venue_mutation':False,'realized_pnl':0}
              print('V5_6_BOUNDED_PREFLIGHT='+json.dumps(out,separators=(',',':'),default=str))
              assert flat['orders']==0 and flat['positions']==0
              assert available >= D('15')
              assert result['status']=='DISARMED_READY' and result['order_entry'] is False
          asyncio.run(main())
          PY
          echo V5_6_BOUNDED_PREFLIGHT_COMPLETE
          EOF
          )
          ENC=$(printf '%s' "$REMOTE" | base64 -w0)
          PARAMS=$(jq -nc --arg cmd "echo '$ENC' | base64 -d | sudo -u ssm-user bash" '{commands:[$cmd]}')
          CID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB V5.6 bounded read-only preflight" --parameters "$PARAMS" --timeout-seconds 900 --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" || true
          RESULT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          OUT=$(jq -r '.Stdout // ""' <<<"$RESULT")
          grep -q 'V5_6_BOUNDED_PREFLIGHT=' <<<"$OUT"
          grep -q 'V5_6_BOUNDED_PREFLIGHT_COMPLETE' <<<"$OUT"
