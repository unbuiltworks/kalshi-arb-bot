name: AWS PMUS q1 encrypted credential install

on:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/pmus-q1-install-credentials.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Encrypt PMUS credentials to EC2 and install 0600 env
        shell: bash
        env:
          PMUS_KEY_ID: ${{ secrets.PMUS_API_KEY_ID }}
          PMUS_SECRET_KEY: ${{ secrets.PMUS_API_SECRET_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "${PMUS_KEY_ID:-}" || { echo 'PMUS repository secret PMUS_API_KEY_ID is missing'; exit 2; }
          test -n "${PMUS_SECRET_KEY:-}" || { echo 'PMUS repository secret PMUS_API_SECRET_KEY is missing'; exit 2; }

          # Generate/reuse an EC2-local sealing key. Only the PUBLIC key leaves EC2.
          REMOTE_KEY=$(cat <<'EOF'
          set -Eeuo pipefail
          SEAL=/home/ssm-user/l5-pmus-q1-seal
          mkdir -p "$SEAL"
          chmod 700 "$SEAL"
          if [[ ! -s "$SEAL/private.pem" ]]; then
            umask 077
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$SEAL/private.pem" >/dev/null 2>&1
          fi
          chmod 600 "$SEAL/private.pem"
          openssl pkey -in "$SEAL/private.pem" -pubout -out "$SEAL/public.pem" >/dev/null 2>&1
          chmod 644 "$SEAL/public.pem"
          cat "$SEAL/public.pem"
          EOF
          )
          ENC=$(printf '%s' "$REMOTE_KEY" | base64 -w0)
          PARAMS=$(jq -nc --arg cmd "echo '$ENC' | base64 -d | sudo -u ssm-user bash" '{commands:[$cmd]}')
          CID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment 'L5 PMUS generate credential sealing public key' --parameters "$PARAMS" \
            --timeout-seconds 60 --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" || true
          PUB=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" \
            --query StandardOutputContent --output text)
          grep -q 'BEGIN PUBLIC KEY' <<<"$PUB"
          printf '%s\n' "$PUB" > /tmp/pmus-ec2-public.pem

          umask 077
          printf '%s' "$PMUS_KEY_ID" > /tmp/pmus-key-id.txt
          printf '%s' "$PMUS_SECRET_KEY" > /tmp/pmus-secret-key.txt
          openssl pkeyutl -encrypt -pubin -inkey /tmp/pmus-ec2-public.pem \
            -in /tmp/pmus-key-id.txt -out /tmp/pmus-key-id.enc \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          openssl pkeyutl -encrypt -pubin -inkey /tmp/pmus-ec2-public.pem \
            -in /tmp/pmus-secret-key.txt -out /tmp/pmus-secret-key.enc \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          KEY_CT=$(base64 -w0 /tmp/pmus-key-id.enc)
          SECRET_CT=$(base64 -w0 /tmp/pmus-secret-key.enc)
          rm -f /tmp/pmus-key-id.txt /tmp/pmus-secret-key.txt /tmp/pmus-key-id.enc /tmp/pmus-secret-key.enc /tmp/pmus-ec2-public.pem

          # Only ciphertext is embedded in SSM command history.
          REMOTE_INSTALL=$(cat <<EOF
          set -Eeuo pipefail
          SEAL=/home/ssm-user/l5-pmus-q1-seal
          OUT=/home/ssm-user/l5-pmus-q1-credentials.env
          umask 077
          printf '%s' '$KEY_CT' | base64 -d > /tmp/pmus-key-id.enc
          printf '%s' '$SECRET_CT' | base64 -d > /tmp/pmus-secret-key.enc
          openssl pkeyutl -decrypt -inkey "\$SEAL/private.pem" -in /tmp/pmus-key-id.enc -out /tmp/pmus-key-id.txt \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          openssl pkeyutl -decrypt -inkey "\$SEAL/private.pem" -in /tmp/pmus-secret-key.enc -out /tmp/pmus-secret-key.txt \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          key=\$(cat /tmp/pmus-key-id.txt)
          secret=\$(cat /tmp/pmus-secret-key.txt)
          test -n "\$key" && test -n "\$secret"
          printf 'PMUS_API_KEY_ID=%s\nPMUS_API_SECRET_KEY=%s\n' "\$key" "\$secret" > "\$OUT"
          chmod 600 "\$OUT"
          rm -f /tmp/pmus-key-id.enc /tmp/pmus-secret-key.enc /tmp/pmus-key-id.txt /tmp/pmus-secret-key.txt
          unset key secret
          set -a
          . "\$OUT"
          set +a
          test -n "\$PMUS_API_KEY_ID" && test -n "\$PMUS_API_SECRET_KEY"
          echo PMUS_Q1_AWS_CREDENTIAL_INSTALL_OK file_mode=600 values_logged=false
          EOF
          )
          ENC2=$(printf '%s' "$REMOTE_INSTALL" | base64 -w0)
          PARAMS2=$(jq -nc --arg cmd "echo '$ENC2' | base64 -d | sudo -u ssm-user bash" '{commands:[$cmd]}')
          CID2=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment 'L5 PMUS install encrypted executor credentials' --parameters "$PARAMS2" \
            --timeout-seconds 60 --query 'Command.CommandId' --output text)
          for _ in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID2" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 2
          done
          RESULT=$(aws ssm get-command-invocation --command-id "$CID2" --instance-id "$AWS_HOT_INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          grep -q 'PMUS_Q1_AWS_CREDENTIAL_INSTALL_OK' <<<"$(jq -r '.Stdout' <<<"$RESULT")"
