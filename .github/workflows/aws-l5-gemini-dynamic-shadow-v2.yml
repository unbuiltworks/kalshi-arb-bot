name: AWS l5 Gemini dynamic shadow v2

on:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/l5-gemini-dynamic-shadow-v2.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation

      - name: Read pinned shadow trigger
        id: trigger
        shell: bash
        run: |
          set -euo pipefail
          FILE=deploy/aws/l5-gemini-dynamic-shadow-v2.trigger
          PINNED_COMMIT=$(awk -F= '$1=="PINNED_COMMIT"{print $2}' "$FILE" | tr -d '[:space:]')
          [[ "$PINNED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          echo "pinned_commit=$PINNED_COMMIT" >> "$GITHUB_OUTPUT"
          echo "L5_DYNAMIC_SHADOW_TRIGGER commit=${PINNED_COMMIT:0:12} classification=SHADOW_NOT_REALIZED order_entry=false"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Launch exact pinned read-only shadow through SSM
        id: launch
        env:
          PINNED_COMMIT: ${{ steps.trigger.outputs.pinned_commit }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_CMD="sudo -u ssm-user bash -lc 'cd /home/ssm-user/kalshi-arb-bot && git fetch origin feature/l5-gemini-dynamic-shadow-v2 && git show ${PINNED_COMMIT}:deploy/aws/run_gemini_l5_dynamic_shadow_v2.sh > /tmp/run_gemini_l5_dynamic_shadow_v2.sh && chmod +x /tmp/run_gemini_l5_dynamic_shadow_v2.sh && PINNED_COMMIT=${PINNED_COMMIT} SHADOW_SECONDS=3600 SHADOW_DISCOVER_S=10 /tmp/run_gemini_l5_dynamic_shadow_v2.sh'"
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$AWS_HOT_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "ARB l5 Gemini dynamic shadow v2 ${PINNED_COMMIT:0:12}" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$AWS_HOT_INSTANCE_ID" || true
          mkdir -p runtime
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$AWS_HOT_INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            > runtime/aws-l5-gemini-dynamic-shadow-v2-launch.json
          cat runtime/aws-l5-gemini-dynamic-shadow-v2-launch.json
          status=$(jq -r '.Status // "Unknown"' runtime/aws-l5-gemini-dynamic-shadow-v2-launch.json)
          test "$status" = "Success"
          stdout=$(jq -r '.Stdout // ""' runtime/aws-l5-gemini-dynamic-shadow-v2-launch.json)
          grep -q 'L5_DYNAMIC_SHADOW_TESTS_OK' <<< "$stdout"
          grep -q 'L5_DYNAMIC_SHADOW_STARTED' <<< "$stdout"
          grep -q 'order_entry=false' <<< "$stdout"
          grep -q 'credentials_loaded=false' <<< "$stdout"

      - name: Upload non-secret launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-l5-gemini-dynamic-shadow-v2-launch
          path: runtime/
          retention-days: 3
          if-no-files-found: warn
