name: AWS Gemini dynamic-complement q1 disarmed preflight

on:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/gemini-dynamic-complement-q1-disarmed-preflight.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  DYNAMIC_COMMIT: e89ce0ddfc46801f24d37ed98042f521318012d8
  DYNAMIC_BRANCH: feature/gemini-incentive-mm-dynamic-complement-q1

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prove dynamic ETH5 q1 launcher refuses to arm on AWS
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_CMD="sudo -u ssm-user bash -lc 'set -euo pipefail; cd /home/ssm-user/kalshi-arb-bot; git fetch origin ${DYNAMIC_BRANCH} >/dev/null; git merge-base --is-ancestor ${DYNAMIC_COMMIT} origin/${DYNAMIC_BRANCH}; git cat-file -e \"${DYNAMIC_COMMIT}^{commit}\"; git show ${DYNAMIC_COMMIT}:src/gemini_incentive_mm_dynamic_live_probe_q1.py | grep -q '\"'\"'TARGET_ASSET = \"ETH\"'\"'\"'; git show ${DYNAMIC_COMMIT}:src/gemini_incentive_mm_dynamic_live_probe_q1.py | grep -q '\"'\"'TARGET_HORIZON = \"5m\"'\"'\"'; git show ${DYNAMIC_COMMIT}:src/gemini_incentive_mm_dynamic_live_probe_q1.py | grep -q '\"'\"'gemini_short_crypto_dynamic_complement_q1_v2'\"'\"'; git show ${DYNAMIC_COMMIT}:src/gemini_short_crypto_dynamic_complement_q1.py | grep -q '\"'\"'ENTRY_PAIR_EDGE = D(\"0.05\")'\"'\"'; git show ${DYNAMIC_COMMIT}:src/gemini_short_crypto_dynamic_complement_q1.py | grep -q '\"'\"'FINAL_PAIR_EDGE = D(\"0.02\")'\"'\"'; git show ${DYNAMIC_COMMIT}:src/gemini_short_crypto_dynamic_complement_q1.py | grep -q '\"'\"'RESCUE_SECONDS = 30.0'\"'\"'; git show ${DYNAMIC_COMMIT}:src/gemini_short_crypto_dynamic_complement_q1.py | grep -q '\"'\"'MAX_REPRICES = 6'\"'\"'; git show ${DYNAMIC_COMMIT}:src/gemini_short_crypto_dynamic_complement_q1_v2.py | grep -q '\"'\"'Persist only accepted orders'\"'\"'; git show ${DYNAMIC_COMMIT}:deploy/aws/run_gemini_dynamic_complement_q1.sh | grep -q '\"'\"'taker_rescue=false'\"'\"'; git show ${DYNAMIC_COMMIT}:deploy/aws/run_gemini_dynamic_complement_q1.sh > /tmp/run_gemini_dynamic_complement_q1.sh; chmod 0700 /tmp/run_gemini_dynamic_complement_q1.sh; bash -n /tmp/run_gemini_dynamic_complement_q1.sh; set +e; PINNED_COMMIT=${DYNAMIC_COMMIT} bash /tmp/run_gemini_dynamic_complement_q1.sh >/tmp/dynamic-q1-disarmed-preflight.log 2>&1; rc=\$?; set -e; test \$rc -ne 0; grep -q \"fresh dynamic-complement q1 approval flag missing\" /tmp/dynamic-q1-disarmed-preflight.log; ! grep -q \"secure env missing\" /tmp/dynamic-q1-disarmed-preflight.log; ! grep -q \"DYNAMIC_COMPLEMENT_Q1_SOURCE_READY\" /tmp/dynamic-q1-disarmed-preflight.log; echo DYNAMIC_Q1_AWS_DISARMED_PREFLIGHT_OK commit=${DYNAMIC_COMMIT} target=ETH5 entry_edge=0.05 final_edge=0.02 rescue_s=30 max_reprices=6 accepted_ids_only=true taker_rescue=false order_entry=false credentials_read=false'"
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$AWS_HOT_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "ARB dynamic complement q1 ETH5 disarmed preflight" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" || true
          RESULT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$AWS_HOT_INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = "Success"
          grep -q 'DYNAMIC_Q1_AWS_DISARMED_PREFLIGHT_OK' <<<"$(jq -r '.Stdout' <<<"$RESULT")"
