name: AWS l5 Gemini q1 live v1

on:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/l5-gemini-q1-live-v1.trigger

permissions:
  id-token: write
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation

      - name: Read one-time launch trigger
        id: trigger
        shell: bash
        run: |
          set -euo pipefail
          FILE=deploy/aws/l5-gemini-q1-live-v1.trigger
          PINNED_COMMIT=$(awk -F= '$1=="PINNED_COMMIT"{print $2}' "$FILE" | tr -d '[:space:]')
          APPROVAL_ID=$(awk -F= '$1=="APPROVAL_ID"{print $2}' "$FILE" | tr -d '[:space:]')
          [[ "$PINNED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APPROVAL_ID" =~ ^[A-Za-z0-9_-]+$ ]]
          echo "pinned_commit=$PINNED_COMMIT" >> "$GITHUB_OUTPUT"
          echo "approval_id=$APPROVAL_ID" >> "$GITHUB_OUTPUT"
          echo "L5_AWS_TRIGGER commit=${PINNED_COMMIT:0:12} approval_id=$APPROVAL_ID"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ARB_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Launch exact pinned l5 q1 probe through SSM
        id: ssm
        shell: bash
        env:
          PINNED_COMMIT: ${{ steps.trigger.outputs.pinned_commit }}
          APPROVAL_ID: ${{ steps.trigger.outputs.approval_id }}
        run: |
          set -euo pipefail
          REMOTE_CMD="sudo -u ssm-user bash -lc 'cd /home/ssm-user/kalshi-arb-bot && git fetch origin feature/l5-gemini-aws-live-probe-v1 && git show ${PINNED_COMMIT}:deploy/aws/run_gemini_l5_threshold_q1_live_v1.sh > /tmp/run_gemini_l5_threshold_q1_live_v1.sh && chmod +x /tmp/run_gemini_l5_threshold_q1_live_v1.sh && PINNED_COMMIT=${PINNED_COMMIT} ARB_GEMINI_L5_Q1_APPROVED=YES ARB_GEMINI_L5_Q1_APPROVAL_ID=${APPROVAL_ID} /tmp/run_gemini_l5_threshold_q1_live_v1.sh'"
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.AWS_ARB_HOT_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "ARB l5 Gemini q1 live v1 ${PINNED_COMMIT:0:12}" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.AWS_ARB_HOT_INSTANCE_ID }}" || true
          mkdir -p runtime
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.AWS_ARB_HOT_INSTANCE_ID }}" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            > runtime/aws-l5-gemini-q1-live-v1-last.json
          cat runtime/aws-l5-gemini-q1-live-v1-last.json
          status=$(jq -r '.Status // "Unknown"' runtime/aws-l5-gemini-q1-live-v1-last.json)
          test "$status" = "Success"

      - name: Upload non-secret launch evidence
        uses: actions/upload-artifact@v4
        with:
          name: aws-l5-gemini-q1-live-v1
          path: runtime/aws-l5-gemini-q1-live-v1-last.json
          retention-days: 3
