name: Kalshi BTC15m Policy-D V1 release tests

on:
  push:
    branches: [release/kalshi-btc15m-policy-d-v1]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt pytest
      - name: Compile live module
        run: python -m py_compile src/kalshi_btc15m_policy_d_live_v1.py
      - name: Run focused Kalshi and Policy-D tests
        run: |
          python -m pytest -q \
            tests/test_kalshi_btc15m_policy_d_live_v1.py \
            tests/test_auth.py \
            tests/test_sports_kp_execution.py
