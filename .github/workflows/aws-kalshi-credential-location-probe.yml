name: AWS Kalshi credential location probe

on:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/kalshi-credential-location-probe.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Locate credential wiring without revealing values
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_CMD=$(cat <<'SH'
          set -eu
          echo KALSHI_CRED_PROBE_START
          found=0
          for f in /home/ssm-user/kalshi-arb-bot/.env /opt/arb/secrets/*.env /home/ssm-user/.env /home/ubuntu/.env; do
            [ -f "$f" ] || continue
            id=0; pem=0; path=0
            grep -q '^KALSHI_API_KEY_ID=.' "$f" 2>/dev/null && id=1 || true
            grep -q '^KALSHI_PRIVATE_KEY_PEM=.' "$f" 2>/dev/null && pem=1 || true
            grep -q '^KALSHI_PRIVATE_KEY_PATH=.' "$f" 2>/dev/null && path=1 || true
            if [ "$id" -eq 1 ] || [ "$pem" -eq 1 ] || [ "$path" -eq 1 ]; then
              echo "KALSHI_CRED_ENV file=$f has_key_id=$id has_inline_pem=$pem has_key_path=$path"
              found=1
            fi
          done
          keyfiles=0
          for f in /home/ssm-user/kalshi-arb-bot/private_key.pem /home/ssm-user/*.pem /opt/arb/secrets/*.pem; do
            [ -f "$f" ] || continue
            if grep -q 'BEGIN .*PRIVATE KEY' "$f" 2>/dev/null; then
              echo "KALSHI_PRIVATE_KEY_FILE_PRESENT file=$f"
              keyfiles=$((keyfiles+1))
            fi
          done
          echo "KALSHI_CRED_PROBE_DONE env_wiring_found=$found private_key_files=$keyfiles values_redacted=true"
          SH
          )
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "Secret-safe Kalshi credential location probe" --parameters "$PARAMETERS" --timeout-seconds 120 --query 'Command.CommandId' --output text)
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 2
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}'
          test "$STATUS" = "Success"
