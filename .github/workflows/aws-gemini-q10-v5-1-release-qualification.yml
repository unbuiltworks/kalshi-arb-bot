name: AWS Gemini q10 V5.1 release qualification

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - deploy/aws/gemini-q10-v5-1-release-qualification.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  RELEASE_BRANCH: release/gemini-q10-production-v5-1
  REQUIRED_RELEASE_COMMIT: c5401bd68418a5b8c3381ee4b6be7b10fc3783ec

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation
      - name: Read qualification trigger
        id: gate
        shell: bash
        run: |
          set -Eeuo pipefail
          F=deploy/aws/gemini-q10-v5-1-release-qualification.trigger
          PIN=$(awk -F= '$1=="PINNED_COMMIT"{print $2}' "$F" | tr -d '[:space:]')
          RUN_ID=$(awk -F= '$1=="RUN_ID"{print $2}' "$F" | tr -d '[:space:]')
          CLASS=$(awk -F= '$1=="CLASSIFICATION"{print $2}' "$F" | tr -d '[:space:]')
          test "$PIN" = "$REQUIRED_RELEASE_COMMIT"
          test "$CLASS" = READ_ONLY_GEMINI_Q10_V5_1_RELEASE_QUALIFICATION
          [[ "$RUN_ID" =~ ^[A-Za-z0-9_-]+$ ]]
          echo "pin=$PIN" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Qualify exact release on EC2 without mutation
        shell: bash
        env:
          PIN: ${{ steps.gate.outputs.pin }}
          RUN_ID: ${{ steps.gate.outputs.run_id }}
        run: |
          set -Eeuo pipefail
          SHORT=${PIN:0:12}
          REMOTE=$(cat <<EOF
          set -Eeuo pipefail
          REPO=/home/ssm-user/kalshi-arb-bot
          WORK=/opt/arb/gemini-q10-v5-1-release-qualification
          STATE=/home/ssm-user/gemini-q10-v5-1-release-qualification-state
          OUT=/home/ssm-user/gemini-q10-v5-1-release-qualification/${RUN_ID}
          IMAGE=arb-gemini-q10-v5-1-release-qualification:${SHORT}
          cd "\$REPO"
          git config --global --add safe.directory "\$REPO" || true
          git fetch origin ${RELEASE_BRANCH} >/dev/null
          ACTUAL=\$(git rev-parse origin/${RELEASE_BRANCH})
          test "\$ACTUAL" = "${PIN}"
          git worktree remove --force "\$WORK" >/dev/null 2>&1 || true
          rm -rf "\$WORK" "\$STATE" "\$OUT"
          git worktree prune
          git worktree add --detach "\$WORK" "${PIN}" >/dev/null
          docker build -q -t "\$IMAGE" "\$WORK" >/dev/null
          mkdir -p "\$STATE" "\$OUT"

          echo V5_1_RELEASE_TESTS_BEGIN
          docker run --rm --network none "\$IMAGE" python -m pytest -q \
            tests/test_btc_spot_toxicity_guard.py \
            tests/test_gemini_prediction_book_cache.py \
            tests/test_gemini_q10_rescue_policy.py \
            tests/test_gemini_liquidity_reward_dynamic_completion_q10.py \
            tests/test_gemini_q10_production_executor.py \
            tests/test_gemini_q10_production_executor_v2.py \
            tests/test_gemini_q10_production_executor_v5.py \
            tests/test_gemini_q10_production_executor_v5_1.py \
            tests/test_gemini_q10_v5_recovery_deadman.py \
            tests/test_gemini_q10_v5_deadman_sidecar.py
          echo V5_1_RELEASE_TESTS_PASS

          if [ -f /opt/arb/secrets/gemini-short-crypto.env ]; then ENV_FILE=/opt/arb/secrets/gemini-short-crypto.env; else ENV_FILE=/home/ssm-user/kalshi-arb-bot/.env; fi
          if [ -d /home/ssm-user/gemini-short-crypto-state ]; then BASE_STATE=/home/ssm-user/gemini-short-crypto-state; else BASE_STATE=/opt/arb/gemini-short-crypto-state; fi
          test -f "\$ENV_FILE"

          echo V5_1_REAL_ACCOUNT_PREFLIGHT_BEGIN
          docker run --rm -i --network host --env-file "\$ENV_FILE" \
            -e GEMINI_SHORT_CRYPTO_STATE_DIR=/base_state \
            -e GEMINI_Q10_PRODUCTION_STATE_DIR=/prod_state \
            -e GEMINI_Q10_PRODUCTION_LIVE=NO \
            -e GEMINI_Q10_PRODUCTION_ARM_ID= \
            -e GEMINI_Q10_PRODUCTION_ARM= \
            -e GEMINI_Q10_V5_RECOVERY_ARM= \
            -e GEMINI_Q10_V5_WATCHDOG_ARM= \
            -v "\$BASE_STATE:/base_state:ro" \
            -v "\$STATE:/prod_state" \
            "\$IMAGE" python - <<'PY'
          import asyncio, json
          from src import gemini_q10_v5_recovery as r
          from src import gemini_q10_production_executor_v5_1 as v51
          async def main():
              report, _, _, _ = await r.audit()
              print('V5_1_RELEASE_PREFLIGHT='+json.dumps(report.as_dict(),separators=(',',':'),default=str))
              assert report.status == 'CLEAN_NO_OPEN_STATE'
              assert report.account_orders == 0
              assert report.account_positions == 0
              v51.install()
          asyncio.run(main())
          PY
          echo V5_1_REAL_ACCOUNT_PREFLIGHT_PASS

          echo V5_1_SIDECAR_IDLE_BEGIN
          set +e
          timeout 2 docker run --rm \
            -e GEMINI_Q10_PRODUCTION_STATE_DIR=/prod_state \
            -e GEMINI_Q10_PRODUCTION_LIVE=NO \
            -v "\$STATE:/prod_state" \
            "\$IMAGE" python -m src.gemini_q10_v5_deadman_sidecar > "\$OUT/sidecar.log" 2>&1
          RC=\$?
          set -e
          test "\$RC" = 124
          grep -q WAITING_FOR_OPEN_CAMPAIGN "\$OUT/sidecar.log"
          echo V5_1_SIDECAR_IDLE_PASS

          echo V5_1_EXACT_SHADOW_BEGIN
          docker run --rm --network host --env-file "\$ENV_FILE" \
            -e GEMINI_SHORT_CRYPTO_STATE_DIR=/base_state \
            -e GEMINI_Q10_PRODUCTION_STATE_DIR=/prod_state \
            -e GEMINI_Q10_PRODUCTION_LIVE=NO \
            -e GEMINI_Q10_PRODUCTION_ARM_ID= \
            -e GEMINI_Q10_PRODUCTION_ARM= \
            -e GEMINI_Q10_PRODUCTION_CONTINUOUS=NO \
            -e GEMINI_Q10_V5_RECOVERY_ARM= \
            -e GEMINI_Q10_V5_WATCHDOG_ARM= \
            -e GEMINI_Q10_V5_SHADOW_CANDIDATE_WAIT_SECONDS=180 \
            -v "\$BASE_STATE:/base_state:ro" \
            -v "\$STATE:/prod_state" \
            "\$IMAGE" python -m src.gemini_q10_production_shadow_v5_1 | tee "\$OUT/shadow.log"
          grep -q 'GEMINI_Q10_V5_SHADOW=' "\$OUT/shadow.log"
          grep -q 'READ_ONLY_V5_SHADOW_NOT_REALIZED' "\$OUT/shadow.log"
          echo V5_1_EXACT_SHADOW_PASS

          echo V5_1_POST_PREFLIGHT_BEGIN
          docker run --rm -i --network host --env-file "\$ENV_FILE" \
            -e GEMINI_SHORT_CRYPTO_STATE_DIR=/base_state \
            -e GEMINI_Q10_PRODUCTION_STATE_DIR=/prod_state \
            -e GEMINI_Q10_PRODUCTION_LIVE=NO \
            -v "\$BASE_STATE:/base_state:ro" \
            -v "\$STATE:/prod_state" \
            "\$IMAGE" python - <<'PY'
          import asyncio, json
          from src import gemini_q10_v5_recovery as r
          async def main():
              report, _, _, _ = await r.audit()
              print('V5_1_RELEASE_POST='+json.dumps(report.as_dict(),separators=(',',':'),default=str))
              assert report.account_orders == 0
              assert report.account_positions == 0
          asyncio.run(main())
          PY
          echo V5_1_RELEASE_QUALIFICATION_COMPLETE pin=${PIN}
          EOF
          )
          ENC=$(printf '%s' "$REMOTE" | base64 -w0)
          PARAMS=$(jq -nc --arg cmd "echo '$ENC' | base64 -d | sudo -u ssm-user bash" '{commands:[$cmd]}')
          CID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB V5.1 release qualification $RUN_ID" --parameters "$PARAMS" --timeout-seconds 1000 --query 'Command.CommandId' --output text)
          for _ in $(seq 1 480); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 2
          done
          RESULT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          OUT=$(jq -r '.Stdout // ""' <<<"$RESULT")
          grep -q 'V5_1_RELEASE_QUALIFICATION_COMPLETE' <<<"$OUT"
