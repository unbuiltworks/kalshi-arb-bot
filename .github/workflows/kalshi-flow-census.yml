name: Kalshi Flow Census

# Read-only venue-flow census over Kalshi's PUBLIC market-data endpoints.
# No credentials, no order entry. Answers the venue gate: does Kalshi's
# BTC/ETH short-window flow support L5-style matched-inventory formation?
#
# NOTE: becomes runnable only once this file is on the default branch.

on:
  workflow_dispatch:
    inputs:
      series:
        description: Space-separated series tickers
        required: false
        default: "KXBTC15M KXETH15M KXBTC KXETH"
      hours:
        description: Only markets closing within the last N hours (0 = all)
        required: false
        default: "48"
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  census:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == github.repository_owner &&
       github.event.issue.title == '[kalshi-census]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run census unit tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/test_census_core.py tests/test_census_kalshi.py -q

      - name: Run the census
        env:
          CENSUS_SERIES: ${{ inputs.series }}
          CENSUS_HOURS: ${{ inputs.hours }}
        run: |
          SERIES="${CENSUS_SERIES:-KXBTC15M KXETH15M KXBTC KXETH}"
          HOURS="${CENSUS_HOURS:-48}"
          # shellcheck disable=SC2086
          python -m src.census.kalshi --series $SERIES --hours "$HOURS" \
            | tee census_summary.txt

      - name: Post summary to the triggering issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          {
            echo '```'
            cat census_summary.txt
            echo '```'
            echo ''
            echo '---'
            echo '_Generated by [Claude Code](https://claude.ai/code)_'
          } > comment.md
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file comment.md

      - uses: actions/upload-artifact@v4
        with:
          name: kalshi-flow-census
          path: |
            data/census/kalshi/census_kalshi.json
            data/census/kalshi/raw_markets.jsonl
            data/census/kalshi/raw_trades.jsonl
            census_summary.txt
          retention-days: 30
