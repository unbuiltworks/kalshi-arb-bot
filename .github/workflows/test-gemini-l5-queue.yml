name: Test Gemini L5 Queue Shadow

on:
  push:
    branches:
      - feature/l5-gemini-queue-shadow
    paths:
      - 'src/gemini_l5_queue_shadow.py'
      - 'src/gemini_l5_complement_cf.py'
      - 'src/gemini_l5_inventory_cf.py'
      - 'src/gemini_l5_queue_service.py'
      - 'src/gemini_l5_short_crypto_universe.py'
      - 'src/gemini_l5_short_crypto_queue_service.py'
      - 'src/gemini_l5_canary.py'
      - 'src/gemini_l5_canonical_backfill.py'
      - 'src/gemini_l5_bottleneck_report.py'
      - 'src/gemini_l5_execution_shell_sweep.py'
      - 'src/gemini_l5_gain_state_scan.py'
      - 'src/gemini_l5_allstate_action_scan.py'
      - 'src/gemini_l5_residual_concentration.py'
      - 'src/gemini_l5_public_settlement_backfill.py'
      - 'src/gemini_l5_public_settlement_shell_sweep.py'
      - 'src/gemini_l5_incentive_audit.py'
      - 'src/gemini_l5_residual_exit_cf.py'
      - 'src/gemini_l5_residual_exit_timing_sweep.py'
      - 'src/gemini_l5_canary_readiness.py'
      - 'tests/test_gemini_l5_queue_shadow.py'
      - 'tests/test_gemini_l5_inventory_cf.py'
      - 'tests/test_gemini_l5_short_crypto_universe.py'
      - 'tests/test_gemini_l5_canary.py'
      - '.github/workflows/test-gemini-l5-queue.yml'
  workflow_dispatch:

jobs:
  queue-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run isolated Gemini queue, inventory, universe, and canary tests
        run: python -m pytest -q tests/test_gemini_l5_queue_shadow.py tests/test_gemini_l5_inventory_cf.py tests/test_gemini_l5_short_crypto_universe.py tests/test_gemini_l5_canary.py
      - name: Run canonical 5m and 15m historical backfill
        env:
          GEMINI_BACKFILL_FETCH_15M: '1'
        run: python -m src.gemini_l5_canonical_backfill
      - name: Decompose behavior, shell, and fill bottlenecks
        run: python -m src.gemini_l5_bottleneck_report
      - name: Sweep paired Gemini execution shells
        run: python -m src.gemini_l5_execution_shell_sweep
      - name: Scan held inventory gain states
        run: python -m src.gemini_l5_gain_state_scan
      - name: Evaluate frozen L5 model at all held book states
        run: python -m src.gemini_l5_allstate_action_scan
      - name: Decompose stochastic residual loss concentration
        run: python -m src.gemini_l5_residual_concentration
      - name: Backfill residuals from public Gemini settlement
        run: python -m src.gemini_l5_public_settlement_backfill
      - name: Compare shells using public Gemini settlement
        run: python -m src.gemini_l5_public_settlement_shell_sweep
      - name: Audit current Gemini incentives
        run: python -m src.gemini_l5_incentive_audit
      - name: Test terminal residual exit counterfactual
        run: python -m src.gemini_l5_residual_exit_cf
      - name: Sweep terminal residual exit timing
        run: python -m src.gemini_l5_residual_exit_timing_sweep
      - name: Evaluate q1 canary readiness
        run: python -m src.gemini_l5_canary_readiness
      - name: Upload canonical backfill
        uses: actions/upload-artifact@v4
        with:
          name: gemini-l5-canonical-backfill
          path: |
            analysis/l5/gemini_l5_canonical_backfill.json
            analysis/l5/gemini_l5_canonical_backfill_rows.jsonl
            analysis/l5/gemini_l5_bottleneck_report.json
            analysis/l5/gemini_l5_execution_shell_sweep.json
            analysis/l5/gemini_l5_gain_state_scan.json
            analysis/l5/gemini_l5_allstate_action_scan.json
            analysis/l5/gemini_l5_residual_concentration.json
            analysis/l5/gemini_l5_public_settlement_backfill.json
            analysis/l5/gemini_l5_public_settlement_shell_sweep.json
            analysis/l5/gemini_l5_incentive_audit.json
            analysis/l5/gemini_l5_residual_exit_cf.json
            analysis/l5/gemini_l5_residual_exit_timing_sweep.json
            analysis/l5/gemini_l5_canary_readiness.json
          retention-days: 14
