name: l5 Gemini outcome-price probe

on:
  push:
    branches:
      - feature/l5-gemini-aws-live-probe-v1
    paths:
      - src/gemini_short_crypto_outcome_price_probe.py
      - .github/workflows/l5-gemini-outcome-price-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'httpx>=0.27'
      - name: Capture documented YES/NO outcome-price consistency
        run: |
          mkdir -p artifacts
          python -m src.gemini_short_crypto_outcome_price_probe \
            | tee artifacts/gemini-short-crypto-outcome-price-probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: l5-gemini-outcome-price-probe
          path: artifacts/
          retention-days: 3
