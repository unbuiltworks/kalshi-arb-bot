name: Gemini L5 volume gate tests

on:
  push:
    branches:
      - feature/gemini-l5-volume-gate-v1
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Compile volume-gate modules
        run: |
          python -m py_compile src/gemini_l5_volume_gate.py
          python -m py_compile src/gemini_eth5_l5_volume_gate_shadow.py
      - name: Run focused tests
        run: pytest -q tests/test_gemini_l5_volume_gate.py
