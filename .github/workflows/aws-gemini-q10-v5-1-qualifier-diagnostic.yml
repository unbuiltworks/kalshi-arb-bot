name: AWS Gemini q10 V5.1 qualifier diagnostic read-only

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - .github/workflows/aws-gemini-q10-v5-1-qualifier-diagnostic.yml

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  RELEASE_BRANCH: release/gemini-q10-production-v5-1-final
  REQUIRED_RELEASE_COMMIT: ff4bc84b40b5bf79c80406c8e0d7ade77ac58e85

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Run full-cycle qualifier diagnostic on EC2 with no order entry
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE=$(cat <<'EOF'
          set -Eeuo pipefail
          REPO=/home/ssm-user/kalshi-arb-bot
          WORK=/opt/arb/gemini-q10-v5-1-qualifier-diagnostic
          IMAGE=arb-gemini-q10-v5-1-qualifier-diagnostic:ff4bc84b40b5
          cd "$REPO"
          git config --global --add safe.directory "$REPO" || true
          git fetch origin release/gemini-q10-production-v5-1-final >/dev/null
          ACTUAL=$(git rev-parse origin/release/gemini-q10-production-v5-1-final)
          test "$ACTUAL" = "ff4bc84b40b5bf79c80406c8e0d7ade77ac58e85"
          git worktree remove --force "$WORK" >/dev/null 2>&1 || true
          rm -rf "$WORK"
          git worktree prune
          git worktree add --detach "$WORK" "$ACTUAL" >/dev/null
          docker build -q -t "$IMAGE" "$WORK" >/dev/null

          docker run --rm --network host \
            -e GEMINI_Q10_PRODUCTION_LIVE=NO \
            -e GEMINI_LIQUIDITY_REWARD_LIVE_Q10=NO \
            "$IMAGE" python - <<'PY'
          import asyncio, json, time
          from collections import Counter
          from decimal import Decimal as D
          from typing import Mapping
          import httpx

          from src import gemini_liquidity_reward_live_probe_q10 as probe
          from src import gemini_q10_rescue_policy as rescue

          WAIT_SECONDS = 360.0
          POLL_SECONDS = 5.0
          DEPTH_ATTEMPTS = 3
          DEPTH_TIMEOUT = 4.0
          DEPTH_RETRY_DELAY = 0.25
          ZERO = D('0')
          Q = D('10')

          def clean_error(exc):
              return {'error_type': type(exc).__name__, 'error_message': str(exc)[:240]}

          async def reward_detail(ticker):
              started = time.perf_counter()
              try:
                  async with httpx.AsyncClient(timeout=8.0, follow_redirects=True, headers={'User-Agent':'arb-v51-readonly-diagnostic/1.0'}) as http:
                      cfg_r, ev_r = await asyncio.gather(
                          http.get(f'{probe.REST}/v1/prediction-markets/liquidity-rewards/config'),
                          http.get(f'{probe.REST}/v1/prediction-markets/liquidity-rewards/events', params={'category':'Crypto','limit':100,'offset':0}),
                      )
              except Exception as exc:
                  return None, {'reason':'REWARD_TRANSPORT_ERROR', **clean_error(exc), 'elapsed_ms':round((time.perf_counter()-started)*1000,3)}
              detail = {
                  'config_status': cfg_r.status_code,
                  'events_status': ev_r.status_code,
                  'elapsed_ms': round((time.perf_counter()-started)*1000,3),
              }
              if cfg_r.status_code != 200 or ev_r.status_code != 200:
                  return None, {'reason':'REWARD_HTTP_STATUS', **detail}
              try:
                  cfg = cfg_r.json() if cfg_r.content else {}
                  payload = ev_r.json() if ev_r.content else {}
              except Exception as exc:
                  return None, {'reason':'REWARD_JSON_ERROR', **clean_error(exc), **detail}
              rows = payload.get('data') or payload.get('events') or payload.get('liquidity_reward_events') or []
              target = None
              for row in rows:
                  if isinstance(row, Mapping) and str(row.get('event_ticker') or row.get('eventTicker') or '').upper() == ticker.upper():
                      target = dict(row)
                      break
              detail.update({'program_enabled':bool(cfg.get('enabled')), 'reward_rows':len(rows), 'event_found':target is not None})
              if not bool(cfg.get('enabled')):
                  return None, {'reason':'REWARD_PROGRAM_DISABLED', **detail}
              if target is None:
                  return None, {'reason':'REWARD_EVENT_MISSING', **detail}
              return {'config':cfg,'event':target}, detail

          async def reliable_top(symbol):
              failures = []
              for attempt in range(1, DEPTH_ATTEMPTS + 1):
                  started = time.perf_counter()
                  try:
                      top = await probe.base.fresh_top(symbol, timeout=DEPTH_TIMEOUT)
                      return top, {'attempt':attempt,'failures':failures,'elapsed_ms':round((time.perf_counter()-started)*1000,3)}
                  except (RuntimeError, asyncio.TimeoutError, OSError) as exc:
                      failures.append({'attempt':attempt, **clean_error(exc), 'elapsed_ms':round((time.perf_counter()-started)*1000,3)})
                      if attempt < DEPTH_ATTEMPTS:
                          await asyncio.sleep(DEPTH_RETRY_DELAY)
              return None, {'attempt':DEPTH_ATTEMPTS,'failures':failures}

          async def evaluate_once():
              started = time.perf_counter()
              try:
                  event = await probe.base.discover_btc5m()
              except Exception as exc:
                  return None, {'classification':'VENUE_DATA_ERROR','reason':'EVENT_DISCOVERY_ERROR',**clean_error(exc)}
              if event is None:
                  return None, {'classification':'MARKET_GATE','reason':'NO_ACTIVE_BTC5M_EVENT'}
              common = {
                  'ticker':event.ticker,
                  'symbol':event.symbol,
                  'seconds_to_expiry':round(event.seconds_to_expiry,3),
                  'price_increment':str(event.price_increment),
              }
              if not (probe.MIN_SECONDS_TO_EXPIRY <= event.seconds_to_expiry <= probe.MAX_SECONDS_TO_EXPIRY):
                  return None, {'classification':'MARKET_GATE','reason':'EXPIRY_WINDOW',**common}

              reward, reward_meta = await reward_detail(event.ticker)
              if reward is None:
                  classification = 'VENUE_DATA_ERROR' if reward_meta['reason'] in {'REWARD_TRANSPORT_ERROR','REWARD_HTTP_STATUS','REWARD_JSON_ERROR'} else 'MARKET_GATE'
                  return None, {'classification':classification,**common,**reward_meta}
              row = reward['event']
              makers_raw = row.get('qualifying_maker_count') if 'qualifying_maker_count' in row else row.get('qualifyingMakerCount')
              try:
                  makers = int(makers_raw)
              except Exception as exc:
                  return None, {'classification':'VENUE_DATA_ERROR','reason':'MAKER_COUNT_UNREADABLE','maker_count_raw':str(makers_raw),**clean_error(exc),**common,**reward_meta}
              if makers != 0:
                  return None, {'classification':'MARKET_GATE','reason':'COMPETITION_PRESENT','qualifying_maker_count':makers,**common,**reward_meta}

              top, depth_meta = await reliable_top(event.symbol)
              if top is None:
                  return None, {'classification':'VENUE_DATA_ERROR','reason':'DEPTH_UNAVAILABLE_AFTER_RETRIES',**common,'depth':depth_meta,**reward_meta}
              bid, bid_size, ask, ask_size = top
              model = probe._model(bid, ask)
              cfg = reward['config']
              max_distance = D(str(cfg.get('max_spread_cents') or 10)) / D('100')
              metrics = {
                  'bid':str(bid),'bid_size':str(bid_size),'ask':str(ask),'ask_size':str(ask_size),
                  'yes_quote':str(model['yes_quote']),'no_quote':str(model['no_quote']),
                  'locked_edge':str(model['locked_edge']),
                  'yes_distance':str(model['yes_distance']),'no_distance':str(model['no_distance']),
                  'max_distance':str(max_distance),'max_one_sided_premium':str(model['max_one_sided_premium']),
              }
              if model['yes_distance'] > max_distance or model['no_distance'] > max_distance:
                  return None, {'classification':'ECONOMIC_GATE','reason':'REWARD_DISTANCE_GATE',**common,**metrics,'depth':depth_meta,**reward_meta}
              if not (D('0.20') <= model['yes_quote'] <= D('0.80') and D('0.20') <= model['no_quote'] <= D('0.80')):
                  return None, {'classification':'ECONOMIC_GATE','reason':'PRICE_BAND_GATE',**common,**metrics,'depth':depth_meta,**reward_meta}
              if model['locked_edge'] < D('0.50'):
                  return None, {'classification':'ECONOMIC_GATE','reason':'PAIR_EDGE_GATE',**common,**metrics,'depth':depth_meta,**reward_meta}

              standing = rescue.standing_rescue_check(
                  yes_quote=model['yes_quote'], no_quote=model['no_quote'], quantity=Q,
                  yes_bid=bid, yes_bid_size=bid_size, yes_ask=ask, yes_ask_size=ask_size,
                  max_loss=D('0.30'), increment=event.price_increment,
              )
              if not standing.safe:
                  return None, {'classification':'SAFETY_GATE','reason':'V5_RESCUE_GATE',**common,**metrics,'rescue':standing.as_dict(),'depth':depth_meta,**reward_meta}
              report = {'classification':'QUALIFIED','reason':'QUALIFIED_V5_1_ENTRY','qualified':True,**common,**metrics,'rescue':standing.as_dict(),'depth':depth_meta,**reward_meta,'evaluation_ms':round((time.perf_counter()-started)*1000,3)}
              return (event, reward, model), report

          async def main():
              deadline = time.monotonic() + WAIT_SECONDS
              counts = Counter()
              samples = {}
              polls = 0
              candidate = None
              while time.monotonic() < deadline:
                  polls += 1
                  try:
                      found, report = await evaluate_once()
                  except Exception as exc:
                      found = None
                      report = {'classification':'DIAGNOSTIC_INTERNAL_ERROR','reason':'UNEXPECTED_DIAGNOSTIC_ERROR',**clean_error(exc)}
                  reason = report.get('reason','UNKNOWN')
                  counts[reason] += 1
                  samples.setdefault(reason, report)
                  if found is not None:
                      candidate = report
                      break
                  await asyncio.sleep(POLL_SECONDS)
              final = {
                  'classification':'READ_ONLY_NO_ORDER_ENTRY',
                  'release_commit':'ff4bc84b40b5bf79c80406c8e0d7ade77ac58e85',
                  'polls':polls,
                  'reason_counts':dict(counts),
                  'reason_samples':samples,
                  'qualified_candidate':candidate,
                  'order_entry':False,
                  'realized_pnl':0,
              }
              print('V5_1_QUALIFIER_DIAG='+json.dumps(final,separators=(',',':'),default=str))
              print('V5_1_QUALIFIER_DIAG_COMPLETE')

          asyncio.run(main())
          PY
          EOF
          )
          ENC=$(printf '%s' "$REMOTE" | base64 -w0)
          PARAMS=$(jq -nc --arg cmd "echo '$ENC' | base64 -d | sudo -u ssm-user bash" '{commands:[$cmd]}')
          CID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB V5.1 read-only qualifier diagnostic" --parameters "$PARAMS" --timeout-seconds 540 --query 'Command.CommandId' --output text)
          for _ in $(seq 1 300); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 2
          done
          RESULT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          grep -q 'V5_1_QUALIFIER_DIAG_COMPLETE' <<<"$(jq -r '.Stdout // ""' <<<"$RESULT")"
