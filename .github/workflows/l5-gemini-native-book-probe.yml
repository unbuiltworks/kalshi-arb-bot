name: l5 Gemini native-book probe

on:
  push:
    branches:
      - feature/l5-gemini-aws-live-probe-v1
    paths:
      - deploy/l5-gemini-native-book.trigger
      - src/gemini_short_crypto_native_book_probe.py
      - .github/workflows/l5-gemini-native-book-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependency
        run: python -m pip install 'httpx>=0.27'
      - name: Capture native UP/DOWN books for BTC/ETH 5m+15m
        run: |
          mkdir -p artifacts
          python -m src.gemini_short_crypto_native_book_probe \
            --seconds 360 \
            --poll-s 2 \
            --output artifacts/gemini-native-short-crypto-book.jsonl \
            | tee artifacts/gemini-native-short-crypto-book.log
      - name: Summarize native book evidence
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path
          rows=[]
          p=Path('artifacts/gemini-native-short-crypto-book.jsonl')
          for line in p.read_text().splitlines():
              try: rows.append(json.loads(line))
              except Exception: pass
          stats=defaultdict(lambda:{'samples':0,'up_two_sided':0,'down_two_sided':0,'both_native_two_sided':0})
          for r in rows:
              k=f"{r.get('asset')}-{r.get('horizon')}"
              s=stats[k]; s['samples']+=1
              s['up_two_sided']+=int(bool((r.get('up') or {}).get('two_sided')))
              s['down_two_sided']+=int(bool((r.get('down') or {}).get('two_sided')))
              s['both_native_two_sided']+=int(bool(r.get('both_native_two_sided')))
          out={'classification':'READ_ONLY_NATIVE_BOOK_DIAGNOSTIC','series':dict(stats),'rows':len(rows),'synthetic_complement_used':False,'realized_pnl':None}
          Path('artifacts/gemini-native-book-summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Upload native-book evidence
        uses: actions/upload-artifact@v4
        with:
          name: l5-gemini-native-book-probe
          path: artifacts/
          retention-days: 3
