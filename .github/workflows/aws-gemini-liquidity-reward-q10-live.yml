name: AWS Gemini liquidity reward q10 live

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - deploy/aws/gemini-liquidity-reward-q10-live.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  LIVE_BRANCH: feature/gemini-liquidity-reward-q10-live-probe
  EXACT_TESTED_COMMIT: e4253cd87aa673ee2d5f3c465914bf53769e0dc4

jobs:
  live_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation

      - name: Read one-use approval trigger
        id: trigger
        shell: bash
        run: |
          set -Eeuo pipefail
          FILE=deploy/aws/gemini-liquidity-reward-q10-live.trigger
          PINNED_COMMIT=$(awk -F= '$1=="PINNED_COMMIT"{print $2}' "$FILE" | tr -d '[:space:]')
          APPROVAL_ID=$(awk -F= '$1=="APPROVAL_ID"{print $2}' "$FILE" | tr -d '[:space:]')
          CLASSIFICATION=$(awk -F= '$1=="CLASSIFICATION"{print $2}' "$FILE" | tr -d '[:space:]')
          test "$PINNED_COMMIT" = "$EXACT_TESTED_COMMIT"
          test "$CLASSIFICATION" = "FRESH_USER_APPROVED_GEMINI_LIQUIDITY_REWARD_Q10_LIVE_PROBE"
          [[ "$APPROVAL_ID" =~ ^[A-Za-z0-9_-]+$ ]]
          echo "pinned_commit=$PINNED_COMMIT" >> "$GITHUB_OUTPUT"
          echo "approval_id=$APPROVAL_ID" >> "$GITHUB_OUTPUT"
          echo "Q10_REWARD_TRIGGER approval_id=$APPROVAL_ID q=10 max_campaigns=1 max_unmatched_contracts=10 taker_rescue=false"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Test, preflight, and run one bounded q10 probe
        env:
          PINNED_COMMIT: ${{ steps.trigger.outputs.pinned_commit }}
          APPROVAL_ID: ${{ steps.trigger.outputs.approval_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          SHORT_SHA="${PINNED_COMMIT:0:12}"
          REMOTE_CMD="sudo -u ssm-user bash -lc 'set -Eeuo pipefail; REPO=/home/ssm-user/kalshi-arb-bot; WORK=/opt/arb/gemini-q10-reward-live; STATE=/home/ssm-user/gemini-q10-reward-live-state/${APPROVAL_ID}; NAME=arb-gemini-liquidity-reward-q10-live; git -C \"\$REPO\" config --global --add safe.directory \"\$REPO\" || true; git -C \"\$REPO\" fetch origin ${LIVE_BRANCH}; git -C \"\$REPO\" cat-file -e \"${PINNED_COMMIT}^{commit}\"; git -C \"\$REPO\" merge-base --is-ancestor \"${PINNED_COMMIT}\" origin/${LIVE_BRANCH}; git -C \"\$REPO\" worktree remove --force \"\$WORK\" >/dev/null 2>&1 || true; rm -rf \"\$WORK\"; git -C \"\$REPO\" worktree prune; git -C \"\$REPO\" worktree add --detach \"\$WORK\" \"${PINNED_COMMIT}\"; IMAGE=arb-gemini-q10-reward-live:${SHORT_SHA}; docker build -t \"\$IMAGE\" \"\$WORK\" >/dev/null; docker run --rm \"\$IMAGE\" python -m pytest -q tests/test_gemini_liquidity_reward_live_probe_q10.py; if [ -f /opt/arb/secrets/gemini-short-crypto.env ]; then ENV_FILE=/opt/arb/secrets/gemini-short-crypto.env; else ENV_FILE=/home/ssm-user/kalshi-arb-bot/.env; fi; if [ -d /home/ssm-user/gemini-short-crypto-state ]; then BASE_STATE=/home/ssm-user/gemini-short-crypto-state; else BASE_STATE=/opt/arb/gemini-short-crypto-state; fi; test -f \"\$ENV_FILE\"; docker run --rm --network host --env-file \"\$ENV_FILE\" -e GEMINI_SHORT_CRYPTO_STATE_DIR=/state -v \"\$BASE_STATE:/state\" \"\$IMAGE\" python -c \"import asyncio,json; from src import gemini_short_crypto_local_budget as local; snap=asyncio.run(local.account_exposure_snapshot()); assert local.local_open_state() is None; assert int(snap.get('active_short_crypto_orders') or 0)==0; assert int(snap.get('active_short_crypto_positions') or 0)==0; print('Q10_PREFLIGHT_FLAT='+json.dumps(snap,default=str,sort_keys=True))\"; mkdir -p \"\$STATE\"; test ! -e \"\$STATE/gemini-liquidity-reward-q10-probe.json\"; docker rm -f \"\$NAME\" >/dev/null 2>&1 || true; docker run --name \"\$NAME\" --network host --env-file \"\$ENV_FILE\" -e GEMINI_SHORT_CRYPTO_STATE_DIR=/base_state -e GEMINI_LIQUIDITY_REWARD_Q10_STATE_DIR=/probe_state -e GEMINI_LIQUIDITY_REWARD_LIVE_Q10=YES -e GEMINI_LIQUIDITY_REWARD_PROBE_ID=${APPROVAL_ID} -e GEMINI_LIQUIDITY_REWARD_PROBE_ARM=${APPROVAL_ID} -v \"\$BASE_STATE:/base_state\" -v \"\$STATE:/probe_state\" \"\$IMAGE\" python -m src.gemini_liquidity_reward_live_probe_q10; echo Q10_PROBE_CONTAINER_EXIT=$?; echo Q10_PROBE_STATE_BEGIN; cat \"\$STATE/gemini-liquidity-reward-q10-probe.json\" 2>/dev/null || true; echo Q10_PROBE_STATE_END; echo Q10_POST_ACCOUNT_BEGIN; docker run --rm --network host --env-file \"\$ENV_FILE\" -e GEMINI_SHORT_CRYPTO_STATE_DIR=/state -v \"\$BASE_STATE:/state\" \"\$IMAGE\" python -c \"import asyncio,json; from src import gemini_short_crypto_local_budget as local; print(json.dumps(asyncio.run(local.account_exposure_snapshot()),default=str,sort_keys=True))\"; echo Q10_POST_ACCOUNT_END'"
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB Gemini q10 liquidity reward live ${APPROVAL_ID}" --parameters "$PARAMETERS" --timeout-seconds 1500 --query 'Command.CommandId' --output text)
          for i in $(seq 1 800); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 2
          done
          RESULT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          grep -q 'Q10_PREFLIGHT_FLAT=' <<<"$(jq -r '.Stdout // ""' <<<"$RESULT")"
          grep -q 'GEMINI_LIQUIDITY_REWARD_Q10' <<<"$(jq -r '.Stdout // ""' <<<"$RESULT")"
