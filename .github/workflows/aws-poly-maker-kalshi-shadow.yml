name: AWS Poly maker to Kalshi hedge shadow

on:
  workflow_dispatch:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/pkmm-autostart.trigger

permissions:
  id-token: write
  contents: read

jobs:
  start-reverse-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ARB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_ARB_REGION }}

      - name: Start read-only Poly maker to Kalshi hedge shadow through SSM
        shell: bash
        run: |
          set -euo pipefail

          REMOTE_CMD="sudo -u ssm-user bash -lc 'cd /home/ssm-user/kalshi-arb-bot && git fetch origin aws-migration-foundation && git show origin/aws-migration-foundation:deploy/aws/start_poly_maker_kalshi_hedge_shadow.sh > /tmp/start_poly_maker_kalshi_hedge_shadow.sh && chmod +x /tmp/start_poly_maker_kalshi_hedge_shadow.sh && /tmp/start_poly_maker_kalshi_hedge_shadow.sh && sleep 20 && /tmp/aws-poly-maker-kalshi-status.sh'"
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.AWS_ARB_HOT_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "ARB Poly maker to Kalshi hedge shadow - read only" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.AWS_ARB_HOT_INSTANCE_ID }}" || true

          RESULT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.AWS_ARB_HOT_INSTANCE_ID }}" \
            --output json)
          echo "$RESULT" | jq '{Status,StandardOutputContent,StandardErrorContent}'
          test "$(echo "$RESULT" | jq -r .Status)" = "Success"
