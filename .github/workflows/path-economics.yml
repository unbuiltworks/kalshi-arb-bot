# Run the sequential path-economics study on the reconstructed OOS state table.
#
# WHY A RUNNER. The reconstructed post-cutoff tape lives in the CI artifact
# produced by the calibrated evaluation run; the research container cannot reach
# Railway's SFTP transport or the venue gateway, so the table is here, not there.
# This job touches NO external service at all: it downloads one artifact this
# repository already produced and runs a pure, deterministic script over it.
#
# NOTHING IS LIVE AND NOTHING IS FITTED. No Railway operation, no order, no
# deploy, no credential. The study has no tunable threshold and never computes
# the rejected q - executable price - fee signal.
name: path-economics

on:
  push:
    branches: ['claude/l5-pmus-economic-results-7c116e']
    paths: ['.github/path_economics_request']

permissions:
  contents: read
  actions: read

jobs:
  baseline:
    # Separate job on purpose: the fixed-side baseline needs ONLY the state
    # table, so it must not wait on the 13-minute sub-second derivation.
    if: ${{ true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read the request
        id: p
        run: |
          set -euo pipefail
          rid="$(sed -n -E 's/^EVAL_RUN_ID=([0-9]+)[[:space:]]*$/\1/p' \
                 .github/path_economics_request | tail -1)"
          [ -n "$rid" ] || { echo "::error::EVAL_RUN_ID missing"; exit 1; }
          echo "rid=$rid" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: oos-evaluation-*
          path: ev
          run-id: ${{ steps.p.outputs.rid }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack
        run: |
          set -euo pipefail
          mkdir -p work
          zcat "$(ls ev/*/state_table_oos.jsonl.gz | head -1)" \
            > work/state_table_oos.jsonl
          wc -l work/state_table_oos.jsonl

      - name: Fixed-side baselines
        run: |
          set -euo pipefail
          python3 scripts/pmus_fixed_side_baseline.py \
            --state work/state_table_oos.jsonl --label OOS \
            | tee FIXED_SIDE_BASELINE.txt

      - name: Previous-window reversal, in-sample descriptive economics
        run: |
          set -euo pipefail
          python3 scripts/pmus_reversal_descriptive.py \
            --state work/state_table_oos.jsonl --label OOS \
            | tee REVERSAL_DESCRIPTIVE.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed-side-baseline-${{ github.run_id }}
          path: |
            FIXED_SIDE_BASELINE.txt
            REVERSAL_DESCRIPTIVE.txt
            analysis/l5/path_economics/fixed_side_baseline_oos.json
            analysis/l5/path_economics/reversal_descriptive_oos.json
          retention-days: 30
          if-no-files-found: error

  study:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read the request
        id: p
        run: |
          set -euo pipefail
          f=.github/path_economics_request
          rid="$(sed -n -E 's/^EVAL_RUN_ID=([0-9]+)[[:space:]]*$/\1/p' "$f" | tail -1)"
          hv="$(sed -n -E 's/^HARVEST_RUN_ID=([0-9]+)[[:space:]]*$/\1/p' "$f" | tail -1)"
          if [ -z "$rid" ]; then
            echo "::error::EVAL_RUN_ID missing"; exit 1
          fi
          if [ -z "$hv" ]; then
            echo "::error::HARVEST_RUN_ID missing"; exit 1
          fi
          echo "rid=$rid" >> "$GITHUB_OUTPUT"
          echo "harvest=$hv" >> "$GITHUB_OUTPUT"
          echo "eval run: $rid"

      - name: Fetch the reconstructed OOS state table
        uses: actions/download-artifact@v4
        with:
          pattern: oos-evaluation-*
          path: ev
          run-id: ${{ steps.p.outputs.rid }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack and record provenance
        run: |
          set -euo pipefail
          gz="$(ls ev/*/state_table_oos.jsonl.gz | head -1)"
          echo "source: $gz"
          sha256sum "$gz"
          mkdir -p work
          zcat "$gz" > work/state_table_oos.jsonl
          wc -l work/state_table_oos.jsonl
          python3 -c "import json;r=json.loads(open('work/state_table_oos.jsonl').readline());print('columns:', sorted(r))"

      - name: Fetch the harvested raw frames (for sub-second studies)
        uses: actions/download-artifact@v4
        with:
          pattern: oos-slice-*
          path: slices
          run-id: ${{ steps.p.outputs.harvest }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive sub-second book and trade rows
        run: |
          set -euo pipefail
          n="$(ls slices/*/rows.jsonl.gz | wc -l)"
          echo "slices: $n"
          if [ "$n" -ne 16 ]; then
            echo "::error::expected 16 slices, got $n"; exit 1
          fi
          zcat slices/*/rows.jsonl.gz > work/oos_ws.jsonl
          wc -l work/oos_ws.jsonl
          # the SAME derivation that was calibrated against the development
          # tape at recall 1.000; not a second implementation
          python3 scripts/pmus_oos_derive_rows.py work/oos_ws.jsonl \
            work/oos_rows.jsonl | tee DERIVE.json
          wc -l work/oos_rows.jsonl

      - name: Run the study
        run: |
          set -euo pipefail
          python3 scripts/pmus_path_economics.py \
            --table work/state_table_oos.jsonl --label OOS \
            | tee PATH_ECONOMICS.log

      - name: BRTI -> PMUS response lag
        run: |
          set -euo pipefail
          python3 scripts/pmus_brti_lag.py \
            --books work/oos_rows.jsonl \
            --state work/state_table_oos.jsonl --label OOS \
            > BRTI_LAG.log 2>&1 || { tail -40 BRTI_LAG.log; exit 1; }
          tail -5 BRTI_LAG.log

      - name: Capture mechanics (taker / maker / hybrid)
        run: |
          set -euo pipefail
          python3 scripts/pmus_capture_mechanics.py \
            --books work/oos_rows.jsonl \
            --state work/state_table_oos.jsonl --label OOS \
            > CAPTURE.log 2>&1 || { tail -40 CAPTURE.log; exit 1; }
          tail -5 CAPTURE.log

      - name: Settlement-lock diagnostic (state table only)
        run: |
          set -euo pipefail
          python3 scripts/pmus_settlement_lock.py \
            --state work/state_table_oos.jsonl --label OOS \
            > SETTLEMENT_LOCK.log 2>&1 || { tail -40 SETTLEMENT_LOCK.log; exit 1; }
          python3 scripts/pmus_settlement_lock_summary.py \
            analysis/l5/path_economics/settlement_lock_oos.json \
            | tee SETTLEMENT_LOCK_SUMMARY.txt

      - name: Addendum headline numbers
        run: |
          set -euo pipefail
          python3 scripts/pmus_addendum_summary.py \
            analysis/l5/path_economics/brti_lag_oos.json \
            analysis/l5/path_economics/capture_mechanics_oos.json \
            | tee ADDENDUM_SUMMARY.txt

      - name: Headline numbers
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/pmus_path_economics_summary.py \
            analysis/l5/path_economics/path_economics_oos.json \
            | tee PATH_ECONOMICS_SUMMARY.txt

      - name: Package
        if: always()
        run: |
          set -euo pipefail
          mkdir -p out
          for f in PATH_ECONOMICS.log PATH_ECONOMICS_SUMMARY.txt \
                   ADDENDUM_SUMMARY.txt DERIVE.json \
                   SETTLEMENT_LOCK_SUMMARY.txt \
                   analysis/l5/path_economics/settlement_lock_oos.json \
                   analysis/l5/path_economics/brti_lag_oos.json \
                   analysis/l5/path_economics/capture_mechanics_oos.json \
                   analysis/l5/path_economics/path_economics_oos.json; do
            if [ -f "$f" ]; then cp -f "$f" out/; fi
          done
          gzip -9 -f out/path_economics_oos.json || true
          ls -l out/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: path-economics-${{ github.run_id }}
          path: out/
          retention-days: 30
          if-no-files-found: error
