name: AWS Gemini q10 V5 recovery readiness

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - deploy/aws/gemini-q10-v5-recovery-readiness.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  FEATURE_BRANCH: feature/gemini-q10-production-executor

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation
      - name: Read trigger
        id: trigger
        shell: bash
        run: |
          set -Eeuo pipefail
          FILE=deploy/aws/gemini-q10-v5-recovery-readiness.trigger
          PIN=$(awk -F= '$1=="PINNED_COMMIT"{print $2}' "$FILE" | tr -d '[:space:]')
          RUN_ID=$(awk -F= '$1=="RUN_ID"{print $2}' "$FILE" | tr -d '[:space:]')
          CLASS=$(awk -F= '$1=="CLASSIFICATION"{print $2}' "$FILE" | tr -d '[:space:]')
          test "$CLASS" = READ_ONLY_GEMINI_Q10_V5_RECOVERY_READINESS
          [[ "$PIN" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUN_ID" =~ ^[A-Za-z0-9_-]+$ ]]
          echo "pin=$PIN" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Validate recovery/dead-man on EC2 without mutation
        shell: bash
        env:
          PIN: ${{ steps.trigger.outputs.pin }}
          RUN_ID: ${{ steps.trigger.outputs.run_id }}
        run: |
          set -Eeuo pipefail
          SHORT=${PIN:0:12}
          REMOTE=$(cat <<EOF
          set -Eeuo pipefail
          REPO=/home/ssm-user/kalshi-arb-bot
          WORK=/opt/arb/gemini-q10-v5-readiness
          STATE=/home/ssm-user/gemini-q10-v5-readiness-state
          IMAGE=arb-gemini-q10-v5-readiness:${SHORT}
          cd "\$REPO"
          git config --global --add safe.directory "\$REPO" || true
          git fetch origin ${FEATURE_BRANCH} >/dev/null
          git cat-file -e "${PIN}^{commit}"
          git merge-base --is-ancestor "${PIN}" origin/${FEATURE_BRANCH}
          git worktree remove --force "\$WORK" >/dev/null 2>&1 || true
          rm -rf "\$WORK" "\$STATE"
          git worktree prune
          git worktree add --detach "\$WORK" "${PIN}" >/dev/null
          docker build -q -t "\$IMAGE" "\$WORK" >/dev/null
          echo V5_RECOVERY_FOCUSED_TESTS_BEGIN
          docker run --rm "\$IMAGE" python -m pytest -q \
            tests/test_btc_spot_toxicity_guard.py \
            tests/test_gemini_prediction_book_cache.py \
            tests/test_gemini_q10_rescue_policy.py \
            tests/test_gemini_q10_production_executor.py \
            tests/test_gemini_q10_production_executor_v2.py \
            tests/test_gemini_q10_production_executor_v5.py \
            tests/test_gemini_q10_v5_recovery_deadman.py
          echo V5_RECOVERY_FOCUSED_TESTS_END
          if [ -f /opt/arb/secrets/gemini-short-crypto.env ]; then ENV_FILE=/opt/arb/secrets/gemini-short-crypto.env; else ENV_FILE=/home/ssm-user/kalshi-arb-bot/.env; fi
          if [ -d /home/ssm-user/gemini-short-crypto-state ]; then BASE_STATE=/home/ssm-user/gemini-short-crypto-state; else BASE_STATE=/opt/arb/gemini-short-crypto-state; fi
          test -f "\$ENV_FILE"
          mkdir -p "\$STATE"
          echo V5_RECOVERY_REAL_ACCOUNT_AUDIT_BEGIN
          docker run --rm --network host --env-file "\$ENV_FILE" \
            -e GEMINI_SHORT_CRYPTO_STATE_DIR=/base_state \
            -e GEMINI_Q10_PRODUCTION_STATE_DIR=/prod_state \
            -e GEMINI_Q10_PRODUCTION_LIVE=NO \
            -e GEMINI_Q10_PRODUCTION_ARM_ID= \
            -e GEMINI_Q10_PRODUCTION_ARM= \
            -e GEMINI_Q10_V5_RECOVERY_ARM= \
            -e GEMINI_Q10_V5_WATCHDOG_ARM= \
            -v "\$BASE_STATE:/base_state:ro" \
            -v "\$STATE:/prod_state" \
            "\$IMAGE" python - <<'PY'
          import asyncio, json
          from src import gemini_q10_v5_recovery as r
          from src import gemini_q10_v5_deadman as d
          from src import gemini_q10_production_executor_v5 as v5
          async def main():
              report, state, _, _ = await r.audit()
              print('V5_RECOVERY_AUDIT='+json.dumps(report.as_dict(),separators=(',',':'),default=str))
              assert report.status == 'CLEAN_NO_OPEN_STATE'
              assert report.account_orders == 0
              assert report.account_positions == 0
              assert not r.recovery_armed()
              assert not d.watchdog_armed()
              dead = await d.check_once()
              print('V5_DEADMAN_AUDIT='+json.dumps(dead,separators=(',',':'),default=str))
              assert dead['status'] == 'IDLE_NO_OPEN_CAMPAIGN'
              await v5.run()
          asyncio.run(main())
          PY
          echo V5_RECOVERY_REAL_ACCOUNT_AUDIT_END
          echo V5_STATE_PATH_SCAN_BEGIN
          find /home/ssm-user /opt/arb -maxdepth 3 -type f -name 'gemini-q10-production-state.json' -print 2>/dev/null | sort | head -50 || true
          echo V5_STATE_PATH_SCAN_END
          EOF
          )
          ENCODED=$(printf '%s' "$REMOTE" | base64 -w0)
          PARAMS=$(jq -nc --arg cmd "echo '$ENCODED' | base64 -d | sudo -u ssm-user bash" '{commands:[$cmd]}')
          CID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB Gemini q10 V5 recovery readiness $RUN_ID" --parameters "$PARAMS" --timeout-seconds 800 --query 'Command.CommandId' --output text)
          for _ in $(seq 1 360); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 2
          done
          RESULT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          OUT=$(jq -r '.Stdout // ""' <<<"$RESULT")
          grep -q 'V5_RECOVERY_AUDIT=' <<<"$OUT"
          grep -q '"account_orders":0' <<<"$OUT"
          grep -q '"account_positions":0' <<<"$OUT"
          grep -q 'V5_DEADMAN_AUDIT=' <<<"$OUT"
