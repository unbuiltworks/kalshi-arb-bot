name: Gemini adaptive maker V5.3 release tests

on:
  push:
    branches: [release/gemini-adaptive-maker-v5-3]
    paths:
      - src/gemini_prediction_depth_cache_v5_3.py
      - src/gemini_adaptive_maker_policy_v5_3.py
      - tests/test_gemini_adaptive_maker_v5_3.py
      - .github/workflows/gemini-adaptive-maker-v5-3-release-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-release-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compile V5.3 modules
        run: |
          python -m py_compile \
            src/gemini_prediction_depth_cache_v5_3.py \
            src/gemini_adaptive_maker_policy_v5_3.py
      - name: Frozen V5.2 suite plus V5.3 adaptive regressions
        run: |
          pytest -q \
            tests/test_btc_spot_toxicity_guard.py \
            tests/test_gemini_prediction_book_cache.py \
            tests/test_gemini_q10_rescue_policy.py \
            tests/test_gemini_liquidity_reward_dynamic_completion_q10.py \
            tests/test_gemini_q10_production_executor.py \
            tests/test_gemini_q10_production_executor_v2.py \
            tests/test_gemini_q10_production_executor_v5.py \
            tests/test_gemini_q10_production_executor_v5_1.py \
            tests/test_gemini_q10_v5_recovery_deadman.py \
            tests/test_gemini_q10_v5_deadman_sidecar.py \
            tests/test_gemini_q10_v5_2.py \
            tests/test_gemini_adaptive_maker_v5_3.py
