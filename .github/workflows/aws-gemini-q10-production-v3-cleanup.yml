name: AWS Gemini q10 production V3 cleanup

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - deploy/aws/gemini-q10-production-v3-cleanup.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Cancel only approved q10 V3 campaign orders and reconcile
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE_SCRIPT=$(cat <<'EOF'
          set -Eeuo pipefail
          if [ -f /opt/arb/secrets/gemini-short-crypto.env ]; then
            ENV_FILE=/opt/arb/secrets/gemini-short-crypto.env
          else
            ENV_FILE=/home/ssm-user/kalshi-arb-bot/.env
          fi
          IMAGE=arb-gemini-q10-production-live:f619ed95e7c8
          docker image inspect "$IMAGE" >/dev/null
          docker run -i --rm --network host --env-file "$ENV_FILE" "$IMAGE" python - <<'PY'
          import asyncio, json
          from src import gemini_short_crypto_btc5m_maker_canary_q1 as base
          from src.gemini_prediction_auth import private_rest_request

          SYMBOL='GEMI-BTC05M2608300230-UP'
          PREFIX='q10p-usr-q10v3-20260829-'

          async def main():
              r=await private_rest_request('POST','/v1/prediction-markets/orders/active',params={'symbol':SYMBOL,'limit':100,'offset':0},timeout=4.0)
              rows=(r.json().get('orders') or []) if r.status_code==200 else []
              ours=[dict(x) for x in rows if str(x.get('clientOrderId') or '').startswith(PREFIX)]
              maker=base.GeminiMakerSession(); await maker.connect()
              actions=[]
              try:
                  for row in ours:
                      actions.append({'cid':row.get('clientOrderId'),'price':row.get('price'),'filled':row.get('filledQuantity'),'cancel':await base._cancel_maker(maker,row=row)})
              finally:
                  await maker.close()
              r2=await private_rest_request('POST','/v1/prediction-markets/orders/active',params={'symbol':SYMBOL,'limit':100,'offset':0},timeout=4.0)
              rows2=(r2.json().get('orders') or []) if r2.status_code==200 else []
              remain=[{'cid':x.get('clientOrderId'),'price':x.get('price'),'filled':x.get('filledQuantity')} for x in rows2 if str(x.get('clientOrderId') or '').startswith(PREFIX)]
              print('Q10_V3_EMERGENCY_CLEANUP='+json.dumps({'classification':'LIVE_SAFETY_CLEANUP_NOT_NEW_CAMPAIGN','symbol':SYMBOL,'active_before':[x.get('clientOrderId') for x in ours],'actions':actions,'active_after':remain},default=str,separators=(',',':')))
          asyncio.run(main())
          PY
          EOF
          )
          ENCODED=$(printf '%s' "$REMOTE_SCRIPT" | base64 -w0)
          PARAMETERS=$(jq -nc --arg cmd "echo '$ENCODED' | base64 -d | sudo -u ssm-user bash" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB q10 V3 bounded safety cleanup" --parameters "$PARAMETERS" --timeout-seconds 420 --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" || true
          RESULT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          grep -q 'Q10_V3_EMERGENCY_CLEANUP=' <<<"$(jq -r '.Stdout // ""' <<<"$RESULT")"
