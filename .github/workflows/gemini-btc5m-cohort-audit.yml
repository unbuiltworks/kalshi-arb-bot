# READ-ONLY settlement/cash audit of BTC5m canary cohort 1.
#
# IT SENDS NO ORDERS, and that is proved before any secret is in scope: an
# AST guard rejects the audit module if it can reach a mutation path or an
# order transport at all. The account reads it does make -- the contract
# object, positions/settled?withCashOuts=true, our own durable ledger -- are
# POST-authenticated reads on this venue, not mutations.
#
# It cannot disturb the recorder or the canary: its own concurrency group.
name: gemini-btc5m-cohort-audit

on:
  push:
    paths:
      - '.github/btc5m_audit_request'

concurrency:
  group: gemini-btc5m-cohort-audit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: python -m pip install --quiet httpx websockets pytest python-dotenv

      - name: Prove the audit has NO order path
        run: |
          python - <<'PY'
          import ast
          src = open("scripts/gemini_btc5m_cohort_audit.py",
                     encoding="utf-8").read()
          tree = ast.parse(src)
          names = set()
          for n in ast.walk(tree):
              if isinstance(n, ast.Attribute):
                  names.add(n.attr)
              elif isinstance(n, ast.Name):
                  names.add(n.id)
          banned = {"place", "attempt", "submit", "submit_sell", "cancel",
                    "order_place", "build_sell"}
          hit = sorted(banned & names)
          assert not hit, "the audit can reach a write path: %r" % hit
          imports = set()
          for n in ast.walk(tree):
              if isinstance(n, ast.ImportFrom) and n.module:
                  imports.add(n.module)
              elif isinstance(n, ast.Import):
                  for al in n.names:
                      imports.add(al.name)
          for bad in ("src.gemini_execution.transport",
                      "src.gemini_execution.sell_path"):
              assert bad not in imports, bad
          # the string of a mutation path must not appear either
          for p in ("/v1/prediction-markets/order",):
              assert p not in src, p
          print("READ-ONLY: no order transport, no mutation path, no "
                "write-capable call name")
          PY

      - name: Local legs only (credential-free)
        run: python -m scripts.gemini_btc5m_cohort_audit --no-venue
             --out /tmp/local_only.json

      - name: Audit -- settled outcome and the cashOuts cash leg
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_SECRET: ${{ secrets.GEMINI_API_SECRET }}
        run: python -m scripts.gemini_btc5m_cohort_audit
             --out analysis/gemini/btc5m_canary/cohort1_audit.json

      - name: Commit the audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- analysis/gemini/btc5m_canary/cohort1_audit.json
          if git diff --cached --quiet; then
            echo "no new audit artifact"; exit 0
          fi
          if git diff --cached --name-only \
               | grep -qvE '^analysis/gemini/btc5m_canary/cohort1_audit\.json$'; then
            echo "::error::refusing to commit outside the audit artifact"
            git diff --cached --name-only; exit 1
          fi
          git commit -m "evidence(gemini): btc5m cohort 1 settlement/cash audit [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:research/gemini-btc5m-information-edge; then exit 0; fi
            git fetch origin research/gemini-btc5m-information-edge
            git rebase FETCH_HEAD || { git rebase --abort; exit 1; }
            sleep $((attempt * 3))
          done
          echo "::error::could not push the audit"; exit 1
