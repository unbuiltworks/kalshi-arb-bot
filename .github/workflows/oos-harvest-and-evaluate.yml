# OOS harvest and the ONE-SHOT frozen evaluation of STATE_CONDITIONAL_PAIR_V1.
#
# WHY THIS EXISTS. Two hosts this work needs are unreachable from the research
# container: Railway's volume transport is SFTP on port 22, and the venue
# gateway (gateway.polymarket.us), which publishes the BRTI 1-second index
# every state-table row is built from, is denied by that container's network
# policy. A GitHub runner reaches both, so retrieval and replay happen here and
# only small derived files travel back.
#
# WHY IT IS PUSH-TRIGGERED. This workflow lives only on a research branch, and
# GitHub offers workflow_dispatch only for workflows present on the default
# branch. Gating a push trigger on .github/oos_request keeps the whole thing on
# the branch without touching main, and ordinary pushes to the branch do not
# start it.
#
# READ-ONLY WITH RESPECT TO RAILWAY. The only Railway operations anywhere in
# this file are `files list` and `files download`. There is no deploy,
# redeploy, restart, variable change, domain change, volume
# mount/detach/resize or Railway agent call, so the healthy
# pmus-ws-evidence-recorder cannot be disturbed by running it. The recorder
# keeps collecting throughout and no second service mounts its volume.
#
# NOTHING IS FITTED. `harvest` retrieves and filters. `evaluate` replays, then
# reads the FROZEN coefficients out of the committed development artifact
# (2939ee67) and runs the staged evaluator (c31a5e32) unchanged. No threshold,
# sizing, window-selection or controller parameter is an input anywhere --
# there is deliberately nowhere to put one.
#
# WINDOW SELECTION IS MECHANICAL. Every hourly part after the frozen
# development cutoff is harvested, all 46 of them, and the
# OOS/DEVELOPMENT split is READ from DEV_CUTOFF_SLUG in
# scripts/pmus_oos_extract_and_inventory.py. No window is chosen, dropped or
# reordered by hand, and a short harvest FAILS rather than scoring part of the
# tape.
#
# THE EVALUATION RUNS ONCE. The stages are separate requests on purpose: the
# tape is harvested and its completeness checked first, and STAGE=evaluate is
# requested a single time against one named harvest run.
name: oos-harvest-and-evaluate

on:
  push:
    branches: ['claude/l5-pmus-economic-results-7c116e']
    paths: ['.github/oos_request']

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.p.outputs.stage }}
      harvest_run_id: ${{ steps.p.outputs.harvest_run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the request
        id: p
        run: |
          set -euo pipefail
          f=.github/oos_request
          # Anchored and fully constrained on BOTH ends: the request file also
          # explains itself in prose, and a loose '^STAGE=' once matched a
          # sentence instead of the directive.
          stage="$(sed -n -E 's/^STAGE=(calibrate|harvest|evaluate)[[:space:]]*$/\1/p' \
                   "$f" | tail -1)"
          rid="$(sed -n -E 's/^HARVEST_RUN_ID=([0-9]*)[[:space:]]*$/\1/p' \
                 "$f" | tail -1)"
          case "$stage" in
            calibrate|harvest|evaluate) ;;
            *) echo "::error::STAGE must be calibrate, harvest or evaluate," \
                    "got '$stage'"
               exit 1 ;;
          esac
          if [ "$stage" = evaluate ] && [ -z "$rid" ]; then
            echo "::error::STAGE=evaluate needs HARVEST_RUN_ID"; exit 1
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "harvest_run_id=$rid" >> "$GITHUB_OUTPUT"
          echo "stage=$stage harvest_run_id=$rid"

  calibrate:
    needs: plan
    if: ${{ needs.plan.outputs.stage == 'calibrate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SSH_PRIVATE_KEY_B64: ${{ secrets.RAILWAY_SSH_PRIVATE_KEY_B64 }}
      PROJECT_ID: 50fb7357-e2bc-4d04-a49e-71eb5d73b0d1
      ENVIRONMENT_ID: f3642d27-26dc-4e21-9170-bc76290c076f
      SERVICE_ID: 71b6ea99-ea6a-4b20-9602-fa873721ed35
      REMOTE_DIR: /state/pmus-ws/raw
      RAILWAY_CLI_VERSION: 5.63.1
      # The volume's 12 GiB retention has already swept every 2026-09-30
      # part -- the oldest surviving part is pmus_ws_20261001_14 -- so the
      # development tape's seven 09-30 windows cannot be re-derived at all.
      # Its eighth window, 2026-10-02-0400z, is the ONLY overlap that still
      # exists. The 03 part comes along because the features need 300s of
      # trailing history before the window opens.
      CAL_FILES: 'pmus_ws_20261002_03.jsonl,pmus_ws_20261002_04.jsonl'
    steps:
      - name: Fail closed if required CI secrets are absent
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set."; exit 1
          fi
          if [ -z "${RAILWAY_SSH_PRIVATE_KEY_B64:-}" ]; then
            echo "::error::RAILWAY_SSH_PRIVATE_KEY_B64 secret is not set."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the PINNED Railway CLI and assert the version
        run: |
          set -euo pipefail
          npm install -g "@railway/cli@$RAILWAY_CLI_VERSION"
          got="$(railway --version | tr -d '\r')"
          echo "installed: $got"
          case "$got" in
            *"$RAILWAY_CLI_VERSION"*) ;;
            *) echo "::error::CLI version mismatch"; exit 1 ;;
          esac

      - name: Prepare dedicated Railway SSH identity
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s' "$RAILWAY_SSH_PRIVATE_KEY_B64" \
            | base64 --decode > ~/.ssh/l5_volume_export
          chmod 600 ~/.ssh/l5_volume_export
          ssh-keygen -y -f ~/.ssh/l5_volume_export \
            > ~/.ssh/l5_volume_export.pub
          chmod 644 ~/.ssh/l5_volume_export.pub

      - name: Reuse frames already retrieved, when a run is named
        if: ${{ needs.plan.outputs.harvest_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: oos-calibration-*
          path: reuse
          run-id: ${{ needs.plan.outputs.harvest_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Adopt the reused frames
        if: ${{ needs.plan.outputs.harvest_run_id != '' }}
        run: |
          set -euo pipefail
          mkdir -p cal
          # The frames are the recorder's own bytes and the parts are immutable,
          # so reusing them is the same read, not a different one -- and it
          # spares the recorder's volume a repeat transfer.
          cp "$(ls reuse/*/ws.jsonl | head -1)" cal/ws.jsonl
          wc -l cal/ws.jsonl

      - name: Read the overlap parts and show the REAL frame shape
        if: ${{ needs.plan.outputs.harvest_run_id == '' }}
        run: |
          set -euo pipefail
          mkdir -p cal
          IFS=',' read -ra NAMES <<< "$CAL_FILES"
          for raw in "${NAMES[@]}"; do
            name="$(echo "$raw" | xargs)"
            [ -n "$name" ] || continue
            ok=0
            for attempt in 1 2 3 4; do
              if railway service files \
                   --service "$SERVICE_ID" \
                   --environment "$ENVIRONMENT_ID" \
                   --project "$PROJECT_ID" \
                   download "$REMOTE_DIR/$name" part.jsonl < /dev/null; then
                ok=1; break
              fi
              echo "read attempt $attempt failed; retrying"
              rm -f part.jsonl; sleep $((attempt * 20))
            done
            [ "$ok" -eq 1 ] || { echo "::error::could not read $name"; exit 1; }
            echo "$name bytes=$(stat -c%s part.jsonl) lines=$(wc -l < part.jsonl)"
            echo "::group::real raw frame shape ($name)"
            # The documented claim was that these are book/trade rows. Print
            # what they actually are, so the record shows it rather than
            # asserting it.
            python3 scripts/pmus_oos_frame_shape.py part.jsonl 2
            echo "::endgroup::"
            python3 scripts/pmus_oos_reduce_part.py part.jsonl rows.jsonl
            cat rows.jsonl >> cal/ws.jsonl
            rm -f part.jsonl rows.jsonl
          done
          wc -l cal/ws.jsonl

      - name: Derive rows and CALIBRATE against the development tape
        run: |
          set -euo pipefail
          python3 scripts/pmus_oos_derive_rows.py cal/ws.jsonl \
            cal/derived.jsonl | tee cal/DERIVE.json
          python3 scripts/pmus_oos_calibrate_derivation.py cal/derived.jsonl \
            | tee cal/CALIBRATION.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oos-calibration-${{ github.run_id }}
          path: cal/
          retention-days: 14
          if-no-files-found: error

  harvest:
    needs: plan
    if: ${{ needs.plan.outputs.stage == 'harvest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # 16 concurrent reads timed out 6 of 16 chunks on "Failed to initialize
      # SFTP session: Timeout". The volume serves one SSH endpoint, so the
      # concurrency is the cause; 6 at a time still finishes well inside the
      # job timeout and does not lean on the retry loop to succeed.
      max-parallel: 6
      matrix:
        chunk:
          - {id: '00', files: 'pmus_ws_20261002_21.jsonl,pmus_ws_20261002_22.jsonl,pmus_ws_20261002_23.jsonl'}
          - {id: '01', files: 'pmus_ws_20261003_00.jsonl,pmus_ws_20261003_01.jsonl,pmus_ws_20261003_02.jsonl'}
          - {id: '02', files: 'pmus_ws_20261003_03.jsonl,pmus_ws_20261003_04.jsonl,pmus_ws_20261003_05.jsonl'}
          - {id: '03', files: 'pmus_ws_20261003_06.jsonl,pmus_ws_20261003_07.jsonl,pmus_ws_20261003_08.jsonl'}
          - {id: '04', files: 'pmus_ws_20261003_09.jsonl,pmus_ws_20261003_10.jsonl,pmus_ws_20261003_11.jsonl'}
          - {id: '05', files: 'pmus_ws_20261003_12.jsonl,pmus_ws_20261003_13.jsonl,pmus_ws_20261003_14.jsonl'}
          - {id: '06', files: 'pmus_ws_20261003_15.jsonl,pmus_ws_20261003_16.jsonl,pmus_ws_20261003_17.jsonl'}
          - {id: '07', files: 'pmus_ws_20261003_18.jsonl,pmus_ws_20261003_19.jsonl,pmus_ws_20261003_20.jsonl'}
          - {id: '08', files: 'pmus_ws_20261003_21.jsonl,pmus_ws_20261003_22.jsonl,pmus_ws_20261003_23.jsonl'}
          - {id: '09', files: 'pmus_ws_20261004_00.jsonl,pmus_ws_20261004_01.jsonl,pmus_ws_20261004_02.jsonl'}
          - {id: '10', files: 'pmus_ws_20261004_03.jsonl,pmus_ws_20261004_04.jsonl,pmus_ws_20261004_05.jsonl'}
          - {id: '11', files: 'pmus_ws_20261004_06.jsonl,pmus_ws_20261004_07.jsonl,pmus_ws_20261004_08.jsonl'}
          - {id: '12', files: 'pmus_ws_20261004_09.jsonl,pmus_ws_20261004_10.jsonl,pmus_ws_20261004_11.jsonl'}
          - {id: '13', files: 'pmus_ws_20261004_12.jsonl,pmus_ws_20261004_13.jsonl,pmus_ws_20261004_14.jsonl'}
          - {id: '14', files: 'pmus_ws_20261004_15.jsonl,pmus_ws_20261004_16.jsonl,pmus_ws_20261004_17.jsonl'}
          - {id: '15', files: 'pmus_ws_20261004_18.jsonl'}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SSH_PRIVATE_KEY_B64: ${{ secrets.RAILWAY_SSH_PRIVATE_KEY_B64 }}
      PROJECT_ID: 50fb7357-e2bc-4d04-a49e-71eb5d73b0d1
      ENVIRONMENT_ID: f3642d27-26dc-4e21-9170-bc76290c076f
      # pmus-ws-evidence-recorder. READ ONLY; never redeployed here.
      SERVICE_ID: 71b6ea99-ea6a-4b20-9602-fa873721ed35
      REMOTE_DIR: /state/pmus-ws/raw
      RAILWAY_CLI_VERSION: 5.63.1
      CHUNK_FILES: ${{ matrix.chunk.files }}
    steps:
      - name: Fail closed if required CI secrets are absent
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set."; exit 1
          fi
          if [ -z "${RAILWAY_SSH_PRIVATE_KEY_B64:-}" ]; then
            echo "::error::RAILWAY_SSH_PRIVATE_KEY_B64 secret is not set."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the PINNED Railway CLI and assert the version
        run: |
          set -euo pipefail
          npm install -g "@railway/cli@$RAILWAY_CLI_VERSION"
          got="$(railway --version | tr -d '\r')"
          echo "installed: $got"
          case "$got" in
            *"$RAILWAY_CLI_VERSION"*) ;;
            *) echo "::error::CLI version mismatch: wanted" \
                    "$RAILWAY_CLI_VERSION, got '$got'"; exit 1 ;;
          esac

      - name: Prepare dedicated Railway SSH identity
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s' "$RAILWAY_SSH_PRIVATE_KEY_B64" \
            | base64 --decode > ~/.ssh/l5_volume_export
          chmod 600 ~/.ssh/l5_volume_export
          ssh-keygen -y -f ~/.ssh/l5_volume_export \
            > ~/.ssh/l5_volume_export.pub
          chmod 644 ~/.ssh/l5_volume_export.pub
          ssh-keygen -lf ~/.ssh/l5_volume_export.pub | awk '{print $2, $4}'

      - name: Read this chunk and reduce each part to BTC 15m rows
        run: |
          set -euo pipefail
          mkdir -p slice
          : > slice/MANIFEST.tsv
          IFS=',' read -ra NAMES <<< "$CHUNK_FILES"
          for raw in "${NAMES[@]}"; do
            name="$(echo "$raw" | xargs)"
            [ -n "$name" ] || continue
            case "$name" in
              */*|..*) echo "::error::refusing suspicious name"; exit 1 ;;
            esac
            echo "::group::$name"
            # The ONLY Railway operation: a read. Retried for transport
            # flakes; a retry re-reads the same immutable part, so a retry
            # cannot vary the data.
            ok=0
            for attempt in 1 2 3 4; do
              if railway service files \
                   --service "$SERVICE_ID" \
                   --environment "$ENVIRONMENT_ID" \
                   --project "$PROJECT_ID" \
                   download "$REMOTE_DIR/$name" part.jsonl < /dev/null; then
                ok=1; break
              fi
              echo "read attempt $attempt failed; retrying"
              rm -f part.jsonl
              sleep $((attempt * 20))
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::could not read $name after 4 attempts"; exit 1
            fi
            bytes="$(stat -c%s part.jsonl)"
            if [ "$bytes" -le 0 ]; then
              echo "::error::read 0 bytes for $name"; exit 1
            fi
            sha="$(sha256sum part.jsonl | awk '{print $1}')"
            lines="$(wc -l < part.jsonl)"
            python3 scripts/pmus_oos_reduce_part.py part.jsonl rows.jsonl \
              > reduce.json
            cat reduce.json
            keptn="$(wc -l < rows.jsonl)"
            printf '%s\t%s\t%s\t%s\t%s\n' \
              "$name" "$bytes" "$lines" "$keptn" "$sha" >> slice/MANIFEST.tsv
            echo "$name bytes=$bytes lines=$lines kept=$keptn"
            cat rows.jsonl >> slice/rows.jsonl
            # reclaim the disk before the next part is read
            rm -f part.jsonl rows.jsonl reduce.json
            echo "::endgroup::"
          done
          gzip -9 slice/rows.jsonl
          ls -l slice/
          cat slice/MANIFEST.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: oos-slice-${{ matrix.chunk.id }}
          path: slice/
          retention-days: 7
          if-no-files-found: error

  evaluate:
    needs: plan
    if: ${{ needs.plan.outputs.stage == 'evaluate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect every harvested slice
        uses: actions/download-artifact@v4
        with:
          pattern: oos-slice-*
          path: slices
          run-id: ${{ needs.plan.outputs.harvest_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge the slices; a SHORT harvest fails rather than scoring
        run: |
          set -euo pipefail
          # `pmus_oos_extract_and_inventory` globs every *.jsonl in
          # data/pmus_ws_tape_oos, so that directory must hold ONLY the derived
          # tape. Raw frames and the post-cutoff restriction live in work/.
          mkdir -p data/pmus_ws_tape_oos work
          cat slices/*/MANIFEST.tsv | sort -u > HARVEST_MANIFEST.tsv
          cat HARVEST_MANIFEST.tsv
          n="$(wc -l < HARVEST_MANIFEST.tsv)"
          echo "parts harvested: $n"
          if [ "$n" -ne 46 ]; then
            echo "::error::expected 46 parts, got $n --" \
                 "refusing to score a partial tape"
            exit 1
          fi
          zcat slices/*/rows.jsonl.gz > work/oos_ws.jsonl
          wc -l work/oos_ws.jsonl

      - name: Derive book/trade rows from the raw frames
        run: |
          set -euo pipefail
          python3 scripts/pmus_oos_derive_rows.py work/oos_ws.jsonl \
            data/pmus_ws_tape_oos/oos_tape.jsonl | tee OOS_DERIVE.json

      - name: Inventory and completeness, under the established gate
        run: |
          set -euo pipefail
          python3 scripts/pmus_oos_extract_and_inventory.py --inventory \
            | tee OOS_INVENTORY_SUMMARY.txt

      - name: Restrict to post-cutoff windows (cutoff read, not retyped)
        run: |
          set -euo pipefail
          python3 scripts/pmus_oos_strict_tape.py \
            data/pmus_ws_tape_oos/oos_tape.jsonl \
            work/oos_strict.jsonl | tee OOS_SPLIT.json

      - name: Build the OOS state table
        run: |
          set -euo pipefail
          python3 scripts/pmus_state_table.py \
            --tape work/oos_strict.jsonl --label OOS \
            | tee state_table_oos.log
          wc -l analysis/l5/state_conditional/state_table_oos.jsonl

      - name: Run the FROZEN evaluation, exactly once
        run: |
          set -euo pipefail
          python3 scripts/pmus_state_conditional_oos.py \
            --table analysis/l5/state_conditional/state_table_oos.jsonl \
            --label OOS | tee OOS_EVALUATION.log

      - name: Package the derived results
        if: always()
        run: |
          set -euo pipefail
          mkdir -p out
          for f in HARVEST_MANIFEST.tsv OOS_INVENTORY_SUMMARY.txt \
                   OOS_SPLIT.json OOS_DERIVE.json state_table_oos.log OOS_EVALUATION.log \
                   analysis/l5/oos/OOS_INVENTORY.json \
                   analysis/l5/state_conditional/market_terms_oos.json \
                   analysis/l5/state_conditional/state_conditional_v1_oos.json \
                   analysis/l5/state_conditional/state_table_oos.jsonl; do
            if [ -f "$f" ]; then cp -f "$f" out/; fi
          done
          gzip -9 out/state_table_oos.jsonl || true
          ls -l out/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oos-evaluation-${{ github.run_id }}
          path: out/
          retention-days: 30
          if-no-files-found: error
