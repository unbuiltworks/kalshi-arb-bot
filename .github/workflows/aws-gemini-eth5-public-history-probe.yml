name: AWS Gemini ETH5 public history probe

on:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/gemini-eth5-public-history-probe.trigger

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation
      - name: Probe public ETH5 trade history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          BASE = "https://api.gemini.com"
          EVENT_RE = re.compile(r"^ETH05M\d{10}$")

          def get_json(path, params=None):
              url = BASE + path
              if params:
                  url += "?" + urllib.parse.urlencode(params, doseq=True)
              req = urllib.request.Request(url, headers={"User-Agent": "arb-eth5-public-history-probe/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      return resp.status, json.load(resp)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")[:1000]
                  try:
                      payload = json.loads(body)
                  except Exception:
                      payload = {"raw": body}
                  return exc.code, payload

          def extract_symbols(payload):
              out = []
              rows = payload.get("data") or [] if isinstance(payload, dict) else []
              for row in rows:
                  if not isinstance(row, dict):
                      continue
                  ticker = str(row.get("ticker") or "").upper()
                  if not EVENT_RE.match(ticker):
                      continue
                  for contract in row.get("contracts") or []:
                      if not isinstance(contract, dict):
                          continue
                      symbol = str(contract.get("instrumentSymbol") or "")
                      if symbol.upper().endswith("-UP"):
                          out.append({
                              "ticker": ticker,
                              "symbol": symbol,
                              "event_status": row.get("status"),
                              "market_state": contract.get("marketState"),
                              "expiry": contract.get("expiryDate") or row.get("expiryDate"),
                          })
              return out

          active_status, active = get_json(
              "/v1/prediction-markets/events",
              [("status", "active"), ("category", "Crypto"), ("limit", "500"), ("offset", "0")],
          )
          settled_status, settled = get_json(
              "/v1/prediction-markets/events/recently-settled",
              [("category", "Crypto"), ("limit", "500"), ("offset", "0")],
          )
          symbols = extract_symbols(active) + extract_symbols(settled)
          seen = set()
          unique = []
          for row in symbols:
              if row["symbol"] in seen:
                  continue
              seen.add(row["symbol"])
              unique.append(row)

          probes = []
          total_trades = 0
          for row in unique[:100]:
              encoded = urllib.parse.quote(row["symbol"], safe="")
              status, trades = get_json(f"/v1/trades/{encoded}", [("limit_trades", "500")])
              item = {**row, "http_status": status}
              if status == 200 and isinstance(trades, list):
                  item["trade_count"] = len(trades)
                  item["buy_count"] = sum(1 for t in trades if isinstance(t, dict) and t.get("type") == "buy")
                  item["sell_count"] = sum(1 for t in trades if isinstance(t, dict) and t.get("type") == "sell")
                  item["newest_timestampms"] = trades[0].get("timestampms") if trades else None
                  item["oldest_timestampms"] = trades[-1].get("timestampms") if trades else None
                  item["sample_keys"] = sorted(trades[0].keys()) if trades and isinstance(trades[0], dict) else []
                  total_trades += len(trades)
              else:
                  item["trade_count"] = 0
                  item["error"] = trades
              probes.append(item)

          result = {
              "type": "GEMINI_ETH5_PUBLIC_HISTORY_PROBE_V1",
              "classification": "READ_ONLY_PUBLIC_MARKET_DATA",
              "order_entry": False,
              "credentials_loaded": False,
              "observed_at": datetime.now(timezone.utc).isoformat(),
              "active_events_http_status": active_status,
              "settled_events_http_status": settled_status,
              "eth5_symbols_found": len(unique),
              "eth5_symbols_with_history": sum(1 for p in probes if p.get("http_status") == 200),
              "eth5_public_trades_returned": total_trades,
              "probes": probes,
          }
          print(json.dumps(result, indent=2, sort_keys=True))
          if active_status != 200:
              raise SystemExit("active event discovery failed")
          PY
