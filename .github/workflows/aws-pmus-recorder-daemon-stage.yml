name: AWS PMUS read-only recorder daemon stage

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - deploy/aws/pmus-recorder-daemon-stage.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  RECORDER_REF: d3614aed26b88e791bfd0abdcfc9395e6aa92969

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RECORDER_REF }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install isolated read-only recorder as systemd service
        shell: bash
        run: |
          set -Eeuo pipefail
          REC_B64=$(base64 -w0 src/pmus_ws_evidence_recorder.py)
          COL_B64=$(base64 -w0 src/pmus_sports_collector.py)
          REMOTE=$(cat <<EOF
          set -Eeuo pipefail
          APP=/home/ssm-user/l5-pmus-ws
          STATE=/home/ssm-user/l5-pmus-ws-state
          VENV=/home/ssm-user/l5-pmus-ws-venv
          CREDS=/home/ssm-user/l5-pmus-q1-credentials.env
          test -f "\$CREDS" && test "\$(stat -c %a "\$CREDS")" = 600
          install -d -o ssm-user -g ssm-user "\$APP/src" "\$STATE"
          printf '%s' '$REC_B64' | base64 -d > "\$APP/src/pmus_ws_evidence_recorder.py"
          printf '%s' '$COL_B64' | base64 -d > "\$APP/src/pmus_sports_collector.py"
          touch "\$APP/src/__init__.py"
          chown -R ssm-user:ssm-user "\$APP" "\$STATE"
          chmod 600 "\$APP/src/pmus_ws_evidence_recorder.py" "\$APP/src/pmus_sports_collector.py"
          if [[ ! -x "\$VENV/bin/python" ]]; then
            sudo -u ssm-user python3 -m venv "\$VENV"
          fi
          sudo -u ssm-user "\$VENV/bin/pip" install --disable-pip-version-check --no-cache-dir 'cryptography>=42' 'websockets>=14,<17' >/dev/null
          cat > /etc/systemd/system/l5-pmus-recorder.service <<'UNIT'
          [Unit]
          Description=L5 PMUS authenticated read-only recorder/gate
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=ssm-user
          Group=ssm-user
          WorkingDirectory=/home/ssm-user/l5-pmus-ws
          EnvironmentFile=/home/ssm-user/l5-pmus-q1-credentials.env
          Environment=PYTHONPATH=/home/ssm-user/l5-pmus-ws
          Environment=PMUS_SERVICE_ROLE=ws-recorder
          Environment=PMUS_WS_ROOT=/home/ssm-user/l5-pmus-ws-state
          Environment=PMUS_WS_LEAGUES=all
          Environment=PMUS_WS_MAX_MARKETS=40
          Environment=PMUS_WS_DISCOVERY_SECONDS=300
          Environment=PMUS_WS_STATUS_EVERY_SECONDS=30
          ExecStart=/home/ssm-user/l5-pmus-ws-venv/bin/python -m src.pmus_ws_evidence_recorder
          Restart=always
          RestartSec=2
          NoNewPrivileges=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now l5-pmus-recorder.service
          sleep 8
          test "\$(systemctl is-active l5-pmus-recorder.service)" = active
          echo PMUS_AWS_RECORDER_ACTIVE=true
          echo PMUS_AWS_RECORDER_REF=${RECORDER_REF}
          echo PMUS_AWS_RECORDER_READ_ONLY=true
          echo PMUS_AWS_RECORDER_STATE=\$STATE
          journalctl -u l5-pmus-recorder.service --no-pager -n 12 | sed -E 's/(X-PM-[A-Za-z-]+)[=:][^ ,}]+/\1=REDACTED/g'
          EOF
          )
          ENC=$(printf '%s' "$REMOTE" | base64 -w0)
          PARAMS=$(jq -nc --arg cmd "echo '$ENC' | base64 -d | bash" '{commands:[$cmd]}')
          CID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment 'L5 PMUS read-only recorder daemon stage' --parameters "$PARAMS" --timeout-seconds 300 --query 'Command.CommandId' --output text)
          for _ in $(seq 1 150); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 2
          done
          RESULT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          OUT=$(jq -r '.Stdout' <<<"$RESULT")
          grep -q 'PMUS_AWS_RECORDER_ACTIVE=true' <<<"$OUT"
          grep -q 'PMUS_AWS_RECORDER_READ_ONLY=true' <<<"$OUT"
