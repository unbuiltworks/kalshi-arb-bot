name: AWS Gemini selective maker V5.6 public diagnostic

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - .github/workflows/aws-gemini-selective-v5-6-public-diagnostic.yml

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  RELEASE_BRANCH: release/gemini-selective-maker-v5-6
  REQUIRED_RELEASE_COMMIT: f33223f0df773c8e158c69877e0621bb88868fac

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Observe live BTC15m tape and safe selective plan without credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE=$(cat <<EOF
          set -Eeuo pipefail
          REPO=/home/ssm-user/kalshi-arb-bot
          WORK=/opt/arb/gemini-selective-v5-6-public
          IMAGE=arb-gemini-selective-v5-6-public:${REQUIRED_RELEASE_COMMIT:0:12}
          cd "\$REPO"
          git config --global --add safe.directory "\$REPO" || true
          git fetch origin ${RELEASE_BRANCH} >/dev/null
          ACTUAL=\$(git rev-parse origin/${RELEASE_BRANCH})
          test "\$ACTUAL" = "${REQUIRED_RELEASE_COMMIT}"
          git worktree remove --force "\$WORK" >/dev/null 2>&1 || true
          rm -rf "\$WORK"
          git worktree prune
          git worktree add --detach "\$WORK" "\$ACTUAL" >/dev/null
          test "\$(git -C "\$WORK" rev-parse HEAD)" = "${REQUIRED_RELEASE_COMMIT}"
          docker build -q -t "\$IMAGE" "\$WORK" >/dev/null

          timeout 660s docker run --rm --network host \
            -e GEMINI_Q10_V5_MAX_RESCUE_LOSS_USD=0.30 \
            -e GEMINI_Q10_V5_MAX_CAMPAIGN_LOSS_USD=1.00 \
            "\$IMAGE" python - <<'PY'
          import asyncio, json, time
          from src import gemini_selective_maker_v5_6 as v56
          from src.gemini_prediction_depth_cache_v5_3 import GeminiDepth5Cache

          async def main():
              deadline=time.monotonic()+620
              seen=[]
              while time.monotonic()<deadline:
                  event=await v56.discover_btc15m()
                  if event is None:
                      await asyncio.sleep(1); continue
                  tape=v56.GeminiTradeTape30(event.symbol)
                  cache=GeminiDepth5Cache(event.symbol,stale_ms=750)
                  stop_t=asyncio.Event(); stop_b=asyncio.Event()
                  tt=asyncio.create_task(tape.run(stop_t)); bt=asyncio.create_task(cache.run(stop_b))
                  try:
                      ready=await tape.wait_ready(timeout=max(1,min(180,event.seconds_to_expiry-v56.STOP_NEW_SECONDS)))
                      if not ready:
                          seen.append({'ticker':event.ticker,'reason':'NO_30_TRADE_TAPE','tape':tape.snapshot()})
                          await asyncio.sleep(0.2); continue
                      while event.seconds_to_expiry>v56.STOP_NEW_SECONDS and time.monotonic()<deadline:
                          try:
                              snap=await cache.wait_fresh(timeout=1,max_age_ms=500)
                          except Exception as exc:
                              seen.append({'ticker':event.ticker,'reason':'DEPTH_NOT_FRESH','error':type(exc).__name__})
                              await asyncio.sleep(.1); continue
                          plan=v56.select_safe_plan(event,snap=snap,tape=tape)
                          if plan is not None:
                              out={
                                'classification':'READ_ONLY_LIVE_PUBLIC_SAFE_SELECTIVE_PLAN',
                                'release_commit':'${REQUIRED_RELEASE_COMMIT}',
                                'ticker':event.ticker,'symbol':event.symbol,
                                'seconds_to_expiry':round(event.seconds_to_expiry,3),
                                'tape':tape.snapshot(),
                                'book':{'bids':[[str(p),str(q)] for p,q in snap.bids],
                                        'asks':[[str(p),str(q)] for p,q in snap.asks],
                                        'age_ms':round(snap.age_ms,3),'sequence':snap.sequence},
                                'plan':plan.as_dict(),
                                'campaign_loss_limit':'1.00','rescue_loss_limit':'0.30',
                                'order_entry':False,'credentials_used':False,'realized_pnl':0,
                              }
                              print('V5_6_PUBLIC_DIAGNOSTIC='+json.dumps(out,separators=(',',':'),default=str))
                              print('V5_6_PUBLIC_DIAGNOSTIC_COMPLETE')
                              return
                          await asyncio.sleep(.1)
                      seen.append({'ticker':event.ticker,'reason':'NO_SAFE_SIGNAL_BEFORE_STOP','tape':tape.snapshot()})
                  finally:
                      stop_t.set(); stop_b.set(); tt.cancel(); bt.cancel()
                      await asyncio.gather(tt,bt,return_exceptions=True)
              print('V5_6_PUBLIC_DIAGNOSTIC='+json.dumps({
                'classification':'READ_ONLY_NO_SAFE_SIGNAL_WITHIN_BOUND',
                'release_commit':'${REQUIRED_RELEASE_COMMIT}','seen':seen[-8:],
                'order_entry':False,'credentials_used':False,'realized_pnl':0},separators=(',',':')))
              print('V5_6_PUBLIC_DIAGNOSTIC_COMPLETE')
          asyncio.run(main())
          PY
          EOF
          )
          ENC=$(printf '%s' "$REMOTE" | base64 -w0)
          PARAMS=$(jq -nc --arg cmd "echo '$ENC' | base64 -d | sudo -u ssm-user bash" '{commands:[$cmd]}')
          CID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "ARB V5.6 public BTC15m selective diagnostic" --parameters "$PARAMS" --timeout-seconds 760 \
            --query 'Command.CommandId' --output text)
          for _ in $(seq 1 380); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 2
          done
          RESULT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          OUT=$(jq -r '.Stdout // ""' <<<"$RESULT")
          grep -q 'V5_6_PUBLIC_DIAGNOSTIC_COMPLETE' <<<"$OUT"
          grep -q '"order_entry":false' <<<"$OUT"
          grep -q '"credentials_used":false' <<<"$OUT"
