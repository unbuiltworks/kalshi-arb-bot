name: Apply sticky COMPLETE retry

on:
  push:
    branches: [fix/r5ft-sticky-complete-retry-20260912]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r5ft-sticky-complete-retry-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stop after bot commit
        id: guard
        run: |
          if [ "${{ github.actor }}" = "github-actions[bot]" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply patch
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/apply_sticky_complete_fix.py
      - name: Syntax check
        if: steps.guard.outputs.skip != 'true'
        run: python -m py_compile src/pmus_spring_l5_session.py
      - name: Focused regression
        if: steps.guard.outputs.skip != 'true'
        run: pytest -q tests/test_sticky_complete_retry.py
      - name: Full test suite
        if: steps.guard.outputs.skip != 'true'
        run: pytest -q
      - name: Commit verified patch
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pmus_spring_l5_session.py tests/test_sticky_complete_retry.py
          git commit -m "fix: keep COMPLETE sticky across post-only race retries"
          git push origin HEAD:fix/r5ft-sticky-complete-retry-20260912
