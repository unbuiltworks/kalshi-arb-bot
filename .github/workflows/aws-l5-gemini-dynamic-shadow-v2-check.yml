name: AWS l5 Gemini dynamic shadow v2 check

on:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/l5-gemini-dynamic-shadow-v2-check.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  CONTAINER_NAME: arb-gemini-l5-dynamic-shadow-v2

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Read-only compact economic summary through SSM
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_CMD='NAME=arb-gemini-l5-dynamic-shadow-v2; ROOT=/home/ssm-user/gemini-l5-dynamic-shadow-v2-state; RUN_DIR=$(ls -1dt "$ROOT"/* 2>/dev/null | head -1); echo L5_DYNAMIC_CHECK_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ); echo L5_DYNAMIC_RUN_DIR=$RUN_DIR; if docker inspect "$NAME" >/dev/null 2>&1; then echo L5_DYNAMIC_RUNNING=$(docker inspect -f "{{.State.Running}}" "$NAME"); echo L5_DYNAMIC_STATUS=$(docker inspect -f "{{.State.Status}} exit={{.State.ExitCode}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}" "$NAME"); fi; if [ -n "$RUN_DIR" ] && [ -f "$RUN_DIR/summary.json" ]; then jq -c '"'"'def n: ((. // "0")|tonumber); def agg($k): reduce .markets_detail[] as $m ({fills:0,markets_with_fills:0,matched_markets:0,sub_dollar_markets:0,matched_qty:0,residual_qty:0,maker_fees:0,modeled_rebate_cents:0}; .fills += (($m[$k].fills // 0)|tonumber) | .markets_with_fills += (if (($m[$k].fills // 0)|tonumber)>0 then 1 else 0 end) | .matched_markets += (if (($m[$k].matched_qty|n)>0) then 1 else 0 end) | .sub_dollar_markets += (if (($m[$k].matched_pair_cost // null) != null and (($m[$k].matched_pair_cost|n)<1)) then 1 else 0 end) | .matched_qty += ($m[$k].matched_qty|n) | .residual_qty += ($m[$k].residual_qty|n) | .maker_fees += ($m[$k].maker_fees|n) | .modeled_rebate_cents += ($m[$k].modeled_maker_rebate_cent_rounded|n)); {status,markets,trades,errors,checkpoints,ws_connections,ws_disconnects,ws_reconnects,read_only,order_entry,realized_pnl,tape_touch:agg("tape_touch"),strict_trade_through:agg("strict_trade_through")}'"'"' "$RUN_DIR/summary.json"; else echo SUMMARY_MISSING; fi'
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB l5 dynamic shadow aggregate economic summary" --parameters "$PARAMETERS" --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}'
