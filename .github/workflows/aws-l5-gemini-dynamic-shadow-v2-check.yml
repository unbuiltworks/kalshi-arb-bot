name: AWS l5 Gemini dynamic shadow v2 check

on:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/l5-gemini-dynamic-shadow-v2-check.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  CONTAINER_NAME: arb-gemini-l5-dynamic-shadow-v2

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Read-only compact economic summary through SSM
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_CMD='NAME=arb-gemini-l5-dynamic-shadow-v2; ROOT=/home/ssm-user/gemini-l5-dynamic-shadow-v2-state; RUN_DIR=$(ls -1dt "$ROOT"/* 2>/dev/null | head -1); echo L5_DYNAMIC_CHECK_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ); echo L5_DYNAMIC_RUN_DIR=$RUN_DIR; if docker inspect "$NAME" >/dev/null 2>&1; then echo L5_DYNAMIC_RUNNING=$(docker inspect -f "{{.State.Running}}" "$NAME"); echo L5_DYNAMIC_STATUS=$(docker inspect -f "{{.State.Status}} exit={{.State.ExitCode}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}" "$NAME"); fi; if [ -n "$RUN_DIR" ] && [ -f "$RUN_DIR/summary.json" ]; then python3 -c "import json,sys,decimal; D=decimal.Decimal; s=json.load(open(sys.argv[1])); out={\"status\":s.get(\"status\"),\"markets\":s.get(\"markets\"),\"trades\":s.get(\"trades\"),\"errors\":s.get(\"errors\"),\"checkpoints\":s.get(\"checkpoints\"),\"ws_connections\":s.get(\"ws_connections\"),\"ws_disconnects\":s.get(\"ws_disconnects\"),\"ws_reconnects\":s.get(\"ws_reconnects\"),\"read_only\":s.get(\"read_only\"),\"order_entry\":s.get(\"order_entry\"),\"realized_pnl\":s.get(\"realized_pnl\")};\nfor key in (\"tape_touch\",\"strict_trade_through\"):\n rows=[]; entered=matched=sub=0; mq=D(0); residual=D(0); residual_cost=D(0); fills=0\n for m in s.get(\"markets_detail\",[]):\n  l=m[key]; f=int(l.get(\"fills\",0)); fills+=f; entered+=int(f>0); q=D(l.get(\"matched_qty\") or \"0\"); r=D(l.get(\"residual_qty\") or \"0\"); residual+=r; side=l.get(\"residual_side\"); v=l.get(\"yes_vwap\") if side==\"YES\" else l.get(\"no_vwap\") if side==\"NO\" else None; residual_cost += r*D(v) if v else D(0); pair=l.get(\"matched_pair_cost\"); matched+=int(q>0); mq+=q; is_sub=bool(pair is not None and D(pair)<D(1)); sub+=int(is_sub);\n  if q>0: rows.append({\"ticker\":m.get(\"ticker\"),\"asset\":m.get(\"asset\"),\"horizon\":m.get(\"horizon\"),\"matched_qty\":str(q),\"pair_cost\":pair,\"gross_edge_per_pair\":str(D(1)-D(pair)) if pair is not None else None,\"residual_side\":side,\"residual_qty\":str(r),\"sub_dollar\":is_sub})\n out[key]={\"fills\":fills,\"markets_with_fills\":entered,\"markets_with_matched_inventory\":matched,\"markets_with_sub_dollar_pairs\":sub,\"matched_qty_total\":str(mq),\"residual_qty_total\":str(residual),\"residual_acquisition_cost_approx\":str(residual_cost),\"matched_markets\":rows}\nprint(json.dumps(out,sort_keys=True))" "$RUN_DIR/summary.json"; else echo SUMMARY_MISSING; fi'
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB l5 dynamic shadow v3 compact economic summary" --parameters "$PARAMETERS" --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}'
