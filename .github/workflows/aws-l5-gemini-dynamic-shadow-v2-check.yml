name: AWS l5 Gemini dynamic shadow v2 check

on:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/l5-gemini-dynamic-shadow-v2-check.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  CONTAINER_NAME: arb-gemini-l5-dynamic-shadow-v2

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Read-only capture health through SSM
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_CMD='NAME=arb-gemini-l5-dynamic-shadow-v2; ROOT=/home/ssm-user/gemini-l5-dynamic-shadow-v2-state; RUN_DIR=$(ls -1dt "$ROOT"/* 2>/dev/null | head -1); echo L5_DYNAMIC_CHECK_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ); echo L5_DYNAMIC_RUN_DIR=$RUN_DIR; if docker inspect "$NAME" >/dev/null 2>&1; then echo L5_DYNAMIC_RUNNING=$(docker inspect -f "{{.State.Running}}" "$NAME"); echo L5_DYNAMIC_STATUS=$(docker inspect -f "{{.State.Status}} exit={{.State.ExitCode}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}" "$NAME"); else echo L5_DYNAMIC_RUNNING=false; echo L5_DYNAMIC_STATUS=not_found; fi; if [ -n "$RUN_DIR" ] && [ -f "$RUN_DIR/capture.jsonl" ]; then echo L5_DYNAMIC_CAPTURE_LINES=$(wc -l < "$RUN_DIR/capture.jsonl"); echo L5_DYNAMIC_TYPE_COUNTS_BEGIN; python3 -c "import json,collections,sys; c=collections.Counter(); [c.update([json.loads(x).get(\"type\",\"NO_TYPE\")]) for x in open(sys.argv[1]) if x.strip()]; print(\"\\n\".join(f\"{k}={v}\" for k,v in sorted(c.items())))" "$RUN_DIR/capture.jsonl"; echo L5_DYNAMIC_TYPE_COUNTS_END; echo L5_DYNAMIC_SHADOW_FILLS_BEGIN; python3 -c "import json,sys; rows=[json.loads(x) for x in open(sys.argv[1]) if x.strip()]; fills=[r for r in rows if r.get(\"type\")==\"SHADOW_FILL\"]; [print(json.dumps(r,sort_keys=True)) for r in fills[-10:]]" "$RUN_DIR/capture.jsonl"; echo L5_DYNAMIC_SHADOW_FILLS_END; else echo L5_DYNAMIC_CAPTURE_LINES=0; fi'
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB l5 dynamic shadow v2 read-only health" --parameters "$PARAMETERS" --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}'
