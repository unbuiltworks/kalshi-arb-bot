name: AWS Gemini adaptive maker V5.3 public diagnostic

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - .github/workflows/aws-gemini-v5-3-public-diagnostic.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  RELEASE_BRANCH: release/gemini-adaptive-maker-v5-3
  REQUIRED_RELEASE_COMMIT: 1f876470e9e4de43235914379636c4b16d02c8ab

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Run exact V5.3 public depth and owned-order simulation on EC2
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE=$(cat <<EOF
          set -Eeuo pipefail
          REPO=/home/ssm-user/kalshi-arb-bot
          WORK=/opt/arb/gemini-adaptive-v5-3-public-diag
          IMAGE=arb-gemini-adaptive-v5-3-public:${REQUIRED_RELEASE_COMMIT:0:12}
          cd "\$REPO"
          git config --global --add safe.directory "\$REPO" || true
          git fetch origin ${RELEASE_BRANCH} >/dev/null
          ACTUAL=\$(git rev-parse origin/${RELEASE_BRANCH})
          test "\$ACTUAL" = "${REQUIRED_RELEASE_COMMIT}"
          git worktree remove --force "\$WORK" >/dev/null 2>&1 || true
          rm -rf "\$WORK"
          git worktree prune
          git worktree add --detach "\$WORK" "\$ACTUAL" >/dev/null
          docker build -q -t "\$IMAGE" "\$WORK" >/dev/null
          docker run --rm --network host \
            -e GEMINI_Q10_PRODUCTION_LIVE=NO \
            -e GEMINI_Q10_PRODUCTION_ARM_ID= \
            -e GEMINI_Q10_PRODUCTION_ARM= \
            -e GEMINI_LIQUIDITY_REWARD_LIVE_Q10=NO \
            "\$IMAGE" python -m src.gemini_adaptive_maker_v5_3_diagnostic
          EOF
          )
          ENC=$(printf '%s' "$REMOTE" | base64 -w0)
          PARAMS=$(jq -nc --arg cmd "echo '$ENC' | base64 -d | sudo -u ssm-user bash" '{commands:[$cmd]}')
          CID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB V5.3 public no-credential adaptive diagnostic" --parameters "$PARAMS" --timeout-seconds 780 --query 'Command.CommandId' --output text)
          for _ in $(seq 1 420); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 2
          done
          RESULT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          OUT=$(jq -r '.Stdout // ""' <<<"$RESULT")
          grep -q 'GEMINI_ADAPTIVE_MAKER_V5_3_DIAG_COMPLETE' <<<"$OUT"
          grep -q '"order_entry":false' <<<"$OUT"
          grep -q '"liquidity_rewards_modeled":false' <<<"$OUT"
          grep -q '"maker_rebates_modeled":false' <<<"$OUT"
