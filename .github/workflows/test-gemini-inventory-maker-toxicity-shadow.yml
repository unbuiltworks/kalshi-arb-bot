name: Test Gemini inventory-maker toxicity shadow

on:
  push:
    branches:
      - feature/gemini-inventory-maker-toxicity-shadow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run focused tests
        run: python -m pytest -q tests/test_gemini_inventory_maker_toxicity_shadow.py tests/test_gemini_liquidity_reward_dynamic_completion_q10.py tests/test_venue_flow_census.py
