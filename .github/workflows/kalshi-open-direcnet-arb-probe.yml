name: Kalshi Open DIRECNET Arb Probe

on:
  pull_request:
    paths:
      - 'src/kalshi_open_direcnet_arb_probe.py'
      - '.github/workflows/kalshi-open-direcnet-arb-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan open Kalshi DIRECNET groups
        run: python -m src.kalshi_open_direcnet_arb_probe
