name: l5 realtime shadow mirror focused tests

on:
  push:
    branches:
      - feature/l5-realtime-shadow-mirror
    paths:
      - src/l5_realtime_shadow_mirror.py
      - tests/test_l5_realtime_shadow_mirror.py
      - .github/workflows/l5-realtime-shadow-mirror-test.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_l5_realtime_shadow_mirror.py
