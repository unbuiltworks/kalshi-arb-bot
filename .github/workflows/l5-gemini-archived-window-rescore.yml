name: l5 Gemini archived-window rescore

on:
  push:
    branches:
      - feature/l5-gemini-aws-live-probe-v1
    paths:
      - deploy/l5-gemini-archived-rescore.trigger

permissions:
  contents: read
  actions: read

jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HISTORICAL_ARTIFACT_ID: '9674027200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install 'httpx>=0.27' 'pytest>=8'
      - name: Verify hardened Gemini replay tests
        run: pytest -q tests/test_gemini_l5_threshold_model.py tests/test_gemini_l5_inventory_replay.py tests/test_l5_shadow_settlement_score.py
      - name: Download exact archived read-only evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/raw artifacts/rescore
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${HISTORICAL_ARTIFACT_ID}/zip" \
            > /tmp/l5-gemini-old.zip
          unzip -q /tmp/l5-gemini-old.zip -d artifacts/raw
          test -s artifacts/raw/gemini-l5-threshold-shadow.jsonl
          sha256sum artifacts/raw/gemini-l5-threshold-shadow.jsonl | tee artifacts/rescore/raw-jsonl.sha256
          wc -l artifacts/raw/gemini-l5-threshold-shadow.jsonl | tee artifacts/rescore/raw-jsonl-lines.txt
      - name: Replay exact raw window with current capped logic
        run: |
          python -m src.gemini_l5_inventory_replay \
            artifacts/raw/gemini-l5-threshold-shadow.jsonl \
            --output artifacts/rescore/gemini-l5-inventory-replay-current.json \
            | tee artifacts/rescore/gemini-l5-inventory-replay-current.log
      - name: Score against official public Gemini settlements
        run: |
          python -m src.l5_shadow_settlement_score \
            --venue gemini \
            artifacts/rescore/gemini-l5-inventory-replay-current.json \
            --output artifacts/rescore/gemini-l5-settlement-score-current.json \
            | tee artifacts/rescore/gemini-l5-settlement-score-current.log
      - name: Print decision evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          replay = json.loads(Path('artifacts/rescore/gemini-l5-inventory-replay-current.json').read_text())
          score = json.loads(Path('artifacts/rescore/gemini-l5-settlement-score-current.json').read_text())
          print('RESCORE_MARKETS', replay.get('markets'))
          print('RESCORE_MARKETS_WITH_FILLS', replay.get('markets_with_trade_through_fills'))
          print('RESCORE_TOTAL_VIRTUAL_FILLS', replay.get('total_virtual_fills'))
          print('RESCORE_MAX_UNITS_PER_OUTCOME', replay.get('max_units_per_outcome'))
          print('SCORE_SETTLED_MARKETS', score.get('settled_markets'))
          print('SCORE_UNRESOLVED_MARKETS', score.get('unresolved_markets'))
          print('SCORE_TRADING_PNL', score.get('settled_shadow_total_trading_pnl'))
          print('SCORE_MODELED_WITH_REBATE', score.get('settled_shadow_total_modeled_pnl_with_maker_rebate'))
          PY
      - name: Upload reproducible rescore evidence
        uses: actions/upload-artifact@v4
        with:
          name: l5-gemini-archived-window-rescore
          path: artifacts/rescore/
          retention-days: 7
