name: incentive arb public census

on:
  push:
    branches:
      - feature/incentive-arb-engine-v1
    paths:
      - src/incentive_arb_engine.py
      - src/gemini_dual_maker_incentive_scan.py
      - src/polymarket_l5_reward_snapshot.py
      - src/short_crypto_incentive_snapshot.py
      - tests/test_incentive_arb_engine.py
      - tests/test_short_crypto_incentive_snapshot.py
      - .github/workflows/incentive-arb-public-census.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal dependencies
        run: python -m pip install 'httpx>=0.27' 'websockets>=12' 'pytest>=8'
      - name: Test accounting and incentive collectors
        run: |
          pytest -q \
            tests/test_incentive_arb_engine.py \
            tests/test_short_crypto_incentive_snapshot.py \
            tests/test_gemini_l5_inventory_policy.py
      - name: Capture public incentive state
        run: |
          mkdir -p artifacts
          python -m src.short_crypto_incentive_snapshot --pretty > artifacts/gemini-kalshi-incentives.json
          python -m src.polymarket_l5_reward_snapshot --hours 48 --pretty > artifacts/polymarket-reward-payments.json
          python -m src.gemini_dual_maker_incentive_scan --quantity 10 --pretty > artifacts/gemini-dual-maker-q10.json
      - name: Print compact census
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          gk=json.loads(Path('artifacts/gemini-kalshi-incentives.json').read_text())
          pm=json.loads(Path('artifacts/polymarket-reward-payments.json').read_text())
          dm=json.loads(Path('artifacts/gemini-dual-maker-q10.json').read_text())
          out={
            'classification':'READ_ONLY_PUBLIC_CENSUS_NOT_REALIZED_PNL',
            'order_entry':False,
            'gemini':{
              'maker_rebate_http_status':gk['gemini']['maker_rebate_http_status'],
              'liquidity_rewards_config_http_status':gk['gemini']['liquidity_rewards_config_http_status'],
              'short_crypto_reward_event_count':len(gk['gemini']['short_crypto_reward_events']),
              'q10_active_markets':dm['markets'],
              'q10_trade_only_arb_markets':dm['trade_only_arb_markets'],
              'q10_two_sided_reward_eligible_markets_at_snapshot':dm['two_sided_reward_eligible_markets_at_snapshot'],
              'active_crypto_rebate_rate':dm['active_crypto_rebate_rate'],
            },
            'kalshi':{
              'incentives_http_status':gk['kalshi']['incentives_http_status'],
              'active_incentive_count':gk['kalshi']['active_incentive_count'],
              'target_15m_incentive_count':gk['kalshi']['target_15m_incentive_count'],
              'other_crypto15_incentive_count':gk['kalshi']['other_crypto15_incentive_count'],
            },
            'polymarket':{
              'reward_payment_window_hours':pm['hours'],
              'maker_rebate_paid_in_window':pm['maker_rebate_paid_in_window'],
              'taker_rebate_paid_in_window':pm['taker_rebate_paid_in_window'],
              'earning_period_attribution':pm['earning_period_attribution'],
            },
          }
          Path('artifacts/compact-census.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: incentive-arb-public-census
          path: artifacts/
          retention-days: 7
