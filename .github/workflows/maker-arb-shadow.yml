name: Maker Arb Shadow

on:
  pull_request:
    paths:
      - 'src/gemini_kalshi_maker_shadow.py'
      - 'tests/test_gemini_kalshi_maker_shadow.py'
      - 'railway-crypto-maker-shadow.toml'
      - '.github/workflows/maker-arb-shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run maker-shadow unit tests
        run: pytest -q tests/test_gemini_kalshi_maker_shadow.py
      - name: Compile maker-shadow module
        run: python -m py_compile src/gemini_kalshi_maker_shadow.py
