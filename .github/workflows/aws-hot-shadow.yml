name: AWS hot shadow parity

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ARB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_ARB_REGION }}

      - name: Start read-only sports maker shadow through SSM
        shell: bash
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.AWS_ARB_HOT_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "ARB AWS parity shadow - read only" \
            --parameters 'commands=["sudo -u ssm-user bash -lc '\''cd /home/ssm-user/kalshi-arb-bot && git fetch origin aws-migration-foundation && git show origin/aws-migration-foundation:deploy/aws/run_sports_maker_shadow.sh > /tmp/run_sports_maker_shadow.sh && chmod +x /tmp/run_sports_maker_shadow.sh && /tmp/run_sports_maker_shadow.sh'\''"]' \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.AWS_ARB_HOT_INSTANCE_ID }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.AWS_ARB_HOT_INSTANCE_ID }}" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}'
