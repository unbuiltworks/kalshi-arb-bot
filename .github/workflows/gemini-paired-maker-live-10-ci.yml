name: Gemini paired-maker live $10 canary CI

on:
  push:
    branches:
      - feature/gemini-paired-maker-live-10-canary
    paths:
      - 'src/gemini_maker/**'
      - 'tests/test_gemini_maker_live_10_canary.py'
      - '.github/workflows/gemini-paired-maker-live-10-ci.yml'
  pull_request:
    paths:
      - 'src/gemini_maker/**'
      - 'tests/test_gemini_maker_live_10_canary.py'

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Focused paired-maker safety tests
        run: |
          python -m pytest -q \
            tests/test_gemini_maker_live_10_canary.py \
            tests/test_gemini_incentive_mm_dynamic_complement.py \
            tests/test_gemini_short_crypto_dynamic_complement_q1_v2.py
      - name: Compile live module
        run: python -m py_compile src/gemini_maker/live_10_canary.py
