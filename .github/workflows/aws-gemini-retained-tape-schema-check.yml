name: AWS Gemini retained tape schema check

on:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/gemini-retained-tape-schema-check.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation
      - name: Read source run
        id: trigger
        shell: bash
        run: |
          set -euo pipefail
          FILE=deploy/aws/gemini-retained-tape-schema-check.trigger
          SOURCE_RUN_ID=$(awk -F= '$1=="SOURCE_RUN_ID"{print $2}' "$FILE" | tr -d '[:space:]')
          CLASSIFICATION=$(awk -F= '$1=="CLASSIFICATION"{print $2}' "$FILE" | tr -d '[:space:]')
          test "$CLASSIFICATION" = "READ_ONLY_PUBLIC_TAPE_SCHEMA"
          echo "source_run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Print public tape schema and recent family coverage
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.trigger.outputs.source_run_id }}
        run: |
          set -euo pipefail
          REMOTE_CMD="sudo -u ssm-user bash -lc 'set -euo pipefail; ROOT=/home/ssm-user/gemini-l5-dynamic-shadow-v2-state; SOURCE=\"\$ROOT/${SOURCE_RUN_ID}/capture.jsonl\"; test -f \"\$SOURCE\"; echo TAPE_SCHEMA_SHADOW_PLAN_BEGIN; grep -m 3 SHADOW_PLAN \"\$SOURCE\" || true; echo TAPE_SCHEMA_SHADOW_PLAN_END; echo TAPE_SCHEMA_PUBLIC_TRADE_BEGIN; grep -m 5 PUBLIC_TRADE \"\$SOURCE\" || true; echo TAPE_SCHEMA_PUBLIC_TRADE_END; echo TAPE_RECENT_COVERAGE_BEGIN; n=0; for f in \$(ls -1dt \"\$ROOT\"/*/capture.jsonl 2>/dev/null); do run=\$(basename \"\$(dirname \"\$f\")\"); total=\$(grep -c '\"type\":\"PUBLIC_TRADE\"' \"\$f\" || true); eth5=\$(grep '\"type\":\"PUBLIC_TRADE\"' \"\$f\" | grep -c '\"asset\":\"ETH\",\"horizon\":\"5m\"' || true); btc5=\$(grep '\"type\":\"PUBLIC_TRADE\"' \"\$f\" | grep -c '\"asset\":\"BTC\",\"horizon\":\"5m\"' || true); eth15=\$(grep '\"type\":\"PUBLIC_TRADE\"' \"\$f\" | grep -c '\"asset\":\"ETH\",\"horizon\":\"15m\"' || true); btc15=\$(grep '\"type\":\"PUBLIC_TRADE\"' \"\$f\" | grep -c '\"asset\":\"BTC\",\"horizon\":\"15m\"' || true); echo TAPE_COVERAGE run=\$run total=\$total eth5=\$eth5 btc5=\$btc5 eth15=\$eth15 btc15=\$btc15; n=\$((n+1)); [ \$n -ge 12 ] && break; done; echo TAPE_RECENT_COVERAGE_END'"
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB retained public tape schema coverage check" --parameters "$PARAMETERS" --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" || true
          RESULT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = "Success"
          grep -q 'TAPE_RECENT_COVERAGE_END' <<<"$(jq -r '.Stdout // ""' <<<"$RESULT")"
