name: AWS Gemini L5 dynamic q1 live

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - deploy/aws/gemini-l5-dynamic-q1-live.trigger
      - deploy/aws/gemini-l5-dynamic-q1-stop.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  LIVE_BRANCH: feature/gemini-l5-dynamic-q1

jobs:
  live:
    if: ${{ contains(github.event.head_commit.modified, 'deploy/aws/gemini-l5-dynamic-q1-live.trigger') || contains(github.event.head_commit.added, 'deploy/aws/gemini-l5-dynamic-q1-live.trigger') }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation
      - name: Validate one-use dynamic approval
        id: trig
        shell: bash
        run: |
          set -euo pipefail
          FILE=deploy/aws/gemini-l5-dynamic-q1-live.trigger
          PIN=$(awk -F= '$1=="PINNED_COMMIT"{print $2}' "$FILE" | tr -d '[:space:]')
          APP=$(awk -F= '$1=="APPROVAL_ID"{print $2}' "$FILE" | tr -d '[:space:]')
          CLS=$(awk -F= '$1=="CLASSIFICATION"{print $2}' "$FILE" | tr -d '[:space:]')
          [[ "$PIN" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APP" =~ ^[A-Za-z0-9_-]{6,80}$ ]]
          test "$CLS" = "FRESH_USER_APPROVED_GEMINI_L5_DYNAMIC_Q1_LIVE"
          echo "pinned=$PIN" >> "$GITHUB_OUTPUT"
          echo "approval=$APP" >> "$GITHUB_OUTPUT"
          echo "L5_DYNAMIC_TRIGGER_VALID commit=${PIN:0:12} approval=$APP"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Pin, preflight, and launch bounded dynamic q1 through SSM
        shell: bash
        env:
          PINNED_COMMIT: ${{ steps.trig.outputs.pinned }}
          APPROVAL_ID: ${{ steps.trig.outputs.approval }}
        run: |
          set -euo pipefail
          REMOTE_CMD="sudo -u ssm-user bash -lc 'set -euo pipefail; cd /home/ssm-user/kalshi-arb-bot; git fetch origin ${LIVE_BRANCH} >/dev/null; git cat-file -e \"${PINNED_COMMIT}^{commit}\"; git merge-base --is-ancestor ${PINNED_COMMIT} origin/${LIVE_BRANCH}; git show ${PINNED_COMMIT}:deploy/aws/run_gemini_l5_dynamic_q1_live.sh > /tmp/run_gemini_l5_dynamic_q1_live.sh; chmod 0700 /tmp/run_gemini_l5_dynamic_q1_live.sh; PINNED_COMMIT=${PINNED_COMMIT} ARB_GEMINI_L5_DYNAMIC_Q1_APPROVED=YES ARB_GEMINI_L5_DYNAMIC_Q1_APPROVAL_ID=${APPROVAL_ID} /tmp/run_gemini_l5_dynamic_q1_live.sh'"
          PARAMS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          CID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --parameters "$PARAMS" --timeout-seconds 900 --query 'Command.CommandId' --output text)
          for i in $(seq 1 180); do
            S=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$S" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 5
          done
          mkdir -p runtime
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' > runtime/aws-gemini-l5-dynamic-q1-live.json
          cat runtime/aws-gemini-l5-dynamic-q1-live.json
          test "$(jq -r '.Status' runtime/aws-gemini-l5-dynamic-q1-live.json)" = "Success"
          OUT=$(jq -r '.Stdout // ""' runtime/aws-gemini-l5-dynamic-q1-live.json)
          grep -q 'L5_DYNAMIC_SAFETY_TESTS_OK' <<<"$OUT"
          grep -q 'L5_DYNAMIC_DISARMED_OK' <<<"$OUT"
          grep -q 'L5_DYNAMIC_ACCOUNT_PREFLIGHT_OK' <<<"$OUT"
          grep -q 'L5_DYNAMIC_PUBLIC_READ_OK' <<<"$OUT"
          grep -q 'L5_DYNAMIC_LIVE_START' <<<"$OUT"
          grep -q 'L5_DYNAMIC_OWNER_RUNNING' <<<"$OUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aws-gemini-l5-dynamic-q1-live
          path: runtime/aws-gemini-l5-dynamic-q1-live.json
          retention-days: 7

  stop:
    if: ${{ contains(github.event.head_commit.modified, 'deploy/aws/gemini-l5-dynamic-q1-stop.trigger') || contains(github.event.head_commit.added, 'deploy/aws/gemini-l5-dynamic-q1-stop.trigger') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation
      - name: Validate one-use exact-stop approval
        id: trig
        shell: bash
        run: |
          set -euo pipefail
          FILE=deploy/aws/gemini-l5-dynamic-q1-stop.trigger
          PIN=$(awk -F= '$1=="PINNED_COMMIT"{print $2}' "$FILE" | tr -d '[:space:]')
          APP=$(awk -F= '$1=="APPROVAL_ID"{print $2}' "$FILE" | tr -d '[:space:]')
          CLS=$(awk -F= '$1=="CLASSIFICATION"{print $2}' "$FILE" | tr -d '[:space:]')
          [[ "$PIN" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APP" =~ ^[A-Za-z0-9_-]{6,80}$ ]]
          test "$CLS" = "FRESH_USER_APPROVED_GEMINI_L5_DYNAMIC_Q1_EXACT_STOP"
          echo "pinned=$PIN" >> "$GITHUB_OUTPUT"
          echo "approval=$APP" >> "$GITHUB_OUTPUT"
          echo "L5_DYNAMIC_STOP_TRIGGER_VALID commit=${PIN:0:12} approval=$APP"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Freeze owner and reconcile only exact dynamic IDs
        shell: bash
        env:
          PINNED_COMMIT: ${{ steps.trig.outputs.pinned }}
          APPROVAL_ID: ${{ steps.trig.outputs.approval }}
        run: |
          set -euo pipefail
          REMOTE_CMD="sudo -u ssm-user bash -lc 'set -euo pipefail; cd /home/ssm-user/kalshi-arb-bot; git fetch origin ${LIVE_BRANCH} >/dev/null; git cat-file -e \"${PINNED_COMMIT}^{commit}\"; git merge-base --is-ancestor ${PINNED_COMMIT} origin/${LIVE_BRANCH}; git show ${PINNED_COMMIT}:deploy/aws/run_gemini_l5_dynamic_q1_stop.sh > /tmp/run_gemini_l5_dynamic_q1_stop.sh; chmod 0700 /tmp/run_gemini_l5_dynamic_q1_stop.sh; PINNED_COMMIT=${PINNED_COMMIT} ARB_GEMINI_L5_DYNAMIC_STOP_APPROVED=YES ARB_GEMINI_L5_DYNAMIC_STOP_APPROVAL_ID=${APPROVAL_ID} /tmp/run_gemini_l5_dynamic_q1_stop.sh'"
          PARAMS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          CID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --parameters "$PARAMS" --timeout-seconds 650 --query 'Command.CommandId' --output text)
          for i in $(seq 1 130); do
            S=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$S" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 5
          done
          mkdir -p runtime
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' > runtime/aws-gemini-l5-dynamic-q1-stop.json
          cat runtime/aws-gemini-l5-dynamic-q1-stop.json
          test "$(jq -r '.Status' runtime/aws-gemini-l5-dynamic-q1-stop.json)" = "Success"
          OUT=$(jq -r '.Stdout // ""' runtime/aws-gemini-l5-dynamic-q1-stop.json)
          grep -q 'L5_DYNAMIC_STOP_SAFETY_TESTS_OK' <<<"$OUT"
          grep -q 'L5_DYNAMIC_STOP_UPGRADE_SAFE' <<<"$OUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aws-gemini-l5-dynamic-q1-stop
          path: runtime/aws-gemini-l5-dynamic-q1-stop.json
          retention-days: 7
