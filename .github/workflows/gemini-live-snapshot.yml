name: Gemini Kalshi Live Snapshot

on:
  push:
    branches:
      - feature/gemini-kalshi-fast-overlap
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run read-only live overlap snapshot
        run: |
          set -o pipefail
          python -m src.gemini_kalshi_rest_snapshot 2>&1 | tee gemini-kalshi-snapshot.log
      - name: Upload snapshot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-kalshi-snapshot
          path: gemini-kalshi-snapshot.log
          if-no-files-found: error
          retention-days: 7
