name: AWS Gemini ETH5 front-queue census status

on:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/gemini-eth5-front-queue-census-status.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  CONTAINER_NAME: arb-gemini-eth5-front-queue-census

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation
      - name: Read trigger
        id: trigger
        shell: bash
        run: |
          set -euo pipefail
          FILE=deploy/aws/gemini-eth5-front-queue-census-status.trigger
          RUN_ID=$(awk -F= '$1=="RUN_ID"{print $2}' "$FILE" | tr -d '[:space:]')
          PINNED_COMMIT=$(awk -F= '$1=="PINNED_COMMIT"{print $2}' "$FILE" | tr -d '[:space:]')
          [[ "$RUN_ID" =~ ^[0-9A-Za-z._-]+$ ]]
          [[ "$PINNED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "pinned_commit=$PINNED_COMMIT" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Read-only partial census summary
        shell: bash
        env:
          RUN_ID: ${{ steps.trigger.outputs.run_id }}
          PINNED_COMMIT: ${{ steps.trigger.outputs.pinned_commit }}
        run: |
          set -Eeuo pipefail
          SHORT_SHA="${PINNED_COMMIT:0:12}"
          REMOTE_SCRIPT=$(cat <<EOF
          set -Eeuo pipefail
          ROOT=/home/ssm-user/gemini-eth5-front-queue-census-state/${RUN_ID}
          IMAGE=arb-gemini-eth5-front-queue-census:${SHORT_SHA}
          NAME=${CONTAINER_NAME}
          test -d "\$ROOT"
          test -s "\$ROOT/run-metadata.json"
          test -f "\$ROOT/census.jsonl"
          docker image inspect "\$IMAGE" >/dev/null
          running=false; status=missing; exit_code=null
          if docker inspect "\$NAME" >/dev/null 2>&1; then
            running=\$(docker inspect -f '{{.State.Running}}' "\$NAME")
            status=\$(docker inspect -f '{{.State.Status}}' "\$NAME")
            exit_code=\$(docker inspect -f '{{.State.ExitCode}}' "\$NAME")
          fi
          lines=\$(wc -l <"\$ROOT/census.jsonl")
          echo "ETH5_FRONT_QUEUE_CENSUS_STATUS run_id=${RUN_ID} running=\$running status=\$status exit=\$exit_code lines=\$lines order_entry=false credentials_loaded=false"
          docker run --rm --network none -v "\$ROOT:/output:ro" "\$IMAGE" \
            python -m src.gemini_eth5_front_queue_census \
              --summarize-only --output /output/census.jsonl
          EOF
          )
          ENCODED=$(printf '%s' "$REMOTE_SCRIPT" | base64 -w0)
          REMOTE_CMD="echo '$ENCODED' | base64 -d | sudo -u ssm-user bash"
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB ETH5 front-queue census status ${RUN_ID}" --parameters "$PARAMETERS" --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" || true
          RESULT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          grep -q 'ETH5_FRONT_QUEUE_CENSUS_STATUS' <<<"$(jq -r '.Stdout // ""' <<<"$RESULT")"
