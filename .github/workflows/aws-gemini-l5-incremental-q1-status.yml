name: AWS Gemini L5 incremental q1 status

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - deploy/aws/gemini-l5-incremental-q1-status.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Read-only incremental q1 state and account exposure
        shell: bash
        run: |
          set -euo pipefail
          REMOTE='set +e; echo L5_INC_STATUS_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ); if docker inspect arb-gemini-l5-incremental-q1 >/dev/null 2>&1; then echo CONTAINER_EXISTS=true; docker inspect -f "running={{.State.Running}} exit={{.State.ExitCode}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}" arb-gemini-l5-incremental-q1; else echo CONTAINER_EXISTS=false; fi; ENV_FILE=/opt/arb/secrets/gemini-short-crypto.env; [ -f "$ENV_FILE" ] || ENV_FILE=/home/ssm-user/kalshi-arb-bot/.env; IMAGE=arb-gemini-l5-incremental:q1-9942a8cfeb6e; echo ACCOUNT_ACTIVE_ORDERS; docker run --rm --network host --env-file "$ENV_FILE" "$IMAGE" python -c "import asyncio,json; from src.gemini_prediction_auth import private_rest_request; r=asyncio.run(private_rest_request(\"POST\",\"/v1/prediction-markets/orders/active\",params={\"limit\":1000,\"offset\":0},timeout=8.0)); d=r.json(); rows=d.get(\"orders\",[]) if isinstance(d,dict) else []; print(json.dumps([{\"symbol\":str(x.get(\"symbol\") or \"\"),\"clientOrderId\":str(x.get(\"clientOrderId\") or \"\")} for x in rows if isinstance(x,dict)]))"; echo ACCOUNT_POSITIONS; docker run --rm --network host --env-file "$ENV_FILE" "$IMAGE" python -c "import asyncio,json; from decimal import Decimal as D; from src.gemini_prediction_auth import private_rest_request; r=asyncio.run(private_rest_request(\"POST\",\"/v1/prediction-markets/positions\",params={\"limit\":1000,\"offset\":0,\"sort\":\"+expiryDate\"},timeout=8.0)); d=r.json(); rows=d.get(\"positions\",[]) if isinstance(d,dict) else []; out=[]; [(out.append({\"symbol\":str(x.get(\"symbol\") or \"\"),\"qty\":str(D(str(x.get(\"totalQuantity\") or \"0\"))),\"outcome\":str(x.get(\"eventOutcome\") or x.get(\"outcome\") or \"\")})) for x in rows if isinstance(x,dict) and D(str(x.get(\"totalQuantity\") or \"0\"))>0]; print(json.dumps(out))"'
          PARAMS=$(jq -nc --arg cmd "$REMOTE" '{commands:[$cmd]}')
          CID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --parameters "$PARAMS" --query 'Command.CommandId' --output text)
          for i in $(seq 1 40); do
            S=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$S" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 2
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}'
