name: AWS Gemini L5 incremental q1 status

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - deploy/aws/gemini-l5-incremental-q1-status.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Read-only dynamic q1 owner state and account exposure
        shell: bash
        run: |
          set -euo pipefail
          REMOTE='set +e; echo L5_DYNAMIC_STATUS_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ); echo RUNNING_CONTAINERS; docker ps --format "name={{.Names}} image={{.Image}} command={{.Command}}"; if docker inspect arb-gemini-l5-dynamic-q1 >/dev/null 2>&1; then echo DYNAMIC_CONTAINER_EXISTS=true; docker inspect -f "running={{.State.Running}} exit={{.State.ExitCode}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}" arb-gemini-l5-dynamic-q1; echo DYNAMIC_LOGS; docker logs --tail 220 arb-gemini-l5-dynamic-q1 2>&1; else echo DYNAMIC_CONTAINER_EXISTS=false; fi; F=/opt/arb/state/gemini-l5-dynamic-q1/session.json; if [ -f "$F" ]; then echo DYNAMIC_STATE_FILE=true; cat "$F"; else echo DYNAMIC_STATE_FILE=false; fi; echo CYCLE_FILES; ls -1 /opt/arb/state/gemini-l5-dynamic-q1/cycle-*.json 2>/dev/null | tail -n 10; for C in $(ls -1 /opt/arb/state/gemini-l5-dynamic-q1/cycle-*.json 2>/dev/null | tail -n 3); do echo CYCLE_FILE=$C; cat "$C"; done; ENV_FILE=/opt/arb/secrets/gemini-short-crypto.env; [ -f "$ENV_FILE" ] || ENV_FILE=/home/ssm-user/kalshi-arb-bot/.env; IMAGE=arb-gemini-l5-dynamic:q1-0d965abf9ee1; echo ACCOUNT_ACTIVE_ORDERS; docker run --rm --network host --env-file "$ENV_FILE" "$IMAGE" python -c "import asyncio,json; from src.gemini_prediction_auth import private_rest_request; r=asyncio.run(private_rest_request(\"POST\",\"/v1/prediction-markets/orders/active\",params={\"limit\":1000,\"offset\":0},timeout=8.0)); d=r.json(); rows=d.get(\"orders\",[]) if isinstance(d,dict) else []; print(json.dumps([{\"symbol\":str(x.get(\"symbol\") or \"\"),\"clientOrderId\":str(x.get(\"clientOrderId\") or \"\"),\"outcome\":str(x.get(\"eventOutcome\") or \"\"),\"price\":str(x.get(\"price\") or \"\"),\"filled\":str(x.get(\"filledQuantity\") or \"0\")} for x in rows if isinstance(x,dict)]))"; echo ACCOUNT_POSITIONS; docker run --rm --network host --env-file "$ENV_FILE" "$IMAGE" python -c "import asyncio,json; from decimal import Decimal as D; from src.gemini_prediction_auth import private_rest_request; r=asyncio.run(private_rest_request(\"POST\",\"/v1/prediction-markets/positions\",params={\"limit\":1000,\"offset\":0,\"sort\":\"+expiryDate\"},timeout=8.0)); d=r.json(); rows=d.get(\"positions\",[]) if isinstance(d,dict) else []; out=[]; [(out.append({\"symbol\":str(x.get(\"symbol\") or \"\"),\"qty\":str(D(str(x.get(\"totalQuantity\") or \"0\"))),\"outcome\":str(x.get(\"eventOutcome\") or x.get(\"outcome\") or \"\")})) for x in rows if isinstance(x,dict) and D(str(x.get(\"totalQuantity\") or \"0\"))>0]; print(json.dumps(out))"; echo EXACT_1145_HISTORY; docker run --rm --network host --env-file "$ENV_FILE" "$IMAGE" python -c "import asyncio,json; from src.gemini_prediction_auth import private_rest_request; ids={\"l5lad-2ba09059ba961c589e76e0-y0\",\"l5lad-56b24a51085adf95ef51b3-n0\",\"l5lad-99aad12482e8126a92a43b-y1\"}; async def q():\n out=[]\n for s in (\"filled\",\"cancelled\"):\n  r=await private_rest_request(\"POST\",\"/v1/prediction-markets/orders/history\",params={\"status\":s,\"symbol\":\"GEMI-ETH05M2609011145-UP\",\"limit\":100},timeout=8.0); d=r.json(); out += [x for x in (d.get(\"orders\",[]) if isinstance(d,dict) else []) if str(x.get(\"clientOrderId\") or \"\") in ids]\n print(json.dumps(out))\n; asyncio.run(q())"; echo EXACT_1145_EVENT; docker run --rm --network host "$IMAGE" python -c "import httpx,json; r=httpx.get(\"https://api.gemini.com/v1/prediction-markets/events/ETH05M2609011145\",timeout=8.0,follow_redirects=True); print(r.status_code); print(json.dumps(r.json()))"'
          PARAMS=$(jq -nc --arg cmd "$REMOTE" '{commands:[$cmd]}')
          CID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --parameters "$PARAMS" --query 'Command.CommandId' --output text)
          for i in $(seq 1 40); do
            S=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$S" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 2
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}'
