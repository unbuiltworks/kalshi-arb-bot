name: AWS Gemini V5.4 continuous settlement audit

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - deploy/aws/gemini-v5-4-continuous-settlement-audit.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  REQUIRED_RELEASE_COMMIT: 1a02c6ca5c707193475bb00f1b476e809a4af127
  APPROVAL_ID: v54cont-20260830-1834-et
  SESSION_START_AVAILABLE_USD: '48.0255'
  ORIGINAL_DAY_BASELINE_USD: '52.3155'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read current Gemini account and exact V5.4 campaign state
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE=$(cat <<EOF
          set -Eeuo pipefail
          REPO=/home/ssm-user/kalshi-arb-bot
          WORK=/opt/arb/gemini-v5-4-continuous-settlement-audit
          STATE=/home/ssm-user/gemini-adaptive-v5-4-continuous-live-state/${APPROVAL_ID}
          RISK_STATE=/home/ssm-user/gemini-adaptive-v5-4-risk-state
          IMAGE=arb-gemini-v5-4-settlement-audit:${REQUIRED_RELEASE_COMMIT:0:12}

          cd "\$REPO"
          git config --global --add safe.directory "\$REPO" || true
          git fetch origin ${REQUIRED_RELEASE_COMMIT} >/dev/null
          git worktree remove --force "\$WORK" >/dev/null 2>&1 || true
          rm -rf "\$WORK"
          git worktree prune
          git worktree add --detach "\$WORK" ${REQUIRED_RELEASE_COMMIT} >/dev/null
          test "\$(git -C "\$WORK" rev-parse HEAD)" = "${REQUIRED_RELEASE_COMMIT}"
          docker build -q -t "\$IMAGE" "\$WORK" >/dev/null

          if [ -f /opt/arb/secrets/gemini-short-crypto.env ]; then ENV_FILE=/opt/arb/secrets/gemini-short-crypto.env; else ENV_FILE=/home/ssm-user/kalshi-arb-bot/.env; fi
          if [ -d /home/ssm-user/gemini-short-crypto-state ]; then BASE_STATE=/home/ssm-user/gemini-short-crypto-state; else BASE_STATE=/opt/arb/gemini-short-crypto-state; fi
          test -f "\$ENV_FILE"
          test -d "\$STATE"
          test -f "\$RISK_STATE/daily-risk.json"

          docker run --rm -i --network host --env-file "\$ENV_FILE" \
            -e GEMINI_SHORT_CRYPTO_STATE_DIR=/base_state \
            -e GEMINI_Q10_PRODUCTION_STATE_DIR=/prod_state \
            -e GEMINI_ADAPTIVE_V5_4_RISK_STATE_DIR=/risk_state \
            -e GEMINI_Q10_PRODUCTION_LIVE=NO \
            -e GEMINI_Q10_PRODUCTION_ARM_ID= \
            -e GEMINI_Q10_PRODUCTION_ARM= \
            -e GEMINI_Q10_V5_RECOVERY_ARM= \
            -e GEMINI_Q10_V5_WATCHDOG_ARM= \
            -v "\$BASE_STATE:/base_state:ro" \
            -v "\$STATE:/prod_state:ro" \
            -v "\$RISK_STATE:/risk_state:ro" \
            "\$IMAGE" python - <<'PY'
          import asyncio, json
          from decimal import Decimal as D
          from src import gemini_adaptive_maker_daily_risk_v5_4 as daily
          from src import gemini_adaptive_maker_executor_v5_3 as v53
          from src import gemini_adaptive_maker_v5_3_recovery as recovery53

          SAFE_KEYS = (
              'clientOrderId','status','orderStatus','side','eventOutcome','price',
              'avgExecutionPrice','averageExecutionPrice','executedQty','filledQuantity',
              'quantity','type','timeInForce','rejectReason','reason','message','code'
          )

          def safe_row(row):
              if not isinstance(row, dict):
                  return None
              return {k: row.get(k) for k in SAFE_KEYS if k in row}

          async def main():
              recovery53.install()
              report, state, _, _ = await recovery53.audit()
              available, flat = await v53.v5.v1._preflight_flat()
              ledger = daily.load()
              state = state or {}
              symbol = str(state.get('symbol') or '')
              pending = state.get('pending_rescue') if isinstance(state.get('pending_rescue'), dict) else {}
              ids = {
                  'yes': state.get('yes_id'),
                  'no': state.get('no_id'),
                  'grace': state.get('grace_last_client_id'),
                  'rescue': pending.get('client_order_id'),
              }
              orders = {}
              for label, cid in ids.items():
                  if not cid or not symbol:
                      orders[label] = {'client_order_id': cid, 'row': None, 'filled': None}
                      continue
                  try:
                      row = await v53.v5.v1.base._order_by_client(str(cid), symbol)
                      filled = v53.v5.v1.base._filled(row) if row else D('0')
                      orders[label] = {
                          'client_order_id': str(cid),
                          'row': safe_row(row),
                          'filled': str(filled),
                      }
                  except Exception as exc:
                      orders[label] = {
                          'client_order_id': str(cid),
                          'lookup_error_type': type(exc).__name__,
                          'lookup_error': str(exc)[:180],
                      }

              session_start = D('${SESSION_START_AVAILABLE_USD}')
              original_day = D('${ORIGINAL_DAY_BASELINE_USD}')
              out = {
                  'classification': 'READ_ONLY_POST_SETTLEMENT_V5_4_CONTINUOUS_AUDIT',
                  'frozen_release_sha': '${REQUIRED_RELEASE_COMMIT}',
                  'approval_id': '${APPROVAL_ID}',
                  'audit': report.as_dict(),
                  'state_status': state.get('status'),
                  'state_open': state.get('open'),
                  'symbol': symbol or None,
                  'available_usd': str(available),
                  'session_start_available_usd': str(session_start),
                  'session_delta_usd': str(D(str(available)) - session_start),
                  'original_day_baseline_usd': str(original_day),
                  'day_delta_usd': str(D(str(available)) - original_day),
                  'flat': flat,
                  'risk_ledger': ledger,
                  'orders': orders,
                  'order_entry': False,
                  'venue_mutation': False,
              }
              print('V5_4_CONTINUOUS_SETTLEMENT_AUDIT='+json.dumps(out,separators=(',',':'),default=str))
              assert flat['orders'] == 0 and flat['positions'] == 0
              assert report.account_orders == 0 and report.account_positions == 0

          asyncio.run(main())
          PY
          EOF
          )
          ENC=$(printf '%s' "$REMOTE" | base64 -w0)
          PARAMS=$(jq -nc --arg cmd "echo '$ENC' | base64 -d | sudo -u ssm-user bash" '{commands:[$cmd]}')
          CID=$(aws ssm send-command \
            --instance-ids "$AWS_HOT_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "ARB read-only Gemini V5.4 continuous settlement audit" \
            --parameters "$PARAMS" \
            --timeout-seconds 480 \
            --query 'Command.CommandId' --output text)
          echo "SSM_COMMAND_ID=$CID"
          for _ in $(seq 1 240); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 2
          done
          RESULT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          OUT=$(jq -r '.Stdout // ""' <<<"$RESULT")
          grep -q 'V5_4_CONTINUOUS_SETTLEMENT_AUDIT=' <<<"$OUT"
          grep -q '"order_entry":false' <<<"$OUT"
          grep -q '"venue_mutation":false' <<<"$OUT"
