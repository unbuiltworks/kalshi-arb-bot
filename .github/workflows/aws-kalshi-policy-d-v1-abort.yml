name: AWS Kalshi Policy-D V1 abort pending launcher

on:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/kalshi-policy-d-v1-abort.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer

jobs:
  abort:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Stop pending launcher and ensure live container absent
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_CMD="set -eu; pkill -TERM -f '/tmp/run_kalshi_policy_d_v1[.]sh' || true; docker rm -f arb-kalshi-policy-d-v1-q1-canary >/dev/null 2>&1 || true; sleep 1; if pgrep -f '/tmp/run_kalshi_policy_d_v1[.]sh' >/dev/null; then echo POLICY_D_ABORT_FAILED_PENDING_PROCESS; exit 2; fi; if docker inspect arb-kalshi-policy-d-v1-q1-canary >/dev/null 2>&1; then echo POLICY_D_ABORT_FAILED_CONTAINER_PRESENT; exit 3; fi; echo POLICY_D_ABORT_CONFIRMED order_entry_not_asserted=true container_absent=true"
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "Abort pending ARB Policy-D launcher before arm" --parameters "$PARAMETERS" --timeout-seconds 120 --query 'Command.CommandId' --output text)
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 2
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}'
          test "$STATUS" = "Success"
