name: AWS Gemini dynamic initial-entry q1 replay

on:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/gemini-dynamic-initial-entry-q1-replay.trigger
      - .github/workflows/aws-gemini-dynamic-initial-entry-q1-replay.yml

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  SOURCE_BRANCH: feature/gemini-incentive-mm-dynamic-complement-q1

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation

      - name: Read shadow replay trigger
        id: trigger
        shell: bash
        run: |
          set -euo pipefail
          FILE=deploy/aws/gemini-dynamic-initial-entry-q1-replay.trigger
          PINNED_COMMIT=$(awk -F= '$1=="PINNED_COMMIT"{print $2}' "$FILE" | tr -d '[:space:]')
          SOURCE_RUN_ID=$(awk -F= '$1=="SOURCE_RUN_ID"{print $2}' "$FILE" | tr -d '[:space:]')
          CLASSIFICATION=$(awk -F= '$1=="CLASSIFICATION"{print $2}' "$FILE" | tr -d '[:space:]')
          ORDER_ENTRY=$(awk -F= '$1=="ORDER_ENTRY"{print $2}' "$FILE" | tr -d '[:space:]')
          [[ "$PINNED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[A-Za-z0-9._-]+$ ]]
          test "$CLASSIFICATION" = "SHADOW_REPLAY_NOT_REALIZED"
          test "$ORDER_ENTRY" = "false"
          echo "pinned_commit=$PINNED_COMMIT" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "DYNAMIC_ENTRY_Q1_REPLAY_TRIGGER commit=${PINNED_COMMIT:0:12} source_run=$SOURCE_RUN_ID order_entry=false"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Replay retained public tape
        shell: bash
        env:
          PINNED_COMMIT: ${{ steps.trigger.outputs.pinned_commit }}
          SOURCE_RUN_ID: ${{ steps.trigger.outputs.source_run_id }}
        run: |
          set -euo pipefail
          SHORT_SHA="${PINNED_COMMIT:0:12}"
          REMOTE_CMD="sudo -u ssm-user bash -lc 'set -euo pipefail; REPO=/home/ssm-user/kalshi-arb-bot; SOURCE=/home/ssm-user/gemini-l5-dynamic-shadow-v2-state/${SOURCE_RUN_ID}/capture.jsonl; WORK=/opt/arb/gemini-dynamic-initial-entry-q1-replay; OUT=/home/ssm-user/gemini-dynamic-initial-entry-q1-replay-state/${SOURCE_RUN_ID}-${SHORT_SHA}; test -f \"\$SOURCE\"; git -C \"\$REPO\" config --global --add safe.directory \"\$REPO\" || true; git -C \"\$REPO\" fetch origin ${SOURCE_BRANCH}; git -C \"\$REPO\" cat-file -e \"${PINNED_COMMIT}^{commit}\"; git -C \"\$REPO\" merge-base --is-ancestor \"${PINNED_COMMIT}\" origin/${SOURCE_BRANCH}; git -C \"\$REPO\" worktree remove --force \"\$WORK\" >/dev/null 2>&1 || true; rm -rf \"\$WORK\"; git -C \"\$REPO\" worktree prune; git -C \"\$REPO\" worktree add --detach \"\$WORK\" \"${PINNED_COMMIT}\"; test \"\$(git -C \"\$WORK\" rev-parse HEAD)\" = \"${PINNED_COMMIT}\"; mkdir -p \"\$OUT\"; IMAGE=arb-gemini-dynamic-initial-entry-q1-replay:${SHORT_SHA}; docker build -t \"\$IMAGE\" \"\$WORK\" >/dev/null; docker run --rm --network none \"\$IMAGE\" python -m pytest -q tests/test_gemini_incentive_mm_dynamic_complement.py tests/test_gemini_dynamic_initial_entry_replay_q1.py; echo DYNAMIC_ENTRY_Q1_TOUCH_BEGIN; docker run --rm --network none -v \"\$SOURCE:/input/capture.jsonl:ro\" -v \"\$OUT:/output\" \"\$IMAGE\" python -m src.gemini_dynamic_initial_entry_replay_q1 --input /input/capture.jsonl --output /output/touch.json --asset ETH --horizon 5m --evidence-mode TAPE_TOUCH_OPTIMISTIC --compact; echo DYNAMIC_ENTRY_Q1_TOUCH_END; echo DYNAMIC_ENTRY_Q1_STRICT_BEGIN; docker run --rm --network none -v \"\$SOURCE:/input/capture.jsonl:ro\" -v \"\$OUT:/output\" \"\$IMAGE\" python -m src.gemini_dynamic_initial_entry_replay_q1 --input /input/capture.jsonl --output /output/strict.json --asset ETH --horizon 5m --evidence-mode STRICT_TRADE_THROUGH --compact; echo DYNAMIC_ENTRY_Q1_STRICT_END; echo DYNAMIC_ENTRY_Q1_REPLAY_OUTPUT=\$OUT; echo DYNAMIC_ENTRY_Q1_REPLAY_CLASSIFICATION=SHADOW_REPLAY_NOT_REALIZED order_entry=false credentials_loaded=false'"
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB Gemini q1 initial-entry shadow replay ${SHORT_SHA}" --parameters "$PARAMETERS" --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" || true
          RESULT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = "Success"
          stdout=$(jq -r '.Stdout // ""' <<<"$RESULT")
          grep -q 'DYNAMIC_ENTRY_Q1_TOUCH_BEGIN' <<<"$stdout"
          grep -q 'DYNAMIC_ENTRY_Q1_STRICT_BEGIN' <<<"$stdout"
          grep -q 'SHADOW_REPLAY_NOT_REALIZED' <<<"$stdout"
          grep -q 'order_entry=false credentials_loaded=false' <<<"$stdout"
