name: AWS l5 realtime shadow mirror

on:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/l5-realtime-shadow-mirror.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  CONTAINER_NAME: arb-l5-realtime-shadow-mirror

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation
      - name: Read trigger
        id: trigger
        shell: bash
        run: |
          set -euo pipefail
          FILE=deploy/aws/l5-realtime-shadow-mirror.trigger
          PINNED_COMMIT=$(awk -F= '$1=="PINNED_COMMIT"{print $2}' "$FILE" | tr -d '[:space:]')
          RUN_ID=$(awk -F= '$1=="RUN_ID"{print $2}' "$FILE" | tr -d '[:space:]')
          DURATION_S=$(awk -F= '$1=="DURATION_S"{print $2}' "$FILE" | tr -d '[:space:]')
          [[ "$PINNED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUN_ID" =~ ^[0-9A-Za-z._-]+$ ]]
          [[ "$DURATION_S" =~ ^[0-9]+$ ]]
          echo "pinned_commit=$PINNED_COMMIT" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "duration_s=$DURATION_S" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build tested image and launch read-only mirror
        shell: bash
        env:
          PINNED_COMMIT: ${{ steps.trigger.outputs.pinned_commit }}
          RUN_ID: ${{ steps.trigger.outputs.run_id }}
          DURATION_S: ${{ steps.trigger.outputs.duration_s }}
        run: |
          set -Eeuo pipefail
          SHORT_SHA="${PINNED_COMMIT:0:12}"
          REMOTE_SCRIPT=$(cat <<EOF
          set -Eeuo pipefail
          REPO=/home/ssm-user/kalshi-arb-bot
          WORK=/home/ssm-user/l5-realtime-shadow-build-${RUN_ID}
          ROOT=/home/ssm-user/l5-realtime-shadow-state/${RUN_ID}
          IMAGE=arb-l5-realtime-shadow-mirror:${SHORT_SHA}
          NAME=${CONTAINER_NAME}
          git config --global --add safe.directory "\$REPO" || true
          cd "\$REPO"
          git fetch origin ${PINNED_COMMIT}
          git worktree remove --force "\$WORK" >/dev/null 2>&1 || true
          rm -rf "\$WORK"
          git worktree add --detach "\$WORK" ${PINNED_COMMIT}
          test "\$(git -C "\$WORK" rev-parse HEAD)" = "${PINNED_COMMIT}"
          docker build -f "\$WORK/Dockerfile.l5-mirror" -t "\$IMAGE" "\$WORK"
          mkdir -p "\$ROOT"
          cat >"\$ROOT/run-metadata.json" <<META
          {"run_id":"${RUN_ID}","commit":"${PINNED_COMMIT}","duration_s":${DURATION_S},"classification":"READ_ONLY_L5_REALTIME_SHADOW_NOT_REALIZED","order_entry":false,"credentials_loaded":false}
          META
          docker rm -f "\$NAME" >/dev/null 2>&1 || true
          docker run -d --name "\$NAME" --restart=no \
            -v "\$ROOT:/output" \
            "\$IMAGE" \
            python -m src.l5_realtime_shadow_mirror \
              --output-dir /output \
              --duration-seconds ${DURATION_S} \
              --book-poll-seconds 1 \
              --trade-poll-seconds 2
          sleep 8
          test "\$(docker inspect -f '{{.State.Running}}' "\$NAME")" = true
          test -s "\$ROOT/mirror.jsonl"
          grep -q 'MIRROR_STARTED' "\$ROOT/mirror.jsonl"
          echo "L5_REALTIME_SHADOW_STARTED run_id=${RUN_ID} commit=${PINNED_COMMIT} duration_s=${DURATION_S} order_entry=false credentials_loaded=false"
          echo "rows=\$(wc -l <"\$ROOT/mirror.jsonl")"
          docker logs --tail 20 "\$NAME" || true
          git -C "\$REPO" worktree remove --force "\$WORK" >/dev/null 2>&1 || true
          EOF
          )
          ENCODED=$(printf '%s' "$REMOTE_SCRIPT" | base64 -w0)
          REMOTE_CMD="echo '$ENCODED' | base64 -d | sudo -u ssm-user bash"
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB l5 realtime shadow ${RUN_ID}" --parameters "$PARAMETERS" --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" || true
          RESULT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          grep -q 'L5_REALTIME_SHADOW_STARTED' <<<"$(jq -r '.Stdout // ""' <<<"$RESULT")"
