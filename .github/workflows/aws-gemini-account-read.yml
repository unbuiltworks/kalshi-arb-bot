name: AWS Gemini account exposure read

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - deploy/aws/gemini-account-read.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Read Gemini prediction exposure
        shell: bash
        run: |
          set -euo pipefail
          REMOTE=$(cat <<'EOF'
          sudo -u ssm-user bash -lc 'set -euo pipefail
          ENV_FILE=/opt/arb/secrets/gemini-short-crypto.env
          [ -f "$ENV_FILE" ] || ENV_FILE=/home/ssm-user/kalshi-arb-bot/.env
          IMAGE=arb-gemini-l5-incremental:q1-9942a8cfeb6e
          docker image inspect "$IMAGE" >/dev/null
          docker run --rm --network host --env-file "$ENV_FILE" "$IMAGE" python - <<"PY"
import asyncio, json
from decimal import Decimal as D
from src.gemini_prediction_auth import private_rest_request

async def post(path, params):
    r = await private_rest_request("POST", path, params=params, timeout=8.0)
    if r.status_code != 200:
        raise RuntimeError(f"read failed {path} http={r.status_code}")
    x = r.json()
    return x if isinstance(x, dict) else {}

async def main():
    active = await post("/v1/prediction-markets/orders/active", {"limit":1000,"offset":0})
    positions = await post("/v1/prediction-markets/positions", {"limit":1000,"offset":0,"sort":"+expiryDate"})
    orders = active.get("orders") if isinstance(active.get("orders"), list) else []
    pos = positions.get("positions") if isinstance(positions.get("positions"), list) else []
    nonzero=[]
    for r in pos:
        if not isinstance(r,dict):
            continue
        try: q=D(str(r.get("totalQuantity") or "0"))
        except Exception: q=D("0")
        if q>0:
            nonzero.append({"symbol":str(r.get("symbol") or ""),"qty":str(q),"eventOutcome":str(r.get("eventOutcome") or r.get("outcome") or "")})
    print(json.dumps({"type":"GEMINI_ACCOUNT_EXPOSURE_READ","active_prediction_orders":len(orders),"nonzero_prediction_positions":nonzero,"mutation":False,"order_entry":False}, sort_keys=True))
asyncio.run(main())
PY'
          EOF
          )
          PARAMS=$(jq -nc --arg cmd "$REMOTE" '{commands:[$cmd]}')
          CID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --parameters "$PARAMS" --query 'Command.CommandId' --output text)
          for i in $(seq 1 60); do
            S=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$S" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 2
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}'
