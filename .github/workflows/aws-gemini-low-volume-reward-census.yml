name: AWS Gemini low-volume reward census

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - deploy/aws/gemini-low-volume-reward-census.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  FEATURE_BRANCH: feature/gemini-low-volume-reward-allocator

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Run public-only reward scarcity census
        shell: bash
        run: |
          set -Eeuo pipefail
          PINNED_COMMIT=$(awk -F= '$1=="PINNED_COMMIT"{print $2}' deploy/aws/gemini-low-volume-reward-census.trigger | tr -d '[:space:]')
          SHORT_SHA="${PINNED_COMMIT:0:12}"
          REMOTE_CMD="sudo -u ssm-user bash -lc 'set -Eeuo pipefail; REPO=/home/ssm-user/kalshi-arb-bot; WORK=/opt/arb/gemini-low-volume-reward-census; git -C \"\$REPO\" fetch origin ${FEATURE_BRANCH}; test \"\$(git -C \"\$REPO\" rev-parse origin/${FEATURE_BRANCH})\" = \"${PINNED_COMMIT}\"; git -C \"\$REPO\" worktree remove --force \"\$WORK\" >/dev/null 2>&1 || true; rm -rf \"\$WORK\"; git -C \"\$REPO\" worktree prune; git -C \"\$REPO\" worktree add --detach \"\$WORK\" \"${PINNED_COMMIT}\"; IMAGE=arb-gemini-low-volume-census:${SHORT_SHA}; docker build -t \"\$IMAGE\" \"\$WORK\" >/dev/null; docker run --rm --network none \"\$IMAGE\" python -m pytest -q tests/test_gemini_low_volume_reward_allocator.py; docker run --rm --network host \"\$IMAGE\" python -m src.gemini_low_volume_reward_allocator'"
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB public Gemini reward scarcity census" --parameters "$PARAMETERS" --timeout-seconds 480 --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" || true
          RESULT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          grep -q 'GEMINI_LOW_VOLUME_REWARD_CENSUS=' <<<"$(jq -r '.Stdout // ""' <<<"$RESULT")"
