name: AWS Gemini q10 production candidate live

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - deploy/aws/gemini-q10-production-live.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  RELEASE_BRANCH: release/gemini-q10-production-v4
  REQUIRED_RELEASE_COMMIT: 123fd0bdf1b424572aa0c5e00f57754e356f7e14

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate fresh live authorization trigger
        id: gate
        shell: bash
        run: |
          set -Eeuo pipefail
          TRIGGER=deploy/aws/gemini-q10-production-live.trigger
          test -f "$TRIGGER"
          PINNED_COMMIT=$(awk -F= '$1=="PINNED_COMMIT"{print $2}' "$TRIGGER" | tr -d '[:space:]')
          APPROVAL_ID=$(awk -F= '$1=="APPROVAL_ID"{print $2}' "$TRIGGER" | tr -d '[:space:]')
          CLASSIFICATION=$(awk -F= '$1=="CLASSIFICATION"{print $2}' "$TRIGGER" | tr -d '\r')
          LIVE_AUTHORIZATION=$(awk -F= '$1=="LIVE_AUTHORIZATION"{print $2}' "$TRIGGER" | tr -d '\r')
          test "$PINNED_COMMIT" = "$REQUIRED_RELEASE_COMMIT"
          test -n "$APPROVAL_ID"
          test "$CLASSIFICATION" = "FRESH_USER_APPROVED_ONE_Q10_BTC5_V4_CAMPAIGN"
          test "$LIVE_AUTHORIZATION" = "EXPLICIT_USER_APPROVAL_Q10_PRODUCTION_V4"
          echo "pinned=$PINNED_COMMIT" >> "$GITHUB_OUTPUT"
          echo "approval=$APPROVAL_ID" >> "$GITHUB_OUTPUT"
          echo "Authorization gate accepted for one bounded V4 campaign; no auto restart."
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build exact release, test, preflight, and run one campaign
        shell: bash
        env:
          PINNED_COMMIT: ${{ steps.gate.outputs.pinned }}
          APPROVAL_ID: ${{ steps.gate.outputs.approval }}
        run: |
          set -Eeuo pipefail
          SHORT_SHA="${PINNED_COMMIT:0:12}"
          REMOTE_SCRIPT=$(cat <<EOF
          set -Eeuo pipefail
          REPO=/home/ssm-user/kalshi-arb-bot
          WORK=/opt/arb/gemini-q10-production-live
          STATE_ROOT=/home/ssm-user/gemini-q10-production-state/${APPROVAL_ID}
          RELEASE_BRANCH=${RELEASE_BRANCH}
          PINNED_COMMIT=${PINNED_COMMIT}
          APPROVAL_ID=${APPROVAL_ID}
          git -C "\$REPO" fetch origin "\$RELEASE_BRANCH"
          ACTUAL_RELEASE_COMMIT=\$(git -C "\$REPO" rev-parse "origin/\$RELEASE_BRANCH")
          test "\$ACTUAL_RELEASE_COMMIT" = "\$PINNED_COMMIT"
          git -C "\$REPO" worktree remove --force "\$WORK" >/dev/null 2>&1 || true
          rm -rf "\$WORK"
          git -C "\$REPO" worktree prune
          git -C "\$REPO" worktree add --detach "\$WORK" "\$PINNED_COMMIT"
          IMAGE="arb-gemini-q10-production-live:${SHORT_SHA}"
          docker build -t "\$IMAGE" "\$WORK" >/dev/null

          echo '=== PRODUCTION FOCUSED SAFETY TESTS ==='
          docker run --rm --network none "\$IMAGE" python -m pytest -q \
            tests/test_gemini_q10_production_risk.py \
            tests/test_gemini_q10_production_candidate.py \
            tests/test_gemini_q10_production_candidate_v2.py \
            tests/test_gemini_q10_production_candidate_v3.py \
            tests/test_gemini_q10_nonce_safe_status.py \
            tests/test_gemini_liquidity_reward_dynamic_completion_q10.py \
            tests/test_gemini_liquidity_reward_live_probe_q10.py \
            tests/test_gemini_short_crypto_dynamic_complement_q1_v2.py

          if [ -f /opt/arb/secrets/gemini-short-crypto.env ]; then
            ENV_FILE=/opt/arb/secrets/gemini-short-crypto.env
          else
            ENV_FILE=/home/ssm-user/kalshi-arb-bot/.env
          fi
          test -f "\$ENV_FILE"
          mkdir -p "\$STATE_ROOT"
          chmod 700 "\$STATE_ROOT"

          echo '=== FRESH READ-ONLY ACCOUNT PREFLIGHT ==='
          docker run --rm --network host --env-file "\$ENV_FILE" \
            -e GEMINI_SHORT_CRYPTO_STATE_DIR=/preflight-state \
            -v /home/ssm-user/gemini-short-crypto-state:/preflight-state \
            "\$IMAGE" python -c 'import asyncio,json; from src import gemini_short_crypto_local_budget as local; snap=asyncio.run(local.account_exposure_snapshot()); print("Q10_PRODUCTION_PREFLIGHT="+json.dumps(dict(local_open_state=local.local_open_state(), **snap),default=str,sort_keys=True)); assert local.local_open_state() is None; assert int(snap.get("active_short_crypto_orders") or 0)==0; assert int(snap.get("active_short_crypto_positions") or 0)==0'

          echo '=== ONE LIVE Q10 BTC5 CAMPAIGN ==='
          docker run --rm --network host --env-file "\$ENV_FILE" \
            -e GEMINI_Q10_PRODUCTION_LIVE=1 \
            -e GEMINI_Q10_PRODUCTION_RUN_ID="\$APPROVAL_ID" \
            -e GEMINI_Q10_PRODUCTION_ARM="\$APPROVAL_ID" \
            -e GEMINI_Q10_PRODUCTION_STATE_DIR=/state \
            -v "\$STATE_ROOT:/state" \
            "\$IMAGE" python -m src.gemini_q10_production_candidate_v3

          echo '=== POST-CAMPAIGN READ-ONLY ACCOUNT SNAPSHOT ==='
          docker run --rm --network host --env-file "\$ENV_FILE" \
            -e GEMINI_SHORT_CRYPTO_STATE_DIR=/preflight-state \
            -v /home/ssm-user/gemini-short-crypto-state:/preflight-state \
            "\$IMAGE" python -c 'import asyncio,json; from src import gemini_short_crypto_local_budget as local; snap=asyncio.run(local.account_exposure_snapshot()); print("Q10_PRODUCTION_POST="+json.dumps(dict(local_open_state=local.local_open_state(), **snap),default=str,sort_keys=True))'
          echo "Q10_PRODUCTION_LIVE_WORKFLOW_COMPLETE approval_id=\$APPROVAL_ID pinned_commit=\$PINNED_COMMIT"
          EOF
          )
          ENCODED=$(printf '%s' "$REMOTE_SCRIPT" | base64 -w0)
          REMOTE_CMD="echo '$ENCODED' | base64 -d | sudo -u ssm-user bash"
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB one user-approved Gemini q10 production V4 campaign" --parameters "$PARAMETERS" --timeout-seconds 840 --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" || true
          RESULT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          grep -q 'Q10_PRODUCTION_LIVE_WORKFLOW_COMPLETE' <<<"$(jq -r '.Stdout // ""' <<<"$RESULT")"
