name: Gemini crypto5 live volume now

on:
  push:
    branches:
      - feature/gemini-l5-volume-gate-v1
    paths:
      - '.github/workflows/gemini-crypto5-live-volume-now.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Print current 5m crypto USD volumes
        run: |
          python - <<'PY'
          import asyncio, json
          from decimal import Decimal as D
          import httpx
          from src.gemini_crypto5_l5_policy_matrix_shadow import discover_crypto5_with_volume

          async def main():
              async with httpx.AsyncClient(timeout=8.0, follow_redirects=True) as http:
                  for i in range(4):
                      events, volumes = await discover_crypto5_with_volume(http, max_seconds_to_expiry=650)
                      rows=[]
                      for symbol,event in sorted(events.items(), key=lambda kv:(kv[1].expiry_ms,kv[1].asset)):
                          if 0 < event.seconds_to_expiry <= 300:
                              rows.append({
                                  'asset':event.asset,
                                  'ticker':event.ticker,
                                  'symbol':event.symbol,
                                  'seconds_to_expiry':round(event.seconds_to_expiry,1),
                                  'volume_usd':str(volumes.get(symbol,D('0'))),
                              })
                      print(json.dumps({'sample':i+1,'rows':rows}, sort_keys=True), flush=True)
                      if i < 3:
                          await asyncio.sleep(5)
          asyncio.run(main())
          PY
