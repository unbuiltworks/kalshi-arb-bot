name: AWS Gemini incentive MM q1 live

on:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/gemini-incentive-mm-q1-live.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation

      - name: Read one-use approval trigger
        id: trigger
        shell: bash
        run: |
          set -euo pipefail
          FILE=deploy/aws/gemini-incentive-mm-q1-live.trigger
          test -f "$FILE"
          PINNED_COMMIT=$(awk -F= '$1=="PINNED_COMMIT"{print $2}' "$FILE" | tr -d '[:space:]')
          APPROVAL_ID=$(awk -F= '$1=="APPROVAL_ID"{print $2}' "$FILE" | tr -d '[:space:]')
          CLASSIFICATION=$(awk -F= '$1=="CLASSIFICATION"{print $2}' "$FILE" | tr -d '[:space:]')
          [[ "$PINNED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APPROVAL_ID" =~ ^[A-Za-z0-9_-]+$ ]]
          test "$CLASSIFICATION" = "FRESH_USER_APPROVED_Q1_LIVE_PROBE"
          echo "pinned_commit=$PINNED_COMMIT" >> "$GITHUB_OUTPUT"
          echo "approval_id=$APPROVAL_ID" >> "$GITHUB_OUTPUT"
          echo "INCENTIVE_MM_Q1_TRIGGER commit=${PINNED_COMMIT:0:12} approval_id=$APPROVAL_ID"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Launch exact pinned q1 probe through SSM
        shell: bash
        env:
          PINNED_COMMIT: ${{ steps.trigger.outputs.pinned_commit }}
          APPROVAL_ID: ${{ steps.trigger.outputs.approval_id }}
        run: |
          set -euo pipefail
          REMOTE_CMD="sudo -u ssm-user bash -lc 'set -euo pipefail; cd /home/ssm-user/kalshi-arb-bot; git fetch origin feature/gemini-incentive-mm-live-probe-q1 >/dev/null; git cat-file -e \"${PINNED_COMMIT}^{commit}\"; git show ${PINNED_COMMIT}:deploy/aws/run_gemini_incentive_mm_live_probe_q1.sh > /tmp/run_gemini_incentive_mm_live_probe_q1.sh; chmod 0700 /tmp/run_gemini_incentive_mm_live_probe_q1.sh; PINNED_COMMIT=${PINNED_COMMIT} ARB_GEMINI_INCENTIVE_MM_Q1_APPROVED=YES ARB_GEMINI_INCENTIVE_MM_Q1_APPROVAL_ID=${APPROVAL_ID} /tmp/run_gemini_incentive_mm_live_probe_q1.sh'"
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$AWS_HOT_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "ARB Gemini incentive MM q1 live ${PINNED_COMMIT:0:12}" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" || true
          mkdir -p runtime
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$AWS_HOT_INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            > runtime/aws-gemini-incentive-mm-q1-live-last.json
          cat runtime/aws-gemini-incentive-mm-q1-live-last.json
          test "$(jq -r '.Status' runtime/aws-gemini-incentive-mm-q1-live-last.json)" = "Success"

      - name: Upload non-secret launch evidence
        uses: actions/upload-artifact@v4
        with:
          name: aws-gemini-incentive-mm-q1-live
          path: runtime/aws-gemini-incentive-mm-q1-live-last.json
          retention-days: 3
