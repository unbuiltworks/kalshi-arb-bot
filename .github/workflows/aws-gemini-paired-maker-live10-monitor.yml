name: AWS Gemini paired-maker live10 monitor

on:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/monitor_gemini_paired_maker_live10.sh
      - .github/workflows/aws-gemini-paired-maker-live10-monitor.yml

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Monitor existing live10 container only
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_CMD="sudo -u ssm-user bash -lc 'set -euo pipefail; cd /home/ssm-user/kalshi-arb-bot; git fetch origin aws-migration-foundation >/dev/null; git show origin/aws-migration-foundation:deploy/aws/monitor_gemini_paired_maker_live10.sh > /tmp/monitor_gemini_paired_maker_live10.sh; chmod 0700 /tmp/monitor_gemini_paired_maker_live10.sh; /tmp/monitor_gemini_paired_maker_live10.sh'"
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB paired-maker live10 read-only monitor" --parameters "$PARAMETERS" --timeout-seconds 5000 --query 'Command.CommandId' --output text)
          for i in $(seq 1 500); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 10
          done
          mkdir -p runtime
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' > runtime/aws-gemini-paired-maker-live10-monitor.json
          cat runtime/aws-gemini-paired-maker-live10-monitor.json
          test "$(jq -r '.Status' runtime/aws-gemini-paired-maker-live10-monitor.json)" = "Success"
          grep -q 'PAIRED_MAKER_LIVE10_CLEAN_TERMINAL_OK' <<<"$(jq -r '.Stdout' runtime/aws-gemini-paired-maker-live10-monitor.json)"

      - name: Upload monitor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-gemini-paired-maker-live10-monitor
          path: runtime/aws-gemini-paired-maker-live10-monitor.json
          retention-days: 3
