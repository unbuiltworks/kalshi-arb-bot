name: AWS PMUS q1 current-schema stage

on:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/pmus-q1-schema-v2-stage.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer

jobs:
  patch_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Apply post-only hardening v3 and test fail-closed behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          PATCH_B64=$(base64 -w0 deploy/aws/patch_pmus_q1_hardening_v3.py)
          REMOTE=$(cat <<EOF
          set -Eeuo pipefail
          STAGE=/home/ssm-user/l5-pmus-q1-stage
          printf '%s' '$PATCH_B64' | base64 -d > /tmp/patch_pmus_q1_hardening_v3.py
          python3 /tmp/patch_pmus_q1_hardening_v3.py
          rm -f /tmp/patch_pmus_q1_hardening_v3.py
          python3 -m py_compile "\$STAGE/src/pmus_q1_executor.py"
          export PYTHONPATH="\$STAGE"
          export PMUS_Q1_STATE_DIR=/tmp/pmus-q1-v3-test
          rm -rf "\$PMUS_Q1_STATE_DIR"
          python3 - <<'PY'
          from decimal import Decimal as D
          from urllib.error import HTTPError
          from src import pmus_q1_executor as e
          class Stale:
              def __init__(self): self.posts=0
              def request(self,m,p,body=None,base=e.API):
                  if p=='/v1/order/preview': return {'order':{'marketSlug':'m'}}
                  if p.endswith('/bbo'): return {'marketData':{'bestBid':{'value':'0.470'},'bestAsk':{'value':'0.475'}}}
                  if p=='/v1/orders': self.posts+=1; raise AssertionError('mutation')
                  raise AssertionError((m,p))
          f=Stale()
          try: e.place_limit_buy(f,'m','OUTCOME_SIDE_YES',D('0.475'),'first_leg'); raise AssertionError('expected refuse')
          except e.Halt as x: assert 'POST_ONLY_STALE_REFUSE' in str(x)
          assert f.posts==0
          class R:
              def __init__(self): self.n=0
              def request(self,m,p,body=None,base=e.API):
                  self.n+=1
                  if self.n==1: raise HTTPError('x',404,'Not Found',None,None)
                  if self.n==2: raise HTTPError('x',429,'Too Many Requests',None,None)
                  return {'order':{'id':'abc','state':'ORDER_STATE_REJECTED','cumQuantity':0}}
          r=R()
          try: e._order_status(r,'abc'); raise AssertionError('expected rejected')
          except e.RejectedNoFill: pass
          assert r.n==3
          print('PMUS_Q1_HARDENING_V3_TESTS_OK stale_post_only_refused=true mutation_replay=false get_404_429_retry=true rejected_zero_fill_terminal=true live_order=false')
          PY
          rm -rf /tmp/pmus-q1-v3-test
          EOF
          )
          ENC=$(printf '%s' "$REMOTE" | base64 -w0)
          PARAMS=$(jq -nc --arg cmd "echo '$ENC' | base64 -d | sudo -u ssm-user bash" '{commands:[$cmd]}')
          CID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment 'L5 PMUS q1 hardening v3 test only' --parameters "$PARAMS" --timeout-seconds 180 --query 'Command.CommandId' --output text)
          for _ in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 2
          done
          RESULT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          OUT=$(jq -r '.Stdout' <<<"$RESULT")
          grep -q 'PMUS_Q1_HARDENING_V3_PATCH_OK' <<<"$OUT"
          grep -q 'PMUS_Q1_HARDENING_V3_TESTS_OK' <<<"$OUT"
