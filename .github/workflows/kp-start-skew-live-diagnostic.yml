name: KP Start Skew Live Diagnostic

on:
  push:
    branches:
      - 'feature/kp-start-skew-live-diagnostic-run'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run read-only K/P MLB start-skew diagnostic
        run: python -m src.sports_kp_mlb_start_skew_diagnostic
