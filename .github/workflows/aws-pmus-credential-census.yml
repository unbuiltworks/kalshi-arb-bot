name: AWS PMUS credential presence census

on:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/pmus-credential-census.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  PMUS_REPO_KEY: ${{ secrets.PMUS_API_KEY_ID }}
  PMUS_REPO_SECRET: ${{ secrets.PMUS_API_SECRET_KEY }}

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check credential locations without reading values
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${PMUS_REPO_KEY:-}" && -n "${PMUS_REPO_SECRET:-}" ]]; then
            echo PMUS_GITHUB_SECRETS=PAIR_PRESENT
          else
            echo PMUS_GITHUB_SECRETS=PAIR_MISSING
          fi

          echo PMUS_AWS_PARAMETER_NAMES_BEGIN
          aws ssm describe-parameters --max-results 50 \
            --query "Parameters[?contains(Name, 'PMUS') || contains(Name, 'pmus')].Name" \
            --output text 2>/dev/null || echo SSM_PARAMETER_LIST_UNAVAILABLE
          echo PMUS_AWS_PARAMETER_NAMES_END

          echo PMUS_AWS_SECRET_NAMES_BEGIN
          aws secretsmanager list-secrets --max-results 50 \
            --query "SecretList[?contains(Name, 'PMUS') || contains(Name, 'pmus')].Name" \
            --output text 2>/dev/null || echo SECRETS_LIST_UNAVAILABLE
          echo PMUS_AWS_SECRET_NAMES_END

          REMOTE=$(cat <<'EOF'
          set -Eeuo pipefail
          echo PMUS_HOST_CREDENTIAL_CENSUS_BEGIN
          found=0
          for f in /home/ssm-user/kalshi-arb-bot/.env /home/ssm-user/kalshi-arb-bot/.env.* /home/ssm-user/.env /home/ssm-user/.env.*; do
            [[ -f "$f" ]] || continue
            k=0; s=0
            grep -q '^PMUS_API_KEY_ID=' "$f" && k=1 || true
            grep -q '^PMUS_API_SECRET_KEY=' "$f" && s=1 || true
            if [[ $k -eq 1 || $s -eq 1 ]]; then
              echo "LOCAL_ENV_FILE path=$f key_name_present=$k secret_name_present=$s"
              found=1
            fi
          done
          while read -r c; do
            [[ -n "$c" ]] || continue
            names=$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$c" 2>/dev/null | cut -d= -f1 | grep '^PMUS_' || true)
            if [[ -n "$names" ]]; then
              echo "CONTAINER_ENV_NAMES container=$c names=$(echo "$names" | paste -sd, -)"
              found=1
            fi
          done < <(docker ps -aq || true)
          [[ $found -eq 1 ]] || echo PMUS_LOCAL_CREDENTIAL_NAMES=NONE
          echo PMUS_HOST_CREDENTIAL_CENSUS_END
          EOF
          )
          ENC=$(printf '%s' "$REMOTE" | base64 -w0)
          PARAMS=$(jq -nc --arg cmd "echo '$ENC' | base64 -d | sudo -u ssm-user bash" '{commands:[$cmd]}')
          CID=$(aws ssm send-command \
            --instance-ids "$AWS_HOT_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "L5 PMUS credential presence census; names only" \
            --parameters "$PARAMS" --timeout-seconds 60 \
            --query 'Command.CommandId' --output text)
          for _ in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 2
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json
