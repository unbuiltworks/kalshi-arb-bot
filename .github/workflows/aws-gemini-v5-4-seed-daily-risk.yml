name: AWS Gemini V5.4 seed persistent daily risk

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - .github/workflows/aws-gemini-v5-4-seed-daily-risk.yml

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  REQUIRED_RELEASE_COMMIT: 1a02c6ca5c707193475bb00f1b476e809a4af127
  INCIDENT_BASELINE_USD: '52.3155'
  EXPECTED_SETTLED_AVAILABLE_USD: '48.0255'
  INCIDENT_DATE_UTC: '2026-08-30'

jobs:
  seed-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Seed account-level daily loss ledger without order entry
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE=$(cat <<EOF
          set -Eeuo pipefail
          REPO=/home/ssm-user/kalshi-arb-bot
          WORK=/opt/arb/gemini-adaptive-v5-4-risk-seed
          RISK=/home/ssm-user/gemini-adaptive-v5-4-risk
          IMAGE=arb-gemini-adaptive-v5-4-risk:${REQUIRED_RELEASE_COMMIT:0:12}
          cd "\$REPO"
          git config --global --add safe.directory "\$REPO" || true
          git fetch origin ${REQUIRED_RELEASE_COMMIT} >/dev/null
          git worktree remove --force "\$WORK" >/dev/null 2>&1 || true
          rm -rf "\$WORK"
          git worktree prune
          git worktree add --detach "\$WORK" ${REQUIRED_RELEASE_COMMIT} >/dev/null
          docker build -q -t "\$IMAGE" "\$WORK" >/dev/null
          if [ -f /opt/arb/secrets/gemini-short-crypto.env ]; then ENV_FILE=/opt/arb/secrets/gemini-short-crypto.env; else ENV_FILE=/home/ssm-user/kalshi-arb-bot/.env; fi
          if [ -d /home/ssm-user/gemini-short-crypto-state ]; then BASE_STATE=/home/ssm-user/gemini-short-crypto-state; else BASE_STATE=/opt/arb/gemini-short-crypto-state; fi
          test -f "\$ENV_FILE"
          mkdir -p "\$RISK"
          chmod 700 "\$RISK"

          docker run --rm -i --network host --env-file "\$ENV_FILE" \
            -e GEMINI_SHORT_CRYPTO_STATE_DIR=/base_state \
            -e GEMINI_ADAPTIVE_V5_4_RISK_STATE_DIR=/risk_state \
            -e GEMINI_Q10_PRODUCTION_LIVE=NO \
            -e GEMINI_Q10_PRODUCTION_ARM_ID= \
            -e GEMINI_Q10_PRODUCTION_ARM= \
            -e GEMINI_Q10_V5_RECOVERY_ARM= \
            -e GEMINI_Q10_V5_WATCHDOG_ARM= \
            -e GEMINI_Q10_V5_MAX_DAILY_LOSS_USD=3.00 \
            -v "\$BASE_STATE:/base_state:ro" \
            -v "\$RISK:/risk_state" \
            "\$IMAGE" python - <<'PY'
          import asyncio, json
          from decimal import Decimal as D
          from src import gemini_adaptive_maker_daily_risk_v5_4 as daily
          from src import gemini_adaptive_maker_executor_v5_3 as v53

          BASELINE = D('${INCIDENT_BASELINE_USD}')
          EXPECTED = D('${EXPECTED_SETTLED_AVAILABLE_USD}')

          async def main():
              available, flat = await v53.v5.v1._preflight_flat()
              assert flat['orders'] == 0 and flat['positions'] == 0
              assert available == EXPECTED, f'unexpected available balance: {available}'

              existing = daily.load()
              if existing is None:
                  daily.seed(
                      date_utc='${INCIDENT_DATE_UTC}',
                      baseline_available_usd=BASELINE,
                      current_available_usd=available,
                      source='V5_3_CANARY1_SETTLED_INCIDENT_20260830',
                  )
              else:
                  assert str(existing['date_utc']) == '${INCIDENT_DATE_UTC}'
                  assert D(str(existing['baseline_available_usd'])) == BASELINE

              decision = daily.check(
                  current_available_usd=available,
                  loss_limit_usd=D('3.00'),
                  account_flat=True,
                  allow_rollover=False,
              )
              out = {
                  'release_commit':'${REQUIRED_RELEASE_COMMIT}',
                  'available_usd':str(available),
                  'baseline_available_usd':str(BASELINE),
                  'settled_drawdown_usd':str(BASELINE - available),
                  'daily_risk':decision.as_dict(),
                  'account_flat':flat,
                  'order_entry':False,
              }
              print('V5_4_DAILY_RISK_SEEDED='+json.dumps(out,separators=(',',':'),default=str))
              assert decision.blocked
              assert decision.status == 'DAILY_LOSS_STOP_GLOBAL'
              assert decision.drawdown_usd == D('4.2900')
              assert decision.loss_limit_usd == D('3.00')
          asyncio.run(main())
          PY
          EOF
          )
          ENC=$(printf '%s' "$REMOTE" | base64 -w0)
          PARAMS=$(jq -nc --arg cmd "echo '$ENC' | base64 -d | sudo -u ssm-user bash" '{commands:[$cmd]}')
          CID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB seed V5.4 persistent daily loss ledger" --parameters "$PARAMS" --timeout-seconds 500 --query 'Command.CommandId' --output text)
          for _ in $(seq 1 240); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 2
          done
          RESULT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          OUT=$(jq -r '.Stdout // ""' <<<"$RESULT")
          grep -q 'V5_4_DAILY_RISK_SEEDED=' <<<"$OUT"
          grep -q '"settled_drawdown_usd":"4.2900"' <<<"$OUT"
          grep -q '"status":"DAILY_LOSS_STOP_GLOBAL"' <<<"$OUT"
          grep -q '"blocked":true' <<<"$OUT"
          grep -q '"order_entry":false' <<<"$OUT"
