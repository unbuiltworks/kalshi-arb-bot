name: AWS Gemini dynamic-complement q1 local reconcile

on:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/gemini-dynamic-complement-q1-local-reconcile.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Reconcile proven-flat venue state into AWS-local ledger
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_CMD="sudo -u ssm-user bash -lc 'set -euo pipefail; cd /home/ssm-user/kalshi-arb-bot; git fetch origin aws-migration-foundation >/dev/null; IMAGE=arb-gemini-dynamic-complement:q1-32af5954c64e; if [ -f /opt/arb/secrets/gemini-short-crypto.env ]; then ENV_FILE=/opt/arb/secrets/gemini-short-crypto.env; else ENV_FILE=/home/ssm-user/kalshi-arb-bot/.env; fi; if [ -d /home/ssm-user/gemini-short-crypto-state ]; then STATE_DIR=/home/ssm-user/gemini-short-crypto-state; else STATE_DIR=/opt/arb/gemini-short-crypto-state; fi; git show origin/aws-migration-foundation:deploy/aws/reconcile_gemini_dynamic_q1_local.py > /tmp/reconcile_gemini_dynamic_q1_local.py; docker run --rm --network host --env-file \"\$ENV_FILE\" -e GEMINI_SHORT_CRYPTO_STATE_DIR=/state -e PYTHONPATH=/app -v \"\$STATE_DIR:/state\" -v /tmp/reconcile_gemini_dynamic_q1_local.py:/tmp/reconcile.py:ro \"\$IMAGE\" python /tmp/reconcile.py; echo DYNAMIC_Q1_LOCAL_RECONCILIATION_OK'"
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB dynamic q1 local reconciliation after settled loss" --parameters "$PARAMETERS" --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" || true
          RESULT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = "Success"
          grep -q 'DYNAMIC_Q1_LOCAL_RECONCILIATION_OK' <<<"$(jq -r '.Stdout' <<<"$RESULT")"
