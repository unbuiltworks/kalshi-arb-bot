name: AWS Gemini incentive MM shadow v2 check

on:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/gemini-incentive-mm-shadow-v2-check.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Read-only q10 shadow evidence through SSM
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_CMD='NAME=arb-gemini-incentive-mm-shadow-v2; ROOT=/home/ssm-user/gemini-incentive-mm-shadow-v2-state; RUN_DIR=$(ls -1dt "$ROOT"/* 2>/dev/null | head -1); echo INCENTIVE_MM_CHECK_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ); echo INCENTIVE_MM_RUN_DIR=$RUN_DIR; if docker inspect "$NAME" >/dev/null 2>&1; then echo INCENTIVE_MM_RUNNING=$(docker inspect -f "{{.State.Running}}" "$NAME"); echo INCENTIVE_MM_STATUS=$(docker inspect -f "{{.State.Status}} exit={{.State.ExitCode}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}" "$NAME"); fi; if [ -n "$RUN_DIR" ] && [ -f "$RUN_DIR/summary.json" ]; then echo INCENTIVE_MM_TOTALS; jq -c '"'"'{status,updated_at,markets,trades,book_tickers,errors,ws_connections,ws_disconnects,ws_reconnects,read_only,order_entry,credentials_loaded,classification,tape_touch,strict_trade_through}'"'"' "$RUN_DIR/summary.json"; echo INCENTIVE_MM_BY_FAMILY; jq -c '"'"'[.markets_detail[] | {family:(.asset+"_"+.horizon),tape_fill:(.tape_touch.fills|tonumber),tape_match:(.tape_touch.matched_quantity|tonumber),tape_locked:(.tape_touch.locked_trade_edge_after_fees|tonumber),tape_resid:(.tape_touch.residual_qty|tonumber),strict_fill:(.strict_trade_through.fills|tonumber),strict_match:(.strict_trade_through.matched_quantity|tonumber),strict_locked:(.strict_trade_through.locked_trade_edge_after_fees|tonumber),strict_resid:(.strict_trade_through.residual_qty|tonumber)}] | sort_by(.family) | group_by(.family) | map({family:.[0].family,tape_fill_count:(map(.tape_fill)|add),tape_matched:(map(.tape_match)|add),tape_locked:(map(.tape_locked)|add),tape_residual:(map(.tape_resid)|add),strict_fill_count:(map(.strict_fill)|add),strict_matched:(map(.strict_match)|add),strict_locked:(map(.strict_locked)|add),strict_residual:(map(.strict_resid)|add)})'"'"' "$RUN_DIR/summary.json"; else echo SUMMARY_MISSING; fi; echo INCENTIVE_MM_ERROR_ROWS_BEGIN; if [ -n "$RUN_DIR" ] && [ -f "$RUN_DIR/capture.jsonl" ]; then grep -E '"'"'REST_SEED_ERROR|SHADOW_DISCOVERY_ERROR|WS_NON_JSON|WS_DISCONNECTED_RETRYING'"'"' "$RUN_DIR/capture.jsonl" | tail -20 || true; fi; echo INCENTIVE_MM_ERROR_ROWS_END'
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB incentive MM q10 shadow check" --parameters "$PARAMETERS" --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" || true
          RESULT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = "Success"
