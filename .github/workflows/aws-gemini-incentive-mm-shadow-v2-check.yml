name: AWS Gemini incentive MM shadow v2 check

on:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/gemini-incentive-mm-shadow-v2-check.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Read-only final q10 shadow evidence through SSM
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_CMD='NAME=arb-gemini-incentive-mm-shadow-v2; ROOT=/home/ssm-user/gemini-incentive-mm-shadow-v2-state; RUN_DIR=$(ls -1dt "$ROOT"/* 2>/dev/null | head -1); echo INCENTIVE_MM_CHECK_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ); echo INCENTIVE_MM_RUN_DIR=$RUN_DIR; if docker inspect "$NAME" >/dev/null 2>&1; then echo INCENTIVE_MM_RUNNING=$(docker inspect -f "{{.State.Running}}" "$NAME"); echo INCENTIVE_MM_STATUS=$(docker inspect -f "{{.State.Status}} exit={{.State.ExitCode}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}" "$NAME"); fi; if [ -n "$RUN_DIR" ] && [ -f "$RUN_DIR/summary.json" ]; then jq -c '"'"'{status,updated_at,markets,trades,book_tickers,errors,ws_connections,ws_disconnects,ws_reconnects,read_only,order_entry,credentials_loaded,classification,tape_touch,strict_trade_through}'"'"' "$RUN_DIR/summary.json"; else echo SUMMARY_MISSING; fi'
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB incentive MM q10 shadow check" --parameters "$PARAMETERS" --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}'
