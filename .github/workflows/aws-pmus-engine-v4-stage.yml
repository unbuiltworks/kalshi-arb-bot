name: AWS PMUS v4 24x7 engine stage DISARMED

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - deploy/aws/pmus-engine-v4-stage.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  ENGINE_REF: 303f945641e4ca1340c44d62ccf718685089a8a3

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/l5-transfer-backtest
          fetch-depth: 1
      - name: Verify exact engine commit
        shell: bash
        run: |
          set -Eeuo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "PMUS_ENGINE_CHECKOUT_HEAD=$ACTUAL"
          test "$ACTUAL" = "$ENGINE_REF"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy source-controlled recorder + DISARMED supervisor
        shell: bash
        run: |
          set -Eeuo pipefail
          FILES=(
            src/pmus_q1_executor.py
            src/pmus_q1_executor_v4.py
            src/pmus_aws_supervisor.py
            src/pmus_ws_evidence_recorder.py
            src/pmus_sports_collector.py
            src/pmus_status_report.py
            src/pmus_settlement_auditor.py
            deploy/aws/l5-pmus-recorder.service
            deploy/aws/l5-pmus-supervisor.service
          )
          tar -czf /tmp/pmus-engine.tgz "${FILES[@]}"
          ARCHIVE_B64=$(base64 -w0 /tmp/pmus-engine.tgz)
          REMOTE=$(cat <<EOF
          set -Eeuo pipefail
          APP=/home/ssm-user/l5-pmus-engine
          VENV=/home/ssm-user/l5-pmus-engine-venv
          WSSTATE=/home/ssm-user/l5-pmus-ws-state
          SUPSTATE=/home/ssm-user/l5-pmus-supervisor-state
          QSTATE=/home/ssm-user/l5-pmus-q1-state
          CREDS=/home/ssm-user/l5-pmus-q1-credentials.env
          test -f "\$CREDS" && test "\$(stat -c %a "\$CREDS")" = 600
          systemctl stop l5-pmus-supervisor.service 2>/dev/null || true
          systemctl stop l5-pmus-recorder.service 2>/dev/null || true
          install -d -o ssm-user -g ssm-user "\$APP" "\$WSSTATE" "\$SUPSTATE" "\$QSTATE"
          rm -rf "\$APP/src" "\$APP/deploy"
          printf '%s' '$ARCHIVE_B64' | base64 -d | tar -xzf - -C "\$APP"
          touch "\$APP/src/__init__.py"
          chown -R ssm-user:ssm-user "\$APP" "\$WSSTATE" "\$SUPSTATE" "\$QSTATE"
          if [[ ! -x "\$VENV/bin/python" ]]; then sudo -u ssm-user python3 -m venv "\$VENV"; fi
          sudo -u ssm-user "\$VENV/bin/pip" install --disable-pip-version-check --no-cache-dir 'cryptography>=42' 'websockets>=14,<17' >/dev/null
          sudo -u ssm-user "\$VENV/bin/python" -m py_compile "\$APP/src/"*.py
          install -m 0644 "\$APP/deploy/aws/l5-pmus-recorder.service" /etc/systemd/system/l5-pmus-recorder.service
          install -m 0644 "\$APP/deploy/aws/l5-pmus-supervisor.service" /etc/systemd/system/l5-pmus-supervisor.service
          : > "\$WSSTATE/recorder.log"
          : > "\$WSSTATE/recorder.err.log"
          : > "\$SUPSTATE/supervisor.log"
          : > "\$SUPSTATE/supervisor.err.log"
          chown ssm-user:ssm-user "\$WSSTATE/recorder.log" "\$WSSTATE/recorder.err.log" "\$SUPSTATE/supervisor.log" "\$SUPSTATE/supervisor.err.log"
          systemctl daemon-reload
          systemctl enable l5-pmus-recorder.service l5-pmus-supervisor.service >/dev/null
          systemctl restart l5-pmus-recorder.service
          sleep 8
          test "\$(systemctl is-active l5-pmus-recorder.service)" = active
          for _ in \$(seq 1 15); do
            if grep -q 'PMUS_WS_STATUS ' "\$WSSTATE/recorder.log"; then break; fi
            sleep 2
          done
          grep -q 'PMUS_WS_STATUS ' "\$WSSTATE/recorder.log"
          ! tail -n 10 "\$WSSTATE/recorder.log" | grep -q 'status_error'
          systemctl restart l5-pmus-supervisor.service
          sleep 5
          test "\$(systemctl is-active l5-pmus-supervisor.service)" = active
          test -f "\$SUPSTATE/heartbeat.json"
          python3 - <<'PY'
          import json
          p='/home/ssm-user/l5-pmus-supervisor-state/heartbeat.json'
          h=json.load(open(p))
          assert h.get('mode') == 'DISARMED_WATCH', h
          action=h.get('action')
          assert action in ('BLOCK','WAIT','WOULD_TRADE'), h
          print('PMUS_AWS_ENGINE_V4_OK mode='+str(h.get('mode'))+' action='+str(action)+' reason='+str(h.get('reason')))
          PY
          echo PMUS_AWS_ENGINE_REF=$ENGINE_REF
          echo PMUS_AWS_RECORDER_ACTIVE=true
          echo PMUS_AWS_SUPERVISOR_ACTIVE=true
          echo PMUS_AWS_SUPERVISOR_LIVE=false
          tail -n 2 "\$WSSTATE/recorder.log"
          cat "\$SUPSTATE/heartbeat.json"
          EOF
          )
          ENC=$(printf '%s' "$REMOTE" | base64 -w0)
          PARAMS=$(jq -nc --arg cmd "echo '$ENC' | base64 -d | bash" '{commands:[$cmd]}')
          CID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment 'L5 PMUS v4 permanent engine DISARMED' --parameters "$PARAMS" --timeout-seconds 420 --query 'Command.CommandId' --output text)
          for _ in $(seq 1 200); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 2
          done
          RESULT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          OUT=$(jq -r '.Stdout' <<<"$RESULT")
          grep -q 'PMUS_AWS_ENGINE_V4_OK' <<<"$OUT"
          grep -q 'PMUS_AWS_SUPERVISOR_LIVE=false' <<<"$OUT"