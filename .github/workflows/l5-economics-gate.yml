name: L5 paired-entry economics gate
on:
  push:
    branches:
      - analysis/l5-second-leg-economics-20261109
  pull_request:
    paths:
      - src/l5_second_leg_economics.py
      - tests/test_l5_second_leg_economics.py
      - tests/test_l5_second_leg_economics_audit.py
      - tests/test_l5_actual_quote_entry_gate.py
      - src/l5_settlement_backed_replay.py
      - tests/test_l5_settlement_backed_replay.py
      - tests/test_l5_production_entry_evidence_gate.py
      - src/l5_two_sided_probe.py
      - tests/test_l5_two_sided_probe.py
      - .github/workflows/l5-economics-gate.yml
permissions:
  contents: read
jobs:
  economics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_l5_second_leg_economics.py tests/test_l5_second_leg_economics_audit.py tests/test_l5_actual_quote_entry_gate.py tests/test_l5_settlement_backed_replay.py tests/test_l5_production_entry_evidence_gate.py
