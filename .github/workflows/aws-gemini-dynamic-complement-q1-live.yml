name: AWS Gemini dynamic-complement q1 live

on:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/gemini-dynamic-complement-q1-live.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  LIVE_BRANCH: feature/gemini-incentive-mm-dynamic-complement-q1
  LIVE_CONTAINER: arb-gemini-dynamic-complement-live-probe-q1
  EXACT_TESTED_COMMIT: 32af5954c64e62be1abf89028cdd629cebd7c542

jobs:
  live_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation

      - name: Read one-use approval trigger
        id: trigger
        shell: bash
        run: |
          set -euo pipefail
          FILE=deploy/aws/gemini-dynamic-complement-q1-live.trigger
          test -f "$FILE"
          PINNED_COMMIT=$(awk -F= '$1=="PINNED_COMMIT"{print $2}' "$FILE" | tr -d '[:space:]')
          APPROVAL_ID=$(awk -F= '$1=="APPROVAL_ID"{print $2}' "$FILE" | tr -d '[:space:]')
          CLASSIFICATION=$(awk -F= '$1=="CLASSIFICATION"{print $2}' "$FILE" | tr -d '[:space:]')
          [[ "$PINNED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APPROVAL_ID" =~ ^[A-Za-z0-9_-]+$ ]]
          test "$PINNED_COMMIT" = "$EXACT_TESTED_COMMIT"
          test "$CLASSIFICATION" = "FRESH_USER_APPROVED_DYNAMIC_COMPLEMENT_Q1_LIVE_PROBE"
          echo "pinned_commit=$PINNED_COMMIT" >> "$GITHUB_OUTPUT"
          echo "approval_id=$APPROVAL_ID" >> "$GITHUB_OUTPUT"
          echo "DYNAMIC_Q1_TRIGGER commit=${PINNED_COMMIT:0:12} approval_id=$APPROVAL_ID target=ETH5 q=1 max_campaigns=1 qualifier_wait_s=1200"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait read-only then launch exact tested dynamic q1 probe through SSM
        shell: bash
        env:
          PINNED_COMMIT: ${{ steps.trigger.outputs.pinned_commit }}
          APPROVAL_ID: ${{ steps.trigger.outputs.approval_id }}
        run: |
          set -euo pipefail
          REMOTE_CMD="sudo -u ssm-user bash -lc 'set -euo pipefail; cd /home/ssm-user/kalshi-arb-bot; git fetch origin ${LIVE_BRANCH} >/dev/null; test ${PINNED_COMMIT} = ${EXACT_TESTED_COMMIT}; git cat-file -e \"${PINNED_COMMIT}^{commit}\"; git merge-base --is-ancestor ${PINNED_COMMIT} origin/${LIVE_BRANCH}; git show ${PINNED_COMMIT}:src/gemini_incentive_mm_dynamic_live_probe_q1.py > /tmp/dcq1-live-wrapper.py; git show ${PINNED_COMMIT}:src/gemini_short_crypto_dynamic_complement_q1.py > /tmp/dcq1-live-core.py; git show ${PINNED_COMMIT}:src/gemini_short_crypto_dynamic_complement_q1_v3.py > /tmp/dcq1-live-v3.py; grep -q '\"'\"'TARGET_ASSET = \"ETH\"'\"'\"' /tmp/dcq1-live-wrapper.py; grep -q '\"'\"'TARGET_HORIZON = \"5m\"'\"'\"' /tmp/dcq1-live-wrapper.py; grep -q '\"'\"'PRE_MUTATION_MAX_ATTEMPTS = 3'\"'\"' /tmp/dcq1-live-wrapper.py; grep -q '\"'\"'TRANSIENT_FAILURE_AFTER_MUTATION_BLOCKED'\"'\"' /tmp/dcq1-live-wrapper.py; grep -q '\"'\"'gemini_short_crypto_dynamic_complement_q1_v3'\"'\"' /tmp/dcq1-live-wrapper.py; grep -q '\"'\"'INITIAL_TARGET_EDGE = D(\"0.10\")'\"'\"' /tmp/dcq1-live-v3.py; grep -q '\"'\"'edge_spending_pair_model'\"'\"' /tmp/dcq1-live-v3.py; grep -q '\"'\"'ENTRY_PAIR_EDGE = D(\"0.05\")'\"'\"' /tmp/dcq1-live-core.py; grep -q '\"'\"'FINAL_PAIR_EDGE = D(\"0.02\")'\"'\"' /tmp/dcq1-live-core.py; git show ${PINNED_COMMIT}:deploy/aws/run_gemini_dynamic_complement_q1.sh > /tmp/run_gemini_dynamic_complement_q1.sh; grep -q '\"'\"'httpx.TransportError'\"'\"' /tmp/run_gemini_dynamic_complement_q1.sh; grep -q '\"'\"'retryable_market_data_error'\"'\"' /tmp/run_gemini_dynamic_complement_q1.sh; grep -q '\"'\"'DYNAMIC_COMPLEMENT_Q1_QUALIFIER_TRANSIENT_RETRY approval_consumed=false'\"'\"' /tmp/run_gemini_dynamic_complement_q1.sh; chmod 0700 /tmp/run_gemini_dynamic_complement_q1.sh; PINNED_COMMIT=${PINNED_COMMIT} QUALIFY_WAIT_SECONDS=1200 QUALIFY_POLL_SECONDS=10 ARB_GEMINI_DYNAMIC_COMPLEMENT_Q1_APPROVED=YES ARB_GEMINI_DYNAMIC_COMPLEMENT_Q1_APPROVAL_ID=${APPROVAL_ID} /tmp/run_gemini_dynamic_complement_q1.sh'"
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$AWS_HOT_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "ARB dynamic complement q1 ETH5 wait+live ${PINNED_COMMIT:0:12}" \
            --parameters "$PARAMETERS" \
            --timeout-seconds 1500 \
            --query 'Command.CommandId' --output text)
          for i in $(seq 1 750); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 2
          done
          mkdir -p runtime
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$AWS_HOT_INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            > runtime/aws-gemini-dynamic-complement-q1-live-launch.json
          cat runtime/aws-gemini-dynamic-complement-q1-live-launch.json
          test "$(jq -r '.Status' runtime/aws-gemini-dynamic-complement-q1-live-launch.json)" = "Success"
          grep -q 'DYNAMIC_COMPLEMENT_Q1_QUALIFYING_WINDOW_FOUND' <<<"$(jq -r '.Stdout' runtime/aws-gemini-dynamic-complement-q1-live-launch.json)"
          grep -q 'DYNAMIC_COMPLEMENT_Q1_LIVE_DETACHED' <<<"$(jq -r '.Stdout' runtime/aws-gemini-dynamic-complement-q1-live-launch.json)"

      - name: Read-only monitor to terminal reconciliation
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_CMD='set -eu; NAME=arb-gemini-dynamic-complement-live-probe-q1; echo DYNAMIC_Q1_MONITOR_STARTED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ); for i in $(seq 1 70); do if ! docker inspect "$NAME" >/dev/null 2>&1; then echo DYNAMIC_Q1_MONITOR_CONTAINER_MISSING; exit 2; fi; running=$(docker inspect -f "{{.State.Running}}" "$NAME"); echo DYNAMIC_Q1_MONITOR_SAMPLE n=$i at=$(date -u +%Y-%m-%dT%H:%M:%SZ) running=$running; if [ "$running" != "true" ]; then break; fi; sleep 15; done; running=$(docker inspect -f "{{.State.Running}}" "$NAME"); status=$(docker inspect -f "{{.State.Status}}" "$NAME"); exit_code=$(docker inspect -f "{{.State.ExitCode}}" "$NAME"); echo DYNAMIC_Q1_MONITOR_FINAL=$(docker inspect -f "status={{.State.Status}} exit={{.State.ExitCode}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}" "$NAME"); echo DYNAMIC_Q1_MONITOR_LOGS_BEGIN; logs=$(docker logs --tail 800 "$NAME" 2>&1 || true); printf "%s\n" "$logs"; echo DYNAMIC_Q1_MONITOR_LOGS_END; if [ "$running" != "false" ] || [ "$status" != "exited" ]; then echo DYNAMIC_Q1_MONITOR_NOT_TERMINAL; exit 3; fi; if [ "$exit_code" != "0" ]; then echo DYNAMIC_Q1_MONITOR_BAD_EXIT_CODE=$exit_code; exit 4; fi; if ! printf "%s\n" "$logs" | grep -Eq "\"stage\":\"(SETTLED|COMPLETE_NO_OPEN_RESERVATION)\""; then echo DYNAMIC_Q1_MONITOR_MISSING_TERMINAL_STAGE; exit 5; fi; echo DYNAMIC_Q1_MONITOR_CLEAN_TERMINAL_OK; echo DYNAMIC_Q1_MONITOR_FINISHED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)'
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$AWS_HOT_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "ARB dynamic complement q1 ETH5 read-only monitor" \
            --parameters "$PARAMETERS" \
            --timeout-seconds 1200 \
            --query 'Command.CommandId' --output text)
          for i in $(seq 1 130); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 10
          done
          mkdir -p runtime
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$AWS_HOT_INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            > runtime/aws-gemini-dynamic-complement-q1-live-monitor.json
          cat runtime/aws-gemini-dynamic-complement-q1-live-monitor.json
          test "$(jq -r '.Status' runtime/aws-gemini-dynamic-complement-q1-live-monitor.json)" = "Success"
          grep -q 'DYNAMIC_Q1_MONITOR_CLEAN_TERMINAL_OK' <<<"$(jq -r '.Stdout' runtime/aws-gemini-dynamic-complement-q1-live-monitor.json)"

      - name: Upload non-secret evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-gemini-dynamic-complement-q1-live
          path: runtime/aws-gemini-dynamic-complement-q1-live-*.json
          retention-days: 3
