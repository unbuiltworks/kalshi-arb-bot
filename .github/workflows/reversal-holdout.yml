# Independent historical backtest of the FROZEN previous-window reversal rule.
#
# WHY A RUNNER. Two hosts this needs are unreachable from the research
# container: the recorder's volume (SFTP on port 22) and the venue gateway
# (gateway.polymarket.us), which publishes the BRTI 1-second index every
# state-table row and every settlement is built from.
#
# READ-ONLY WITH RESPECT TO RAILWAY. The only Railway operation in this file is
# `files download`. No deploy, redeploy, restart, variable, domain or volume
# operation, so the healthy pmus-ws-evidence-recorder cannot be disturbed and
# no second service mounts its volume.
#
# WHICH WINDOWS, AND WHY THEY ARE THE ONLY ONES LEFT. The 178 windows that
# GENERATED this hypothesis are retired. The 12 GiB volume retention has since
# swept every part before pmus_ws_20261002_00, including the whole of
# 2026-10-01 -- which was a clean holdout hours ago and is now gone. What
# survives and is disjoint from the 28 development windows (6 on 09-30, 22 on
# 10-02 1100z-2045z) is 2026-10-02 00:00z through 10:45z. Those 11 hourly parts
# are harvested, all of them, and a short harvest FAILS rather than scoring a
# partial tape. No window is chosen, dropped or reordered by hand.
#
# NOTHING IS FITTED. The rule is frozen in scripts/pmus_reversal_descriptive.py
# and has no tunable input -- there is deliberately nowhere to put a threshold.
# It runs ONCE.
name: reversal-holdout

on:
  push:
    branches: ['claude/l5-pmus-economic-results-7c116e']
    paths: ['.github/reversal_holdout_request']

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.p.outputs.stage }}
      harvest_run_id: ${{ steps.p.outputs.harvest_run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the request
        id: p
        run: |
          set -euo pipefail
          f=.github/reversal_holdout_request
          stage="$(sed -n -E 's/^STAGE=(harvest|evaluate)[[:space:]]*$/\1/p' "$f" | tail -1)"
          rid="$(sed -n -E 's/^HARVEST_RUN_ID=([0-9]*)[[:space:]]*$/\1/p' "$f" | tail -1)"
          case "$stage" in
            harvest|evaluate) ;;
            *) echo "::error::STAGE must be harvest or evaluate, got '$stage'"; exit 1 ;;
          esac
          if [ "$stage" = evaluate ] && [ -z "$rid" ]; then
            echo "::error::STAGE=evaluate needs HARVEST_RUN_ID"; exit 1
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "harvest_run_id=$rid" >> "$GITHUB_OUTPUT"
          echo "stage=$stage harvest_run_id=$rid"

  harvest:
    needs: plan
    if: ${{ needs.plan.outputs.stage == 'harvest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # One SSH endpoint serves the volume; 16 concurrent reads timed out
      # before, 4 does not.
      max-parallel: 4
      matrix:
        chunk:
          - {id: '00', files: 'pmus_ws_20261002_00.jsonl,pmus_ws_20261002_01.jsonl,pmus_ws_20261002_02.jsonl'}
          - {id: '01', files: 'pmus_ws_20261002_03.jsonl,pmus_ws_20261002_04.jsonl,pmus_ws_20261002_05.jsonl'}
          - {id: '02', files: 'pmus_ws_20261002_06.jsonl,pmus_ws_20261002_07.jsonl,pmus_ws_20261002_08.jsonl'}
          - {id: '03', files: 'pmus_ws_20261002_09.jsonl,pmus_ws_20261002_10.jsonl'}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SSH_PRIVATE_KEY_B64: ${{ secrets.RAILWAY_SSH_PRIVATE_KEY_B64 }}
      PROJECT_ID: 50fb7357-e2bc-4d04-a49e-71eb5d73b0d1
      ENVIRONMENT_ID: f3642d27-26dc-4e21-9170-bc76290c076f
      # pmus-ws-evidence-recorder. READ ONLY; never redeployed here.
      SERVICE_ID: 71b6ea99-ea6a-4b20-9602-fa873721ed35
      REMOTE_DIR: /state/pmus-ws/raw
      RAILWAY_CLI_VERSION: 5.63.1
      CHUNK_FILES: ${{ matrix.chunk.files }}
    steps:
      - name: Fail closed if required CI secrets are absent
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set."; exit 1
          fi
          if [ -z "${RAILWAY_SSH_PRIVATE_KEY_B64:-}" ]; then
            echo "::error::RAILWAY_SSH_PRIVATE_KEY_B64 secret is not set."; exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the PINNED Railway CLI and assert the version
        run: |
          set -euo pipefail
          npm install -g "@railway/cli@$RAILWAY_CLI_VERSION"
          got="$(railway --version | tr -d '\r')"
          echo "installed: $got"
          case "$got" in
            *"$RAILWAY_CLI_VERSION"*) ;;
            *) echo "::error::CLI version mismatch"; exit 1 ;;
          esac

      - name: Prepare dedicated Railway SSH identity
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s' "$RAILWAY_SSH_PRIVATE_KEY_B64" \
            | base64 --decode > ~/.ssh/l5_volume_export
          chmod 600 ~/.ssh/l5_volume_export
          ssh-keygen -y -f ~/.ssh/l5_volume_export > ~/.ssh/l5_volume_export.pub
          chmod 644 ~/.ssh/l5_volume_export.pub

      - name: Read this chunk and reduce each part to BTC 15m rows
        run: |
          set -euo pipefail
          mkdir -p slice
          : > slice/MANIFEST.tsv
          IFS=',' read -ra NAMES <<< "$CHUNK_FILES"
          for raw in "${NAMES[@]}"; do
            name="$(echo "$raw" | xargs)"
            [ -n "$name" ] || continue
            case "$name" in
              */*|..*) echo "::error::refusing suspicious name"; exit 1 ;;
            esac
            echo "::group::$name"
            ok=0
            for attempt in 1 2 3 4; do
              if railway service files \
                   --service "$SERVICE_ID" \
                   --environment "$ENVIRONMENT_ID" \
                   --project "$PROJECT_ID" \
                   download "$REMOTE_DIR/$name" part.jsonl < /dev/null; then
                ok=1; break
              fi
              echo "read attempt $attempt failed; retrying"
              rm -f part.jsonl; sleep $((attempt * 20))
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::could not read $name after 4 attempts"; exit 1
            fi
            bytes="$(stat -c%s part.jsonl)"
            if [ "$bytes" -le 0 ]; then
              echo "::error::read 0 bytes for $name"; exit 1
            fi
            sha="$(sha256sum part.jsonl | awk '{print $1}')"
            lines="$(wc -l < part.jsonl)"
            python3 scripts/pmus_oos_reduce_part.py part.jsonl rows.jsonl > reduce.json
            cat reduce.json
            keptn="$(wc -l < rows.jsonl)"
            printf '%s\t%s\t%s\t%s\t%s\n' \
              "$name" "$bytes" "$lines" "$keptn" "$sha" >> slice/MANIFEST.tsv
            echo "$name bytes=$bytes lines=$lines kept=$keptn"
            cat rows.jsonl >> slice/rows.jsonl
            rm -f part.jsonl rows.jsonl reduce.json
            echo "::endgroup::"
          done
          gzip -9 slice/rows.jsonl
          cat slice/MANIFEST.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: holdout-slice-${{ matrix.chunk.id }}
          path: slice/
          retention-days: 7
          if-no-files-found: error

  evaluate:
    needs: plan
    if: ${{ needs.plan.outputs.stage == 'evaluate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect every harvested slice
        uses: actions/download-artifact@v4
        with:
          pattern: holdout-slice-*
          path: slices
          run-id: ${{ needs.plan.outputs.harvest_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge the slices; a SHORT harvest fails rather than scoring
        run: |
          set -euo pipefail
          mkdir -p work
          cat slices/*/MANIFEST.tsv | sort -u > HARVEST_MANIFEST.tsv
          cat HARVEST_MANIFEST.tsv
          n="$(wc -l < HARVEST_MANIFEST.tsv)"
          echo "parts harvested: $n"
          if [ "$n" -ne 11 ]; then
            echo "::error::expected 11 parts, got $n -- refusing to score a partial tape"
            exit 1
          fi
          zcat slices/*/rows.jsonl.gz > work/holdout_ws.jsonl
          wc -l work/holdout_ws.jsonl

      - name: Derive book/trade rows (the derivation calibrated at recall 1.000)
        run: |
          set -euo pipefail
          python3 scripts/pmus_oos_derive_rows.py work/holdout_ws.jsonl \
            work/holdout_tape.jsonl | tee HOLDOUT_DERIVE.json
          wc -l work/holdout_tape.jsonl

      - name: Build the HOLDOUT state table
        run: |
          set -euo pipefail
          python3 scripts/pmus_state_table.py \
            --tape work/holdout_tape.jsonl --label HOLDOUT \
            | tee state_table_holdout.log
          wc -l analysis/l5/state_conditional/state_table_holdout.jsonl
          python3 scripts/pmus_holdout_windows.py \
            analysis/l5/state_conditional/state_table_holdout.jsonl

      - name: Assert the holdout is disjoint from the development windows
        run: |
          set -euo pipefail
          # The 22 development windows on 10-02 are 1100z..2045z; nothing in
          # the harvested parts can reach them, but prove it rather than
          # assert it.
          if grep -oE 'cpc-btc-updown-15m-2026-10-02-[0-9]{4}z' \
               analysis/l5/state_conditional/state_table_holdout.jsonl \
             | sort -u | awk -F- '{print $NF}' | tr -d 'z' \
             | awk '$1+0 >= 1100 {found=1} END{exit !found}'; then
            echo "::error::a development window leaked into the holdout"; exit 1
          fi
          echo "disjoint: no window at or after 1100z"

      - name: Run the FROZEN reversal rule, exactly once
        run: |
          set -euo pipefail
          python3 scripts/pmus_reversal_descriptive.py \
            --state analysis/l5/state_conditional/state_table_holdout.jsonl \
            --label HOLDOUT | tee REVERSAL_HOLDOUT.txt

      - name: Package
        if: always()
        run: |
          set -euo pipefail
          mkdir -p out
          for f in HARVEST_MANIFEST.tsv HOLDOUT_DERIVE.json \
                   state_table_holdout.log REVERSAL_HOLDOUT.txt \
                   analysis/l5/state_conditional/market_terms_holdout.json \
                   analysis/l5/path_economics/reversal_descriptive_holdout.json \
                   analysis/l5/state_conditional/state_table_holdout.jsonl; do
            if [ -f "$f" ]; then cp -f "$f" out/; fi
          done
          gzip -9 -f out/state_table_holdout.jsonl || true
          ls -l out/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reversal-holdout-${{ github.run_id }}
          path: out/
          retention-days: 30
          if-no-files-found: error
