name: AWS Gemini mixed reward shadow status

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - deploy/aws/gemini-mixed-reward-shadow-status.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Read mixed reward shadow state
        shell: bash
        run: |
          set -Eeuo pipefail
          RUN_ID=$(awk -F= '$1=="RUN_ID"{print $2}' deploy/aws/gemini-mixed-reward-shadow-status.trigger | tr -d '[:space:]')
          REMOTE_SCRIPT=$(cat <<EOF
          set -Eeuo pipefail
          STATE_DIR=/home/ssm-user/gemini-mixed-reward-shadow-state/${RUN_ID}
          RUN_CONTAINER=arb-gemini-mixed-reward-shadow-${RUN_ID}
          LEGACY_CONTAINER=arb-gemini-mixed-reward-shadow
          if docker inspect "\$RUN_CONTAINER" >/dev/null 2>&1; then CONTAINER="\$RUN_CONTAINER"; else CONTAINER="\$LEGACY_CONTAINER"; fi
          echo "GEMINI_MIXED_REWARD_SHADOW_CONTAINER_NAME=\$CONTAINER"
          echo "GEMINI_MIXED_REWARD_SHADOW_CONTAINER="
          docker inspect "\$CONTAINER" --format 'status={{.State.Status}} exit={{.State.ExitCode}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' 2>/dev/null || echo 'status=missing'
          echo "GEMINI_MIXED_REWARD_SHADOW_CURRENT="
          test -s "\$STATE_DIR/current.json" && cat "\$STATE_DIR/current.json" || echo '{}'
          echo "GEMINI_MIXED_REWARD_SHADOW_FINAL="
          test -s "\$STATE_DIR/final.json" && cat "\$STATE_DIR/final.json" || echo '{}'
          echo "GEMINI_MIXED_REWARD_SHADOW_ERROR="
          test -s "\$STATE_DIR/last_error.json" && cat "\$STATE_DIR/last_error.json" || echo '{}'
          EOF
          )
          ENCODED=$(printf '%s' "$REMOTE_SCRIPT" | base64 -w0)
          REMOTE_CMD="echo '$ENCODED' | base64 -d | sudo -u ssm-user bash"
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB Gemini mixed reward shadow status" --parameters "$PARAMETERS" --timeout-seconds 240 --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" || true
          RESULT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
