name: AWS Gemini incentive watch status

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - deploy/aws/gemini-incentive-watch-status.trigger
      - .github/workflows/aws-gemini-incentive-watch-status.yml

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Read current watch evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE_CMD="sudo -u ssm-user bash -lc 'set -Eeuo pipefail; STATE=/home/ssm-user/gemini-incentive-live-watch-state/20260829T1445ET-gemini-incentive-watch1; NAME=arb-gemini-incentive-live-watch; echo GEMINI_INCENTIVE_WATCH_STATUS; cat \"\$STATE/run-metadata.txt\"; if docker ps --format \"{{.Names}}\" | grep -qx \"\$NAME\"; then echo running=true; else echo running=false; fi; echo scan_count=\$(wc -l < \"\$STATE/scans.jsonl\" 2>/dev/null || echo 0); echo error_count=\$(wc -l < \"\$STATE/errors.log\" 2>/dev/null || echo 0); echo latest_scans_begin; tail -n 12 \"\$STATE/scans.jsonl\" 2>/dev/null || true; echo latest_scans_end'"
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB Gemini incentive watch status" --parameters "$PARAMETERS" --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" || true
          RESULT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
