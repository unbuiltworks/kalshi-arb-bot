name: AWS Gemini retained tape coverage

on:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/gemini-retained-tape-coverage.trigger
      - .github/workflows/aws-gemini-retained-tape-coverage.yml

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  SOURCE_BRANCH: feature/gemini-incentive-mm-dynamic-complement-q1

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation
      - name: Read coverage trigger
        id: trigger
        shell: bash
        run: |
          set -euo pipefail
          FILE=deploy/aws/gemini-retained-tape-coverage.trigger
          PINNED_COMMIT=$(awk -F= '$1=="PINNED_COMMIT"{print $2}' "$FILE" | tr -d '[:space:]')
          CLASSIFICATION=$(awk -F= '$1=="CLASSIFICATION"{print $2}' "$FILE" | tr -d '[:space:]')
          [[ "$PINNED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$CLASSIFICATION" = "READ_ONLY_PUBLIC_TAPE_ANALYSIS"
          echo "pinned_commit=$PINNED_COMMIT" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Parse retained tapes offline
        shell: bash
        env:
          PINNED_COMMIT: ${{ steps.trigger.outputs.pinned_commit }}
        run: |
          set -euo pipefail
          SHORT_SHA="${PINNED_COMMIT:0:12}"
          REMOTE_CMD="sudo -u ssm-user bash -lc 'set -euo pipefail; REPO=/home/ssm-user/kalshi-arb-bot; ROOT=/home/ssm-user/gemini-l5-dynamic-shadow-v2-state; WORK=/opt/arb/gemini-retained-tape-coverage; test -d \"\$ROOT\"; git -C \"\$REPO\" config --global --add safe.directory \"\$REPO\" || true; git -C \"\$REPO\" fetch origin ${SOURCE_BRANCH}; git -C \"\$REPO\" cat-file -e \"${PINNED_COMMIT}^{commit}\"; git -C \"\$REPO\" merge-base --is-ancestor \"${PINNED_COMMIT}\" origin/${SOURCE_BRANCH}; git -C \"\$REPO\" worktree remove --force \"\$WORK\" >/dev/null 2>&1 || true; rm -rf \"\$WORK\"; git -C \"\$REPO\" worktree prune; git -C \"\$REPO\" worktree add --detach \"\$WORK\" \"${PINNED_COMMIT}\"; IMAGE=arb-gemini-retained-tape-coverage:${SHORT_SHA}; docker build -t \"\$IMAGE\" \"\$WORK\" >/dev/null; docker run --rm --network none \"\$IMAGE\" python -m pytest -q tests/test_gemini_retained_tape_coverage.py tests/test_gemini_dynamic_initial_entry_replay_q1.py tests/test_gemini_incentive_mm_dynamic_complement.py; echo RETAINED_TAPE_COVERAGE_BEGIN; docker run --rm --network none -v \"\$ROOT:/tapes:ro\" \"\$IMAGE\" python -m src.gemini_retained_tape_coverage --root /tapes --max-runs 20 --compact; echo RETAINED_TAPE_COVERAGE_END; echo RETAINED_TAPE_COVERAGE_CLASSIFICATION=READ_ONLY_PUBLIC_TAPE_ANALYSIS order_entry=false credentials_loaded=false'"
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB retained Gemini tape coverage ${SHORT_SHA}" --parameters "$PARAMETERS" --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" || true
          RESULT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = "Success"
          stdout=$(jq -r '.Stdout // ""' <<<"$RESULT")
          grep -q 'RETAINED_TAPE_COVERAGE_BEGIN' <<<"$stdout"
          grep -q 'READ_ONLY_PUBLIC_TAPE_ANALYSIS' <<<"$stdout"
          grep -q 'order_entry=false credentials_loaded=false' <<<"$stdout"
