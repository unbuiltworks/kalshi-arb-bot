name: AWS PMUS residual completion shadow READ ONLY

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - deploy/aws/pmus-residual-completion-shadow.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  ENGINE_REF: a91aebb8122ac4bec1bf5633e3f4f83bd339cfa1

jobs:
  residual-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/l5-transfer-backtest
          fetch-depth: 1
      - name: Verify exact evidence code
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$ENGINE_REF"
          grep -q 'PURE TAPE ANALYSIS' src/pmus_residual_completion_shadow.py
      - name: Verify trigger
        shell: bash
        run: |
          grep -qx 'GO=READ_ONLY_RESIDUAL_SHADOW' deploy/aws/pmus-residual-completion-shadow.trigger || true
          # Trigger lives on aws-migration-foundation, so verify through git show.
          git show origin/aws-migration-foundation:deploy/aws/pmus-residual-completion-shadow.trigger | grep -qx 'GO=READ_ONLY_RESIDUAL_SHADOW'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Replay DET MIN residual against persisted AWS tape
        shell: bash
        run: |
          set -Eeuo pipefail
          SCRIPT_B64=$(base64 -w0 src/pmus_residual_completion_shadow.py)
          REMOTE=$(cat <<EOF
          set -Eeuo pipefail
          test "\$(systemctl is-active l5-pmus-recorder.service)" = active
          test "\$(systemctl is-active l5-pmus-supervisor.service)" = active
          grep -q '^Environment=PMUS_SUPERVISOR_LIVE=NO$' /etc/systemd/system/l5-pmus-supervisor.service
          TMP=/home/ssm-user/l5-pmus-residual-shadow.py
          printf '%s' '$SCRIPT_B64' | base64 -d > "\$TMP"
          chown ssm-user:ssm-user "\$TMP"
          chmod 600 "\$TMP"
          sudo -u ssm-user env PYTHONPATH=/home/ssm-user/l5-pmus-engine /home/ssm-user/l5-pmus-engine-venv/bin/python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          slug='aec-mlb-det-min-2026-09-02'
          ledger=Path('/home/ssm-user/l5-pmus-q1-state/ledger.jsonl')
          if not ledger.exists():
              raise SystemExit('NO_Q1_LEDGER')
          armed=False
          fill_t=None
          candidates=[]
          for line in ledger.open():
              try: r=json.loads(line)
              except Exception: continue
              if r.get('kind')=='submitted' and r.get('stage')=='first_leg':
                  armed=(r.get('slug')==slug)
                  if armed: candidates.append({'submitted_t':r.get('t'),'price':r.get('price'),'order_id':r.get('order_id')})
                  continue
              if armed and r.get('kind')=='filled' and str(r.get('stage','')).startswith('first_leg'):
                  fill_t=r.get('t')
                  candidates[-1]['fill_t']=fill_t
                  candidates[-1]['fill_price']=r.get('price')
                  armed=False
          if not fill_t:
              raise SystemExit('NO_TARGET_FIRST_FILL_TIMESTAMP')
          print('PMUS_RESIDUAL_FILL_PROVENANCE '+json.dumps(candidates[-1],separators=(',',':')))
          cmd=[sys.executable,'/home/ssm-user/l5-pmus-residual-shadow.py',
               '--slug',slug,'--first-cost','0.42','--entry-time',fill_t,
               '--root','/home/ssm-user/l5-pmus-ws-state']
          p=subprocess.run(cmd,text=True,capture_output=True,check=True)
          print('PMUS_RESIDUAL_SHADOW '+p.stdout.strip().replace('\n',' '))
          PY
          rm -f "\$TMP"
          echo PMUS_RESIDUAL_SHADOW_OK read_only=true permanent_supervisor_disarmed=true
          EOF
          )
          ENC=$(printf '%s' "$REMOTE" | base64 -w0)
          PARAMS=$(jq -nc --arg cmd "echo '$ENC' | base64 -d | bash" '{commands:[$cmd]}')
          CID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment 'L5 PMUS residual persistence tape replay READ ONLY' --parameters "$PARAMS" --timeout-seconds 180 --query 'Command.CommandId' --output text)
          for _ in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 2
          done
          RESULT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          grep -q 'PMUS_RESIDUAL_SHADOW_OK' <<<"$(jq -r '.Stdout' <<<"$RESULT")"
