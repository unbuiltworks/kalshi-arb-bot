name: AWS PMUS residual completion shadow READ ONLY

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - deploy/aws/pmus-residual-completion-shadow.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  ENGINE_REF: a91aebb8122ac4bec1bf5633e3f4f83bd339cfa1

jobs:
  residual-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/l5-transfer-backtest
          fetch-depth: 1
      - name: Verify exact evidence code
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$ENGINE_REF"
          grep -q 'PURE TAPE ANALYSIS' src/pmus_residual_completion_shadow.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Stream-replay DET MIN residual against persisted AWS tape
        shell: bash
        run: |
          set -Eeuo pipefail
          SCRIPT_B64=$(base64 -w0 src/pmus_residual_completion_shadow.py)
          REMOTE=$(cat <<EOF
          set -Eeuo pipefail
          test "\$(systemctl is-active l5-pmus-recorder.service)" = active
          test "\$(systemctl is-active l5-pmus-supervisor.service)" = active
          grep -q '^Environment=PMUS_SUPERVISOR_LIVE=NO$' /etc/systemd/system/l5-pmus-supervisor.service
          TMP=/home/ssm-user/l5-pmus-residual-shadow.py
          printf '%s' '$SCRIPT_B64' | base64 -d > "\$TMP"
          chown ssm-user:ssm-user "\$TMP"
          chmod 600 "\$TMP"
          sudo -u ssm-user env PYTHONPATH=/home/ssm-user/l5-pmus-engine /home/ssm-user/l5-pmus-engine-venv/bin/python - <<'PY'
          import importlib.util, json
          from datetime import datetime, timezone
          from decimal import Decimal as D
          from pathlib import Path
          from src import pmus_ws_evidence_recorder as rec

          slug='aec-mlb-det-min-2026-09-02'
          ledger=Path('/home/ssm-user/l5-pmus-q1-state/ledger.jsonl')
          armed=False; fill_t=None; candidates=[]
          for line in ledger.open():
              try: r=json.loads(line)
              except Exception: continue
              if r.get('kind')=='submitted' and r.get('stage')=='first_leg':
                  armed=(r.get('slug')==slug)
                  if armed: candidates.append({'submitted_t':r.get('t'),'price':r.get('price'),'order_id':r.get('order_id')})
                  continue
              if armed and r.get('kind')=='filled' and str(r.get('stage','')).startswith('first_leg'):
                  fill_t=r.get('t'); candidates[-1]['fill_t']=fill_t; candidates[-1]['fill_price']=r.get('price'); armed=False
          if not fill_t: raise SystemExit('NO_TARGET_FIRST_FILL_TIMESTAMP')
          print('PMUS_RESIDUAL_FILL_PROVENANCE '+json.dumps(candidates[-1],separators=(',',':')))
          entry_dt=datetime.fromisoformat(fill_t.replace('Z','+00:00'))
          if entry_dt.tzinfo is None: entry_dt=entry_dt.replace(tzinfo=timezone.utc)
          entry_t=entry_dt.timestamp()

          spec=importlib.util.spec_from_file_location('residual_shadow','/home/ssm-user/l5-pmus-residual-shadow.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          root=Path('/home/ssm-user/l5-pmus-ws-state')
          needle=slug.encode()
          files=sorted((root/'raw').glob('pmus_ws_*.jsonl'))
          def target_rows():
              for path in files:
                  with path.open('rb') as f:
                      for raw in f:
                          if needle not in raw: continue
                          try:
                              row=json.loads(raw)
                              if row.get('kind')!='ws': continue
                              dt=datetime.fromisoformat(str(row['t']).replace('Z','+00:00'))
                              if dt.tzinfo is None: dt=dt.replace(tzinfo=timezone.utc)
                              t=dt.timestamp()
                              if t < entry_t: continue
                              yield t,row.get('msg')
                          except Exception:
                              continue
          report=mod.analyze_residual(target_rows(),slug,D('0.42'),entry_t)
          print('PMUS_RESIDUAL_SHADOW '+json.dumps(report,separators=(',',':'),default=str))
          PY
          rm -f "\$TMP"
          echo PMUS_RESIDUAL_SHADOW_OK read_only=true permanent_supervisor_disarmed=true
          EOF
          )
          ENC=$(printf '%s' "$REMOTE" | base64 -w0)
          PARAMS=$(jq -nc --arg cmd "echo '$ENC' | base64 -d | bash" '{commands:[$cmd]}')
          CID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment 'L5 PMUS residual persistence stream replay READ ONLY' --parameters "$PARAMS" --timeout-seconds 180 --query 'Command.CommandId' --output text)
          for _ in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 2
          done
          RESULT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          grep -q 'PMUS_RESIDUAL_SHADOW_OK' <<<"$(jq -r '.Stdout' <<<"$RESULT")"
