name: AWS PMUS q1 read-auth preflight

on:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/pmus-q1-read-auth-preflight.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: GET-only PMUS account and BBO preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          SLUG=$(sed -n 's/^MARKET_SLUG=//p' deploy/aws/pmus-q1-read-auth-preflight.trigger | head -1)
          [[ "$SLUG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'invalid market slug trigger'; exit 2; }
          REMOTE=$(cat <<EOF
          set -Eeuo pipefail
          STAGE=/home/ssm-user/l5-pmus-q1-stage
          STATE=/home/ssm-user/l5-pmus-q1-state
          CREDS=/home/ssm-user/l5-pmus-q1-credentials.env
          VENV=/home/ssm-user/l5-pmus-q1-venv
          test -f "\$CREDS" && test "\$(stat -c %a "\$CREDS")" = 600
          test -f "\$STAGE/src/pmus_q1_executor.py"
          if [[ ! -x "\$VENV/bin/python" ]]; then
            python3 -m venv "\$VENV"
          fi
          if ! "\$VENV/bin/python" -c 'import cryptography' 2>/dev/null; then
            "\$VENV/bin/pip" install --disable-pip-version-check --no-cache-dir 'cryptography>=42' >/dev/null
          fi
          set -a
          . "\$CREDS"
          set +a
          export PMUS_Q1_STATE_DIR="\$STATE"
          unset PMUS_Q1_LIVE PMUS_Q1_SESSION_ID PMUS_Q1_ARM PMUS_Q1_GATE_EVIDENCE
          cd "\$STAGE"
          "\$VENV/bin/python" - <<'PY'
          import json, os
          from src.pmus_q1_executor import Transport, preflight
          slug = '${SLUG}'
          reason = preflight(Transport(), slug)
          out = {'status': 'READ_AUTH_PREFLIGHT_OK' if reason is None else 'READ_AUTH_PREFLIGHT_FAILED',
                 'slug': slug, 'reason': reason, 'order_entry': False}
          print(json.dumps(out, separators=(',', ':')))
          raise SystemExit(0 if reason is None else 1)
          PY
          EOF
          )
          ENC=$(printf '%s' "$REMOTE" | base64 -w0)
          PARAMS=$(jq -nc --arg cmd "echo '$ENC' | base64 -d | sudo -u ssm-user bash" '{commands:[$cmd]}')
          CID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "L5 PMUS q1 GET-only preflight $SLUG" --parameters "$PARAMS" --timeout-seconds 180 \
            --query 'Command.CommandId' --output text)
          for _ in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 2
          done
          RESULT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          grep -q 'READ_AUTH_PREFLIGHT_OK' <<<"$(jq -r '.Stdout' <<<"$RESULT")"
