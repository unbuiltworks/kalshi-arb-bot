name: AWS PMUS q1 read-auth + preview preflight

on:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/pmus-q1-read-auth-preflight.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  EXPECTED_STAGE_SHA256: 06c7bc3ef38f721b2c3cdc8a4d8c627c34b06caf15d96709c85cefc4bd7e6b98

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Authenticated account/BBO + preview-only PMUS preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          SLUG=$(sed -n 's/^MARKET_SLUG=//p' deploy/aws/pmus-q1-read-auth-preflight.trigger | head -1)
          [[ "$SLUG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'invalid market slug trigger'; exit 2; }
          REMOTE=$(cat <<EOF
          set -Eeuo pipefail
          STAGE=/home/ssm-user/l5-pmus-q1-stage
          STATE=/home/ssm-user/l5-pmus-q1-state
          CREDS=/home/ssm-user/l5-pmus-q1-credentials.env
          VENV=/home/ssm-user/l5-pmus-q1-venv
          EXPECTED='${EXPECTED_STAGE_SHA256}'
          test -f "\$CREDS" && test "\$(stat -c %a "\$CREDS")" = 600
          test -f "\$STAGE/src/pmus_q1_executor.py"
          ACTUAL=\$(sha256sum "\$STAGE/src/pmus_q1_executor.py" | awk '{print \$1}')
          test "\$ACTUAL" = "\$EXPECTED" || { echo PMUS_Q1_STAGE_SHA_MISMATCH; exit 2; }
          if [[ ! -x "\$VENV/bin/python" ]]; then
            python3 -m venv "\$VENV"
          fi
          if ! "\$VENV/bin/python" -c 'import cryptography' 2>/dev/null; then
            "\$VENV/bin/pip" install --disable-pip-version-check --no-cache-dir 'cryptography>=42' >/dev/null
          fi
          set -a
          . "\$CREDS"
          set +a
          export PMUS_Q1_STATE_DIR="\$STATE"
          unset PMUS_Q1_LIVE PMUS_Q1_SESSION_ID PMUS_Q1_ARM PMUS_Q1_GATE_EVIDENCE
          cd "\$STAGE"
          "\$VENV/bin/python" - <<'PY'
          import json
          from decimal import Decimal as D
          from src.pmus_q1_executor import Transport, preflight, entry_ok

          slug = '${SLUG}'
          t = Transport()
          reason = preflight(t, slug)
          if reason is not None:
              print(json.dumps({'status':'READ_AUTH_PREFLIGHT_FAILED','slug':slug,
                                'reason':reason,'preview':False,'order_entry':False},
                               separators=(',',':')))
              raise SystemExit(1)

          bbo = t.request('GET', f'/v1/markets/{slug}/bbo', base='https://gateway.polymarket.us').get('marketData') or {}
          bid = (bbo.get('bestBid') or {}).get('value')
          ask = (bbo.get('bestAsk') or {}).get('value')
          if bid is None or ask is None or not entry_ok(D(str(bid))):
              print(json.dumps({'status':'PREVIEW_PREFLIGHT_FAILED','slug':slug,
                                'reason':'fresh_bbo_not_eligible','preview':False,'order_entry':False},
                               separators=(',',':')))
              raise SystemExit(1)

          body = {'marketSlug':slug,
                  'type':'ORDER_TYPE_LIMIT',
                  'price':{'value':str(D(str(bid))),'currency':'USD'},
                  'quantity':1,
                  'tif':'TIME_IN_FORCE_GOOD_TILL_CANCEL',
                  'participateDontInitiate':True,
                  'outcomeSide':'OUTCOME_SIDE_YES',
                  'action':'ORDER_ACTION_BUY',
                  'manualOrderIndicator':'MANUAL_ORDER_INDICATOR_AUTOMATIC'}
          preview = t.request('POST','/v1/order/preview',{'request':body})
          order = preview.get('order') if isinstance(preview,dict) else None
          if not isinstance(order,dict) or order.get('marketSlug') not in (None,slug):
              print(json.dumps({'status':'PREVIEW_PREFLIGHT_FAILED','slug':slug,
                                'reason':'preview_missing_or_mismatched','preview':False,'order_entry':False},
                               separators=(',',':')))
              raise SystemExit(1)
          print(json.dumps({'status':'READ_AUTH_PREFLIGHT_OK','slug':slug,
                            'bid':str(bid),'ask':str(ask),'preview':True,
                            'qty':1,'order_entry':False}, separators=(',',':')))
          PY
          EOF
          )
          ENC=$(printf '%s' "$REMOTE" | base64 -w0)
          PARAMS=$(jq -nc --arg cmd "echo '$ENC' | base64 -d | sudo -u ssm-user bash" '{commands:[$cmd]}')
          CID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "L5 PMUS q1 authenticated preview-only preflight $SLUG" --parameters "$PARAMS" --timeout-seconds 180 \
            --query 'Command.CommandId' --output text)
          for _ in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 2
          done
          RESULT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          OUT=$(jq -r '.Stdout' <<<"$RESULT")
          grep -q 'READ_AUTH_PREFLIGHT_OK' <<<"$OUT"
          grep -q '"preview":true' <<<"$OUT"
          grep -q '"order_entry":false' <<<"$OUT"
