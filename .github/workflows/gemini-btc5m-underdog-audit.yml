# READ-ONLY settlement/cash audit of BTC5m UNDERDOG cohort 1.
#
# Same audit module as the canary audit, bound to the underdog ledger with
# --cohort underdog. IT SENDS NO ORDERS, and that is proved before any secret
# is in scope: the same AST guard rejects the audit module if it can reach a
# mutation path or an order transport at all. The account reads it makes --
# the contract object, positions/settled?withCashOuts=true, order history and
# mytrades, our own durable ledger -- are POST-authenticated READS on this
# venue, not mutations.
#
# Its own concurrency group, so it cannot disturb the recorder, the canary,
# the canary audit or any live cohort.
name: gemini-btc5m-underdog-audit

on:
  push:
    paths:
      - '.github/btc5m_underdog_audit_request'

concurrency:
  group: gemini-btc5m-underdog-audit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: python -m pip install --quiet httpx websockets pytest python-dotenv

      - name: Prove the audit has NO order path
        run: |
          python - <<'PY'
          import ast
          src = open("scripts/gemini_btc5m_cohort_audit.py",
                     encoding="utf-8").read()
          tree = ast.parse(src)
          names = set()
          for n in ast.walk(tree):
              if isinstance(n, ast.Attribute):
                  names.add(n.attr)
              elif isinstance(n, ast.Name):
                  names.add(n.id)
          banned = {"place", "attempt", "submit", "submit_sell", "cancel",
                    "order_place", "build_sell"}
          hit = sorted(banned & names)
          assert not hit, "the audit can reach a write path: %r" % hit
          imports = set()
          for n in ast.walk(tree):
              if isinstance(n, ast.ImportFrom) and n.module:
                  imports.add(n.module)
              elif isinstance(n, ast.Import):
                  for al in n.names:
                      imports.add(al.name)
          for bad in ("src.gemini_execution.transport",
                      "src.gemini_execution.sell_path"):
              assert bad not in imports, bad
          for p in ("/v1/prediction-markets/order",):
              assert p not in src, p
          print("READ-ONLY: no order transport, no mutation path, no "
                "write-capable call name")
          PY

      - name: Credential PRESENCE only (never a value)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_SECRET: ${{ secrets.GEMINI_API_SECRET }}
        run: |
          python - <<'PY'
          import os
          for k in ("GEMINI_API_KEY", "GEMINI_API_SECRET"):
              print(k, "PRESENT" if os.environ.get(k) else "ABSENT")
          PY

      - name: Local legs only (credential-free)
        run: python -m scripts.gemini_btc5m_cohort_audit --cohort underdog
             --no-venue --out /tmp/underdog_local_only.json

      - name: Audit -- settled outcome and the settled-position cash leg
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_SECRET: ${{ secrets.GEMINI_API_SECRET }}
        run: python -m scripts.gemini_btc5m_cohort_audit --cohort underdog
             --out analysis/gemini/underdog_audit/UNDERDOG_COHORT1_AUDIT.json

      - name: Commit the audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- analysis/gemini/underdog_audit/UNDERDOG_COHORT1_AUDIT.json
          if git diff --cached --quiet; then
            echo "no new audit artifact"; exit 0
          fi
          if git diff --cached --name-only \
               | grep -qvE '^analysis/gemini/underdog_audit/UNDERDOG_COHORT1_AUDIT\.json$'; then
            echo "::error::refusing to commit outside the audit artifact"
            git diff --cached --name-only; exit 1
          fi
          git commit -m "evidence(gemini): btc5m underdog cohort 1 settlement/cash audit [skip ci]"
          for n in 1 2 3; do
            if git push origin HEAD:research/gemini-btc5m-information-edge; then exit 0; fi
            git fetch origin research/gemini-btc5m-information-edge
            git rebase FETCH_HEAD || { git rebase --abort; exit 1; }
            sleep $((n * 3))
          done
          echo "::error::could not push the audit"; exit 1
