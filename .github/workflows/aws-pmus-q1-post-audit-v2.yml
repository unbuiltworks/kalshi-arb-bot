name: AWS PMUS q1 post-probe read-only audit v2

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - deploy/aws/pmus-q1-post-audit-v2.trigger

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Read-only PMUS settlement/account audit
        shell: bash
        run: |
          set -Eeuo pipefail
          SLUG=$(sed -n 's/^MARKET_SLUG=//p' deploy/aws/pmus-q1-post-audit-v2.trigger | head -1)
          [[ "$SLUG" =~ ^[A-Za-z0-9._-]+$ ]] || exit 2
          SCRIPT_B64=$(base64 -w0 deploy/aws/pmus_settlement_audit.py)
          REMOTE=$(cat <<EOF
          set -Eeuo pipefail
          STAGE=/home/ssm-user/l5-pmus-q1-stage
          CREDS=/home/ssm-user/l5-pmus-q1-credentials.env
          VENV=/home/ssm-user/l5-pmus-q1-venv
          test -f "\$CREDS" && test "\$(stat -c %a "\$CREDS")" = 600
          printf '%s' '$SCRIPT_B64' | base64 -d > /tmp/pmus_settlement_audit.py
          chmod 600 /tmp/pmus_settlement_audit.py
          set -a; . "\$CREDS"; set +a
          export PYTHONPATH="\$STAGE"
          "\$VENV/bin/python" /tmp/pmus_settlement_audit.py "$SLUG"
          rm -f /tmp/pmus_settlement_audit.py
          echo PMUS_ENGINE_HEARTBEAT_BEGIN
          cat /home/ssm-user/l5-pmus-supervisor-state/heartbeat.json
          echo
          echo PMUS_RECORDER_STATUS_BEGIN
          grep 'PMUS_WS_STATUS ' /home/ssm-user/l5-pmus-ws-state/recorder.log | tail -n 3
          EOF
          )
          ENC=$(printf '%s' "$REMOTE" | base64 -w0)
          PARAMS=$(jq -nc --arg cmd "echo '$ENC' | base64 -d | sudo -u ssm-user bash" '{commands:[$cmd]}')
          CID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "L5 PMUS settlement audit $SLUG" --parameters "$PARAMS" --timeout-seconds 180 --query 'Command.CommandId' --output text)
          for _ in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 2
          done
          RESULT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          OUT=$(jq -r '.Stdout' <<<"$RESULT")
          grep -q 'PMUS_SETTLEMENT_AUDIT_OK' <<<"$OUT"
          grep -q '"order_entry":false' <<<"$OUT"
          grep -q 'PMUS_ENGINE_HEARTBEAT_BEGIN' <<<"$OUT"
          grep -q 'PMUS_RECORDER_STATUS_BEGIN' <<<"$OUT"
