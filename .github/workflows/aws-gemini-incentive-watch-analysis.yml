name: AWS Gemini incentive watch analysis

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - deploy/aws/gemini-incentive-watch-analysis.trigger
      - .github/workflows/aws-gemini-incentive-watch-analysis.yml

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation
      - name: Read trigger
        id: trigger
        shell: bash
        run: |
          set -Eeuo pipefail
          FILE=deploy/aws/gemini-incentive-watch-analysis.trigger
          PINNED_COMMIT=$(awk -F= '$1=="PINNED_COMMIT"{print $2}' "$FILE" | tr -d '[:space:]')
          [[ "$PINNED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(awk -F= '$1=="ORDER_ENTRY"{print $2}' "$FILE" | tr -d '[:space:]')" = false
          echo "pinned_commit=$PINNED_COMMIT" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Analyze current watch
        env:
          PINNED_COMMIT: ${{ steps.trigger.outputs.pinned_commit }}
        shell: bash
        run: |
          set -Eeuo pipefail
          SHORT_SHA="${PINNED_COMMIT:0:12}"
          REMOTE_CMD="sudo -u ssm-user bash -lc 'set -Eeuo pipefail; REPO=/home/ssm-user/kalshi-arb-bot; WORK=/opt/arb/gemini-incentive-watch-analysis; STATE=/home/ssm-user/gemini-incentive-live-watch-state/20260829T1445ET-gemini-incentive-watch1; git -C \"\$REPO\" config --global --add safe.directory \"\$REPO\" || true; git -C \"\$REPO\" fetch origin feature/incentive-arb-engine-v1; git -C \"\$REPO\" worktree remove --force \"\$WORK\" >/dev/null 2>&1 || true; rm -rf \"\$WORK\"; git -C \"\$REPO\" worktree prune; git -C \"\$REPO\" worktree add --detach \"\$WORK\" \"${PINNED_COMMIT}\"; cd \"\$WORK\"; PYTHONPATH=. python3 -m src.gemini_incentive_watch_analyzer \"\$STATE/scans.jsonl\"'"
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB Gemini incentive watch analysis ${SHORT_SHA}" --parameters "$PARAMETERS" --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" || true
          RESULT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          grep -q 'READ_ONLY_GEMINI_INCENTIVE_WATCH_ANALYSIS_NOT_REALIZED' <<<"$(jq -r '.Stdout // ""' <<<"$RESULT")"
