name: AWS Gemini incentive live scan

on:
  push:
    branches:
      - aws-migration-foundation
    paths:
      - deploy/aws/gemini-incentive-live-scan.trigger
      - .github/workflows/aws-gemini-incentive-live-scan.yml

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aws-migration-foundation
      - name: Read trigger
        id: trigger
        shell: bash
        run: |
          set -Eeuo pipefail
          FILE=deploy/aws/gemini-incentive-live-scan.trigger
          PINNED_COMMIT=$(awk -F= '$1=="PINNED_COMMIT"{print $2}' "$FILE" | tr -d '[:space:]')
          test "$(awk -F= '$1=="CLASSIFICATION"{print $2}' "$FILE" | tr -d '[:space:]')" = "READ_ONLY_SHADOW_SNAPSHOT_NOT_REALIZED"
          test "$(awk -F= '$1=="ORDER_ENTRY"{print $2}' "$FILE" | tr -d '[:space:]')" = "false"
          [[ "$PINNED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          echo "pinned_commit=$PINNED_COMMIT" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Run public live incentive scan
        env:
          PINNED_COMMIT: ${{ steps.trigger.outputs.pinned_commit }}
        shell: bash
        run: |
          set -Eeuo pipefail
          SHORT_SHA="${PINNED_COMMIT:0:12}"
          REMOTE_CMD="sudo -u ssm-user bash -lc 'set -Eeuo pipefail; REPO=/home/ssm-user/kalshi-arb-bot; WORK=/opt/arb/gemini-incentive-live-scan; git -C \"\$REPO\" config --global --add safe.directory \"\$REPO\" || true; git -C \"\$REPO\" fetch origin feature/incentive-arb-engine-v1; git -C \"\$REPO\" cat-file -e \"${PINNED_COMMIT}^{commit}\"; git -C \"\$REPO\" worktree remove --force \"\$WORK\" >/dev/null 2>&1 || true; rm -rf \"\$WORK\"; git -C \"\$REPO\" worktree prune; git -C \"\$REPO\" worktree add --detach \"\$WORK\" \"${PINNED_COMMIT}\"; IMAGE=arb-gemini-incentive-live-scan:${SHORT_SHA}; docker build -t \"\$IMAGE\" \"\$WORK\" >/dev/null; docker run --rm --network host \"\$IMAGE\" python -m src.gemini_dual_maker_incentive_scan --quantity 10 > /tmp/gemini_incentive_live_scan.json; python3 - <<\"PY\"
import json
p=json.load(open('/tmp/gemini_incentive_live_scan.json'))
rows=[r for r in p.get('rows',[]) if r.get('two_sided_reward_eligible_at_snapshot')]
def dec(v,default=0):
    try:return float(v)
    except:return default
rows.sort(key=lambda r:(r.get('reported_qualifying_maker_count') if r.get('reported_qualifying_maker_count') is not None else 999999,-dec(r.get('trade_only_locked_edge_per_pair')),dec(r.get('seconds_to_expiry'))))
compact={k:p.get(k) for k in ['observed_at','classification','order_entry','credentials_loaded','active_crypto_rebate_rate','liquidity_rewards_enabled','reward_min_quantity','reward_max_distance_from_mid','markets','trade_only_arb_markets','two_sided_reward_eligible_markets_at_snapshot']}
compact['top_candidates']=[{k:r.get(k) for k in ['ticker','asset','horizon','seconds_to_expiry','yes_bid','yes_ask','no_bid','spread','trade_only_locked_edge','trade_only_locked_edge_per_pair','projected_pair_rebate_if_both_filled','projected_pair_edge_if_rebates_later_paid','liquidity_reward_daily_pool_usd','liquidity_reward_pool_event_count','reported_qualifying_maker_count','yes_distance_from_mid','no_distance_from_mid']} for r in rows[:12]]
print('GEMINI_INCENTIVE_LIVE_SCAN='+json.dumps(compact,separators=(',',':')))
PY'"
          PARAMETERS=$(jq -nc --arg cmd "$REMOTE_CMD" '{commands:[$cmd]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB Gemini incentive live scan ${SHORT_SHA}" --parameters "$PARAMETERS" --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" || true
          RESULT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          grep -q 'GEMINI_INCENTIVE_LIVE_SCAN=' <<<"$(jq -r '.Stdout // ""' <<<"$RESULT")"
