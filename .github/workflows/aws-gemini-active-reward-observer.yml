name: AWS Gemini active reward observer read-only

on:
  push:
    branches: [aws-migration-foundation]
    paths:
      - .github/workflows/aws-gemini-active-reward-observer.yml

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_HOT_INSTANCE_ID: i-0b90f0a309153f47e
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::318017571498:role/arb-github-ssm-deployer
  REQUIRED_RELEASE_COMMIT: 1a02c6ca5c707193475bb00f1b476e809a4af127

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Observe active Gemini reward competition with public endpoints only
        shell: bash
        run: |
          set -Eeuo pipefail
          SCRIPT_B64=$(base64 -w0 deploy/aws/gemini_active_reward_observer.py)
          REMOTE=$(cat <<EOF
          set -Eeuo pipefail
          REPO=/home/ssm-user/kalshi-arb-bot
          WORK=/opt/arb/gemini-active-reward-observer
          SCRIPT=/opt/arb/gemini-active-reward-observer.py
          IMAGE=arb-gemini-active-reward-observer:${REQUIRED_RELEASE_COMMIT:0:12}
          cd "\$REPO"
          git config --global --add safe.directory "\$REPO" || true
          git fetch origin ${REQUIRED_RELEASE_COMMIT} >/dev/null
          git worktree remove --force "\$WORK" >/dev/null 2>&1 || true
          rm -rf "\$WORK" "\$SCRIPT"
          git worktree prune
          git worktree add --detach "\$WORK" ${REQUIRED_RELEASE_COMMIT} >/dev/null
          test "\$(git -C "\$WORK" rev-parse HEAD)" = "${REQUIRED_RELEASE_COMMIT}"
          printf '%s' '${SCRIPT_B64}' | base64 -d > "\$SCRIPT"
          docker build -q -t "\$IMAGE" "\$WORK" >/dev/null
          docker run --rm --network host \
            -e GEMINI_Q10_PRODUCTION_LIVE=NO \
            -e GEMINI_Q10_PRODUCTION_ARM_ID= \
            -e GEMINI_Q10_PRODUCTION_ARM= \
            -e GEMINI_Q10_V5_RECOVERY_ARM= \
            -e GEMINI_Q10_V5_WATCHDOG_ARM= \
            -v "\$SCRIPT:/diag/gemini_active_reward_observer.py:ro" \
            "\$IMAGE" python /diag/gemini_active_reward_observer.py
          EOF
          )
          ENC=$(printf '%s' "$REMOTE" | base64 -w0)
          PARAMS=$(jq -nc --arg cmd "echo '$ENC' | base64 -d | sudo -u ssm-user bash" '{commands:[$cmd]}')
          CID=$(aws ssm send-command --instance-ids "$AWS_HOT_INSTANCE_ID" --document-name AWS-RunShellScript --comment "ARB Gemini public active reward observer" --parameters "$PARAMS" --timeout-seconds 520 --query 'Command.CommandId' --output text)
          for _ in $(seq 1 270); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 2
          done
          RESULT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$AWS_HOT_INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json)
          echo "$RESULT"
          test "$(jq -r '.Status' <<<"$RESULT")" = Success
          OUT=$(jq -r '.Stdout // ""' <<<"$RESULT")
          grep -q 'GEMINI_ACTIVE_REWARD_OBSERVER=' <<<"$OUT"
          grep -q 'GEMINI_ACTIVE_REWARD_OBSERVER_COMPLETE' <<<"$OUT"
          grep -q '"order_entry":false' <<<"$OUT"
          grep -q '"credentials_read":false' <<<"$OUT"
