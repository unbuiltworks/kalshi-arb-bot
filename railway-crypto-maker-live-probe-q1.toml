# One-shot maker-triggered hedge LIVE_PROBE. First deploy is read-only preflight.
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python -m src.gemini_kalshi_maker_live_probe_q1_final"
preDeployCommand = ["python -m pytest -q tests/test_gemini_kalshi_maker_live_probe_q1.py tests/test_gemini_kalshi_maker_live_probe_q1_safe.py tests/test_gemini_kalshi_maker_live_probe_q1_final.py"]
restartPolicyType = "NEVER"
