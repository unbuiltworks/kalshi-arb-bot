# Single-attempt XRP maker canary. Dedicated live arm is absent by default, so this deploy is read-only.
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python -m src.gemini_kalshi_xrp_maker_live_canary"
preDeployCommand = ["python -m pytest -q tests/test_gemini_kalshi_maker_live_probe_q1.py tests/test_gemini_kalshi_maker_live_probe_q1_safe.py tests/test_gemini_kalshi_maker_live_probe_q1_final.py tests/test_gemini_kalshi_maker_live_probe_q1_venue_once.py tests/test_gemini_kalshi_maker_rest_guard.py tests/test_gemini_kalshi_maker_dominance_guard.py tests/test_gemini_kalshi_gemini_maker_partial_economics.py tests/test_gemini_kalshi_gemini_maker_safe_quote.py tests/test_gemini_kalshi_xrp_maker_live_canary.py && python -m py_compile src/gemini_kalshi_xrp_maker_live_canary.py src/gemini_kalshi_gemini_maker_safe_quote.py src/gemini_kalshi_crypto_maker_budget.py"]
restartPolicyType = "NEVER"