# Targeted public refdata preflight before bounded q1 maker promotion.
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python -m src.gemini_kalshi_current_refdata_probe"
preDeployCommand = ["python -m pytest -q tests/test_gemini_kalshi_maker_live_probe_q1.py tests/test_gemini_kalshi_maker_live_probe_q1_safe.py tests/test_gemini_kalshi_maker_live_probe_q1_final.py tests/test_gemini_kalshi_maker_live_probe_q1_venue_once.py tests/test_gemini_kalshi_maker_rest_guard.py tests/test_gemini_kalshi_maker_dominance_guard.py && python -m py_compile src/gemini_kalshi_current_refdata_probe.py src/gemini_kalshi_crypto_maker_budget.py"]
restartPolicyType = "NEVER"
