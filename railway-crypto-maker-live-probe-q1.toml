# Restored after bounded Gemini q10 live canary; keep this service read-only.
# Same-Gemini crypto threshold-ladder zero-order-entry edge census.
# Reuses the existing complete q1-certified L<H discovery path in place; no new service.
# Broad REST snapshots measure >=1c/2c/3c after-fee incidence/depth but MUST NOT be
# interpreted as sub-second lifetime evidence. WS lifetime/public-print proxy remains
# a separate instrumentation layer required by ARB_EDGE_CENSUS_2026-08.md.
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python -m src.gemini_same_venue_crypto_edge_census --interval-seconds 15"
preDeployCommand = ["python -m pytest -q tests/test_gemini_same_venue_crypto_ladder_scan.py tests/test_gemini_same_venue_crypto_full_pairs.py && python -m py_compile src/gemini_same_venue_crypto_edge_census.py src/gemini_same_venue_crypto_full_pair_taker.py src/gemini_same_venue_crypto_ladder_scan.py src/gemini_same_venue_crypto_taker_q1.py"]
restartPolicyType = "ALWAYS"
