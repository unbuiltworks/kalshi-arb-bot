[build]
builder = "RAILPACK"

[deploy]
startCommand = "python -u -m src.gemini_q10_maxwidth_spotguard_shadow_v3"
preDeployCommand = ["python -m py_compile src/gemini_q10_maxwidth_spotguard_shadow_v3.py src/gemini_q10_maxwidth_spotguard_shadow_v2.py src/gemini_q10_maxwidth_spotguard_shadow.py src/btc_spot_toxicity_guard.py src/gemini_prediction_book_cache.py && python -m pytest -q tests/test_gemini_q10_maxwidth_spotguard_shadow_v2.py tests/test_btc_spot_toxicity_guard.py tests/test_gemini_prediction_book_cache.py"]
restartPolicyType = "NEVER"
