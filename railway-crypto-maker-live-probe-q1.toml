# Same-Gemini crypto threshold-ladder q=1 live canary.
# Account-authoritative orphan audit -> 100ms depth WS -> orders@account lifecycle.
# REST is bounded recovery/audit only; old Gemini<->Kalshi maker remains parked.
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python -m src.gemini_same_venue_crypto_account_gate"
preDeployCommand = ["python -m pytest -q tests/test_gemini_same_venue_crypto_ladder_scan.py tests/test_gemini_same_venue_crypto_maker_q1.py tests/test_gemini_same_venue_crypto_maker_q1_depth.py && python -m py_compile src/gemini_same_venue_crypto_ladder_scan.py src/gemini_same_venue_crypto_budget.py src/gemini_same_venue_crypto_maker_q1.py src/gemini_same_venue_crypto_maker_q1_depth.py src/gemini_same_venue_crypto_maker_q1_wsfirst.py src/gemini_same_venue_crypto_account_gate.py src/gemini_kalshi_execution_shadow.py src/gemini_kalshi_fast_overlap.py"]
restartPolicyType = "NEVER"
